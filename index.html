Instrumentos del Gobierno Federal: CETES, BONDES, UDIBONOS, BPAs, PIC FARAC; Bancarios: PRLV, AB, CD; Privados: Papel Comercial\n\n**Mercado de Capitales**:\n1. Se colocan instrumentos de mediano o largo plazo (más de 1 año)\n2. Instrumentos de renta variable (con o sin vencimiento)\n3. Son instrumentos de poca liquidez\n4. El dinero se utiliza para formación o incremento de capital social o para financiar proyectos de mediano y largo plazo\n5. Instrumentos Privados: CPOs, CPIs, Acciones"},{"title":"Instrumentos de Renta Fija del Gobierno Federal","content_md":"**Cetes (Certificados de la Tesorería)**:\n- Título de crédito al portador\n- Emitidos por el Gobierno Federal\n- En moneda nacional y su valor nominal es de $10.00\n- Plazos 28 días, 91 días, 182 días, 364 días\n- Se venden a descuento. El rendimiento se obtiene al comparar la ganancia obtenida y la inversión\n- La colocación es por subasta pública\n- En la subasta que realiza BANXICO, intervienen Bancos, casas de Bolsa, Aseguradoras y Sociedades de Inversión\n\n**Bondes (Bonos de Desarrollo)**:\n- Son títulos de Crédito Emitidos por el gobierno federal\n- Se utiliza para financiar proyectos de mediano y largo plazo\n- Valor nominal: $100 pesos\n- Plazo: Múltiplos de 28 días 3, 5, 10 años\n- Rendimiento pagable cada 28 días (CETES a 28 días o TIIE, la que resulte más alta)\n\n**Udibonos (Bonos en UDIs)**:\n- Está indizado (ligado) al INPC\n- Protege al inversionista del efecto inflacionario\n- Pago de intereses semestralmente\n- Valor nominal: 100 udis\n- Plazo: Múltiplos de 182 días, 3, 5, 10, 20 y 30 años\n- Rendimiento con una sobretasa por encima de la inflación (o tasa real) del periodo correspondiente\n- Pagan rendimiento cada 182 días\n\n**BPAs (Bonos de Protección al ahorro)**:\n- Emisiones con el fin de reducir gradualmente el costo financiero asociado a los programas de apoyo a ahorradores\n- Valor Nominal: 100 pesos\n- Rendimiento: Pagable cada 28 días, la tasa es la mayor entre Cetes a 28 días y los PRLVs\n- Plazos: en múltiplos de 28 días\n\n**PIC - FARAC**:\n- Pagaré de indemnización carretera, emitidos por Banobras\n- Aplicables al Fideicomiso de Apoyo para el Rescate de Autopistas Concesionadas\n- Valor nominal: 100 UDIS\n- Plazo: va de 5 a 30 años\n- Rendimiento: Con pago de la tasa de interés fija cada 182 días\n- Garantía: Gobierno Federal"},{"title":"Instrumentos de Renta Fija de la Banca Comercial","content_md":"**PRLV (Pagaré con Rendimiento Liquidable al Vencimiento)**:\n- Son títulos de corto plazo emitidos por instituciones de crédito\n- Ayudan a cubrir la captación bancaria y alcanzar el ahorro interno de los particulares\n- Valor nominal: $100 pesos o múltiplos\n- Plazo: va de 7 a 360 días, según las necesidades de financiamiento de la empresa emisora\n- Rendimiento: los intereses se pagarán a la tasa pactada por el emisor precisamente al vencimiento de los títulos\n- Garantía: el patrimonio de las instituciones de crédito que lo emite\n\n**ABs (Aceptaciones Bancarias)**:\n- Son **Letras de Cambio** que emite una empresa nombre propio y aceptada por un banco con base en créditos\n- Se hace para apoyar transacciones de importación o exportación, para facilitar la compra venta de bienes\n- Valor nominal: $100 pesos\n- Plazo: va desde 7 hasta 182 días\n- Rendimiento: se fija con relación a una tasa de referencia que puede ser CETES o TIIE (tasa de interés interbancaria de equilibrio), pero siempre es un poco mayor"},{"title":"Instrumentos de Renta Fija de la Empresa Privada","content_md":"**PCs (Papel Comercial)**:\n- Es un pagaré negociable emitido por empresas que participan en el mercado de valores\n- Valor nominal: $100 pesos\n- Plazo: de 7 a 360 días, según las necesidades de financiamiento de la empresa emisora\n- Rendimiento: al igual que los CETES, este instrumento se compra a descuento respecto de su valor nominal, pero por lo general pagan una sobretasa referenciada a CETES o a la TIIE (Tasa de Interés Interbancaria de Equilibrio)\n- Garantía: Por ser un pagaré, no ofrece ninguna garantía, ofrece rendimientos mayores y menor liquidez\n\n**Obligaciones**:\n- Son instrumentos emitidos en serie por empresas privadas que participan en el mercado de valores\n- Valor nominal: $100 pesos, 100 UDIS o múltiplos\n- Plazo: De tres años en adelante. Su amortización puede ser al término del plazo o en parcialidades anticipadas\n- Rendimiento: dan una sobretasa teniendo como referencia a los CETES o TIIE\n- Garantía: puede ser quirografaria, fiduciaria, avalada, hipotecaria o prendaria\n\n**CPO (Certificados de Participación Ordinaria)**:\n- Títulos colocados en el mercado bursátil por instituciones crediticias con cargo a un fideicomiso cuyo patrimonio se integra por bienes muebles\n- Valor nominal: $100 pesos o 100 UDIS\n- Plazo: De 3 años en adelante, y su amortización puede ser al vencimiento o con pagos periódicos\n- Rendimiento: Pagan una sobretasa, teniendo como referencia a los CETES o TIIE, o tasa real\n\n**CPI (Certificados de Participación Inmobiliaria)**:\n- Títulos colocados en el mercado bursátil por instituciones crediticias con cargo a un fideicomiso cuyo patrimonio se integra por bienes inmuebles\n- Valor nominal: $100 pesos\n- Plazo: De tres años en adelante. Su amortización puede ser al vencimiento o con pagos periódicos\n- Rendimiento: pagan una sobretasa teniendo como referencia a los CETES o TIIE"},{"title":"Instrumentos de Renta Variable","content_md":"**Acciones**: Partes iguales (alícuotas) en que se divide el capital social de una empresa. El propietario adquiere derechos patrimoniales sobre el Negocio.\n\n**Acciones Comunes**: Aquellas que no tienen calificación o preferencia alguna. Tienen derecho a voto general interviniendo en todos los actos de la vida de la empresa (tales como elegir al consejo de administración o decidir las políticas de la empresa).\n\n**Acciones Preferentes**: Gozan de ciertos derechos sobre las demás acciones que conforman el capital social de una empresa: Primacía de pago en el caso de liquidación, Percepción de dividendos. Se emite con un dividendo determinado que debe pagarse antes de que se paguen dividendos a los tenedores de acciones ordinarias. Generalmente no tienen derecho a voto.\n\n**Acciones Convertibles**: Se emiten con ciertos privilegios adquiriendo, en un tiempo predeterminado, privilegios adicionales o distintos a los originales."},{"title":"Conceptos de Finanzas y Contabilidad","content_md":"**Ingresos**: Toda cantidad que incremente el activo o disminuya el pasivo de una persona física o moral.\n\n**Egresos**: Representan las obligaciones que tiene la empresa para sostener su operación.\n\n**Patrimonio**: Valor total del capital inicial las aportaciones posteriores y las utilidades acumuladas. Activos menos pasivos (Activos Netos).\n\n**Inversión**: Una persona deposita el dinero (capital) en instrumentos financieros con la finalidad de obtener mayores ganancias en el largo plazo.\n\n**Ahorro**: La cantidad de dinero, usualmente llamada capital, guardada en forma segura para un uso posterior; generalmente se obtiene una ganancia (interés) baja y fija.\n\n**Riesgo Financiero**: Es la incertidumbre que representan las futuras ganancias o pérdidas de una inversión.\n- **Riesgo de Mercado**: Incertidumbre que genera un País por cuestiones políticas, variación en tasas de rendimientos, alta inflación, alta devaluación, situación política, nivel de delincuencia.\n- **Riesgo de Crédito**: Incertidumbre que tiene el inversionista que compra instrumentos de deuda (está prestando dinero al emisor). Tiene que ver con la experiencia y la imagen del emisor y está calificado por Standard and Poors, Fitch, Moodys.\n- **Riesgo de Liquidez**: Incertidumbre que tiene el emisor de instrumentos de deuda y representa la incapacidad de pago por no tener efectivo para cumplir las obligaciones contraídas.\n\n**Diversificación**: Sistema que consiste en colocar el dinero en distintos instrumentos y giros para equilibrar el riesgo financiero. Permite reducir la variabilidad de los rendimientos. Permite a los inversionistas protegerse contra la volatilidad de los riesgos financieros.\n\n**Tolerancia al Riesgo**:\n- Capacidad que tienen los inversionistas para soportar la volatilidad de las tasas o los mercados\n- Permite al inversionista para incursionar a valores de mayor riesgo pero con mayor utilidad\n- Refleja la conducta de los inversionistas que realizan una correcta administración de riesgos para seleccionar mejor los instrumentos en que invierten\n\n**Costo de Oportunidad**:\n- Pérdida económica que acepta un inversionista para cambiar a otra inversión aparentemente mejor\n- Intereses que acepta pagar un inversionista para aprovechar oportunidades de mejor inversión\n- Contablemente, es un gasto que no implica salida de dinero\n\n**Anualidades**: Flujo de fondos regulares y de un mismo monto durante un determinado número de períodos tendientes a amortizar una deuda o a la formación de un capital. Se dividen en:\n- **Contingentes**: Su pago depende de la ocurrencia de eventos futuros e inciertos (primas de seguros, Rentas vitalicias)\n- **Vencidas**: Su pago inicia al término de un plazo prefijado\n- **Anticipadas**: El pago debe hacerse al inicio de un plazo determinado\n\n**Poder Adquisitivo**: Cantidad de bienes o servicios que puede adquirir un individuo con su salario o que se pueden comprar por determinada moneda.\n\n**Inflación**: Incremento en el precio de bienes o servicios (tasa de inflación).\n\n**Devaluación**: Variación en el precio de una moneda débil ante otra más fuerte (tasa de cambio).\n\n**Valor del Dinero en el Tiempo**: Se refiere al comportamiento del poder adquisitivo del dinero, cambia por intereses obtenidos, por la inflación o por la devaluación.\n\n**Valor Presente**: Se obtiene al descontar los intereses o tasas de inflación en un período determinado de tiempo.\n\n**Valor Futuro**: Es la cantidad que se alcanzará cuando se agregan las tasas de interés en un tiempo determinado.\n\n**Tasa Nominal**: Se expresa en los instrumentos, es anual y no contempla la reinversión ni la inflación.\n\n**Tasa Efectiva**: Es la que se aplica al capital en uno o varios periodos de inversión.\n\n**Tasa Simple**: Se aplica sobre el capital inicial, los intereses no generan nuevos intereses.\n\n**Tasa Compuesta**: Los intereses se integran al capital en cada reinversión (capitalización).\n\n**Tasa de Inflación**: Expresa el incremento en el valor de bienes y servicios.\n\n**Tasa de Cambio**: Expresa la diferencia de una moneda ante otra extranjera.\n\n**Tasa Pasiva**: Es al que pagan los bancos.\n\n**Tasa Real**: Se obtiene al descontar la inflación.\n\n**Liquidez**: Rapidez con la que un instrumento financiero se convierte a efectivo.\n\n**Liquidez - Rendimiento**: Es una relación inversa o negativa: **a mayor liquidez el rendimientos es menor**.\n\n**Rendimiento**: Premio que obtiene una persona por permitir que otro use su dinero.\n\n**Rendimiento - Riesgo**: Relación positiva o directa: **a mayor riesgo, mayor rendimiento**."}],"questions":[{"id":1,"text":"¿Cuál es el objetivo del Sistema Financiero Mexicano?","options":[{"key":"a","text":"Permitir que el dinero fluya de forma efectiva hasta llegar a los usuarios finales"},{"key":"b","text":"Integrar todas las leyes y reglamentos para vigilar a las instituciones"}],"correct":"a"},{"id":2,"text":"¿A quién se le considera la autoridad máxima del sistema financiero mexicano?","options":[{"key":"a","text":"La secretaría de Hacienda y Crédito Público (SHCP)"},{"key":"b","text":"El Banco de México"}],"correct":"a"},{"id":3,"text":"¿A qué autoridad le compete supervisar la solvencia económica de las instituciones financieras?","options":[{"key":"a","text":"La secretaría de Hacienda y Crédito Público (SHCP)"},{"key":"b","text":"La Comisión Nacional Bancaria y de Valores (CNBV)"}],"correct":"a"},{"id":4,"text":"De la siguiente lista identifica las funciones del Banco de México: 1. Ofrece servicios de tesorería al Gobierno Federal; 2. Establece la política monetaria; 3. Autoriza la creación de instituciones financieras; 4. Emite nuevos billetes y monedas y los envía a la banca comercial; 5. Impone castigos a las instituciones que infrinjan las leyes y reglamentos sobre finanzas; 6. Actúa como banca de reserva de la banca comercial; 7. Funge como acreditante de última instancia","options":[{"key":"a","text":"1, 2, 3, 5, 6"},{"key":"b","text":"1, 2, 4, 6, 7"}],"correct":"b","list":{"stem":"De la siguiente lista identifica las funciones del Banco de México:","kind":"num","items":[{"k":"1","text":"Ofrece servicios de tesorería al Gobierno Federal"},{"k":"2","text":"Establece la política monetaria"},{"k":"3","text":"Autoriza la creación de instituciones financieras"},{"k":"4","text":"Emite nuevos billetes y monedas y los envía a la banca comercial"},{"k":"5","text":"Impone castigos a las instituciones que infrinjan las leyes y reglamentos sobre finanzas"},{"k":"6","text":"Actúa como banca de reserva de la banca comercial"},{"k":"7","text":"Funge como acreditante de última instancia"}]},"handwritten_note":"Palomitas junto a las funciones 1, 2, 4, 6 y 7; junto a la 4: “(casa de moneda)”; junto a la 6: “(IPAB)” [poco legible, podría leerse “IPAD”]"},{"id":5,"text":"¿Qué institución se considera como asesor financiero del Gobierno Federal?","options":[{"key":"a","text":"SHCP"},{"key":"b","text":"BANXICO"}],"correct":"b"},{"id":6,"text":"Relaciona ambas columnas determinando la competencia de cada comisión: 1. CNBV; 2. CNSF; 3. CONSAR — a) Afores y Siefores; b) Bancos y sociedades de crédito; c) Casas de bolsa; d) Aseguradoras y afianzadoras; e) Sociedades operadoras y sociedades de inversión","options":[{"key":"a","text":"1 a, b, c; 2 d; 3 e"},{"key":"b","text":"1 b, c, e; 2 d; 3 a"}],"correct":"b","match":{"stem":"Relaciona ambas columnas determinando la competencia de cada comisión:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"CNBV"},{"k":"2","text":"CNSF"},{"k":"3","text":"CONSAR"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Afores y Siefores"},{"k":"b","text":"Bancos y sociedades de crédito"},{"k":"c","text":"Casas de bolsa"},{"k":"d","text":"Aseguradoras y afianzadoras"},{"k":"e","text":"Sociedades operadoras y sociedades de inversión"}]}]},"handwritten_note":"Líneas trazadas a mano relacionando las comisiones (CNBV, CNSF, CONSAR aparecen encerradas/unidas con los incisos)"},{"id":7,"text":"¿Qué comisión es mencionada en la Ley de Sociedades de Inversión?","options":[{"key":"a","text":"CNBV"},{"key":"b","text":"CONDUSEF"}],"correct":"a"},{"id":8,"text":"La Comisión Nacional Bancaria y de Valores autoriza la creación de las siguientes instituciones financieras","options":[{"key":"a","text":"Bancos, casa de bolsa, afore, siefore"},{"key":"b","text":"Bancos, casas de bolsa, sociedades de inversión, Sofoles"}],"correct":"b"},{"id":9,"text":"Las siguientes son instituciones supervisadas por la CNBV, EXCEPTO:","options":[{"key":"a","text":"Casas de Empeño"},{"key":"b","text":"Uniones de Crédito"}],"correct":"a"},{"id":10,"text":"¿Qué autoridad tiene el objetivo de procurar la equidad entre los usuarios y las instituciones financieras?","options":[{"key":"a","text":"SHCP"},{"key":"b","text":"CONDUSEF"}],"correct":"b"},{"id":11,"text":"Relaciona ambas columnas estableciendo la diferencia entre las acciones de la CONDUSEF: 1. Preventivas; 2. Correctivas — a) Creación de cultura; b) Recibir quejas de usuarios; c) Conciliar entre los usuarios y las instituciones; d) Informar y asesorar a los usuarios; e) Fungir como árbitro; f) Otorgar servicios de abogados gratuitos","options":[{"key":"a","text":"1 a, d; 2 b, c, e, f"},{"key":"b","text":"1 a, b, e; 2 c, d, f"}],"correct":"a","match":{"stem":"Relaciona ambas columnas estableciendo la diferencia entre las acciones de la CONDUSEF:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Preventivas"},{"k":"2","text":"Correctivas"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Creación de cultura"},{"k":"b","text":"Recibir quejas de usuarios"},{"k":"c","text":"Conciliar entre los usuarios y las instituciones"},{"k":"d","text":"Informar y asesorar a los usuarios"},{"k":"e","text":"Fungir como árbitro"},{"k":"f","text":"Otorgar servicios de abogados gratuitos"}]}]},"handwritten_note":"“1. a, d — 2. b, c, e [F]” escrito a mano junto a la pregunta"},{"id":12,"text":"La siguiente institución financiera es supervisada por la Comisión Nacional Bancaria y de Valores, EXCEPTO:","options":[{"key":"a","text":"Sociedades de Inversión de deuda"},{"key":"b","text":"Sociedades de inversión especializadas en fondos para el retiro"}],"correct":"b","handwritten_note":"“(Consar)” escrito a mano junto a la opción b"},{"id":13,"text":"Relaciona ambas columnas identificando las características de los distintos bancos: 1. Banca comercial; 2. Banca de desarrollo — a) Tiene cuentahabientes o ahorradores; b) Otorga préstamos al público en general; c) Usa el dinero del Gobierno Federal; d) Otorga préstamos de acuerdo de un plan nacional; e) Usan el dinero de los ahorradores","options":[{"key":"a","text":"1 c, d; 2 a, b, e"},{"key":"b","text":"1 a, b, e; 2 c, d"}],"correct":"b","match":{"stem":"Relaciona ambas columnas identificando las características de los distintos bancos:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Banca comercial"},{"k":"2","text":"Banca de desarrollo"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Tiene cuentahabientes o ahorradores"},{"k":"b","text":"Otorga préstamos al público en general"},{"k":"c","text":"Usa el dinero del Gobierno Federal"},{"k":"d","text":"Otorga préstamos de acuerdo de un plan nacional"},{"k":"e","text":"Usan el dinero de los ahorradores"}]}]},"handwritten_note":"Líneas onduladas trazadas a mano uniendo cada banca con sus incisos"},{"id":14,"text":"De la siguiente lista, identifica los bancos de desarrollo: 1. Banco Nacional de México; 2. Banco de comercio exterior; 3. Banco de Obras Públicas; 4. Banco HSBC; 5. Banco Santander; 6. Nacional Financiera","options":[{"key":"a","text":"1, 3, 5"},{"key":"b","text":"2, 3, 6"}],"correct":"b","list":{"stem":"De la siguiente lista, identifica los bancos de desarrollo:","kind":"num","items":[{"k":"1","text":"Banco Nacional de México"},{"k":"2","text":"Banco de comercio exterior"},{"k":"3","text":"Banco de Obras Públicas"},{"k":"4","text":"Banco HSBC"},{"k":"5","text":"Banco Santander"},{"k":"6","text":"Nacional Financiera"}]},"handwritten_note":"“Banamex” escrito junto a Banco Nacional de México; palomitas en 2, 3 y 6"},{"id":15,"text":"Las siguientes razones motivan que la banca de desarrollo sea también conocida como banca de segundo piso:","options":[{"key":"a","text":"Operan instrumentos de mercado secundario"},{"key":"b","text":"No tienen sucursales ni atienden al público usuario"}],"correct":"b"},{"id":16,"text":"Almacenes generales de depósito, SOFOLES, SOFOMES, Sociedades de ahorro popular, Uniones de Crédito Popular; forman parte del sector:","options":[{"key":"a","text":"Bancario"},{"key":"b","text":"Instituciones financieras no bancarias"}],"correct":"b","handwritten_note":"“Las supervisa CNBV” escrito a mano"},{"id":17,"text":"Instituciones financieras que captan recursos de la colocación de instrumentos inscritos en el registro nacional de valores e intermediarios y otorgan créditos para determinadas actividades:","options":[{"key":"a","text":"Sociedades de Inversión"},{"key":"b","text":"SOFOMES"}],"correct":"b","handwritten_note":"“Sociedad financiera [ilegible]” escrito a mano debajo de la pregunta"},{"id":18,"text":"De la siguiente lista, identifica las instituciones que pertenecen al sector bursátil: 1. Banca de desarrollo; 2. Bolsa Mexicana de valores; 3. Casas de Cambio; 4. Casas de bolsa; 5. Sociedades de inversión; 6. Casas de empeño; 7. Sociedades operadoras de Sociedades de Inversión; 8. Calificadoras de Riesgos de Crédito","options":[{"key":"a","text":"1, 3, 5, 6, 7"},{"key":"b","text":"2, 4, 5, 7, 8"}],"correct":"b","list":{"stem":"De la siguiente lista, identifica las instituciones que pertenecen al sector bursátil:","kind":"num","items":[{"k":"1","text":"Banca de desarrollo"},{"k":"2","text":"Bolsa Mexicana de valores"},{"k":"3","text":"Casas de Cambio"},{"k":"4","text":"Casas de bolsa"},{"k":"5","text":"Sociedades de inversión"},{"k":"6","text":"Casas de empeño"},{"k":"7","text":"Sociedades operadoras de Sociedades de Inversión"},{"k":"8","text":"Calificadoras de Riesgos de Crédito"}]},"handwritten_note":"Al margen: “Relacionadas con la bolsa”; palomitas junto a las opciones 2, 5, 7 y 8"},{"id":19,"text":"Establece los locales, instalaciones y mecanismos que faciliten las relaciones y operaciones entre la oferta y demanda de valores, títulos de así como","options":[{"key":"a","text":"Casa de Bolsa"},{"key":"b","text":"Bolsa Mexicana de Valores"}],"correct":"b"},{"id":20,"text":"Presta los servicios necesarios para la realización de los procesos de emisión, colocación en intercambio de los referidos valores.","options":[{"key":"a","text":"Casa de Bolsa"},{"key":"b","text":"Bolsa Mexicana de Valores"}],"correct":"b"},{"id":21,"text":"Expedir normas que establezcan estándares y esquemas operativos y de conducta que promuevan prácticas justas y equitativas en el mercado de valores, así como vigilar su observancia e imponer medidas disciplinarias y correctivas, es otra función de:","options":[{"key":"a","text":"Casa de Bolsa"},{"key":"b","text":"Bolsa Mexicana de Valores"}],"correct":"b"},{"id":22,"text":"Son sociedades anónimas dedicadas a la intermediación con valores, pone en contacto a oferentes y demandantes de valores, ofrece y negocia valores por cuenta propia o de terceros en el mercado primario o secundario.","options":[{"key":"a","text":"Casa de Bolsa"},{"key":"b","text":"Bolsa Mexicana de Valores"}],"correct":"a","handwritten_note":"Al margen izquierdo: “Necesitas oficio” [poco legible]; la palabra “oferentes” aparece subrayada"},{"id":23,"text":"De la siguiente lista, identifica las funciones de una Casa de bolsa: 1. Asesoran a las empresas para obtener financiamiento a través de la emisión de títulos, y participan en las ofertas públicas como colocador de los mismos; 2. Expiden normas que establecen estándares y esquemas operativos; 3. Contribuyen a dar liquidez a los títulos al actuar como formador de mercado manteniendo continuamente posturas de compra y de venta por un importe mínimo de valores; 4. Establece los locales, instalaciones y mecanismos para facilitar la oferta y demanda de valores; 5. Celebran operaciones de compra-venta, reporto y préstamo de valores, actuando por cuenta propia o de sus clientes.","options":[{"key":"a","text":"1, 3, 5"},{"key":"b","text":"2, 4, 5"}],"correct":"a","list":{"stem":"De la siguiente lista, identifica las funciones de una Casa de bolsa:","kind":"num","items":[{"k":"1","text":"Asesoran a las empresas para obtener financiamiento a través de la emisión de títulos, y participan en las ofertas públicas como colocador de los mismos"},{"k":"2","text":"Expiden normas que establecen estándares y esquemas operativos"},{"k":"3","text":"Contribuyen a dar liquidez a los títulos al actuar como formador de mercado manteniendo continuamente posturas de compra y de venta por un importe mínimo de valores"},{"k":"4","text":"Establece los locales, instalaciones y mecanismos para facilitar la oferta y demanda de valores"},{"k":"5","text":"Celebran operaciones de compra-venta, reporto y préstamo de valores, actuando por cuenta propia o de sus clientes"}]},"handwritten_note":"Palomitas junto a las funciones 1, 3 y 5"},{"id":24,"text":"¿Qué institución financiera crea y administra sociedades de inversión?","options":[{"key":"a","text":"Sociedades operadoras"},{"key":"b","text":"Casas de bolsa"}],"correct":"a"},{"id":25,"text":"Las siguientes instituciones se consideran intermediarios en el mercado de valores","options":[{"key":"a","text":"Casas de bolsa, Sociedades operadoras de sociedades de inversión"},{"key":"b","text":"Asociación Mexicana de Bancos, Asociación Mexicana de Instituciones de Seguros"}],"correct":"a"},{"id":26,"text":"Instituciones financieras que intermedian con recursos de muchos inversionistas, que se vuelven socios, en la compra de acciones y valores para conformar un portafolio o cartera","options":[{"key":"a","text":"Uniones de crédito"},{"key":"b","text":"Sociedades de inversión"}],"correct":"b","handwritten_note":"Subrayado a mano: “muchos inversionistas, que se vuelven socios”"},{"id":27,"text":"¿Cómo obtienen los recursos financieros las sociedades de inversión?","options":[{"key":"a","text":"Abriendo cuentas de ahorradores"},{"key":"b","text":"Vendiendo sus acciones a los inversionistas"}],"correct":"b"},{"id":28,"text":"Sólo pueden invertir en instrumentos de deuda cuya utilidad y pérdida neta se asigne diariamente entre los accionistas. Representan bajo riesgo","options":[{"key":"a","text":"Sociedad de Inversión de Deuda"},{"key":"b","text":"Sociedad de Inversión de renta Variable"}],"correct":"a"},{"id":29,"text":"Sus activos se invierten en acciones e instrumentos de deuda colocados en las casas de bolsa","options":[{"key":"a","text":"Sociedad de Inversión de Capitales"},{"key":"b","text":"Sociedad de inversión de Renta variable"}],"correct":"b"},{"id":30,"text":"Invierten exclusivamente en instrumentos financieros definidos en sus estatutos y en su prospecto de información al público inversionista","options":[{"key":"a","text":"Sociedad de Inversión de capitales"},{"key":"b","text":"Sociedad de Inversión de Objeto Limitado"}],"correct":"b"},{"id":31,"text":"Invierte en valores y documentos emitidos por empresas que requieren recursos a largo plazo (acciones u obligaciones), que serán denominadas Empresas promovidas","options":[{"key":"a","text":"Sociedad de Inversión de Capitales"},{"key":"b","text":"Sociedad de inversión de Renta variable"}],"correct":"a"},{"id":32,"text":"¿Qué tipo de sociedades tienen prohibido recomprar sus acciones, a menos que coticen en la bolsa?","options":[{"key":"a","text":"Sociedades abiertas"},{"key":"b","text":"Sociedades Cerradas"}],"correct":"b"},{"id":33,"text":"Los fondos de inversión que son creados y operados por las instituciones de seguros, tienen las siguientes características:","options":[{"key":"a","text":"Son totalmente seguros"},{"key":"b","text":"Son con riesgo o sin riesgo"}],"correct":"b","handwritten_note":"“Fondos de inversión de aseguradoras” escrito a mano junto a la pregunta anterior/esta pregunta"},{"id":34,"text":"¿Quién administra las aportaciones obligatorias de los trabajadores para la jubilación?","options":[{"key":"a","text":"Afores"},{"key":"b","text":"Siefores"}],"correct":"a","handwritten_note":"“Administradora de fondos para el retiro” escrito a mano"},{"id":35,"text":"¿Quién invierte las aportaciones obligatorias de los trabajadores para la jubilación?","options":[{"key":"a","text":"Afores"},{"key":"b","text":"Siefores"}],"correct":"b","handwritten_note":"“Sociedad de inversión especializada en fondos para el retiro” escrito a mano"},{"id":36,"text":"Las instituciones cuya función principal es permitir a personas y empresas la transferencia de riesgos a través de contratos, son:","options":[{"key":"a","text":"Instituciones de seguros"},{"key":"b","text":"Casas de bolsa"}],"correct":"a"},{"id":37,"text":"¿Cuál es el propósito fundamental de la regulación del mercado financiero?","options":[{"key":"a","text":"Vigilar la solvencia de las entidades financieras"},{"key":"b","text":"Fomentar el desarrollo del sector industrial"}],"correct":"a"},{"id":38,"text":"¿Cuál es el propósito fundamental del mercado financiero?","options":[{"key":"a","text":"Asegurar la rentabilidad de los instrumentos de inversión"},{"key":"b","text":"Poner en contacto a los agentes financieros"}],"correct":"b","handwritten_note":"“inversionistas, emisores” escrito a mano junto a la opción b"},{"id":39,"text":"¿Cuál de las siguientes actividades no se realizan en los mercados financieros?","options":[{"key":"a","text":"Emitir instrumentos financieros"},{"key":"b","text":"Asegurar la rentabilidad de los instrumentos de inversión"}],"correct":"b"},{"id":40,"text":"Los instrumentos recién emitidos son colocados para su intermediación en el Mercado:","options":[{"key":"a","text":"Mercado Primario"},{"key":"b","text":"Mercado Secundario"}],"correct":"a","handwritten_note":"“nuevos” escrito bajo la palabra ‘recién emitidos’; el número 1 (Mercado Primario) aparece circulado (opciones impresas como 1 y 2)"},{"id":41,"text":"Es el mercado donde se renegocian instrumentos que ya existían","options":[{"key":"a","text":"Mercado Primario"},{"key":"b","text":"Mercado Secundario"}],"correct":"b","handwritten_note":"El número 2 (Mercado Secundario) aparece circulado (opciones impresas como 1 y 2); la palabra ‘renegocian’ subrayada"},{"id":42,"text":"Relaciona ambas columnas identificando las características de cada mercado: 1. Mercado de dinero; 2. Mercado de Capitales — a) Se colocan instrumentos de corto Plazo; b) Se colocan instrumentos de Alta liquidez y bajo rendimiento; c) Se colocan instrumentos de mediano y largo plazo; d) Se colocan instrumentos de baja liquidez y mayor rendimiento","options":[{"key":"a","text":"1 a, b; 2 c, d"},{"key":"b","text":"1 c, d; 2 a, b"}],"correct":"a","match":{"stem":"Relaciona ambas columnas identificando las características de cada mercado:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Mercado de dinero"},{"k":"2","text":"Mercado de Capitales"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Se colocan instrumentos de corto Plazo"},{"k":"b","text":"Se colocan instrumentos de Alta liquidez y bajo rendimiento"},{"k":"c","text":"Se colocan instrumentos de mediano y largo plazo"},{"k":"d","text":"Se colocan instrumentos de baja liquidez y mayor rendimiento"}]}]},"handwritten_note":"“1. a, b — 2. c, d” escrito a mano; “corto plazo” junto al inciso b y “largo plazo” junto al inciso d"},{"id":43,"text":"Relaciona ambas columnas estableciendo los instrumentos que se colocan en cada mercado: 1. Mercado de dinero; 2. Mercado de capitales — a) Cetes, Udibonos, Pic-farac; b) Aceptaciones bancarias; c) Acciones; d) Pagarés con rendimiento liquidable al vencimiento; e) Certificados de Participación","options":[{"key":"a","text":"1 a, d, e; 2 b, c"},{"key":"b","text":"1 a, b, d; 2 c, e"}],"correct":"b","match":{"stem":"Relaciona ambas columnas estableciendo los instrumentos que se colocan en cada mercado:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Mercado de dinero"},{"k":"2","text":"Mercado de capitales"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Cetes, Udibonos, Pic-farac"},{"k":"b","text":"Aceptaciones bancarias"},{"k":"c","text":"Acciones"},{"k":"d","text":"Pagarés con rendimiento liquidable al vencimiento"},{"k":"e","text":"Certificados de Participación"}]}]},"handwritten_note":"“corto plazo” escrito junto a los incisos a, b y d; “Largo plazo” junto a los incisos c y e"},{"id":44,"text":"Son contratos donde se establece la obligación de una de las partes para pagar el capital obtenido más un interés preestablecido","options":[{"key":"a","text":"Valores patrimoniales"},{"key":"b","text":"Instrumentos de deuda"}],"correct":"b","handwritten_note":"El número 2 (Instrumentos de deuda) aparece circulado (opciones impresas como 1 y 2)"},{"id":45,"text":"Identifica las características de los Instrumentos de Deuda: 1. Tienen interés preestablecido; 2. Tiene plazo fijo; 3. Son de renta variable; 4. Pueden ser de corto o largo plazo; 5. Son de bajo riesgo","options":[{"key":"a","text":"1, 3, 5"},{"key":"b","text":"1, 2, 5, 4"}],"correct":"b","list":{"stem":"Identifica las características de los Instrumentos de Deuda:","kind":"num","items":[{"k":"1","text":"Tienen interés preestablecido"},{"k":"2","text":"Tiene plazo fijo"},{"k":"3","text":"Son de renta variable"},{"k":"4","text":"Pueden ser de corto o largo plazo"},{"k":"5","text":"Son de bajo riesgo"}]},"handwritten_note":"Palomitas en 1, 2, 4 y 5; a la opción b (impresa “1, 2, 5”) se le agregó a mano el “4”"},{"id":46,"text":"Los siguientes son instrumentos adquiridos por los fondos de deuda, excepto:","options":[{"key":"a","text":"Acciones"},{"key":"b","text":"Papel Comercial"}],"correct":"a","handwritten_note":"El número 1 (Acciones) aparece circulado (opciones impresas como 1 y 2)"},{"id":47,"text":"Las siguientes opciones son instrumentos de deuda a corto plazo, Excepto:","options":[{"key":"a","text":"Papel comercial"},{"key":"b","text":"Certificados de participación ordinarios"}],"correct":"b"},{"id":48,"text":"Los activos financieros en función de los rendimientos o ganancias pueden ser clasificados en","options":[{"key":"a","text":"Títulos de renta fija o renta variable"},{"key":"b","text":"Títulos de deuda o de propiedad"}],"correct":"a","handwritten_note":"Subrayado a mano: “función de los rendimientos”"},{"id":49,"text":"Relaciona ambas columnas estableciendo las características de cada renta: 1. Renta Fija; 2. Renta Variable — a) Tienen plazo e interés preestablecido; b) No hay interés preestablecido; c) Son de bajo rendimiento y bajo riesgo; d) Son de alto rendimiento y alto riesgo","options":[{"key":"a","text":"1 a, c; 2 b, d"},{"key":"b","text":"1 b, d; 2 a, c"}],"correct":"a","match":{"stem":"Relaciona ambas columnas estableciendo las características de cada renta:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Renta Fija"},{"k":"2","text":"Renta Variable"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Tienen plazo e interés preestablecido"},{"k":"b","text":"No hay interés preestablecido"},{"k":"c","text":"Son de bajo rendimiento y bajo riesgo"},{"k":"d","text":"Son de alto rendimiento y alto riesgo"}]}]},"handwritten_note":"“1. a, c — 2. b, d” y “Acciones” (con flecha) escritos a mano"},{"id":50,"text":"El gobierno Federal, los Bancos y la Empresa Privada, para el mercado de valores son considerados:","options":[{"key":"a","text":"Emisores de instrumentos"},{"key":"b","text":"Intermediarios Bursátiles"}],"correct":"a"},{"id":51,"text":"Relaciona ambas columnas identificando los instrumentos de cada emisor: 1. Gobierno Federal; 2. Bancos; 3. Empresas Privadas — a) Papel comercial, Obligaciones, certificados de participación, acciones; b) Cetes, Udibonos, Pic-farac, Bondes; c) Pagarés con rendimiento liquidable al vencimiento, aceptaciones, certificados de depósito","options":[{"key":"a","text":"1 b, 2 c, 3 a"},{"key":"b","text":"1 b, 2 a, 3 c"}],"correct":"a","match":{"stem":"Relaciona ambas columnas identificando los instrumentos de cada emisor:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Gobierno Federal"},{"k":"2","text":"Bancos"},{"k":"3","text":"Empresas Privadas"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Papel comercial, Obligaciones, certificados de participación, acciones"},{"k":"b","text":"Cetes, Udibonos, Pic-farac, Bondes"},{"k":"c","text":"Pagarés con rendimiento liquidable al vencimiento, aceptaciones, certificados de depósito"}]}]},"handwritten_note":"Líneas trazadas a mano uniendo cada emisor con su inciso; las letras a), b), c) aparecen circuladas"},{"id":52,"text":"Se venden a descuento, tienen plazos de 28, 91 o 182 días y los garantiza el Gobierno Federal","options":[{"key":"a","text":"Bondes"},{"key":"b","text":"CETES"}],"correct":"b","handwritten_note":"“Por los plazos son cetes” escrito a mano"},{"id":53,"text":"Los emite Banobras en apoyo del rescate de autopistas concesionadas","options":[{"key":"a","text":"Bonos carreteros"},{"key":"b","text":"PIC – Farac"}],"correct":"b","handwritten_note":"Al pie de la página: “Pic-farac: Pagaré de indemnización carretera y fideicomiso de apoyo para el rescate de autopistas concesionadas”"},{"id":54,"text":"Qué instrumento financiero avalado por el gobierno federal está ligado con el índice nacional de precios al consumidor","options":[{"key":"a","text":"Udibonos"},{"key":"b","text":"Cetes"}],"correct":"a","handwritten_note":"“inflación” escrito bajo la pregunta; al margen: “Instrumento que se actualiza por inflación”"},{"id":55,"text":"¿Cuál de los siguientes instrumentos paga al final del plazo el principal más los intereses generados?","options":[{"key":"a","text":"Aceptaciones Bancarias"},{"key":"b","text":"Pagaré"}],"correct":"b","handwritten_note":"“con rendimiento” escrito a mano después de ‘Pagaré’"},{"id":56,"text":"Son las letras de cambio que emite un banco en respaldo al préstamo que hace a una empresa","options":[{"key":"a","text":"Pagarés con rendimiento liquidable al vencimiento"},{"key":"b","text":"Aceptaciones bancarias"}],"correct":"b","handwritten_note":"“Emite una empresa” escrito a mano junto a la opción b; ‘letras de cambio’ subrayado"},{"id":57,"text":"¿Cómo se llama al instrumento de deuda a corto plazo emitido por empresas mexicanas bien conocidas, cuyas acciones están cotizadas en la bolsa?","options":[{"key":"a","text":"Acción"},{"key":"b","text":"Papel comercial"}],"correct":"b"},{"id":58,"text":"Cuando la rentabilidad futura de algún activo financiero no es predecible, entonces el inversionista enfrenta un:","options":[{"key":"a","text":"Costo de oportunidad"},{"key":"b","text":"Riesgo"}],"correct":"b"},{"id":59,"text":"Son los riesgos que corresponden a la naturaleza de causar daño siempre que ocurren","options":[{"key":"a","text":"Riesgo Puro"},{"key":"b","text":"Riesgo Financiero"}],"correct":"a","handwritten_note":"“incendio, explosión, terremoto, enfermedades” escrito a mano"},{"id":60,"text":"Son los riesgos que se administran a través de los seguros","options":[{"key":"a","text":"Riesgos puros"},{"key":"b","text":"Riesgos financieros"}],"correct":"a"},{"id":61,"text":"Un campesino que siembra maíz, siente el temor de que una helada le impida cosechar, ¿De qué riesgo se trata?","options":[{"key":"a","text":"Riesgo puro"},{"key":"b","text":"Riesgo Financiero"}],"correct":"a","handwritten_note":"La palabra ‘helada’ aparece subrayada"},{"id":62,"text":"Se define como la incertidumbre que tiene un inversionista que no sabe cuánto ganará en la casa de bolsa","options":[{"key":"a","text":"Riesgo Puro"},{"key":"b","text":"Riesgo Financiero"}],"correct":"b","handwritten_note":"Junto a ‘Riesgo Puro’: “solo se pierde”; junto a ‘Riesgo Financiero’: “se gana o pierde”"},{"id":63,"text":"El cultivo de jitomate a resultado muy rentable a largo plazo, sin embargo, los precios han sido volátiles los últimos meses; ¿qué tipo de riesgo enfrenta el campesino?","options":[{"key":"a","text":"Riesgo Puro"},{"key":"b","text":"Riesgo Financiero"}],"correct":"b"},{"id":64,"text":"¿Cuál ejemplo, es un riesgo financiero?","options":[{"key":"a","text":"Un negocio pone una sucursal en una zona donde la delincuencia es muy alta"},{"key":"b","text":"Un inversionista compra un terreno en una zona con posibilidad de desarrollo"}],"correct":"b"},{"id":65,"text":"Relaciona ambas columnas identificando las características de cada riesgo: 1. Riesgo de Mercado; 2. Riesgo de Crédito; 3. Riesgo de Liquidez — a) Es la incertidumbre de no contar con los recursos para pagar obligaciones; b) Es el riesgo del inversionista que compra instrumentos de deuda; c) Es el que tiene que ver con el tipo de gobierno y su economía; d) Tiene que ver con la incertidumbre que genera el emisor con mala experiencia en pagos; e) Tiene que ver con la volatilidad en tasas de interés, devaluación o inflación","options":[{"key":"a","text":"1 c, e; 2 b, d; 3 a"},{"key":"b","text":"1 a, d; 2 b, 3 b, c"}],"correct":"a","match":{"stem":"Relaciona ambas columnas identificando las características de cada riesgo:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Riesgo de Mercado"},{"k":"2","text":"Riesgo de Crédito"},{"k":"3","text":"Riesgo de Liquidez"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Es la incertidumbre de no contar con los recursos para pagar obligaciones"},{"k":"b","text":"Es el riesgo del inversionista que compra instrumentos de deuda"},{"k":"c","text":"Es el que tiene que ver con el tipo de gobierno y su economía"},{"k":"d","text":"Tiene que ver con la incertidumbre que genera el emisor con mala experiencia en pagos"},{"k":"e","text":"Tiene que ver con la volatilidad en tasas de interés, devaluación o inflación"}]}]},"handwritten_note":"“1. c, e — 2. b, d — 3. a” escrito a mano"},{"id":66,"text":"La relación entre riesgo y rendimiento es:","options":[{"key":"a","text":"Directa"},{"key":"b","text":"Inversa"}],"correct":"a","handwritten_note":"“A mayor riesgo, mayor rendimiento” escrito a mano (la segunda palabra es poco legible)"},{"id":67,"text":"Es la capacidad del inversionista para convertir a efectivo sus activos financieros a corto plazo sin que afecte el valor de los mismos:","options":[{"key":"a","text":"Liquidez"},{"key":"b","text":"Riesgo"}],"correct":"a"},{"id":68,"text":"La relación entre la rentabilidad y la liquidez es:","options":[{"key":"a","text":"Directa"},{"key":"b","text":"Inversa"}],"correct":"b","handwritten_note":"“A mayor liquidez menor rendimiento” escrito a mano"},{"id":69,"text":"Un inversionista coloca el 70% en instrumentos de largo plazo, el 20% en instrumentos de mediano plazo y el 10% en instrumentos de corto plazo, ¿cuál tiene mayor liquidez?","options":[{"key":"a","text":"El 0.70"},{"key":"b","text":"El 0.10"}],"correct":"b"},{"id":70,"text":"¿Cuál de los siguientes instrumentos es de los más seguros y con mayor liquidez en el mercado de dinero?","options":[{"key":"a","text":"Papel comercial"},{"key":"b","text":"Cetes"}],"correct":"b"},{"id":71,"text":"¿Cuáles son los instrumentos del mercado de dinero con menor liquidez y que tienen mayor riesgo?","options":[{"key":"a","text":"Papel comercial"},{"key":"b","text":"Cetes"}],"correct":"a"},{"id":72,"text":"¿Cuáles son los instrumentos de inversión de alto rendimiento y mayor riesgo y por lo tanto representan una conducta agresiva del inversionista?","options":[{"key":"a","text":"CETES"},{"key":"b","text":"Acciones"}],"correct":"b"},{"id":73,"text":"Son los documentos que representan una parte alícuota del capital social de una persona moral lucrativa:","options":[{"key":"a","text":"Papel comercial"},{"key":"b","text":"Acciones"}],"correct":"b"},{"id":74,"text":"La distribución del capital entre varias alternativas con el fin de diluir el riesgo","options":[{"key":"a","text":"Prevención"},{"key":"b","text":"Diversificación"}],"correct":"b"},{"id":75,"text":"¿Cómo puede enfrentarse el riesgo propio, es decir aquel que se define por los peligros que rodean a determinada empresa?","options":[{"key":"a","text":"Mediante la diversificación de inversiones"},{"key":"b","text":"Incrementando los pasivos"}],"correct":"a"},{"id":76,"text":"Si un inversionista no elige un solo activo financiero, está realizando:","options":[{"key":"a","text":"Incrementando el riesgo"},{"key":"b","text":"La diversificación"}],"correct":"b"},{"id":77,"text":"Qué medida puede reducir la variabilidad de las rentabilidades de las acciones","options":[{"key":"a","text":"El endeudamiento"},{"key":"b","text":"La diversificación de inversiones"}],"correct":"b"},{"id":78,"text":"¿Qué concepto define la proyección de flujos equivalentes en términos de poder adquisitivo, al capital invertido en un plazo determinado a una cierta tasa de interés?","options":[{"key":"a","text":"Precio de equilibrio"},{"key":"b","text":"Valor del dinero en el tiempo"}],"correct":"b","handwritten_note":"Subrayado a mano: “proyección de flujos equivalentes en términos de poder adquisitivo”"},{"id":79,"text":"Es la cantidad de dinero que alcanzará una inversión en un plazo determinado agregándole los intereses que genere:","options":[{"key":"a","text":"Valor Presente"},{"key":"b","text":"Valor Futuro"}],"correct":"b","handwritten_note":"“o monto” escrito a mano junto a ‘Valor Futuro’"},{"id":80,"text":"Es una manera de calcular el valor de los activos, descontando la rentabilidad que obtiene un capital en un plazo determinado","options":[{"key":"a","text":"Valor Presente"},{"key":"b","text":"Valor Futuro"}],"correct":"a"},{"id":81,"text":"Es el aumento generalizado y sostenido de los precios de bienes y servicios en un país:","options":[{"key":"a","text":"Devaluación"},{"key":"b","text":"Inflación"}],"correct":"b"},{"id":82,"text":"Una persona obtiene un incremento salarial del 7%, si la inflación fue del 5%, ¿cómo afecta este evento al trabajador?","options":[{"key":"a","text":"Reduce su poder adquisitivo"},{"key":"b","text":"Incrementa su poder adquisitivo"}],"correct":"b"},{"id":83,"text":"Un inversionista obtiene una tasa efectiva del 8%, si en el mismo período la inflación fue del 8%, ¿cómo se considera el rendimiento real?","options":[{"key":"a","text":"Nulo"},{"key":"b","text":"Bajo"}],"correct":"a","handwritten_note":"“lo que rebasa la inflación” escrito a mano; al pie de la página: “Rendimiento real: Ganancia que supera la inflación. Puede ser positiva o negativa”"},{"id":84,"text":"Un inversionista obtiene una tasa efectiva del 6%, si en el mismo período la inflación fue del 4%, ¿cómo se considera el rendimiento?","options":[{"key":"a","text":"Bajo"},{"key":"b","text":"Alto"}],"correct":"a"},{"id":85,"text":"Una inversión paga el 14% de interés nominal, si en el mismo plazo la inflación fue del 7%; ¿cómo es la tasa real con relación a la tasa nominal?","options":[{"key":"a","text":"Mayor"},{"key":"b","text":"Menor"}],"correct":"b"},{"id":86,"text":"Es la disminución o pérdida del valor nominal de una moneda corriente frente a otras monedas extranjeras","options":[{"key":"a","text":"Devaluación"},{"key":"b","text":"Inflación"}],"correct":"a"},{"id":87,"text":"¿Qué operación financiera se identifica con el pago periódico de la prima de un seguro de vida?","options":[{"key":"a","text":"Anualidad"},{"key":"b","text":"Interés"}],"correct":"a"},{"id":88,"text":"Relaciona ambas columnas estableciendo los ejemplos de cada concepto: 1. Costo de Oportunidad; 2. Tolerancia al riesgo — a) Pérdida económica que acepta un inversionista para cambiar a otra inversión aparente mente mejor; b) Capacidad que tienen los inversionistas para soportar la volatilidad de las tasas o los mercados; c) Intereses que acepta pagar un inversionista para aprovechar oportunidades de mejor inversión; d) Permite al inversionista para incursionar a valores de mayor riesgo pero con mayor utilidad; e) Contablemente, es un gasto que no implica salida de dinero; f) Refleja la conducta de los inversionistas que realizan una correcta administración de riesgos para seleccionar mejor los instrumentos en que invierten","options":[{"key":"a","text":"1 a, c, e; 2 b, d, f"},{"key":"b","text":"1 b, d, f; 2 a, c, e"}],"correct":"a","match":{"stem":"Relaciona ambas columnas estableciendo los ejemplos de cada concepto:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Costo de Oportunidad"},{"k":"2","text":"Tolerancia al riesgo"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Pérdida económica que acepta un inversionista para cambiar a otra inversión aparente mente mejor"},{"k":"b","text":"Capacidad que tienen los inversionistas para soportar la volatilidad de las tasas o los mercados"},{"k":"c","text":"Intereses que acepta pagar un inversionista para aprovechar oportunidades de mejor inversión"},{"k":"d","text":"Permite al inversionista para incursionar a valores de mayor riesgo pero con mayor utilidad"},{"k":"e","text":"Contablemente, es un gasto que no implica salida de dinero"},{"k":"f","text":"Refleja la conducta de los inversionistas que realizan una correcta administración de riesgos para seleccionar mejor los instrumentos en que invierten"}]}]},"handwritten_note":"“1. a, c, e — 2. B, d, F” escrito a mano"},{"id":89,"text":"La rentabilidad de una inversión financiera es una recompensa al tenedor de activos por:","options":[{"key":"a","text":"Invertir su dinero de manera productiva"},{"key":"b","text":"Renunciar temporalmente al poder de adquisición y soportar el riesgo"}],"correct":"b"},{"id":90,"text":"Señale como se determina el rendimiento.","options":[{"key":"a","text":"Es la diferencia entre el precio de compra y el de venta de los instrumentos financieros"},{"key":"b","text":"Es la diferencia entre la oferta y la demanda de los instrumentos financieros"}],"correct":"a"},{"id":91,"text":"Relaciona ambas columnas establecido las características de cada tasa: 1. Tasa Efectiva; 2. Tasa Nominal — a) Es la que se expresa en los instrumentos; b) Representa la ganancia del plazo completo; c) Representa el interés de un año; d) No incluye inflación ni reinversión; e) Se calcula dividiendo Interés entre Capital Inicial","options":[{"key":"a","text":"1 b, e; 2 a, c, d"},{"key":"b","text":"1 a, c, d; 2 b, e"}],"correct":"a","match":{"stem":"Relaciona ambas columnas establecido las características de cada tasa:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Tasa Efectiva"},{"k":"2","text":"Tasa Nominal"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Es la que se expresa en los instrumentos"},{"k":"b","text":"Representa la ganancia del plazo completo"},{"k":"c","text":"Representa el interés de un año"},{"k":"d","text":"No incluye inflación ni reinversión"},{"k":"e","text":"Se calcula dividiendo Interés entre Capital Inicial"}]}]},"handwritten_note":"“1. b, e — 2. a, c, d” escrito a mano"},{"id":92,"text":"Relaciona ambas columnas estableciendo las características de cada tasa: 1. Tasa Simple; 2. Tasa Compuesta — a) Los intereses se capitalizan; b) Los intereses no ganan intereses; c) Los rendimientos tienen este comportamiento: primer año $300, segundo año $300, tercer año $300; d) Los rendimientos se comportan así: primer período $50.00, y en el segundo $55.00","options":[{"key":"a","text":"1 a, c; 2 b, d"},{"key":"b","text":"1 b, c; 2 a, d"}],"correct":"b","match":{"stem":"Relaciona ambas columnas estableciendo las características de cada tasa:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Tasa Simple"},{"k":"2","text":"Tasa Compuesta"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Los intereses se capitalizan"},{"k":"b","text":"Los intereses no ganan intereses"},{"k":"c","text":"Los rendimientos tienen este comportamiento: primer año $300, segundo año $300, tercer año $300"},{"k":"d","text":"Los rendimientos se comportan así: primer período $50.00, y en el segundo $55.00"}]}]},"handwritten_note":"“1. b, c — 2. a, d” escrito a mano"},{"id":93,"text":"Señala que tasa le conviene más al inversionista","options":[{"key":"a","text":"1% mensual"},{"key":"b","text":"12% anual"}],"correct":"a","handwritten_note":"“En compuesta es más —” escrito a mano"},{"id":94,"text":"¿Cómo se denomina la tasa que se paga por el uso de recursos financieros?","options":[{"key":"a","text":"Tasa pasiva"},{"key":"b","text":"Tasa activa"}],"correct":"a","handwritten_note":"‘se paga’ aparece subrayado en la pregunta"},{"id":95,"text":"Tasa que cobran las instituciones por los créditos que otorgan","options":[{"key":"a","text":"Tasa Pasiva"},{"key":"b","text":"Tasa Activa"}],"correct":"b","handwritten_note":"‘cobran’ aparece subrayado en la pregunta"},{"id":96,"text":"¿Qué termino define el derecho de los propietarios sobre los activos netos de una empresa?","options":[{"key":"a","text":"Riqueza"},{"key":"b","text":"Patrimonio"}],"correct":"b"},{"id":97,"text":"Venta de producto, descuentos en pasivos, obsequios o cualquier situación que incremente el patrimonio, contablemente se consideran:","options":[{"key":"a","text":"Ingresos"},{"key":"b","text":"Egresos"}],"correct":"a"},{"id":98,"text":"Sueldos, prestaciones, premios que reciben las personas; se consideran","options":[{"key":"a","text":"Ingresos"},{"key":"b","text":"Egresos"}],"correct":"a","handwritten_note":"‘que reciben las personas’ aparece subrayado"},{"id":99,"text":"Intereses de un crédito, renta de vivienda, pago de servicios; se consideran","options":[{"key":"a","text":"Ingresos"},{"key":"b","text":"Egresos"}],"correct":"b"},{"id":100,"text":"Los pagos periódicos que realiza una persona para reducir la deuda de una tarjeta de crédito; ¿cómo afecta a los individuos?","options":[{"key":"a","text":"Aumenta poder adquisitivo"},{"key":"b","text":"Reduce poder adquisitivo"}],"correct":"b"}]},{"id":"mat","label":"Matemáticas Financieras","theory":[{"title":"Razones y Proporciones — notas manuscritas (página 1)","content_md":"Encabezado impreso: **Matemáticas Financieras — Razones y Proporciones**.\n\nNota manuscrita en la parte superior de la página:\n\n> Contestar\n> - % a decimal ÷ 100\n> - decimal a % × 100"},{"title":"Tasa Nominal y Tasa Efectiva (página 2)","content_md":"**Tasa Nominal** (nota manuscrita junto al título: \"10 %\"):\n\n1. Es la expresada en los instrumentos o contratos de inversión\n2. Representa el interés que se ganaría en un año\n3. No contempla la inflación ni la reinversión\n\n**Nota: si el problema no aclara el tipo de tasa, se considera el cálculo nominal o anual.**\n\n**Tasa Efectiva**:\n\n1. Es la ganancia que se obtiene en el plazo completo que dura la inversión, puede ser un sólo periodo o varios periodos.\n2. Se obtiene dividiendo el interés entre el capital inicial (valor presente)\n\nNota manuscrita: \"Tasa efectiva = interés ÷ capital inicial\""},{"title":"Tasa Real (página 2)","content_md":"**Tasa Real**: Representa el rendimiento que rebasa a la tasa de inflación, se obtiene descontando la inflación a la tasa efectiva o tasa nominal.\n\nNotas manuscritas al pie de la página (método):\n\n> inflación abajo, interés arriba\n> 5 + 100 = 105 ; 8 + 100 = 108 ; ÷ = 0.97 − 1 = 0.03 [ilegible] × 100 = [ilegible]\n> Restar interés − inflación y marcar la que no da de resultado [ilegible]"},{"title":"Interés Simple (página 3)","content_md":"**Interés Simple**: En cada reinversión los intereses son retirados, sólo se reinvierte el capital inicial. Los intereses no ganan intereses.\n\nNotas manuscritas en el margen izquierdo de la página:\n\n> cuánto\n> Tarea\n> Monto es igual a capital + intereses\n> Es igual a valor futuro\n> Es igual a valor que alcanzará\n\nNota manuscrita entre las preguntas 9 y 10: \"Capital inicial = Valor presente\".\n\nNotas manuscritas al pie de la página: \"160,000 → 100 % / 83,324.87 —\" y \"× 3.5 / 1.435\"."},{"title":"Interés Compuesto (página 4)","content_md":"**Interés Compuesto**: Los intereses se agregan al capital en cada reinversión (capitalización), por lo tanto, los intereses también ganan intereses.\n\nNotas manuscritas:\n\n> Cuando dice capitalizable es interés compuesto\n> si no está directo es anual (con flecha hacia \"12% capitalizable trimestralmente\" de la pregunta 1)\n> Anual (con flecha hacia \"tasa nominal del 6.5%\" de la pregunta 2)"},{"title":"Procedimiento para calcular interés simple — con problemas resueltos a mano (páginas 5, 6 y 7)","content_md":"Pasos impresos del procedimiento (los pasos 6 y 7 solo aparecen en algunas tablas):\n\n1. Convierto la tasa a decimal\n2. Defino si la tasa es anual, mensual, bimestral, trimestral, cuatrimestral o anual\n3. Si la tasa es anual y el periodo de inversión es menor, la tasa se divide entre 12, 6, 4, 3 o 2\n4. La tasa del periodo se multiplica por el número de periodos invertidos\n5. Si el problema pide calcular interés, la tasa efectiva se multiplica por el capital\n6. Si el problema pide calcular monto, a la tasa efectiva se le suma 1 y el resultado se multiplica por el capital\n7. Si el problema pide calcular capital inicial, el monto se divide entre la suma de la tasa más 1\n\nColumna \"Problema\" llenada a mano (corresponden a las preguntas de Interés Simple de la página 3):\n\n**Problema 1**: 3.5 ÷ 100 = 0.035 | Anual | .035 ÷ 12 = 0.0029 | 0.0029 × 18 = 0.052 | 0.052 × 50,000 = 2,625\n\n**Problema 2**: 3.5 ÷ 100 = 0.035 | Tasa mensual | No aplica, NO ES ANUAL | 0.035 × 1 = 0.035 | 0.035 × 50,000 = 1,750\n\n**Problema 3**: 12 ÷ 100 = 0.12 | Tasa bimestral | No aplica | 0.12 × 1 = 0.12 | 0.24 × 4,390 = 526.8 [sic]\n\n**Problema 4**: 12 ÷ 100 = 0.12 | Tasa bimestral | No aplica | 0.12 × (incompleto) | (paso 5 en blanco)\n\n**Problema 5** (la tabla de este problema lleva el encabezado impreso \"Procedimiento para calcular interés compuesto\", aunque los pasos son los del interés simple con monto): 6 ÷ 100 = 0.06 | Tasa Anual | 0.06 ÷ 4 = 0.015 | 0.015 × 3 = 0.045 | No aplica - No se pide interés | 0.045 + 1 = 1.045 × 450 = 470.25\n\n**Problema 6**: 6 ÷ 100 = 0.06 | Tasa Trimestral | No aplica porque no es Anual | 0.06 × 3 = 0.18 | No aplica - no pide interés | 0.18 + 1 = 1.18 × 450 = 531\n\n**Problema 7**: 9 ÷ 100 = 0.09 | Tasa cuatrimestral | (resto de la tabla en blanco)\n\n**Problema 8**: (tabla en blanco)\n\n**Problema 9**: .24 ÷ | Tasa anual | .24 ÷ 4 = 0.06 | 0.06 × 1 = 0.06 | No aplica - No pide i[nterés] | No aplica - No pide mont[o] | 1000 ÷ 1.06 = 943.39\n\n**Problema 10**: 4 ÷ 100 = 0.04 | Tasa semestral | No Aplica | 0.04 × 3 = 0.12 | No Aplica | No Aplica | 32,000 ÷ 1.12 = 28,571\n\n**Problema 11**: (tabla en blanco)\n\n**Problema 12**: (tabla en blanco)"},{"title":"Procedimiento para calcular interés compuesto — con problemas resueltos a mano (páginas 8, 9 y 10)","content_md":"Nota manuscrita en la parte superior de la página 8 (truco de calculadora):\n\n> 1.03 × y presionar 2 veces igual\n> [1.03 × = =] → uno menos a la potencia\n\nPasos impresos del procedimiento:\n\n1. Convierto la tasa a decimal\n2. Defino si la tasa es anual, mensual, bimestral, trimestral, cuatrimestral o anual\n3. Si la tasa es anual y el periodo de inversión es menor, la tasa se divide entre 12, 6, 4, 3 o 2\n4. A la tasa del periodo se le suma 1 y el resultado se eleva a la potencia de acuerdo al número de periodos invertidos\n5. Si el problema pide calcular monto, la tasa potenciada se multiplica por el capital\n6. Si el problema pide calcular capital inicial, el monto se divide entre la tasa potenciada\n\nColumna \"Problema\" llenada a mano (corresponden a las preguntas de Interés Compuesto de la página 4):\n\n**Problema 1**: 12 ÷ 100 = 0.12 | Tasa Anual | 0.12 ÷ 4 = 0.03 | 0.03 + 1 = 1.03^3 = 1.092727 | 1.092727 × 1,500 = 1,639 | No se hace porque no pide capi[tal]\n\n**Problema 2**: 6.5 ÷ 100 = 0.065 | Tasa anual | 0.065 ÷ 6 = 0.010833 | 0.010 + 1 = 1.01083 = 1.0328 | 1.0328 × 850,000 = 877,925.3 | No se hace\n\n**Problema 3**: (tabla en blanco)\n\n**Problema 4** (en esta tabla el paso 5 impreso dice \"a la tasa efectiva se le suma 1 y el resultado se multiplica por el capital\"): 4 ÷ 100 = 0.04 | Tasa Anual | No aplica porque es mayor a[l año] | 0.04 + 1 = 1.04^5 = 1.2166 | 1.2166 × 175,000 = 212,90[ilegible] | (en blanco). Nota manuscrita al pie con flecha a este problema: \"Hay que agregar inflación\"\n\n**Problema 5**: 3 ÷ 100 = 0.03 | Tasa Anua[l] | No aplica | 0.03 + 1 = 1.03^2 = 1.0609 | No aplica | 10,000 ÷ 1.0609 = 9,425.9. Nota manuscrita arriba con flecha a este problema: \"Hay que descontar inflación\"\n\n**Problema 6**: (tabla en blanco)\n\n**Problema 7**: (tabla en blanco)\n\n**Problema 8**: (tabla en blanco)\n\n**Problema 9**: 12 ÷ 100 = 0.12 | Tasa Anual | No hay periodos menores a 1 [año] | 0.12 + 1 = 1.12^3 = 1.404928 | No aplica, no pide monto | 10 ÷ 1.404928 = 7.11"}],"questions":[{"id":1,"text":"El 78% de los autos asegurados no son nuevos. Exprésalo en decimales","options":[{"key":"a","text":"0.078"},{"key":"b","text":"0.78"}],"correct":"b"},{"id":2,"text":"Relaciona ambas columnas estableciendo la equivalencia de expresiones porcentuales y decimales. Columna izquierda: a) 1%, b) 1.5%, c) 10%. Columna derecha: 1. 0.1, 2. 0.01, 3. 0.015","options":[{"key":"a","text":"a 1, b 2, c 3"},{"key":"b","text":"a 2, b 3, c 1"}],"correct":"b","match":{"stem":"Relaciona ambas columnas estableciendo la equivalencia de expresiones porcentuales y decimales:","cols":[{"label":"Columna izquierda","kind":"let","items":[{"k":"a","text":"1%"},{"k":"b","text":"1.5%"},{"k":"c","text":"10%"}]},{"label":"Columna derecha","kind":"num","items":[{"k":"1","text":"0.1"},{"k":"2","text":"0.01"},{"k":"3","text":"0.015"}]}]},"handwritten_note":"Líneas trazadas a mano conectando las columnas de porcentajes y decimales; sin círculo visible en las opciones."},{"id":3,"text":"Un agente de seguros visita a 30 prospectos, de los cuales 6 adquieren seguro de vida. Calcula la razón equivalente a la efectividad.","options":[{"key":"a","text":"1/5"},{"key":"b","text":"2/8"}],"correct":"a","handwritten_note":"6 ÷ 30 = 2 [sic]. Junto a las opciones: 1/5 = .2 ; 2/8 = .25"},{"id":4,"text":"Relaciona ambas columnas determinando las fracciones equivalentes. Columna izquierda: 1. 5/7, 2. 14/32, 3. 15/75. Columna derecha: a) 1/5, b) 25/35, c) 7/16","options":[{"key":"a","text":"1 b, 2 c, 3 a"},{"key":"b","text":"1 a, 2 c, 3 b"}],"correct":"a","match":{"stem":"Relaciona ambas columnas determinando las fracciones equivalentes:","cols":[{"label":"Columna izquierda","kind":"num","items":[{"k":"1","text":"5/7"},{"k":"2","text":"14/32"},{"k":"3","text":"15/75"}]},{"label":"Columna derecha","kind":"let","items":[{"k":"a","text":"1/5"},{"k":"b","text":"25/35"},{"k":"c","text":"7/16"}]}]},"handwritten_note":"5/7 = 0.71 ; 14/32 = 0.43 ; 15/75 = 0.2 ; 1/5 = 0.2 ; 25/35 = 0.71 ; 7/16 = 0.43"},{"id":5,"text":"El Sr. López repartió entre sus 2 hijos $ 1,250.00; a Pepe le corresponden 3/8 y el resto a Sandra. ¿Cuánto le toca a Pepe? (numerada \"4.\" en el original, número repetido)","options":[{"key":"a","text":"$ 468.75"},{"key":"b","text":"$ 781.25"}],"correct":"a","handwritten_note":"3/8 = 0.375 ; 0.375 × 1,250 = (flecha hacia la opción a)"},{"id":6,"text":"Un asegurado incrementa su suma asegurada en 3/7, si pagaba una prima de $ 3,500.00, ¿cuánto incrementará su prima?","options":[{"key":"a","text":"$ 1500.00"},{"key":"b","text":"$ 1600.00"}],"correct":"a","handwritten_note":"3/7 = 0.42 ; 0.42 × 3,500 = 1,500"},{"id":7,"text":"Un asegurado tiene una suma asegurada de $50,000 y paga una prima de $230. Tomando en cuenta misma edad y riesgo, si el asegurado incrementa la suma asegurada en 2/8 ¿Cuánto pagará de prima?","options":[{"key":"a","text":"$287.5"},{"key":"b","text":"$285.3"}],"correct":"a","handwritten_note":"2/8 = 0.25 ; 0.25 × 230 = 57.5 + 230 ="},{"id":8,"text":"¿Qué porcentaje es 337.50 de 13,500.00?","options":[{"key":"a","text":"25%"},{"key":"b","text":"2.5%"}],"correct":"b","handwritten_note":"337.50 ÷ 13,500 = 0.025 × 100 = 2.5"},{"id":9,"text":"Si 4 de cada 5 mujeres sufre cáncer, ¿qué porcentaje sufre la enfermedad?","options":[{"key":"a","text":"80%"},{"key":"b","text":"8%"}],"correct":"a","handwritten_note":"4 ÷ 5 = 0.8 × 100 = 80"},{"id":10,"text":"Un agente de seguros cobra $ 3,500 de comisión por un seguro, si la prima fue de $ 19,000 ¿qué porcentaje de comisión se manejó?","options":[{"key":"a","text":".1842%"},{"key":"b","text":"18.42%"}],"correct":"b","handwritten_note":"3,500 ÷ 19,000 = 0.1842 × 100"},{"id":11,"text":"En un examen aprueban 58 alumnos, que representan el 72.5% ¿Cuántos alumnos presentaron el examen?","options":[{"key":"a","text":"95"},{"key":"b","text":"80"}],"correct":"b","handwritten_note":"58 ÷ .725 = 80"},{"id":12,"text":"Una promotoría tiene 15 mujeres en su fuerza de ventas, que representa el 65%, ¿cuántos hombres tiene la promotora?","options":[{"key":"a","text":"8"},{"key":"b","text":"23"}],"correct":"a","handwritten_note":"15 ÷ .65 = 23.07 Total agentes − 15"},{"id":13,"text":"A una mujer le adelantan $ 200.00 que es el 15% de su tanda, ¿cuánto falta que le paguen?","options":[{"key":"a","text":"$ 1,133"},{"key":"b","text":"$ 1,333"}],"correct":"a","handwritten_note":"200 ÷ .15 = 1,333, Total de tanda − 200 = 1,133"},{"id":14,"text":"Un comerciante pide un préstamo de $ 45,000; la tasa de interés nominal es del 5%. ¿en cuántos días pagará un interés de $ 1,125?","options":[{"key":"a","text":"180 días"},{"key":"b","text":"90 días"}],"correct":"a","handwritten_note":"45,000 × .05 = 2,250 → 360 días ; 1,125 = 180 días ; = Anual = 360 días"},{"id":15,"text":"Si 20 obreros fabrican 300 pantalones en 10 días, ¿cuántos pantalones fabricarán 8 obreros en 20 días?","options":[{"key":"a","text":"240"},{"key":"b","text":"300"}],"correct":"a","handwritten_note":"Producción 300 ÷ Personas 20 ÷ Días 10 = 1.5 × 8 × 20 = 240"},{"id":16,"text":"Si 30 mujeres fabrican 200 bolsas en 15 días, ¿cuántas bolsas fabricarán 18 mujeres en 25 días","options":[{"key":"a","text":"225"},{"key":"b","text":"200"}],"correct":"b","handwritten_note":"Producción 200 ÷ Personas 30 ÷ Días 15 = 0.444 × 18 × 25 = 200"},{"id":17,"text":"Una inversión inicia con $ 40,000.00, a los 18 meses se recuperan $ 45,000.00; ¿qué tasa efectiva se obtuvo?","options":[{"key":"a","text":"1.25%"},{"key":"b","text":"12.5%"}],"correct":"b","handwritten_note":"5 ÷ 40,000 = 0.125 × 100 = 12.50 (la marca sobre la opción no es clara; el cálculo manuscrito da 12.50)"},{"id":18,"text":"Una inversión inicia con $ 40,000.00, a los 18 meses se recuperan $ 45,000.00; ¿qué tasa se obtuvo?","options":[{"key":"a","text":"12.5%"},{"key":"b","text":"8.33%"}],"correct":"b","handwritten_note":"12.5 ÷ 18 = 0.69 mensual × 12 = 8.33"},{"id":19,"text":"¿Si una inversión de $ 65,000, ganó $ 15,000 en 2 años, ¿qué tasa efectiva, le aplicaron?","options":[{"key":"a","text":"23.07%"},{"key":"b","text":"11.54%"}],"correct":"a","handwritten_note":"15,000 ÷ 65,000 = 0.23 × 100 = 23.07 (la marca sobre la opción no es clara; el cálculo manuscrito da 23.07)"},{"id":20,"text":"¿Si una inversión de $ 65,000, ganó $ 15,000 en 2 años, ¿qué tasa, le aplicaron?","options":[{"key":"a","text":"23.07%"},{"key":"b","text":"11.54%"}],"correct":"b","handwritten_note":"23.07 ÷ 2 = 11.53"},{"id":21,"text":"Si una inversión de $ 34,000 gana $ 2,750 en 15 meses, ¿qué tasa efectiva obtuvo?","options":[{"key":"a","text":"8.08%"},{"key":"b","text":"6.47%"}],"correct":"a","handwritten_note":"2,750 ÷ 34,000 = 0.08 × 100 = 8.08"},{"id":22,"text":"Si una inversión de $ 34,000 gana $ 2,750 en 15 meses, ¿qué tasa, obtuvo?","options":[{"key":"a","text":"8.08%"},{"key":"b","text":"6.47%"}],"correct":"b","handwritten_note":"8.08 ÷ 15 = 0.53 mensual × 12 meses = 6.47"},{"id":23,"text":"Una persona invierte $ 3,500, durante un trimestre y obtiene $ 35.50, ¿qué tasa efectiva le dieron?","options":[{"key":"a","text":"1.01%"},{"key":"b","text":"4.05%"}],"correct":"a","handwritten_note":"35.50 ÷ 3,500 = 0.01 = 1.01"},{"id":24,"text":"Una persona invierte $ 3,500, durante un trimestre y obtiene $ 35.50, ¿qué tasa le dieron?","options":[{"key":"a","text":"1.01%"},{"key":"b","text":"4.05%"}],"correct":"b","handwritten_note":"1.01 × 4 = 4.05 → Trimestres de un año"},{"id":25,"text":"Si se invierte un capital inicial de $5000 y se retorna después de 18 meses $6,300. Calcula la tasa real si en ese periodo hubo una inflación del 5%","options":[{"key":"a","text":"20%"},{"key":"b","text":"21%"}],"correct":"a","handwritten_note":"1,300 ÷ 5,000 = 0.26 × 100 = 26 ; 26 + 100 = 126 / 5 + 100 = 105 ; ÷ = 1.2 − 1 = 0.2 × 100 = 20"},{"id":26,"text":"Se invierte una capital de $ 30,000; le pagan un interés de $ 6,000. Si en el mismo plazo hubo una inflación del 10%, ¿Qué tasa real obtuvo?","options":[{"key":"a","text":"10%"},{"key":"b","text":"9.09%"}],"correct":"b","handwritten_note":"6,000 ÷ 30,000 = 0.2 × 100 = 20 ; 20 + 100 = 120 / 10 + 100 = 110 ; ÷ = 1.09 − 0.09 × 100 = 9.09 [sic]"},{"id":27,"text":"¿Cuál es la tasa real si se obtiene una tasa nominal del 13% y en el mismo periodo la inflación fue del 6.9%","options":[{"key":"a","text":"6.1%"},{"key":"b","text":"5.70%"}],"correct":"b","handwritten_note":"13 + 100 = 113 / 6.9 + 100 = 106.9 ; ÷ = 1.05 − 1 = 0.05 × 100 = 5.70"},{"id":28,"text":"Si se tiene una inflación del 6% y la tasa de interés es del 10%, calcula la tasa real.","options":[{"key":"a","text":"3.77%"},{"key":"b","text":"4%"}],"correct":"a","handwritten_note":"10 + 100 = 110 / 6 + 100 = 106 ; ÷ = 1.03 − 1 = 0.037 × 100 = 3.77"},{"id":29,"text":"Calcula la tasa real si la inflación es del 8% y la tasa efectiva obtenida es del 5%","options":[{"key":"a","text":"2.77%"},{"key":"b","text":"-2.77%"}],"correct":"b","handwritten_note":"Al pie de la página: inflación abajo, interés arriba ; 5 + 100 = 105 / 8 + 100 = 108 ; ÷ = 0.97 − 1 = 0.03 [ilegible] × 100 = [ilegible] ; Restar interés − inflación y marcar la que no da de resultado [ilegible]"},{"id":30,"text":"Una persona obtiene un préstamo de $ 50,000.00 y acepta liquidarlos en año y medio, pagando mensualmente el interés mientras exista la deuda, le aplican una tasa simple del 3.5% ¿cuánto pagará de interés?","options":[{"key":"a","text":"$ 2,625.00"},{"key":"b","text":"$ 1,750.00"}],"correct":"a","handwritten_note":"La tasa es anual porque no dice 3.5 mensual"},{"id":31,"text":"Una persona obtiene un préstamo de $ 50,000.00 y acepta liquidarlos en año y medio, mientras exista la deuda, le aplican una tasa simple del 3.5% mensual, ¿cuánto paga de interés cada mes?","options":[{"key":"c","text":"$ 2,625.00"},{"key":"d","text":"$ 1,750.00"}],"correct":"d","handwritten_note":"\"3.5% mensual\" subrayado a mano"},{"id":32,"text":"Calcule el interés de una inversión de $ 4,390 a una tasa del 12% en 60 días","options":[{"key":"a","text":"$ 87.80"},{"key":"b","text":"$ 526.80"}],"correct":"a"},{"id":33,"text":"Calcule el interés de una inversión de $ 4,390 a una tasa del 12 % bimestral en 60 días","options":[{"key":"c","text":"$ 87.80"},{"key":"d","text":"$ 526.80"}],"correct":"d"},{"id":34,"text":"¿Qué monto alcanzarán $ 450.00 al 6% de interés simple durante 3 trimestres?","options":[{"key":"a","text":"$ 531"},{"key":"b","text":"$ 470.25"}],"correct":"b","handwritten_note":"En el margen izquierdo: Monto es igual a capital + intereses"},{"id":35,"text":"¿Qué monto alcanzarán $ 450.00 al 6% trimestral de interés simple durante 3 trimestres?","options":[{"key":"a","text":"$ 531"},{"key":"b","text":"$ 470.25"}],"correct":"a"},{"id":36,"text":"Calcula el valor que tendrán $ 5,250.00 a los 6 cuatrimestres, si se invierten a una tasa simple del 9% cuatrimestral","options":[{"key":"a","text":"$ 8,085"},{"key":"b","text":"$ 6,195"}],"correct":"a"},{"id":37,"text":"Calcula el valor que tendrán $ 5,250.00 a los 6 cuatrimestres, si se invierten a una tasa simple del 9%","options":[{"key":"c","text":"$ 8,085"},{"key":"d","text":"$ 6,195"}],"correct":"d"},{"id":38,"text":"Tres meses después de pedir prestado, una persona paga $ 1000.00 ¿cuánto pidió prestado si le aplicaron una tasa simple anual del 24 %","options":[{"key":"a","text":"$ 943.39"},{"key":"b","text":"$ 940.00"}],"correct":"a","handwritten_note":"Capital inicial = Valor presente"},{"id":39,"text":"Un inversionista recupera $ 32,000.00 a los 18 meses, si le aplicaron una tasa simple del 4% semestral, ¿cuánto fue su capital inicial?","options":[{"key":"a","text":"$ 28,571.43"},{"key":"b","text":"$ 28,449.50"}],"correct":"a"},{"id":40,"text":"¿Cuál fue el capital inicial si un inversionista recupera $ 160,000 en 20 años y seis meses y le aplicaron una tasa simple del 7%?","options":[{"key":"a","text":"$ 83,254.87"},{"key":"b","text":"$ 65,708.42"}],"correct":"b","handwritten_note":"Al pie de la página: 160,000 → 100 % ; 83,324.87 —"},{"id":41,"text":"Un inversionista recupera $ 325,000 a los 8 años si le aplicaron una tasa del 3% semestral ¿con cuánto inició?","options":[{"key":"a","text":"$ 219,594.60"},{"key":"b","text":"$ 262,096.00"}],"correct":"a"},{"id":42,"text":"Con $ 1,500.00 al 12% capitalizable trimestralmente, ¿cuánto habrá en 9 meses?","options":[{"key":"a","text":"$ 2,107.39"},{"key":"b","text":"$ 1,639.09"}],"correct":"b","handwritten_note":"Debajo de la pregunta: \"si no está directo es anual\". (En la hoja de procedimientos, el Problema 1 de interés compuesto calcula a mano 1.092727 × 1,500 = 1,639)"},{"id":43,"text":"Se invierten $ 850,000 durante un año a una tasa nominal del 6.5% con capitalización bimestral; ¿qué monto se alcanzará después de 6 meses?","options":[{"key":"a","text":"$ 877,598.25"},{"key":"b","text":"$ 877,924.48"}],"correct":"b","handwritten_note":"Junto a \"tasa nominal\": \"Anual\""},{"id":44,"text":"Si se invierten durante 6 cuatrimestres un capital de $27,000 a una tasa del 3%. Calcula cuánto valdrá el capital si se reinvirtieron los intereses anualmente:","options":[{"key":"a","text":"$30,000.2"},{"key":"d","text":"$28,644.3"}],"correct":"d"},{"id":45,"text":"Si unos estudiantes desean realizar un viaje dentro de 5 años, que hoy les cuesta $ 175,000.00 y se piensa que habrá una inflación del 4% anual, ¿Cuánto deben ahorrar?","options":[{"key":"a","text":"$ 212,914.26"},{"key":"b","text":"$ 202,584.37"}],"correct":"a","handwritten_note":"\"inflación\" subrayado a mano. (En la hoja de procedimientos: \"Hay que agregar inflación\")"},{"id":46,"text":"Si se guardan $ 10,000.00 en una caja de seguridad y la inflación es del 3% anual, ¿Cuál será el valor futuro en términos de poder adquisitivo a los dos años?","options":[{"key":"a","text":"$ 9,433.96"},{"key":"b","text":"$ 9,425.96"}],"correct":"b","handwritten_note":"(En la hoja de procedimientos: \"Hay que descontar inflación\"; 10,000 ÷ 1.0609 = 9,425.9)"},{"id":47,"text":"Una pareja ahorra durante 48 quincenas $ 50,000, si le aplicaron una tasa compuesta del 10% anual, ¿cuál fue su capital inicial?","options":[{"key":"a","text":"$ 41,322.31"},{"key":"b","text":"$ 40,431.26"}],"correct":"a"},{"id":48,"text":"Un inversionista recupera 43,200.00 a los 18 meses de iniciada su inversión, si le aplicaron una tasa del 14% capitalizable semestralmente, ¿Cuál fue su valor presente?","options":[{"key":"a","text":"$ 35,264.06"},{"key":"b","text":"$ 35,702.47"}],"correct":"a"},{"id":49,"text":"Un capital que se capitalizó durante 2 años se convirtió en $ 33,820.00; si le aplicaron una tasa cuatrimestral del 4%, calcular el valor presente.","options":[{"key":"a","text":"$24,713.18"},{"key":"b","text":"$ 26,728.43"}],"correct":"b"},{"id":50,"text":"Hace 3 años se compraban 10 pantalones con $ 1,200; si la inflación fue del 12%, ¿cuántos pantalones se compran hoy con $ 1,200?","options":[{"key":"a","text":"7"},{"key":"b","text":"9"}],"correct":"a","handwritten_note":"(En la hoja de procedimientos, Problema 9: 1.12^3 = 1.404928 ; 10 ÷ 1.404928 = 7.11)"}]},{"id":"autos","label":"Automóviles","theory":[{"title":"Coberturas Básicas — Daños Materiales","content_md":"*(Nota manuscrita en la parte superior de la página: \"Modulo 4\". Nota manuscrita en el margen izquierdo: \"Aprender\".)*\n\n**Objetivo:** Resarce las pérdidas parciales o totales que sufra el auto asegurado. (Se considera pérdida total: daño mayor al 50% a petición del asegurado; más del 75% es automático). Opera en México, USA y Canadá.\n\n**Riesgos Cubiertos:**\n1. Colisiones, Volcaduras\n2. Rotura de cristales\n3. Incendio, rayo o explosión\n4. Riesgos naturales como huracán, inundación, terremoto, etc.\n5. Actos vandálicos de personas que participen en eventos públicos (huelgas, mítines, alborotos populares)\n6. Caída de objetos sobre el automóvil\n7. Alud, derrumbe de rocas o tierra\n8. Daños por traslado en otro medio por colisión, volcadura, descarrilamiento o hundimiento del vehículo transportador, caídas durante la carga descarga o trasbordo, avería gruesa\n9. Grúa por accidente hasta 30 días de salario mínimo del D.F.\n\n**Riesgos Por Convenio Expreso:**\n1. Automóviles para enseñanza de manejo\n2. Automóviles de competencia\n3. Autos con usos diferentes al autorizado\n4. Automóviles que se utilizan para arrastrar remolques\n5. En tracto camiones, el segundo remolque (Dolly)\n\n**Exclusiones Definitivas:**\n1. Falta de licencia\n2. Fallas mecánicas\n3. Partes bajas por sobrecarga o exceso de tracción o transitar en caminos no adecuados\n4. Servicio militar\n5. Daños causados por la marea\n6. Daños causados por su propia carga\n7. Daños por estado de embriaguez o drogadicción en autos de trabajo\n8. Perjuicios por no poder utilizar el auto\n\n**Deducible:**\n- 5% sobre la suma asegurada\n- 20% sobre el valor del cristal dañado (No aplica si existe daño a la carrocería)\n\n**Suma Asegurada (DM y RT):**\n| Tipo de auto | Suma asegurada |\n|---|---|\n| Último Modelo nuevos | Valor factura |\n| Autos con más de un año | Valor Comercial (Contempla la depreciación por uso y la oferta y demanda), o Valor Convenido |\n| Clásicos o Antiguos | Avalúo |"},{"title":"Coberturas Básicas — Robo Total","content_md":"**Objetivo:** Paga las pérdidas totales o parciales causadas por apropiación ilegal del auto asegurado. (Se considera Pérdida total: Mayor al 50% a petición del asegurado; más del 75% es automático). Opera en México, USA y Canadá.\n\n**Riesgos Cubiertos:**\n- Pérdida total causada por Robo del Automóvil asegurado, o abuso de confianza (Excepto Familiares)\n- Pérdidas parciales por daños materiales o robo parcial como consecuencia del Robo Total de la Unidad\n\n**Cuando no se contrata la cobertura de Daños Materiales:**\n- Incendio, rayo o explosión\n- Riesgos naturales como huracán, inundación, terremoto, etc.\n- Actos vandálicos de personas que participen en eventos públicos (huelgas, mítines, alborotos populares)\n- Caída de objetos sobre el automóvil\n- Alud, derrumbe de rocas o tierra\n- Daños durante su traslado en otro medio por colisión, volcadura, descarrilamiento o hundimiento del vehículo transportador, caídas durante la carga descarga o trasbordo, contribución a la avería gruesa\n\n**Deducible:** 10% sobre la suma asegurada"},{"title":"Coberturas Básicas — Responsabilidad Civil","content_md":"**Objetivo:** Sustituir al asegurado en las obligaciones que le nazcan por causar daños a terceros con el automóvil asegurado (sólo en México). Gastos y costas durante o la resolución o ejecución de juicio civil por con motivo de su responsabilidad civil. Suma asegurada adicional hasta 100% para estos gastos.\n\n**Riesgos Cubiertos:**\n| Modalidad | Cobertura |\n|---|---|\n| R. C. Personas (SUVA) | Gastos médicos, por lesiones, indemnización y gastos funerarios por muerte, indemnización por incapacidad |\n| R. C. Bienes | Reparación o reposición de los bienes de terceros que se dañen |\n| R. C. Catastrófica | Funciona como suma asegurada que se utiliza en exceso de las coberturas anteriores |\n| Límite Único y Combinado (LUC) | Funciona con una suma asegurada que puede utilizarse para daños a personas o a bienes o ambos |\n\n**Exclusiones Definitivas:**\n1. Las mencionadas en Daños materiales\n2. Lesiones, la muerte o bienes de ocupantes, el asegurado, sus familiares y empleados\n3. Fianzas o cauciones, gastos y costas de juicios en materia penal\n4. Perjuicios\n5. Daños a las vías públicas por exceso de carga o tracción\n6. Daños por la carga cuando no esté en servicio o durante la carga o descarga"},{"title":"Paquetes de Coberturas","content_md":"| Paquete | Coberturas |\n|---|---|\n| Amplio | Daños materiales, Robo Total, Responsabilidad Civil, Gastos Médicos Ocupantes |\n| Limitado | Robo Total, Responsabilidad Civil, Gastos Médicos Ocupantes |\n| Resp. Civil | Responsabilidad Civil, Gastos Médicos Ocupantes |"},{"title":"Coberturas Adicionales — Gastos Médicos Ocupantes","content_md":"**Objetivo:**\n- Paga los gastos médicos necesarios para restaurar la salud de los ocupantes por accidentes en tránsito\n- También se pagan los gastos funerarios de los ocupantes fallecidos\n\n**Suma asegurada:**\n- Se establece por evento\n- Se distribuye entre los ocupantes lesionados\n\n**Exclusiones Definitivas:**\n- Pasajeros de autos de servicio público\n- Ocupantes de motocicletas\n- Personas en compartimentos no adecuados\n\n**Deducible:** No tiene"},{"title":"Coberturas Adicionales — Equipo Especial","content_md":"**Objetivo:** Resarcir los daños o pérdidas que sufran los accesorios.\n\n**Concepto:** Accesorios que tenga el automóvil asegurado y que sean diferentes al descrito por el fabricante.\n\n**Cobertura:** Se indemnizan los siniestros amparados en las coberturas de Daños mater
