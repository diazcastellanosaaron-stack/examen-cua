rgen: \"Pág. 5\""},{"id":52,"text":"Son los contratos elaborados unilateralmente por una institución de seguros:","options":[{"key":"a","text":"Contratos de adhesión"},{"key":"b","text":"Contratos de no adhesión"}],"correct":"a","handwritten_note":"Al margen: \"Duda\". Al pie de página: \"Elaborado unilateralmente: uno pone las condiciones y el otro la acepta (ej. Telcel)\""},{"id":53,"text":"Los contratos de adhesión deben ser escritos:","options":[{"key":"a","text":"En papel seguridad, con tinta negra y sobre un fondo claro"},{"key":"b","text":"En idioma español y con características legibles y claras para visión normal"}],"correct":"b"},{"id":54,"text":"La obligación de constituir un capital mínimo de garantía trae consigo los siguientes beneficios.","options":[{"key":"a","text":"Proteger a los asegurados de una posible insolvencia de la aseguradora"},{"key":"b","text":"Elevar las ventas de la aseguradora"}],"correct":"a","handwritten_note":"Al margen: \"Duda\""},{"id":55,"text":"Menciona los dos tipos de Reserva Técnica que toda institución de seguros debe constituir:","options":[{"key":"a","text":"Riesgos en curso y para obligaciones pendientes de cumplir"},{"key":"b","text":"Riesgos en curso y catastróficas"}],"correct":"a"},{"id":56,"text":"Elija los motivos por los que una Institución debe constituir reservas para obligaciones pendientes de cumplir:","options":[{"key":"a","text":"Por pólizas en vigor, gastos de adquisición, fondo para comisiones"},{"key":"b","text":"Por las pólizas vencidas, siniestros ocurridos y reparto de periódico de utilidades, por los siniestros ocurridos y no reportados"}],"correct":"b","handwritten_note":"Al margen: \"Pág. 5\""},{"id":57,"text":"La siguiente institución se considera como distribuidor de contratos de seguros:","options":[{"key":"a","text":"Banca Comercial"},{"key":"b","text":"Banca de desarrollo"}],"correct":"a","handwritten_note":"Junto a \"Banca Comercial\": \"Privados\"; junto a \"Banca de desarrollo\": \"Gobierno\""},{"id":58,"text":"Cuando una persona adquiere su seguro en una tienda departamental y en la asesoría existen omisiones que la dañan, ¿quién debe responder ante el asegurado?","options":[{"key":"a","text":"La tienda departamental"},{"key":"b","text":"La institución de seguros"}],"correct":"b"},{"id":59,"text":"¿Cuántos seguros pueden comercializar las instituciones de seguros en México?","options":[{"key":"a","text":"3"},{"key":"b","text":"4"}],"correct":"a","handwritten_note":"Al margen: \"Pág. 6\""},{"id":60,"text":"De acuerdo a la ley de instituciones de seguro y fianzas, las operaciones de seguros son las siguientes:","options":[{"key":"a","text":"Vida, Accidentes y enfermedades, Daños"},{"key":"b","text":"Incendio, Agrícola, Marítimos, Crédito, Automóviles"}],"correct":"a"},{"id":61,"text":"¿Qué tipo de seguro comprende todos los riesgos que puede afectar a la persona del asegurado, en su integridad personal, en su existencia, salud o vigor vital?","options":[{"key":"a","text":"Seguro de personas"},{"key":"b","text":"Seguro de accidentes y enfermedades"}],"correct":"a","handwritten_note":"Subrayadas a mano las palabras \"existencia\" y \"vigor vital\""},{"id":62,"text":"La operación que tiene como base la lesión o incapacidad que afecte la integridad personal, salud o vigor vital del asegurado, se considera comprendida dentro de las operaciones de:","options":[{"key":"a","text":"Vida"},{"key":"b","text":"Accidentes y enfermedades"}],"correct":"b"},{"id":63,"text":"Relaciona ambas columnas estableciendo los ramos que corresponden a cada Operación. Operaciones: 1. Accidentes y Enfermedades, 2. Daños. Ramos: a) Incendio, b) Gastos Médicos, c) Responsabilidad Civil, d) Diversos, e) Accidentes Personales, f) Salud, g) Agrícola y de animales","options":[{"key":"a","text":"1 b, e, f; 2 a, c, d, g"},{"key":"b","text":"1 a, c, d, g; 2 b, e, f"}],"correct":"a","match":{"stem":"Relaciona ambas columnas estableciendo los ramos que corresponden a cada Operación:","cols":[{"label":"Operaciones","kind":"num","items":[{"k":"1","text":"Accidentes y Enfermedades"},{"k":"2","text":"Daños"}]},{"label":"Ramos","kind":"let","items":[{"k":"a","text":"Incendio"},{"k":"b","text":"Gastos Médicos"},{"k":"c","text":"Responsabilidad Civil"},{"k":"d","text":"Diversos"},{"k":"e","text":"Accidentes Personales"},{"k":"f","text":"Salud"},{"k":"g","text":"Agrícola y de animales"}]}]},"handwritten_note":"Escrito a mano junto a las operaciones: \"1. b, e, f\" y \"2. a, c, d, g\""},{"id":64,"text":"¿A qué ramo pertenece el seguro que está dirigido a prevenir o restaurar la salud a través de la prestación de servicios?","options":[{"key":"a","text":"Salud"},{"key":"b","text":"Gastos Médicos"}],"correct":"a"},{"id":65,"text":"En que ramo se establece el objetivo de cubrir los provechos esperados por el asegurado","options":[{"key":"a","text":"Incendio"},{"key":"b","text":"Agrícola y de animales"}],"correct":"b","handwritten_note":"Subrayada a mano la palabra \"provechos\""},{"id":66,"text":"¿Cuál de los siguientes seguros permite amparar la responsabilidad civil?","options":[{"key":"a","text":"Incendio"},{"key":"b","text":"Automóviles"}],"correct":"b"},{"id":67,"text":"Cuál es el seguro que indemniza el daño causado por el incumplimiento de obligaciones legales o contractuales por el contratante del seguro","options":[{"key":"a","text":"Seguro de Caución"},{"key":"b","text":"Seguro de Garantía Financiera"}],"correct":"a","handwritten_note":"Al pie de página: \"Caución: Cantidad de dinero\""},{"id":68,"text":"Mecanismo por el cual una institución se obliga a devolver el importe de la prima","options":[{"key":"a","text":"Contraseguro"},{"key":"b","text":"Distribución de riesgo"}],"correct":"a"},{"id":69,"text":"Existe cuando un asegurado contrata dos o más seguros para proteger sus bienes contra los mismos riesgos","options":[{"key":"a","text":"Distribución de riesgo"},{"key":"b","text":"Coaseguro"}],"correct":"b","handwritten_note":"Debajo de la pregunta: \"2 o más seguros para mi casa - Ejemplo\". Al pie de página: \"coa - Dos o más personas operan lo mismo / Pagan un siniestro\""},{"id":70,"text":"Es el mecanismo mediante el cual una compañía de seguros reduce su riesgo al transferir una parte del mismo a una o más compañías","options":[{"key":"a","text":"Reaseguro financiero"},{"key":"b","text":"Reaseguro"}],"correct":"b"},{"id":71,"text":"Es un contrato obligatorio para las aseguradoras y le permite distribuir los riesgos que asume, con otras aseguradoras","options":[{"key":"a","text":"Coaseguro"},{"key":"b","text":"Reaseguro"}],"correct":"b"},{"id":72,"text":"¿Cuál de los siguientes instrumentos establece la obligación de la institución de seguros para pagar intereses moratorios?","options":[{"key":"a","text":"Art. 276 de la Ley de Instituciones de Seguros y Fianzas (Antes 135 bis)"},{"key":"b","text":"Art. 75 de la ley sobre el contrato de seguros"}],"correct":"a","handwritten_note":"Al margen: \"Memoria\""},{"id":73,"text":"La SHCP publicó en el Diario Oficial de la Federación las reglas generales para la prevención y detección de un tema que tiene que ver con:","options":[{"key":"a","text":"La Ley Sobre el Contrato de Seguro"},{"key":"b","text":"El Código Penal"}],"correct":"b"},{"id":74,"text":"Las reglas que se emiten para prevenir y detectar el lavado de dinero, son una respuesta a los compromisos adquiridos por México ante:","options":[{"key":"a","text":"Grupo de acción Financiera Sobre Blanqueo de Capitales"},{"key":"b","text":"Tribunal de Arbitraje de Comercio Internacional"}],"correct":"a","handwritten_note":"Junto a la opción a: \"sinónimo Lavado dinero\""},{"id":75,"text":"Relaciona ambas columnas identificando los procesos para lavar dinero: 1. Colocación, 2. Estratificación, 3. Integración. a) Separación de fondos ilícitos de su fuente mediante una serie de transacciones financieras sofisticadas, b) Apertura de cuentas bancarias, c) Operaciones comerciales que parecen legales, d) Adquirir seguros de Protección e inversión","options":[{"key":"a","text":"1 a, c; 2 b; 3 d"},{"key":"b","text":"1 b, d; 2 a; 3 c"}],"correct":"b","match":{"stem":"Relaciona ambas columnas identificando los procesos para lavar dinero:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Colocación"},{"k":"2","text":"Estratificación"},{"k":"3","text":"Integración"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Separación de fondos ilícitos de su fuente mediante una serie de transacciones financieras sofisticadas"},{"k":"b","text":"Apertura de cuentas bancarias"},{"k":"c","text":"Operaciones comerciales que parecen legales"},{"k":"d","text":"Adquirir seguros de Protección e inversión"}]}]},"handwritten_note":"Escrito a mano: junto a Colocación \"b, d\"; junto a Estratificación \"a\" y \"Divide\"; junto a Integración \"c\". Al pie: \"Estratifica: Dividir\""},{"id":76,"text":"Para las reglas, se considera cliente de una aseguradora a EXCEPTO:","options":[{"key":"a","text":"Cónyuge y descendientes del asegurado en póliza de vida"},{"key":"b","text":"Contratante o asegurado obligado a pagar la prima"}],"correct":"a"},{"id":77,"text":"Se consideran operaciones relevantes cuando la prima, cuota u aportación sea igual o superior al equivalente a:","options":[{"key":"a","text":"10,000 dólares de los E.U.A"},{"key":"b","text":"15,000 dólares de los E.U.A"}],"correct":"a"},{"id":78,"text":"Operación o conducta que no concuerde con los antecedentes o actividad, o con el perfil transaccional inicial o habitual de dicho Cliente, por ejemplo: Un cliente compra seguros de automóviles con vigencia mensual con alguna frecuencia, ¿qué operación realiza?","options":[{"key":"a","text":"Relevante"},{"key":"b","text":"Inusual"}],"correct":"b","handwritten_note":"Al pie de página: \"Relevante: llama la atención\"; \"Relevante / Inusual: conductas del cliente\""},{"id":79,"text":"Conducta sospechosa de directivos o empleados de la institución de seguros","options":[{"key":"a","text":"Inusual"},{"key":"b","text":"Preocupante"}],"correct":"b","handwritten_note":"Al pie de página: \"Preocupante: Trabajador\""},{"id":80,"text":"¿Qué tipo de documentos debe pedir el agente para identificar a su cliente persona física?","options":[{"key":"a","text":"Documento oficial vigente con fotografía, firma y domicilio, cédula fiscal"},{"key":"b","text":"Declaración fiscal del último año, estados financieros, cédula fiscal"}],"correct":"a"},{"id":81,"text":"Los agentes deben recabar los siguientes documentos al asegurar personas morales:","options":[{"key":"a","text":"Acta constitutiva, poderes e identificación de apoderados"},{"key":"b","text":"Acta constitutiva, estados financieros"}],"correct":"a","handwritten_note":"Junto a \"personas morales\": \"Empresas\""},{"id":82,"text":"Presidentes, gobernadores o presidentes municipales, sus cónyuge, hijos y padres, líderes de partidos políticos o Militares de alto rango; son considerados:","options":[{"key":"a","text":"Personas que no son asegurable"},{"key":"b","text":"Personas políticamente expuestas"}],"correct":"b"},{"id":83,"text":"En los siguientes seguros, el contratante conserva los expedientes de los asegurados, EXCEPTO:","options":[{"key":"a","text":"Seguros individuales para colectividades que tienen interés común"},{"key":"b","text":"Seguros de grupo o Colectivo, seguros de garantía de créditos"}],"correct":"a","handwritten_note":"Al margen izquierdo: \"Ojo\""},{"id":84,"text":"Las operaciones relevantes deben ser reportadas a la SHCP por las aseguradoras:","options":[{"key":"a","text":"Los primeros 10 días de enero, abril, julio y octubre"},{"key":"b","text":"A los 60 días de ser detectadas"}],"correct":"a"},{"id":85,"text":"Las operaciones inusuales y preocupantes deben ser reportadas a la SHCP por las aseguradoras:","options":[{"key":"a","text":"Los primeros 10 días de enero, abril, julio y octubre"},{"key":"b","text":"A los 60 días de ser detectadas"}],"correct":"b"},{"id":86,"text":"¿Qué organismo debe denunciar penalmente en caso de detectar una operación relacionada con el lavado de dinero?","options":[{"key":"a","text":"La comisión nacional de seguros y fianzas"},{"key":"b","text":"Secretaría de Hacienda y Crédito Público"}],"correct":"b"},{"id":87,"text":"¿De cuánto es la multa que se aplica a los agentes de seguros que no cumplen las Reglas de Prevención y detección para Operaciones con Recursos de Procedencia Ilícita?","options":[{"key":"a","text":"8000 días"},{"key":"b","text":"100,000 días"}],"correct":"b","handwritten_note":"La marca sobre las opciones no es del todo clara en el escaneo"},{"id":88,"text":"¿Qué pena de cárcel se impone a las personas que colaboren en el lavado de dinero?","options":[{"key":"a","text":"5 a 15 años"},{"key":"b","text":"3 a 15 años"}],"correct":"a"},{"id":89,"text":"En qué momento el agente de seguros podrá hacer pública la información que tiene sobre sus clientes","options":[{"key":"a","text":"Cuando la autoridad competente se lo pida"},{"key":"b","text":"Cuando la institución de seguros lo solicite"}],"correct":"a","handwritten_note":"Al margen derecho: \"o cuando el asegurado lo requiere o autoriza por escrito\""},{"id":90,"text":"Una institución de seguros se obliga mediante el cobro de una prima a resarcir los daños o a pagar la suma contratada al ocurrir el evento previsto","options":[{"key":"a","text":"Póliza de seguros"},{"key":"b","text":"Contrato de seguro"}],"correct":"b"},{"id":91,"text":"¿Cómo se llama al valor económico que una persona tiene en que no se produzca un siniestro?","options":[{"key":"a","text":"Interés Bancario"},{"key":"b","text":"Interés Asegurable"}],"correct":"b","handwritten_note":"Arriba de la página: \"Interés: Valor económico de las cosas / Asegurable: Pérdida económica en caso de siniestro\""},{"id":92,"text":"En los seguros de personas, el interés asegurable permite asegurar:","options":[{"key":"a","text":"Un interés económico de cualquier especie"},{"key":"b","text":"Sólo un interés económico patrimonial"}],"correct":"a"},{"id":93,"text":"¿A quién le corresponde la obligación de declarar por escrito en el cuestionario relativo, todos los hechos importantes para la apreciación del riesgo, tal como los conoce o deba conocerlos?","options":[{"key":"a","text":"Contratante"},{"key":"b","text":"Proponente"}],"correct":"b"},{"id":94,"text":"En qué documentos se debe declarar por escrito todos los hechos importantes para la apreciación del riesgo:","options":[{"key":"a","text":"En cualquier papel que tenga el proponente"},{"key":"b","text":"En los cuestionarios relativo facilitados por la aseguradora"}],"correct":"b"},{"id":95,"text":"El contrato de seguro que es solicitado por cuenta de otro, ¿qué datos debe contener la solicitud?","options":[{"key":"a","text":"Sólo la del asegurado"},{"key":"b","text":"La del representante y la del representado"}],"correct":"b","handwritten_note":"Escrito a mano junto a la opción b: \"contratante / Asegurado\""},{"id":96,"text":"Las pólizas de seguros se pueden hacer: nominativas, A la orden o al Portador, ¿Qué seguro se prohíbe hacer al portador?","options":[{"key":"a","text":"Seguros de Vida"},{"key":"b","text":"Seguros de Automóviles"}],"correct":"a","handwritten_note":"Al pie de página: \"Póliza: Prueba escrita de contrato\""},{"id":97,"text":"El asegurado al solicitar copia o duplicado de su póliza y/o solicitud, la aseguradora:","options":[{"key":"a","text":"Puede negarse a expedirlas"},{"key":"b","text":"Tiene la obligación de expedirlos"}],"correct":"b"},{"id":98,"text":"Identifica los datos que contiene cualquier póliza: 1. Nombres del asegurado y la aseguradora, 2. Domicilio de ambas partes, 3. Monto de Garantía, 4. Beneficiarios preferentes, 5. Descripción del objeto asegurado, 6. Descripción de riesgos, 7. Primas o cuotas, 8. Firma del asegurado o contratante, 9. Firma de la institución de seguros","options":[{"key":"a","text":"1, 2, 4, 5, 6, 7, 8"},{"key":"b","text":"1, 2, 3, 5, 6, 7, 9"}],"correct":"b","list":{"stem":"Identifica los datos que contiene cualquier póliza:","kind":"num","items":[{"k":"1","text":"Nombres del asegurado y la aseguradora"},{"k":"2","text":"Domicilio de ambas partes"},{"k":"3","text":"Monto de Garantía"},{"k":"4","text":"Beneficiarios preferentes"},{"k":"5","text":"Descripción del objeto asegurado"},{"k":"6","text":"Descripción de riesgos"},{"k":"7","text":"Primas o cuotas"},{"k":"8","text":"Firma del asegurado o contratante"},{"k":"9","text":"Firma de la institución de seguros"}]},"handwritten_note":"Al margen: \"Aprender\". Palomeados los datos 1, 2, 3, 5, 6, 7 y 9. Junto a \"Monto de Garantía\": \"Suma asegurada\"; junto a \"Beneficiarios preferentes\": \"El banco cuando asegura deudas\"; junto a \"Descripción de riesgos\": \"cobertura básica, coberturas adicionales, exclusiones\". En la opción b el \"8\" impreso está corregido a mano por \"9\""},{"id":99,"text":"Identifica los datos de las pólizas de vida con vigencia menor a 10 años: 1. Suma asegurada, 2. Nombres de los beneficiarios, 3. Nombre del beneficiario preferente, 4. Causa y plazo para que se otorgue la prestación, 5. Valores Garantizados, 6. Edad o fecha de nacimiento del asegurado","options":[{"key":"a","text":"1, 2, 4, 6"},{"key":"b","text":"1, 3, 4, 5"}],"correct":"a","list":{"stem":"Identifica los datos de las pólizas de vida con vigencia menor a 10 años:","kind":"num","items":[{"k":"1","text":"Suma asegurada"},{"k":"2","text":"Nombres de los beneficiarios"},{"k":"3","text":"Nombre del beneficiario preferente"},{"k":"4","text":"Causa y plazo para que se otorgue la prestación"},{"k":"5","text":"Valores Garantizados"},{"k":"6","text":"Edad o fecha de nacimiento del asegurado"}]},"handwritten_note":"Al margen: \"Aprender\". Palomeados los datos 1, 2, 4 y 6. Junto al dato 4: \"Riesgos y vigencia\""},{"id":100,"text":"El contrato de seguro deberá hacerse constar por:","options":[{"key":"a","text":"Escrito"},{"key":"b","text":"Duplicado"}],"correct":"a"},{"id":101,"text":"¿En qué momento se perfecciona el contrato de seguro?","options":[{"key":"a","text":"Cuando la aseguradora acepta la oferta"},{"key":"b","text":"Cuando el proponente conoce la aceptación de la oferta"}],"correct":"b","handwritten_note":"Debajo: \"momento en el que se cumplieron los requisitos para celebrarlo\""},{"id":102,"text":"Si la institución de seguros no contesta la propuesta de un seguro de vida, ¿cuándo inicia la vigencia?","options":[{"key":"a","text":"A los 30 días de ingresada la oferta o el examen médico."},{"key":"b","text":"Cuando el proponente se entera que fue aceptado"}],"correct":"a"},{"id":103,"text":"Relaciona ambas columnas identificando las causas que correspondan a cada concepto: 1. Rescisión, 2. Anulación. a) Omisiones o inexactas declaraciones, b) Dolo o mala fe, c) Agravación de riesgo, d) Asegurar un bien que ya está siniestrado, e) Cambio de propietario del bien asegurado, f) Asegurar por muerte a un tercero sin su consentimiento","options":[{"key":"a","text":"1 a, c, e; 2 b, d, f"},{"key":"b","text":"1 a, b, d; 2 c, e, f"}],"correct":"a","match":{"stem":"Relaciona ambas columnas identificando las causas que correspondan a cada concepto:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Rescisión"},{"k":"2","text":"Anulación"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Omisiones o inexactas declaraciones"},{"k":"b","text":"Dolo o mala fe"},{"k":"c","text":"Agravación de riesgo"},{"k":"d","text":"Asegurar un bien que ya está siniestrado"},{"k":"e","text":"Cambio de propietario del bien asegurado"},{"k":"f","text":"Asegurar por muerte a un tercero sin su consentimiento"}]}]},"handwritten_note":"Escrito a mano: \"Rescisión: cancelación anticipada\"; \"Anulación: El contrato no es válido desde el inicio\"; junto a cada inciso los números \"1\" o \"2\" (a:1, b:2, c:1, d:2, e:1, f:2)"},{"id":104,"text":"La aseguradora pierde el derecho a rescindir el contrato por omisiones o inexactas declaraciones por las siguientes causas, EXCEPTO:","options":[{"key":"a","text":"Si la aseguradora provoca las omisiones o inexactas declaraciones"},{"key":"b","text":"La aseguradora no practica examen médico"}],"correct":"b","handwritten_note":"Al margen: \"Aprender\". Al pie de página: \"¿Cuánto tiempo tiene la aseguradora para informar la rescisión al asegurado?: 15 días hábiles\""},{"id":105,"text":"Se refiere a los cambios que sufre un objeto asegurado y que, de haber existido al inicio, el contrato se rechaza o se celebra en condiciones distintas:","options":[{"key":"a","text":"Omisiones o inexactas declaraciones"},{"key":"b","text":"Agravación Esencial del Riesgo"}],"correct":"b"},{"id":106,"text":"¿Qué plazo tiene el asegurado a partir de que tiene conocimiento del hecho para avisar a la aseguradora de una agravación esencial en el riesgo?","options":[{"key":"a","text":"72 hrs"},{"key":"b","text":"24 hrs."}],"correct":"b","handwritten_note":"Junto a la opción b: \"(En el seguro de Vida 30 Días)\""},{"id":107,"text":"¿Cuál de las siguientes situaciones impide a la aseguradora que rescinda el contrato por agravación esencial de riesgo?","options":[{"key":"a","text":"La agravación de riesgos causa el siniestro"},{"key":"b","text":"La agravación es motivada por un deber de humanidad"}],"correct":"b","handwritten_note":"La marca sobre las opciones no es del todo clara en el escaneo"},{"id":108,"text":"Si ocurre un siniestro antes de celebrar el contrato, ¿qué derecho tiene la aseguradora?","options":[{"key":"a","text":"Anular el contrato y cobrar el doble de la prima"},{"key":"b","text":"Anular el contrato sin cobrar la prima"}],"correct":"b","handwritten_note":"La marca sobre las opciones no es del todo clara en el escaneo"},{"id":109,"text":"¿Quién deberá cubrir los gastos que hace el asegurado durante las maniobras de salvamento para reducir el daño?","options":[{"key":"a","text":"El asegurado"},{"key":"b","text":"La Institución Aseguradora"}],"correct":"b"},{"id":110,"text":"Para los seguros de vida, ¿cuánto tiempo tiene los beneficiarios para ejercer sus derechos para que no prescriban?","options":[{"key":"a","text":"2 años"},{"key":"b","text":"5 años"}],"correct":"b","handwritten_note":"Junto a \"2 años\": \"Los demás seguros\". Al margen: \"Tiempo que se tiene para ejercer\""},{"id":111,"text":"Elija de la siguiente lista 3 casos en que no corre el lapso de 2 años de prescripción:","options":[{"key":"a","text":"Por omisiones, inexactas declaraciones, nombramientos de peritos."},{"key":"b","text":"Al realizar convenio expreso, por ausencia de beneficiarios, indisputabilidad"}],"correct":"a","handwritten_note":"En la hoja esta pregunta y la siguiente aparecen ambas numeradas como 22"},{"id":112,"text":"La cláusula de peritaje se aplica en el siguiente supuesto:","options":[{"key":"a","text":"Cuando no se logra establecer la procedencia o improcedencia del siniestro"},{"key":"b","text":"Cuando hay desacuerdo en el valor del siniestro"}],"correct":"b"},{"id":113,"text":"¿Qué autoridad determina el tercer perito cuando se mantiene el desacuerdo?","options":[{"key":"a","text":"La CONDUSEF y el Poder Judicial"},{"key":"b","text":"La CNSF y la CONDUSEF"}],"correct":"a","handwritten_note":"La marca sobre las opciones no es del todo clara en el escaneo"},{"id":114,"text":"¿Cuánto tiempo mínimo de vigencia debe tener una póliza para que, en caso de suicidio, la aseguradora esté obligada a pagar la suma asegurada?","options":[{"key":"a","text":"5 años"},{"key":"b","text":"2 años"}],"correct":"b"},{"id":115,"text":"Los seguros de vida que tengan vigencia de 10 años o más, deben cobrarse con prima:","options":[{"key":"a","text":"Creciente"},{"key":"b","text":"Nivelada"}],"correct":"b"},{"id":116,"text":"En los seguros de vida, que tengan 10 años o más de vigencia se constituye un fondo que permite la viabilidad de las primas futuras, ¿cómo se denomina el fondo?","options":[{"key":"a","text":"Reserva técnica"},{"key":"b","text":"Reserva matemática"}],"correct":"b"},{"id":117,"text":"En los seguros de vida que tenga 10 años o más de vigencia ¿cuál es la obligación de la aseguradora?","options":[{"key":"a","text":"Incrementar la reserva técnica"},{"key":"b","text":"Otorgar valores garantizados"}],"correct":"b"},{"id":118,"text":"En un seguro de vida, si fallece un menor de 12 años ¿cuál es la obligación de la institución de seguros?","options":[{"key":"a","text":"Devolver la reserva matemática"},{"key":"b","text":"Devolver la prima menos gastos"}],"correct":"b","handwritten_note":"Junto a la pregunta: \"Se prohíbe asegurar por muerte a menor de 12 años\". Arriba de la página: \"Edad de aseguramiento para seguro de vida - mínimo 12 años, máx. 70 años\""},{"id":119,"text":"Cuando al fallecer un asegurado en la póliza de vida no tiene beneficiarios nombrados o los que había fallecieron y no fueron cambiados, ¿quién recibe la suma asegurada?","options":[{"key":"a","text":"Los familiares del asegurado"},{"key":"b","text":"Los que se designen en un juicio sucesorio"}],"correct":"b"},{"id":120,"text":"Si el asegurado nombró a su cónyuge y sus descendientes como beneficiarios sin especificar la participación, ¿cómo se reparte la suma asegurada si fallece?","options":[{"key":"a","text":"75% cónyuge 25% descendientes"},{"key":"b","text":"50% cónyuge 50% descendientes"}],"correct":"b"},{"id":121,"text":"Si al fallecer un asegurado en la póliza de vida, se descubre que un error en la edad del asegurado y la real estaba fuera de los límites de aceptación, ¿qué procede?","options":[{"key":"a","text":"Se anula el contrato y se devuelve la prima"},{"key":"b","text":"Se rescinde el contrato y se devuelve la reserva matemática"}],"correct":"b","handwritten_note":"Junto a la pregunta: \"No era asegurable\""},{"id":122,"text":"Cuando fallece un asegurado de vida y se descubre un error en la edad declarada, ¿qué procede?","options":[{"key":"a","text":"Se ajusta la prima del seguro"},{"key":"b","text":"Se ajusta la suma asegurada"}],"correct":"b"},{"id":123,"text":"El seguro obligatorio denominado RC del Viajero se puede agregar a los siguientes seguros:","options":[{"key":"a","text":"Incendio, Automóviles y barcos"},{"key":"b","text":"Automóviles, Barcos y Aviones"}],"correct":"b","handwritten_note":"Junto a la pregunta: \"Cubre a pasajeros de Transporte\""},{"id":124,"text":"Identifica las características de los seguros obligatorios: 1. Las ordena una ley o reglamento, 2. La vigencia es de un año o menor, 3. La vigencia es de un año, 4. No son cancelables, 5. La prima puede ser fraccionada","options":[{"key":"a","text":"1, 2, 5"},{"key":"b","text":"1, 3, 4"}],"correct":"b","list":{"stem":"Identifica las características de los seguros obligatorios:","kind":"num","items":[{"k":"1","text":"Las ordena una ley o reglamento"},{"k":"2","text":"La vigencia es de un año o menor"},{"k":"3","text":"La vigencia es de un año"},{"k":"4","text":"No son cancelables"},{"k":"5","text":"La prima puede ser fraccionada"}]},"handwritten_note":"Palomeadas a mano las características 1, 3 y 4"},{"id":125,"text":"R. C. del viajero, R. C Hotelería, R. C. para agentes de seguros se consideran:","options":[{"key":"a","text":"Seguros obligatorios"},{"key":"b","text":"Seguros básicos"}],"correct":"a"},{"id":126,"text":"¿Cuánto tiempo tiene la institución de seguros para contestar una solicitud de prórroga, modificación o renovación?","options":[{"key":"a","text":"15 días hábiles"},{"key":"b","text":"15 días naturales"}],"correct":"a","handwritten_note":"Junto a \"prórroga\": \"Aumentar vigencia\""},{"id":127,"text":"Una vez que la compañía de seguros cuenta con todos los elementos que le permitan determinar la procedencia del siniestro, ¿Cuál es el plazo máximo para efectuar la indemnización?","options":[{"key":"a","text":"10 días"},{"key":"b","text":"30 días"}],"correct":"b","handwritten_note":"Junto a \"30 días\": \"naturales\""},{"id":128,"text":"¿Cuánto tiempo tiene el asegurado para revisar su póliza y verificar su contenido?","options":[{"key":"a","text":"15 días hábiles"},{"key":"b","text":"30 días naturales"}],"correct":"b","handwritten_note":"Al margen derecho: \"A partir del día que recibe la póliza\""},{"id":129,"text":"El procedimiento para arbitraje en contra de las instituciones de seguros se sujetará a lo dispuesto por la:","options":[{"key":"a","text":"Ley de instituciones de seguros y fianzas"},{"key":"b","text":"Ley para la defensa y protección del usuario de servicios financieros"}],"correct":"b"},{"id":130,"text":"Es la comisión que tiene por finalidad proveer a la equidad en las relaciones entre los asegurados y aseguradoras:","options":[{"key":"a","text":"Comisión nacional para la protección y defensa de los asegurados"},{"key":"b","text":"Comisión nacional para la protección y defensa de los usuarios de servicios financieros"}],"correct":"b"},{"id":131,"text":"Las delegaciones de la Condusef Tienen las siguientes características","options":[{"key":"a","text":"Tienen dependencia completa del centro."},{"key":"b","text":"Tienen autonomía para resolver quejas, pero reportan sus actividades a la Matriz"}],"correct":"b"},{"id":132,"text":"¿En qué área de la CONDUSEF se reciben las quejas para resolver en amigable composición?","options":[{"key":"a","text":"Dirección de Orientación, Supervisión, Conciliación y Dictamen"},{"key":"b","text":"Dirección de Quejas y Arbitraje"}],"correct":"a"},{"id":133,"text":"Elija dos lugares donde un usuario puede presentar una reclamación en caso de existir controversia:","options":[{"key":"a","text":"Tribunales correspondientes o Comisión Nacional para la Protección y Defensa de los Usuarios de Servicios Financieros y/o sus Delegaciones"},{"key":"b","text":"Unidad especializada en consulta y reclamaciones de la Institución Financiera o Comisión Nacional de Seguros y Fianzas"}],"correct":"a"},{"id":134,"text":"La queja del usuario podrá presentarse personalmente o por correo en:","options":[{"key":"a","text":"La matriz o la delegación que corresponda al domicilio del usuario."},{"key":"b","text":"La matriz o la delegación que corresponda al domicilio de la institución financiera"}],"correct":"a"},{"id":135,"text":"El usuario deberá presentar la queja en contra de la institución financiera en un plazo máximo de:","options":[{"key":"a","text":"1 año"},{"key":"b","text":"2 años"}],"correct":"b"},{"id":136,"text":"Las quejas que por oficio podrán ser rechazadas por la CONDUSEF, son:","options":[{"key":"a","text":"Las que tengan que ver con Devolución de Primas y las de disminución indebida de suma asegurada"},{"key":"b","text":"Las que tengan que ver con rendimiento y las que sean notoriamente improcedentes"}],"correct":"b"},{"id":137,"text":"¿Qué plazo tiene la CONDUSEF para reunir a las partes a una audiencia de conciliación","options":[{"key":"a","text":"20 días hábiles"},{"key":"b","text":"20 días naturales"}],"correct":"a"},{"id":138,"text":"Cuando la CONDUSEF solicita información a cualquiera de las siguientes autoridades: SHCP, CNBV, CNSF, CONSAR; ¿Cuántos días hábiles tienen para contestar?","options":[{"key":"a","text":"15"},{"key":"b","text":"10"}],"correct":"b"},{"id":139,"text":"¿Qué plazo tiene el árbitro o tribunal de arbitraje para emitir un laudo, una vez que se ha cerrado la etapa probatoria?","options":[{"key":"a","text":"60 días"},{"key":"b","text":"30 días"}],"correct":"a","handwritten_note":"Al pie de página: \"Laudo = Sentencia\""},{"id":140,"text":"Las siguiente es definición de la palabra Riesgo, EXCEPTO:","options":[{"key":"a","text":"La ocurrencia del evento previsto en el contrato de seguro"},{"key":"b","text":"Posibilidad de que un hecho dañoso ocurra"}],"correct":"a","handwritten_note":"Junto a la opción a: \"(siniestro)\""},{"id":141,"text":"Corresponden a la naturaleza del riesgo, siempre que ocurren causan daño o pérdidas económicas","options":[{"key":"a","text":"Puro"},{"key":"b","text":"Especulativo"}],"correct":"a","handwritten_note":"Debajo de la pregunta: \"incendio, Terremoto, huracanes, asalto\". Junto a \"Puro\": \"solo se pierde\""},{"id":142,"text":"Son riesgo creados por las personas con la intención de obtener algún beneficio, pero existe la posibilidad de perder.","options":[{"key":"a","text":"Puro"},{"key":"b","text":"Especulativo"}],"correct":"b","handwritten_note":"Debajo de la pregunta: \"Negocios, inversiones, lotería\". Junto a \"Especulativo\": \"se pierde o ganar\""},{"id":143,"text":"Son los riesgos que cuentan con cantidad suficiente de estadísticas y por lo tanto se puede establecer con facilidad la frecuencia y la severidad de los mismos:","options":[{"key":"a","text":"Subjetivos"},{"key":"b","text":"Objetivos"}],"correct":"b","handwritten_note":"Debajo de la pregunta: \"se pueden medir\". Junto a \"Subjetivos\": \"no se miden\"; junto a \"Objetivos\": \"ya que se puede medir\""},{"id":144,"text":"Son riesgos que por su naturaleza generan pérdidas en un gran número de personas al mismo tiempo","options":[{"key":"a","text":"Particulares"},{"key":"b","text":"Catastróficos"}],"correct":"b"},{"id":145,"text":"La frecuencia de estos riesgos se mantiene en el tiempo, esto permite que las tarifas de seguros que los cubren no cambien tan fácilmente:","options":[{"key":"a","text":"Constantes"},{"key":"b","text":"Variables"}],"correct":"a","handwritten_note":"Debajo de la pregunta: \"muerte o incendios\". Junto a \"Constantes\": \"no cambia\"; junto a \"Variables\": \"cambia\""},{"id":146,"text":"La actitud de apartar todas las variables que puedan causar que el riesgo se presente, se le conoce como:","options":[{"key":"a","text":"Eliminarlos"},{"key":"b","text":"Disminuirlo"}],"correct":"a","handwritten_note":"Subrayado a mano: \"apartar todas las variables\""},{"id":147,"text":"La persona ataca algunas causas por las que se puede presentar un siniestro, ¿qué actitud toma?","options":[{"key":"a","text":"Disminución del riesgo"},{"key":"b","text":"Prevención del riesgo"}],"correct":"a"},{"id":148,"text":"Una persona que percibe la posibilidad de que su casa se incendie, decide comprar un seguro, ¿qué actitud toma ante el riesgo?","options":[{"key":"a","text":"Previene"},{"key":"b","text":"Transfiere"}],"correct":"b"},{"id":149,"text":"La distribución del riesgo puede hacerse a través de los siguientes conceptos, EXCEPTO:","options":[{"key":"a","text":"Coaseguro, mutualidad, reaseguro"},{"key":"b","text":"Seguro, Protección contra incendios, formación de reservas"}],"correct":"b"},{"id":150,"text":"El deducible que tiene algunos seguros, se convierten en una forma de:","options":[{"key":"a","text":"Transferencia parcial del riesgo"},{"key":"b","text":"Retención parcial del siniestro"}],"correct":"b"},{"id":151,"text":"Una persona percibe la posibilidad de incendio en su negocio y no hace nada al respecto, esta persona está:","options":[{"key":"a","text":"Transfiriendo el riesgo"},{"key":"b","text":"Reteniendo el riesgo"}],"correct":"b","handwritten_note":"Junto a la opción b: \"o asume\""},{"id":152,"text":"De la siguiente lista, elija las características que debe tener un riesgo para poder ser asegurable:","options":[{"key":"a","text":"Generar ganancia, Concreto, Subjetividad, Lícito, Incertidumbre Certeza"},{"key":"b","text":"Posible, Aleatorio, Fortuito, Concreto, Lícito, Contenido económico"}],"correct":"b","handwritten_note":"Junto a la opción b: \"Puede medir\"; \"Si a uno le puede pasar\"; \"No quiero que pase\""},{"id":153,"text":"La incertidumbre en el riesgo debe existir para ser asegurable, esto corresponde al concepto de:","options":[{"key":"a","text":"Fortuito"},{"key":"b","text":"Aleatorio"}],"correct":"b","handwritten_note":"Junto a \"Aleatorio\": \"= incierto\""},{"id":154,"text":"La palabra fortuito, en la administración de riesgos implica:","options":[{"key":"a","text":"La ocurrencia del evento debe presentarse de forma volitiva para las personas"},{"key":"b","text":"La ocurrencia del evento debe presentarse de forma no volitiva para las personas"}],"correct":"b","handwritten_note":"Junto a \"no volitiva\": \"involuntario\""},{"id":155,"text":"La realización del riesgo ha de producir una pérdida económica, esto se refiere a:","options":[{"key":"a","text":"Contenido económico"},{"key":"b","text":"Concreto"}],"correct":"a"},{"id":156,"text":"Una gran masa expuesta a riesgos similares, se asocia para protegerse entre sí y de esa manera dispersan el riesgo de los miembros, esto pertenece al principio de:","options":[{"key":"a","text":"Indemnizatorio"},{"key":"b","text":"Mutualismo"}],"correct":"b","handwritten_note":"Junto a \"Mutualismo\": \"Gran masa en ayuda\". Al margen: \"Pag 12 / Pag 13\""},{"id":157,"text":"En una colectividad, sólo una parte pequeña de la población sufre los siniestros, la pérdida económica será repartida entre toda la comunidad mutualizada, esto representa el principio de:","options":[{"key":"a","text":"Dispersión"},{"key":"b","text":"Indemnizatorio"}],"correct":"a"},{"id":158,"text":"Este principio de los seguros, establece que las personas deben demostrar que tuvieron un daño económico para solicitar el resarcimiento:","options":[{"key":"a","text":"Indemnizatorio"},{"key":"b","text":"Contributorio"}],"correct":"a","handwritten_note":"Junto a \"Indemnizatorio\": \"Pagar daño\""},{"id":159,"text":"Cuando el pronóstico de cuentas futuras se basa en mayor número de muestras, el pronóstico tienda a ser más acertado, esto corresponde a:","options":[{"key":"a","text":"Ley de los grandes números"},{"key":"b","text":"Probabilidad"}],"correct":"a"},{"id":160,"text":"Es la posibilidad de frecuencia de un suceso que genera pérdidas:","options":[{"key":"a","text":"Ley de los grandes números"},{"key":"b","text":"Probabilidad"}],"correct":"b"},{"id":161,"text":"¿Cuál de los siguientes conceptos se refiere a la frecuencia?","options":[{"key":"a","text":"Indica el costo promedio de los siniestros producidos en un año."},{"key":"b","text":"Indica el número de siniestros ocurridos en un determinado periodo de tiempo."}],"correct":"b"},{"id":162,"text":"¿Cuál de los siguientes conceptos se refiere a severidad?","options":[{"key":"a","text":"Es el monto de los siniestros registrados en un periodo determinado"},{"key":"b","text":"Es el porcentaje que represente los siniestros en relación a la suma asegurada"}],"correct":"a","handwritten_note":"Debajo: \"Valor del daño\""},{"id":163,"text":"En función de las características del riesgo a asegurar, la posibilidad que ocurra el siniestro (frecuencia) y el monto de la pérdida que tendrá el asegurado (Severidad), se calcula la:","options":[{"key":"a","text":"Prima pura de riesgo"},{"key":"b","text":"Prima neta"}],"correct":"a"},{"id":164,"text":"Es la prima que incluye: la prima pura de riesgo, los gastos de administración, los gastos de adquisición, la utilidad esperada:","options":[{"key":"a","text":"Prima pura de riesgo"},{"key":"b","text":"Prima de tarifa"}],"correct":"b"},{"id":165,"text":"Los siguientes elementos conforman el cálculo de la prima, EXCEPTO:","options":[{"key":"a","text":"Gastos de redistribución de riesgos, prima pura de riesgo, utilidades, gastos de administración, gastos de adquisición"},{"key":"b","text":"Derechos de póliza, recargos por pago fraccionado"}],"correct":"b"},{"id":166,"text":"Dentro de la prima de tarifa se incluyen las comisiones y bonos que se pagan a agentes de seguros en el concepto:","options":[{"key":"a","text":"Gastos de administración"},{"key":"b","text":"Gastos de adquisición"}],"correct":"b"},{"id":167,"text":"Los siguientes se consideran dentro del concepto de gastos de administración","options":[{"key":"a","text":"Comisiones de agentes, exámenes médicos a asegurados"},{"key":"b","text":"Nómina, mantenimiento, equipamiento"}],"correct":"b","handwritten_note":"La marca sobre las opciones no es del todo clara en el escaneo"},{"id":168,"text":"Es la prima que incluye los recargos aplicables y los impuestos que amerite:","options":[{"key":"a","text":"Prima neta"},{"key":"b","text":"Prima Bruta o total"}],"correct":"b","handwritten_note":"Junto a \"Prima neta\": \"sin recargo, ni impuestos\""},{"id":169,"text":"Los gastos que se derivan de la expedición de pólizas se permiten que se carguen al asegurado, ¿en qué concepto?","options":[{"key":"a","text":"Derecho de póliza"},{"key":"b","text":"Recargo de emisión"}],"correct":"a"},{"id":170,"text":"¿Quién debe cubrir los gastos de expedición y/o los impuestos que genere la póliza?","options":[{"key":"a","text":"La Aseguradora"},{"key":"b","text":"El contratante"}],"correct":"b"},{"id":171,"text":"¿Cómo se define el pago por cargo fraccionado?","options":[{"key":"a","text":"Es el porcentaje de la prima que se cobra en planes de descuentos por nómina"},{"key":"b","text":"Es un porcentaje de la prima que se cobra por realizar pagos diferentes al anual"}],"correct":"b"},{"id":172,"text":"Los siguientes son causas por las que se aplica el Recargo por Pago Fraccionado, EXCEPTO;","options":[{"key":"a","text":"Gastos de contabilidad, Intereses del capital invertido"},{"key":"b","text":"Aumento en la siniestralidad, manejo de cuentas bancarias"}],"correct":"b","handwritten_note":"Al margen izquierdo: \"incluye intereses\""},{"id":173,"text":"¿Cuál es el límite máximo de responsabilidad para la Aseguradora en caso de siniestro?","options":[{"key":"a","text":"El valor real del bien"},{"key":"b","text":"La suma asegurada"}],"correct":"b","handwritten_note":"Junto a la opción b: \"Definición\""},{"id":174,"text":"Los siguientes conceptos son formas que se aplican para compartir el riesgo entre asegurado y Aseguradora, EXCEPTO:","options":[{"key":"a","text":"Reaseguro"},{"key":"b","text":"Coaseguro"}],"correct":"a","handwritten_note":"Junto a \"Reaseguro\": \"Distribuye Aseguradora\"; junto a \"Coaseguro\": \"Distribuye el asegurado\""},{"id":175,"text":"Identifica las definiciones de deducible: 1. Primeros gastos del siniestro que paga el asegurado, 2. Se usa para evitar reclamaciones pequeñas, 3. Es la parte del siniestro que asume la aseguradora, 4. Participación del asegurado en el siniestro que se aplica hasta el último peso, 5. Cantidad que se debe rebasar para pagar un siniestro","options":[{"key":"a","text":"1, 3, 4"},{"key":"b","text":"1, 2, 5"}],"correct":"b","list":{"stem":"Identifica las definiciones de deducible:","kind":"num","items":[{"k":"1","text":"Primeros gastos del siniestro que paga el asegurado"},{"k":"2","text":"Se usa para evitar reclamaciones pequeñas"},{"k":"3","text":"Es la parte del siniestro que asume la aseguradora"},{"k":"4","text":"Participación del asegurado en el siniestro que se aplica hasta el último peso"},{"k":"5","text":"Cantidad que se debe rebasar para pagar un siniestro"}]},"handwritten_note":"Palomeadas a mano las definiciones 1, 2 y 5"},{"id":176,"text":"Si la siniestralidad prevista para el cálculo de primas es menor a la realmente ocurrida, la utilidad se puede repartir a los asegurados a través de:","options":[{"key":"a","text":"Valores garantizados"},{"key":"b","text":"Dividendos"}],"correct":"b"},{"id":177,"text":"Los siguientes tipos de desviaciones favorables generan dividendos EXCEPTO:","options":[{"key":"a","text":"Rendimientos financieros, gastos, mortalidad favorable"},{"key":"b","text":"Derechos de inspección, reducción de comisiones"}],"correct":"b","handwritten_note":"Junto a la opción a: \"utilidades\". La marca sobre las opciones no es del todo clara en el escaneo"},{"id":178,"text":"Los siguientes son formas en que el asegurado puede utilizar sus dividendos, EXCEPTO:","options":[{"key":"a","text":"Pago de prima, retiro cada año, incremento de suma asegurada"},{"key":"b","text":"Incremento de la reserva técnica, pago de siniestros, inversión"}],"correct":"b","handwritten_note":"Al pie de página: \"Dividendo: Parte de las utilidades que le toca a cada socio\". La marca sobre las opciones no es del todo clara en el escaneo"}]},{"id":"vida","label":"Vida Individual","theory":[{"title":"1. Conceptos Generales (Seguro de Vida)","content_md":"Módulo de Riesgos Individuales de Seguros de Personas: Seguro de Vida\n\n*Nota manuscrita en el encabezado de la página: \"Modulo 2\"*\n\n| Concepto | Definición |\n|---|---|\n| Ley de los Grandes Números | Cuando se pretende establecer un pronóstico de eventos futuros e inciertos, a mayor número de muestras analizadas, el pronóstico tiende a ser más acertado |\n| Probabilidad | Cálculo que se obtiene dividiendo el número de eventos ocurridos entre el número de muestras analizadas. |\n| Tabla de Mortalidad | Instrumento estadístico que acumula la información sobre el comportamiento de un colectivo de personas desde los 0 hasta los 99 años de edad y establece el comportamiento de la mortalidad de las personas a diferentes edades. Es el instrumento utilizado en las instituciones aseguradoras para calcular la prima pura de riesgo del seguro de vida. |\n| Tasa de Mortalidad | Es el resultado de dividir la cantidad de fallecimientos a cada edad al final del año, entre las personas que estaban con vida al principio de cada edad. |\n| Prima Pura de Riesgo | Es la parte de la prima que se lleva al fondo denominado Reserva Técnica y permite juntar el dinero suficiente para pagar todos los siniestros que ocurran en un tiempo determinado |\n| Prima de Tarifa | Es la que incluye: prima pura de riesgo, reserva matemática, gastos de adquisición, gastos de administración, utilidad esperada |\n| Prima Única | Sistema de pago que con sólo una anualidad permite pagar todos los años de vigencia del seguro contratado, incluye las obligaciones futuras de la aseguradora y originalmente se aplicaba en los seguros Vitalicios |"},{"title":"Primas Aplicables al Seguro de Vida","content_md":"(Gráfica de Prima contra Edad con tres tipos de prima)\n\n- **Prima: Natural Ascendente, prima por edad alcanzada** — Aplica en seguros: Con vigencia de un año renovable\n- **Prima: Nivelada, se obtiene de promediar las Ascendentes** — Aplica en seguros: Con vigencia de 10 años o más\n- **Prima: Decreciente, cada año es menor por la suma asegurada** — Aplica en seguros: Que garantizan créditos, hipotecas, autos, etc."},{"title":"Reserva Matemática y Valores Garantizados","content_md":"- El exceso de prima que se paga en la prima nivelada durante la primera mitad de la vigencia, forma el fondo de dinero llamado **Reserva Matemática**.\n- La Reserva Matemática, sirva para: **Compensar las primas en la segunda parte del plan cuando la prima nivelada es menor a la prima ascendente**.\n- Los primeros dos años el fondo se llama: **Reserva Matemática**.\n- De la tercera anualidad pagada en adelante, el fondo se llama: **Valores garantizados** (usos que el asegurado puede darle a su reserva matemática)."},{"title":"Valores Garantizados: variación y formas de uso","content_md":"**Los Valores Garantizados varían de acuerdo a:**\n1. Plan contratado\n2. Suma asegurada\n3. Edad de contratación\n4. Vigencia del plan\n\n**Las formas para utilizar el Valor Garantizado en efectivo son:**\n1. Rescate (Retiro total con la cancelación de la póliza)\n2. Préstamo Automático (para pago de primas)\n3. Préstamo Ordinario (para los usos que el asegurado requiera)\n\n**Las formas para utilizar el Valor Garantizado como protección son:**\n1. Seguro Saldado (Con el valor garantizado se mantiene vigencia faltante, pero se reduce Suma Asegurada)\n2. Seguro Prorrogado (Se mantiene la misma Suma asegurada, reduce vigencia)"},{"title":"Seguro Saldado y Seguro Prorrogado (esquemas)","content_md":"**Seguro Saldado** — Con la reserva matemática:\n- Se paga la prima de una vigencia igual a la faltante\n- Se reduce la Suma Asegurada\n\n**Seguro Prorrogado** — Con la reserva matemática:\n- Se paga la prima de una Suma asegurada Igual\n- Se reduce la vigencia faltante"},{"title":"2. Planes Básicos","content_md":"**Objetivo Legal:** Cubre los riesgos que puedan afectar la persona del asegurado en su existencia. Se considerarán comprendidos dentro de estas operaciones los beneficios adicionales basados en la salud o en accidentes personales. También, los que tengan como base planes de pensiones o de supervivencia relacionados con la edad, jubilación o retiro de personas, ya sea privados o derivados de las leyes de seguridad social;\n\n| Características | Temporales | Vitalicios o de Vida Entera | Dotales |\n|---|---|---|---|\n| Edad de Contratación | 12 a 70 años; 50 años para Edad Alcanzada 60; 55 años para Edad Alcanzada 65 | De 12 a 70 años | Dotal Puro desde recién nacidos; Dotal Mixto de 12 a 70 años; 50 años para Edad Alcanzada 60; 55 años para Edad Alcanzada 65 |\n| Riesgos Amparados | Este seguro sólo paga la suma asegurada cuando el asegurado fallece | Este seguro paga la suma asegurada si el asegurado fallece o si llega con vida al término del plan | **Dotal Puro:** Paga la suma contratada sólo si el asegurado llega con vida al término del plazo elegido. **Dotal Mixto:** Paga la suma contratada si el asegurado fallece durante el plazo o si llega con vida al final del plazo |\n| Plazo de contrato | 1, 5, 10, 15 o 20 años; Contratos a Edad alcanzada 60 o 65 años | Plazo automático hasta los 99 años de edad | 1, 5, 10, 15 o 20 años; Edad Alcanzada 60 o 65; Corto plazo 1, 3 o 6 meses |\n| Tipo de prima | Temporales a 1 año: Prima Ascendiente; Temporales a 10 años o más: Prima Nivelada | Dado que los plazos siempre son mayores a 10 años, siempre aplica prima nivelada | Dotales a 1 año: Prima ascendente; Dotales a 10 años o más: Prima Nivelada |\n| Plazos de pago | La prima se paga todos los años | **Ordinario de Vida (OV):** La prima se paga hasta que el asegurado fallezca o cumpla 99 años. **Vida Pagos Limitados (VPL):** el asegurado elige pagos a 5, 10, 15 o 20 años o a edad alcanzada y queda protegido hasta los 99 años | La prima se paga todos los años de vigencia |\n| Prima Única | No aplica | Con un sólo pago, el seguro se mantiene vigente hasta los 99 años de edad | No aplica |\n| Valores garantizados | Sólo en temporales con vigencia de 10 años o más, se reducen en la segunda etapa de la vigencia; al final son igual a cero. | Siempre generan valores garantizados, toda la vigencia son crecientes y a los 99 años de edad del asegurado son igual a la suma asegurada. | En dotales con vigencia de 10 años o más son obligatorios, crecen toda la vigencia; al final de la vigencia son igual a la suma asegurada |"},{"title":"Fideicomiso","content_md":"**Fideicomiso:** Es un contrato adicional al seguro donde una persona física o moral cede condicionalmente los derechos sobre sus bienes a una institución (fiduciaria) para que los administre en favor de otras personas de acuerdo a instrucciones especificadas en el contrato.\n\n| Fiduciaria | Fideicomitente | Fideicomisario |\n|---|---|---|\n| Entidad financiera autorizada por la Comisión Nacional Bancaria y de Valores para celebrar contratos de fideicomiso (administración de Bienes). La institución de Seguros puede tener esta autorización | Persona que contrata el fideicomiso (asegurado), aporta los bienes que se administrarán y establece las instrucciones en que debe realizarse la administración: Rentas vitalicias; Rentas a plazo fijo; Rentas fijas o variables; Derecho a retiros parciales, etc. En el seguro de vida, nombra como beneficiario el número de fideicomiso que le da la fiduciaria | Personas que reciben el beneficio de la administración de los bienes (suma asegurada). En los seguros de vida son los beneficiarios. |"},{"title":"3. Beneficios Adicionales","content_md":"*Nota manuscrita en el encabezado: \"Aprender\"*\n\n**Por Accidente:** Lesiones o la muerte que sufra el asegurado por un evento fortuito, súbito, violento y por causa externa\n\n| Nombre | Objetivo | Condición |\n|---|---|---|\n| Muerte Accidental | Paga la suma asegurada a los beneficiarios cuando el asegurado fallece por un accidente | La muerte debe ocurrir al momento del accidente o en un plazo máximo de 90 días |\n| Pérdidas Orgánicas | Paga al asegurado un porcentaje de la suma por muerte accidental cuando sufra alguna pérdida orgánica causada por un accidente | La pérdida orgánica debe ocurrir al momento del accidente o en un plazo máximo de 90 días |\n| Muerte por Accidente Colectivo | Paga a los beneficiarios el doble de la suma asegurada por muerte accidental cuando esta ocurra: | 1. Como pasajero de un transporte terrestre con itinerario y ruta fija. 2. En un incendio de edificio público. 3. En accidentes de un elevador público (excepto: industriales o de minas) |\n\n**Por Invalidez:** 1. Incapacidad causada por accidente o enfermedad para trabajar en una actividad compatible con aptitudes, conocimientos o posición socio-económica. (6 meses de espera). 2. Pérdida de la vista en ambos ojos, amputación de ambos pies o ambos manos o un pie y una mano, una mano y un ojo, un pie y un ojo\n\n| Nombre | Objetivo | Condición |\n|---|---|---|\n| Exención de pago de Prima | El seguro se mantiene por el resto de la vigencia sin que el asegurado pague más primas. **Sólo aplica al plan básico** | Un médico debe declarar el estado de invalidez y debe ser permanente. |\n| Pago Adicional por Invalidez | Se paga al asegurado la suma asegurada contratada | Un médico debe declarar el estado de invalidez y debe ser permanente. La indemnización se paga 6 meses después del diagnóstico |\n| Rentas Vitalicias por Invalidez | El asegurado recibe una anualidad por el resto de su vida. Puede ser renta fija o variable | Un médico debe declarar el estado de invalidez y debe ser permanente. La primera renta se paga 6 meses después del diagnóstico |\n\n**Exclusiones — Aplicables Únicamente a los Beneficios por Accidente:**\n- Enfermedad física o mental\n- Infecciones que no sean causadas por accidente\n\n**Aplicables a los beneficios por accidente y por invalidez:**\n- Servicio militar, actos de guerra\n- Accidente durante actos delictivos del asegurado\n- Accidentes causados por embriaguez del asegurado\n- Accidentes por usar drogadas. **Excepto por medicamentos prescritos**\n- Homicidio intencional\n- Participación en riñas si las provoca\n- Suicidio o autolesiones\n- Hernias y eventraciones\n- Envenenamientos o inhalación de gases **EXCEPTO si es accidental**\n- Accidentes durante la práctica de deportes peligrosos\n- Accidentes a bordo de aeronaves, **Excepto como pasajero en aviones con itinerario**\n- Abortos, cualquiera que sea su causa\n\n**Aplicables Únicamente a los beneficios por Invalidez:**\n- Invalidez causada por enfermedades preexistentes\n\n**Otros Beneficios:**\n\n| Nombre | Objetivo | Condición | Exclusiones |\n|---|---|---|---|\n| Seguro Mancomunado | En el mismo contrato se aseguran el asegurado y su cónyuge | Al fallecimiento de cualquiera, se paga el 100% de la suma asegurada y el contrato se cancela | 1. Omisiones o inexactas declaraciones los primeros dos años. 2. Suicidio los primeros dos años |\n| Gastos Funerarios | Los beneficiarios reciben un anticipo de la suma asegurada | Presentar el certificado de defunción | Muerte durante los primeros dos años |"},{"title":"4. Condiciones Generales","content_md":"**Indisputabilidad:**\n- La aseguradora renuncia a su derecho de rescindir por omisiones o inexactas declaraciones a partir del tercer año de vigencia\n- Los primeros dos años se mantiene el derecho de rescindir el contrato\n- Cada vez que el seguro se rehabilite vuelven a contar los dos años\n\n**Carencia de Restricciones:** La aseguradora renuncia a rescindir el contrato cuando el asegurado agrave el riesgo por las siguientes causas:\n- Cambio de domicilio\n- Cambio en la forma y frecuencia de viajes\n- Cambio en su estilo y género de vida\n\n**Suicidio:**\n- Si el asegurado se suicida durante los primeros 2 años de vigencia, la aseguradora, sólo regresa la reserva matemática si existe.\n- Si el asegurado se suicida después de dos años de vigencia, se paga la suma asegurada\n\n**Beneficiarios:**\n- El asegurado tiene derecho a nombrar a quien el decida.\n- Puede cambiarlos en cualquier momento durante la vigencia\n- Si nombra beneficiarios irrevocables, sólo los puede cambiar con acta de defunción o autorización por escrito del beneficiario.\n- Si sólo existe un beneficiario nombrado y éste desaparece antes que el asegurado, la suma se indemniza a los herederos legales.\n- Si existen vario beneficiarios nombrados y uno de ellos desaparece antes que el asegurado, su parte se distribuye entre los demás beneficiarios\n- El seguro es inembargable sólo si los beneficiarios son irrevocables o los nombrados son cónyuge y descendientes\n\n**Edad:**\n- La edad de cotización será la que se tenga antes de iniciar la vigencia.\n- Si el asegurado agrega una copia de su acta de nacimiento a la solicitud, la aseguradora no pedirá comprobantes de edad al momento del siniestro.\n- Si el asegurado cometió un error en su edad al contratar el seguro y la edad real estaba fuera de los límites de aceptación (12 a 70 años), el seguro se rescinde y sólo se devuelve la reserva si existe.\n- Si el asegurado al contratar el seguro comete error en la declaración de edad, pero la real está dentro de los límites de aceptación, se ajusta la suma asegurada si esto se descubre después del siniestro.\n\n**Actividad:**\n- Si el asegurado cambia durante la vigencia del seguro a una actividad de mayor peligro, debe informar por escrito a la aseguradora en un plazo de 30 días naturales.\n- La aseguradora tendrá 15 días hábiles para informar la rescisión\n- Si el asegurado fallece y no declaró el cambio de actividad, la aseguradora tiene derecho a reducir la suma asegurada que indemnizará\n\n**Cambio de Plan:**\n- El asegurado puede cambiar de plan si lo desea (**de una menor a uno mayor**)\n- La edad de cotización es la del primer plan\n- El asegurado debe pagar retroactiva la diferencia de la reserva matemática\n\n**Póliza:**\n- Concepto: Documento que emite la Institución de Seguros y que es la prueba escrita de la existencia del contrato. Describe las condiciones en que operará\n- Datos: Nombre del asegurado y/o Contratante; Fecha de nacimiento o edad del asegurado; Nombre y participación de los beneficiarios de Seguro; Causa y plazo de la prestación (Riesgos amparados y vigencia); Monto de Garantía (Suma Asegurada); Tabla de Valores Garantizados (En seguros de menos de 10 años no son obligatorios)\n- Tipo de Documento: Queda prohibido por la Ley Sobre el Contrato emitir pólizas de Vida **Al Portador**\n\n**Reclamación:**\n- Aviso: Los beneficiarios o Asegurado deben informar por escrito la ocurrencia del siniestro en un plazo de 5 días. La prescripción es de 5 Años\n- Documentos Requeridos — Del Asegurado: Póliza; Acta de nacimiento; Acta de defunción; Actuaciones del ministerio público y dictamen de autopsia si es indispensable\n- Documentos Requeridos — De los Beneficiarios: Identificación oficial con fotografía y firma; Acta de matrimonio si es cónyuge; Certificado de concubinato en su caso; Acta de nacimiento si es hijo"},{"title":"Notas manuscritas en las páginas del banco de preguntas","content_md":"**Página 7 (encabezado):**\n- \"mas imp\"\n- \"¿Para que sirve la reserva matematica? compensa las primas futura cuando la Prima nivelada es [frase incompleta]\"\n\n**Página 7 (pie de página):**\n- \"Reserva Matematica: Fondo de Dinero\"\n- \"Reserva Tecnica: Para paga siniestro\"\n- \"Dividendo: Es reparto de utilidades\"\n- \"¿Como se forma Reserva matematica? Se forma Dinero en exceso que se paga en la prima nivelada\"\n\n**Página 8 (pie de página):**\n- \"¿Cuanta fiduciarias puede haber en un fideicomiso? · 1 sola\"\n\n**Página 9 (pie de página):**\n- \"Plan basico no tiene exclusiones a menos que sea suicidio en meno de 2 años\"\n- \"Exención de pago de primas: si tiene invalidez se exenta pago de primas\" [escritura poco legible]\n\n**Página 10 (pie de página):**\n- \"¿Menciona 2 formas en las que se puede cambiar a un beneficiario irrevocable en el seguro de vida? · Con el acta de defunción de beneficiario o con una autorización escrita del beneficiario\""}],"questions":[{"id":1,"text":"Al pronosticar un hecho futuro e incierto, la posibilidad de acertar es mayor si existe un número de muestras mayor; este enunciado corresponda a:","options":[{"key":"a","text":"Ley de los grandes números"},{"key":"b","text":"Ley de probabilidad"}],"correct":"a"},{"id":2,"text":"¿Cómo se denomina al fondo que se acumula junto con los intereses por inversiones, que se utiliza para el pago de siniestros en el seguro de vida?","options":[{"key":"a","text":"Reserva para obligaciones pendientes de cumplir"},{"key":"b","text":"Reserva Matemática"}],"correct":"a","handwritten_note":"Subrayado a mano: 'pago de siniestros'"},{"id":3,"text":"¿Cómo se denomina el instrumento que aporta información sobre la relación de personas que permanecen con vida y las que fallecen?","options":[{"key":"a","text":"Tasa de mortalidad"},{"key":"b","text":"Tabla de mortalidad"}],"correct":"b","handwritten_note":"Al margen izquierdo: 'Estadistica'; subrayada la palabra 'instrumento'"},{"id":4,"text":"La experiencia pasada es la base para calcular las primas en los seguros de vida, ¿qué instrumento contiene dicha experiencia?","options":[{"key":"a","text":"Tasa de mortalidad"},{"key":"b","text":"Tabla de mortalidad"}],"correct":"b"},{"id":5,"text":"Identifica las definiciones que corresponden a Tasa de Mortalidad: 1. La proporción de personas por cada edad que mueren en el término de un año. 2. Instrumento estadístico que ayuda a pronosticar la mortalidad. 3. Elemento de la tabla de mortalidad sirve para calcular la prima pura de riesgo de muerte. 4. Se obtiene dividiendo el número de personas muertas al final de un año entre las personas que estaban vivas al principio del año. 5. Cálculo de las edades en que hay más muertes.","options":[{"key":"a","text":"1, 3, 5"},{"key":"b","text":"1, 3, 4"}],"correct":"b","list":{"stem":"Identifica las definiciones que corresponden a Tasa de Mortalidad:","kind":"num","items":[{"k":"1","text":"La proporción de personas por cada edad que mueren en el término de un año"},{"k":"2","text":"Instrumento estadístico que ayuda a pronosticar la mortalidad"},{"k":"3","text":"Elemento de la tabla de mortalidad sirve para calcular la prima pura de riesgo de muerte"},{"k":"4","text":"Se obtiene dividiendo el número de personas muertas al final de un año entre las personas que estaban vivas al principio del año"},{"k":"5","text":"Cálculo de las edades en que hay más muertes"}]},"handwritten_note":"Palomas manuscritas junto a los enunciados 1 y 4"},{"id":6,"text":"Prima que considera únicamente el valor de las obligaciones futuras de una institución de seguros en los seguros de vida","options":[{"key":"a","text":"Prima Pura de Riesgo"},{"key":"b","text":"Prima Bruta"}],"correct":"a","handwritten_note":"Subrayado 'obligaciones futuras'; debajo escrito a mano: 'siniestros'"},{"id":7,"text":"Se refiere a la prima que se aplica de acuerdo a la probabilidad de muerte de los asegurados y por lo tanto es variable cada año","options":[{"key":"a","text":"Prima Pura de Riesgo"},{"key":"b","text":"Prima Bruta"}],"correct":"a","handwritten_note":"Junto a la opción b (Prima Bruta), escrito a mano: 'Paga[ilegible] completa como asegurado'"},{"id":8,"text":"De la siguiente lista elige 4 elementos que forman parte del cálculo de la prima en un seguro de vida: a) Interés supuesto, b) Gastos de expedición, c) Tasa de mortalidad, d) Gastos de Adquisición, e) Valores de dividendos, f) Gastos de Administración","options":[{"key":"a","text":"a, c, d, f"},{"key":"b","text":"a, b, d, f"}],"correct":"a","list":{"stem":"De la siguiente lista elige 4 elementos que forman parte del cálculo de la prima en un seguro de vida:","kind":"let","items":[{"k":"a","text":"Interés supuesto"},{"k":"b","text":"Gastos de expedición"},{"k":"c","text":"Tasa de mortalidad"},{"k":"d","text":"Gastos de Adquisición"},{"k":"e","text":"Valores de dividendos"},{"k":"f","text":"Gastos de Administración"}]},"handwritten_note":"Palomas manuscritas en: Interés supuesto, Tasa de mortalidad, Gastos de Adquisición y Gastos de Administración. Al margen: 'Prima de tarifa en el seguro de vida'"},{"id":9,"text":"Es la prima que se aplica por edad alcanzada, cada renovación es más alta, a edades avanzadas es muy costosa, también se denomina natural, aplica en seguros de 1 año","options":[{"key":"a","text":"Creciente"},{"key":"b","text":"Nivelada"}],"correct":"a"},{"id":10,"text":"Se obtiene al promediar las primas crecientes y permite que el costo de prima se mantenga igual toda la vigencia, es obligatoria en seguros de 10 años o más:","options":[{"key":"a","text":"Creciente"},{"key":"b","text":"Nivelada"}],"correct":"b"},{"id":11,"text":"¿Qué tipo de prima se aplica en un seguro temporal a 20 años, un dotal a edad alcanzada de 65 años y en un ordinario de vida?","options":[{"key":"c","text":"Creciente"},{"key":"d","text":"Nivelada"}],"correct":"d","handwritten_note":"Escrito a mano junto a la pregunta: 'Los 3 tienen 10 años o mas de vigencia'"},{"id":12,"text":"En un Seguro de Vida a 10 años, ¿Cuál es la prima que paga un asegurado para cubrir el riesgo en un plazo máximo de 12 meses?","options":[{"key":"a","text":"Única"},{"key":"b","text":"Anual"}],"correct":"a"},{"id":13,"text":"Con sólo una anualidad se paga toda la vigencia de la póliza, considera las obligaciones futuras de la aseguradora, Prima aplicable en el seguro vitalicio","options":[{"key":"a","text":"Prima Nivelada"},{"key":"b","text":"Prima única"}],"correct":"b"},{"id":14,"text":"Es la prima que se aplica en los seguros de vida que sirven de garantía para créditos","options":[{"key":"a","text":"Nivelada"},{"key":"b","text":"Decreciente"}],"correct":"b"},{"id":15,"text":"Es la cantidad adicional que cubre el asegurado o contratante a la prima básica para cubrir un riesgo agravado en un Seguro de Vida:","options":[{"key":"a","text":"Recargo fijo"},{"key":"b","text":"Extraprima"}],"correct":"b"},{"id":16,"text":"¿Qué tipo de riesgos acepta una institución de seguros cuando aplica una extraprima?","options":[{"key":"a","text":"Normales"},{"key":"b","text":"Subnormales"}],"correct":"b"},{"id":17,"text":"Para el seguro de vida, las extraprimas dependen de las variables que pueden incrementar la mortalidad calculada, por lo tanto, pueden ser:","options":[{"key":"a","text":"Por edad avanzada y hábitos"},{"key":"b","text":"Por Estado de salud y por actividad"}],"correct":"b"},{"id":18,"text":"Una azafata compró un seguro de vida, ¿qué sucede si en el tiempo se convierte en asistente administrativo?","options":[{"key":"a","text":"Se incrementa la protección"},{"key":"b","text":"Se cancela la extraprima"}],"correct":"b"},{"id":19,"text":"De acuerdo a las prácticas de cotización, la prima de una mujer debe establecerse considerando:","options":[{"key":"a","text":"3 años menos de la edad real"},{"key":"b","text":"2 años menos de la edad real"}],"correct":"a"},{"id":20,"text":"Cuando una persona no fuma, se aplica un descuente de:","options":[{"key":"a","text":"3 años"},{"key":"b","text":"2 años"}],"correct":"b"},{"id":21,"text":"Para los efectos del Contrato de Seguro de vida, se considera como edad del asegurado, la que haya alcanzado:","options":[{"key":"a","text":"A la fecha de inicio de la vigencia"},{"key":"b","text":"A la fecha de recibida la oferta del seguro"}],"correct":"a"},{"id":22,"text":"Relaciona ambas columnas: 1. Reserva Matemática, 2. Valores Garantizados; a) Se forma con el exceso que se paga en la prima nivelada en los primeros años de vigencia, b) Es el uso de la reserva que puede hacer el asegurado, c) Hace viables las primas futuras en el seguro de vida, d) Existen desde la tercera anualidad pagada, e) En la segunda parte del plan, compensa las primas que son mayores por edad","options":[{"key":"a","text":"1 a, c, e; 2 b, d"},{"key":"b","text":"1 b, d; 2 a, c, e"}],"correct":"a","match":{"stem":"Relaciona ambas columnas:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Reserva Matemática"},{"k":"2","text":"Valores Garantizados"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Se forma con el exceso que se paga en la prima nivelada en los primeros años de vigencia"},{"k":"b","text":"Es el uso de la reserva que puede hacer el asegurado"},{"k":"c","text":"Hace viables las primas futuras en el seguro de vida"},{"k":"d","text":"Existen desde la tercera anualidad pagada"},{"k":"e","text":"En la segunda parte del plan, compensa las primas que son mayores por edad"}]}]},"handwritten_note":"Manuscrito: '1. a, c, e / 2. b, d' y palabras poco legibles junto a las columnas; al margen derecho: 'Hasta que el asegurado a pagado 3 anulidades paga[ilegible]'"},{"id":23,"text":"¿Quién es la persona que tiene derecho a usar la reserva matemática?","options":[{"key":"a","text":"La aseguradora"},{"key":"b","text":"El contratante y/o asegurado"}],"correct":"b"},{"id":24,"text":"Identifica las características que cambian el monto de los Valores Garantizados: 1. Plan contratado, 2. Los dividendos retirados, 3. La edad del asegurado, 4. La suma asegurada, 5. La reserva técnica, 6. La vigencia del seguro","options":[{"key":"a","text":"1, 2, 4, 6"},{"key":"b","text":"1, 3, 4, 6"}],"correct":"b","list":{"stem":"Identifica las características que cambian el monto de los Valores Garantizados:","kind":"num","items":[{"k":"1","text":"Plan contratado"},{"k":"2","text":"Los dividendos retirados"},{"k":"3","text":"La edad del asegurado"},{"k":"4","text":"La suma asegurada"},{"k":"5","text":"La reserva técnica"},{"k":"6","text":"La vigencia del seguro"}]},"handwritten_note":"Palomas manuscritas junto a los enunciados 3, 4 y 6"},{"id":25,"text":"Relaciona ambas columnas: 1. En efectivo, 2. Para mantener protección; a) Rescate, b) Seguro saldado, c) Préstamo automático, d) Préstamo ordinario, e) Seguro prorrogado","options":[{"key":"a","text":"1 a, c, d; 2 b, e"},{"key":"b","text":"1 b, c, d; 2 a, e"}],"correct":"a","match":{"stem":"Relaciona ambas columnas:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"En efectivo"},{"k":"2","text":"Para mantener protección"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Rescate"},{"k":"b","text":"Seguro saldado"},{"k":"c","text":"Préstamo automático"},{"k":"d","text":"Préstamo ordinario"},{"k":"e","text":"Seguro prorrogado"}]}]},"handwritten_note":"Manuscrito: '1. a, c, d / 2. b, e'; 'Valor Garantizado'; junto a Rescate: 'Cancelación'; al margen: 'si no paga la aseguradora lo toma de la reserva matemat[ica]'; 'Retiro Parcial para usar'"},{"id":26,"text":"Identifica los requisitos para usar los valores garantizados: 1. Se deben pagar tres anualidades, 2. Se solicitan al tercer año de vigencia, 3. El beneficiario debe autorizar el retiro, 4. El seguro debe tener 10 años o más de vigencia, 5. Se debe solicitar 30 días antes el uso deseado","options":[{"key":"a","text":"1, 2, 5"},{"key":"b","text":"1, 4, 5"}],"correct":"b","list":{"stem":"Identifica los requisitos para usar los valores garantizados:","kind":"num","items":[{"k":"1","text":"Se deben pagar tres anualidades"},{"k":"2","text":"Se solicitan al tercer año de vigencia"},{"k":"3","text":"El beneficiario debe autorizar el retiro"},{"k":"4","text":"El seguro debe tener 10 años o más de vigencia"},{"k":"5","text":"Se debe solicitar 30 días antes el uso deseado"}]},"handwritten_note":"Palomas manuscritas en los requisitos 1, 4 y 5; junto al 3: 'el dinero e[s] lo que yo quiera' [poco legible]"},{"id":27,"text":"Relaciona ambas columnas: 1. Rescate, 2. Préstamo automático, 3. Préstamo ordinario; a) Sirve para pagar primas, b) El dinero lo usa el asegurado para lo que el quiera, c) Retiro total de la reserva matemática, pero se cancela el seguro","options":[{"key":"a","text":"1 a, 2 b, 3 c"},{"key":"b","text":"1 c, 2 a, 3 b"}],"correct":"b","match":{"stem":"Relaciona ambas columnas:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Rescate"},{"k":"2","text":"Préstamo automático"},{"k":"3","text":"Préstamo ordinario"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Sirve para pagar primas"},{"k":"b","text":"El dinero lo usa el asegurado para lo que el quiera"},{"k":"c","text":"Retiro total de la reserva matemática, pero se cancela el seguro"}]}]},"handwritten_note":"Manuscrito junto a la columna 1: Rescate → c, Préstamo automático → a, Préstamo ordinario → b"},{"id":28,"text":"Cuando el seguro ha sido gravado por algún préstamo, las siguientes condiciones se aplican, EXCEPTO:","options":[{"key":"a","text":"El seguro prorrogado y saldado se incrementan"},{"key":"b","text":"El seguro prorrogado y saldado se reducen"}],"correct":"a"},{"id":29,"text":"Relaciona ambas columnas: 1. Seguro Saldado, 2. Seguro prorrogado; a) Se mantiene la vigencia faltante, b) Se mantiene la Misma Suma Asegurada, c) Se reduce la Suma Asegurada, d) Se reduce la vigencia faltante","options":[{"key":"a","text":"1 a, b; 2 c, d"},{"key":"b","text":"1 a, c; 2 b, d"}],"correct":"b","match":{"stem":"Relaciona ambas columnas:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Seguro Saldado"},{"k":"2","text":"Seguro prorrogado"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Se mantiene la vigencia faltante"},{"k":"b","text":"Se mantiene la Misma Suma Asegurada"},{"k":"c","text":"Se reduce la Suma Asegurada"},{"k":"d","text":"Se reduce la vigencia faltante"}]}]},"handwritten_note":"Líneas manuscritas cruzadas relacionando las opciones de ambas columnas"},{"id":30,"text":"Los valores garantizados se aplican de la siguiente forma:","options":[{"key":"a","text":"Sólo aplican al plan básico"},{"key":"b","text":"Aplican al plan básico y los beneficios adicionales"}],"correct":"a"},{"id":31,"text":"Para el seguro de vida individual, el concepto Dividendo se aplica a:","options":[{"key":"a","text":"El superávit de la aseguradora que se distribuye entre los asegurados"},{"key":"b","text":"Las aportaciones adicionales que se agregan a la prima anual"}],"correct":"a"},{"id":32,"text":"Para el seguro de vida individual, los Dividendos que se entregan a los asegurados, se obtienen por:","options":[{"key":"a","text":"Excedentes en la mortalidad pronosticada"},{"key":"b","text":"Excedentes de rendimientos de la reserva matemática"}],"correct":"b"},{"id":33,"text":"Ahorro en la mortalidad, más asegurados, uso menor de la reserva matemática, interés mayor al presupuestado por la reserva matemática, son elementos de:","options":[{"key":"a","text":"Valores garantizados"},{"key":"b","text":"Dividendos"}],"correct":"b"},{"id":34,"text":"Retiro en efectivo, pago de primas, incrementar la suma asegurada, crear ahorro; son usos de:","options":[{"key":"a","text":"Valores garantizados"},{"key":"b","text":"Dividendos"}],"correct":"b","handwritten_note":"Manuscrito bajo la pregunta: 'Por esta no es valores' [poco legible]"},{"id":35,"text":"¿Cuál de las siguientes opciones contiene sólo planes básicos del seguro de vida?","options":[{"key":"a","text":"Ordinario de vida, dotales, universales"},{"key":"b","text":"Temporales, vitalicios, dotales"}],"correct":"b"},{"id":36,"text":"Es el seguro más económico, sólo cobran los beneficiarios, los valores garantizados más bajos, no hay recuperación al final de vigencia:","options":[{"key":"a","text":"Seguro Temporal"},{"key":"b","text":"Ordinario de Vida"}],"correct":"a"},{"id":37,"text":"Es el plan que cumple los requisitos de los bancos para cubrir las deudas en caso de fallecimiento o invalidez de los deudores:","options":[{"key":"a","text":"Temporal Decreciente"},{"key":"b","text":"Temporal Creciente"}],"correct":"a"},{"id":38,"text":"Indemniza por muerte o sobrevivencia a los 99 años de edad, los valores garantizados crecen toda la vigencia","options":[{"key":"a","text":"Temporales"},{"key":"b","text":"Vitalicios"}],"correct":"b","handwritten_note":"Bajo '99 años' escrito a mano: 'ó 95 años'; al margen derecho: 'si se cumple 99 años lo cobra el asegurado'"},{"id":39,"text":"Identifica los sistemas de contratación del seguro Vitalicio: 1. Ordinario de Vida (OV), 2. Vida Pagos Limitados (VPL), 3. Seguro Flexible, 4. Seguro Mancomunado, 5. Vida Universal, 6. Seguro de Prima Única","options":[{"key":"a","text":"1, 2, 4, 5"},{"key":"b","text":"1, 2, 4, 6"}],"correct":"b","list":{"stem":"Identifica los sistemas de contratación del seguro Vitalicio:","kind":"num","items":[{"k":"1","text":"Ordinario de Vida (OV)"},{"k":"2","text":"Vida Pagos Limitados (VPL)"},{"k":"3","text":"Seguro Flexible"},{"k":"4","text":"Seguro Mancomunado"},{"k":"5","text":"Vida Universal"},{"k":"6","text":"Seguro de Prima Única"}]},"handwritten_note":"Palomas manuscritas junto a los enunciados 1, 2, 4 y 6"},{"id":40,"text":"Seguro Vitalicio que obliga al asegurado a pagar la prima hasta que fallezca o cumpla 99 años de edad","options":[{"key":"a","text":"Ordinario de vida"},{"key":"b","text":"Vida pagos limitados"}],"correct":"a"},{"id":41,"text":"Seguro Vitalicio que permite al asegurado pagar prima en un plazo menor y quedar asegurado hasta los 99 años de edad","options":[{"key":"a","text":"Ordinario de vida (OV)"},{"key":"b","text":"Vida pagos limitados (VPL)"}],"correct":"b","handwritten_note":"Junto a la opción a: 'Pagas hasta lo[s] 99'; junto a la opción b: 'Cuando solo se paga menos años'"},{"id":42,"text":"Se contrata a plazos determinados, es el seguro con mayor costo, se utiliza como sistema de ahorro, tiene los valores garantizados más altos, el asegurado cobra la suma asegurada si está vivo al final de la vigencia:","options":[{"key":"a","text":"Temporales"},{"key":"b","text":"Dotales"}],"correct":"b","handwritten_note":"Junto a la opción b (Dotales): 'ahorro'"},{"id":43,"text":"Es un plan que indemniza al asegurado en caso de sobrevivencia al final del plazo, pero si fallece no hay indemnización.","options":[{"key":"a","text":"Dotal puro"},{"key":"b","text":"Dotal Mixto"}],"correct":"a","handwritten_note":"Junto a la opción a (Dotal puro): 'ahorro'"},{"id":44,"text":"Identifica los planes que permiten al asegurado cobrar la suma asegurada al terminar la vigencia: 1. Ordinario de vida, 2. Dotal, 3. Temporal, 4. Vida Pagos limitados, 5. Decreciente","options":[{"key":"a","text":"1, 3, 5"},{"key":"b","text":"1, 2, 4"}],"correct":"b","list":{"stem":"Identifica los planes que permiten al asegurado cobrar la suma asegurada al terminar la vigencia:","kind":"num","items":[{"k":"1","text":"Ordinario de vida"},{"k":"2","text":"Dotal"},{"k":"3","text":"Temporal"},{"k":"4","text":"Vida Pagos limitados"},{"k":"5","text":"Decreciente"}]},"handwritten_note":"Palomas manuscritas junto a los enunciados 1, 2 y 4"},{"id":45,"text":"Es el contrato por el cual se transfiere la propiedad de bienes a una institución financiera, para que sean administrados con un fin lícito, que el contratante señale","options":[{"key":"a","text":"Cuenta financiera"},{"key":"b","text":"Fideicomiso"}],"correct":"b"},{"id":46,"text":"¿Los fideicomisos de las aseguradoras contienen un número de cuenta individual para cada póliza que participe en éste?","options":[{"key":"a","text":"No, es global"},{"key":"b","text":"Si"}],"correct":"a"},{"id":47,"text":"Se define como Fiduciaria:","options":[{"key":"a","text":"Es la institución autorizada por las Instituciones de Crédito para administrar el fondo"},{"key":"b","text":"Es la institución autorizada por autoridades financieras para administrar el fideicomiso"}],"correct":"b"},{"id":48,"text":"Persona que contrata el fideicomiso y da las instrucciones de administración","options":[{"key":"a","text":"Fideicomisario"},{"key":"b","text":"Fideicomitente"}],"correct":"b","handwritten_note":"Junto a 'Fideicomisario': 'Beneficiario'; junto a 'Fideicomitente': 'contratante'"},{"id":49,"text":"¿El fideicomisario puede cambiar los términos en los que fue creado el fideicomiso?","options":[{"key":"a","text":"Si"},{"key":"b","text":"No"}],"correct":"b"},{"id":50,"text":"Es la administración donde la suma asegurada se divide entre los años calculados como la esperanza de vida del beneficiario:","options":[{"key":"a","text":"Rentas vitalicias"},{"
