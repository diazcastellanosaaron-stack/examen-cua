key":"b","text":"Rentas fijas o variables"}],"correct":"a"},{"id":51,"text":"Si el asegurado establece que se debe entregar el equivalente a 5 salarios mensuales y se programan 14 pagos al año, ¿qué sistema de administración eligió?","options":[{"key":"a","text":"Rentas vitalicias"},{"key":"b","text":"Rentas fijas o variables"}],"correct":"b"},{"id":52,"text":"El asegurado instruye que la suma asegurada se divida en 5 años y que se incluyan los intereses obtenidos, la administración elegida es:","options":[{"key":"a","text":"Rentas fijas"},{"key":"b","text":"Plazo fijo"}],"correct":"b"},{"id":53,"text":"¿Cuáles son los beneficios adicionales que se agregan al Seguro de Vida?","options":[{"key":"a","text":"Por accidente e invalidez"},{"key":"b","text":"Por invalidez y enfermedad"}],"correct":"a"},{"id":54,"text":"Relaciona ambas columnas: 1. Beneficios por accidente, 2. Beneficios por Invalidez; a) Muerte accidental, b) Pérdidas orgánicas, c) Exención de pago de prima, d) Pago anticipado o adicional, e) Muerte colectiva, f) Rentas vitalicias","options":[{"key":"a","text":"1 a, b, e; 2 c, d, f"},{"key":"b","text":"1 a, c, d; 2 b, e, f"}],"correct":"a","match":{"stem":"Relaciona ambas columnas:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Beneficios por accidente"},{"k":"2","text":"Beneficios por Invalidez"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Muerte accidental"},{"k":"b","text":"Pérdidas orgánicas"},{"k":"c","text":"Exención de pago de prima"},{"k":"d","text":"Pago anticipado o adicional"},{"k":"e","text":"Muerte colectiva"},{"k":"f","text":"Rentas vitalicias"}]}]},"handwritten_note":"Manuscrito: '1. a, b, e / 2. c, d, f'"},{"id":55,"text":"Eventos súbitos, violentos, fortuitos y por causa externa; es la definición de:","options":[{"key":"a","text":"Accidente"},{"key":"b","text":"Incidente"}],"correct":"a"},{"id":56,"text":"¿Cuál de las siguientes situaciones NO es un accidente?","options":[{"key":"a","text":"Accidente cardiovascular"},{"key":"b","text":"Rotura de una pierna esquiando"}],"correct":"a"},{"id":57,"text":"Los siguientes son beneficios por accidente que se agregan al seguro de vida, EXCEPTO:","options":[{"key":"a","text":"Muerte accidental, Pérdidas orgánicas"},{"key":"b","text":"Indemnización diaria por incapacidad, Rentas vitalicias"}],"correct":"b"},{"id":58,"text":"Para que se indemnice la suma asegurada por muerte accidental, el fallecimiento debe ocurrir durante el accidente o en un plazo máximo de:","options":[{"key":"a","text":"60 días"},{"key":"b","text":"90 días"}],"correct":"b"},{"id":59,"text":"En el acta de defunción consta que la muerte del asegurado fue por un accidente en un avión como tripulante. ¿Cómo indemnizará la compañía?","options":[{"key":"a","text":"Paga la suma asegurada de la cobertura básica pero la del beneficio por accidente no se paga"},{"key":"b","text":"El accidente es una exclusión y no paga ninguna indemnización"}],"correct":"a"},{"id":60,"text":"Relaciona ambas columnas: 1. 100%, 2. 50%, 3. 30%, 4. 15%, 5. 10%; a) Amputación de ambas manos o pies, b) Amputación del dedo pulgar, c) Ceguera en ambos ojos, d) Amputación de un pie o una mano, e) Vista de un solo ojo, f) Amputación del dedo índice","options":[{"key":"a","text":"a, d, 2 c, 3 b, 4 f, 5 e"},{"key":"b","text":"1 a, c; 2 d, 3 e, 4 b, 5 f"}],"correct":"b","match":{"stem":"Relaciona ambas columnas:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"100%"},{"k":"2","text":"50%"},{"k":"3","text":"30%"},{"k":"4","text":"15%"},{"k":"5","text":"10%"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Amputación de ambas manos o pies"},{"k":"b","text":"Amputación del dedo pulgar"},{"k":"c","text":"Ceguera en ambos ojos"},{"k":"d","text":"Amputación de un pie o una mano"},{"k":"e","text":"Vista de un solo ojo"},{"k":"f","text":"Amputación del dedo índice"}]}]},"handwritten_note":"Al margen: 'Indemnizacio[n] Por perdidas organicas'; números manuscritos junto a cada inciso: a→1, b→4, c→1, d→2, e→3, f→5"},{"id":61,"text":"Para que se indemnice la cobertura de Muerte Colectiva por el accidente en un almacén, la causa debe ser:","options":[{"key":"a","text":"Por Incendio"},{"key":"b","text":"Por cualquier accidente"}],"correct":"a"},{"id":62,"text":"El asegurado fallece en un accidente de un autobús Acapulco – Cuernavaca; ¿qué se indemniza?","options":[{"key":"a","text":"Plan básico y Muerte accidental"},{"key":"b","text":"Plan Básico y Muerte Colectiva"}],"correct":"b"},{"id":63,"text":"La muerte de un asegurado en un elevador hace que se indemnice el doble de la suma por Muerte Accidental","options":[{"key":"a","text":"En un hotel"},{"key":"b","text":"En una mina"}],"correct":"a"},{"id":64,"text":"En un temporal con suma asegurada de un millón, los tres beneficios por accidente con suma de ochocientos mil pesos y fallece en un accidente de un avión comercial con itinerario. ¿Cuánto cobran los beneficiarios?","options":[{"key":"a","text":"Un millón ochocientos mil pesos"},{"key":"b","text":"Dos millones seiscientos mil pesos"}],"correct":"a"},{"id":65,"text":"Relaciona ambas columnas: 1. Exclusiones, 2. Excepciones; a) Drogas prescritas por médicos, b) Envenenamiento o intoxicación accidental, c) Estado de embriaguez o drogadicción, d) Actos delictivos del asegurado, e) Accidentes aéreos de vuelos comerciales con itinerario, f) Suicidio, homicidio intencional","options":[{"key":"a","text":"1 c, d, f; 2 a, b, e"},{"key":"b","text":"1 a, b, e; 2 c, d, f"}],"correct":"a","match":{"stem":"Relaciona ambas columnas:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Exclusiones"},{"k":"2","text":"Excepciones"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Drogas prescritas por médicos"},{"k":"b","text":"Envenenamiento o intoxicación accidental"},{"k":"c","text":"Estado de embriaguez o drogadicción"},{"k":"d","text":"Actos delictivos del asegurado"},{"k":"e","text":"Accidentes aéreos de vuelos comerciales con itinerario"},{"k":"f","text":"Suicidio, homicidio intencional"}]}]},"handwritten_note":"Manuscrito: '1. c, d, F / 2. a, b, e'"},{"id":66,"text":"En cuál de los siniestros siguientes se excluyen los beneficios por accidente:","options":[{"key":"a","text":"El accidente a causa de medicamentos recomendadas por un médico"},{"key":"b","text":"La muerte del asegurado ocurre por participar en una riña colectiva"}],"correct":"b"},{"id":67,"text":"En qué cobertura se aplica la exención de pago de prima cunado el asegurado sufre invalidez permanente","options":[{"key":"a","text":"Solo al Plan Básico"},{"key":"b","text":"Plan básico y los beneficios por accidente"}],"correct":"a","handwritten_note":"Sobre la palabra 'cunado' escrito a mano: 'cuando'"},{"id":68,"text":"La definición de invalidez se refiera a:","options":[{"key":"a","text":"No puede trabajar en nada"},{"key":"b","text":"Incapacidad de un trabajo compatible con sus conocimiento, aptitudes o posición económica"}],"correct":"b"},{"id":69,"text":"¿En cuál de los siguientes casos se requiere un periodo de 6 meses para recibir el beneficio por invalidez?","options":[{"key":"a","text":"Hemiplejia por embolia"},{"key":"b","text":"Amputación de un pie y una mano por un incendio"}],"correct":"a"},{"id":70,"text":"Cuál de las siguientes exclusiones es exclusiva para los beneficios por invalidez","options":[{"key":"a","text":"Pasajero de aviones chárter"},{"key":"b","text":"Enfermedades preexistentes"}],"correct":"b"},{"id":71,"text":"Cuáles son las edades de contratación para los beneficios por accidente","options":[{"key":"a","text":"12 a 69 años"},{"key":"b","text":"16 a 69 años"}],"correct":"a"},{"id":72,"text":"Cuáles son las edades de contratación para los beneficios por invalidez","options":[{"key":"a","text":"12 a 64 años"},{"key":"b","text":"16 a 59 años"}],"correct":"b"},{"id":73,"text":"De acuerdo a la Ley de Instituciones de Seguros y de Fianzas, el seguro de Vida debe cubrir riesgos que:","options":[{"key":"a","text":"Amenacen el vigor vital"},{"key":"b","text":"Tengan que ver con la existencia"}],"correct":"b"},{"id":74,"text":"Nombre completo del asegurado y los beneficiarios, fechas de nacimiento o edad, causa y plazo de la prestación, valores garantizados son datos de pólizas de Vida:","options":[{"key":"a","text":"Con 10 años o más de vigencia"},{"key":"b","text":"Cualquier seguro de vida"}],"correct":"a"},{"id":75,"text":"De acuerdo a la cláusula de Indisputabilidad, la institución puede rescindir el contrato por:","options":[{"key":"a","text":"Dolo o mala fe"},{"key":"b","text":"Omisiones o inexactas declaraciones"}],"correct":"b","handwritten_note":"Junto a la opción a (Dolo o mala fe): 'se anula'"},{"id":76,"text":"¿Cómo se denomina la cláusula que representa una renuncia por parte de la aseguradora a rescindir el contrato por omisiones o inexactas declaraciones:","options":[{"key":"a","text":"Carencia de restricciones"},{"key":"b","text":"Indisputabilidad"}],"correct":"b"},{"id":77,"text":"Si la aseguradora las provocó, si la aseguradora conocía las omisiones, si la aseguradora renuncia por escrito a su derecho; son situaciones que impiden a la aseguradora:","options":[{"key":"a","text":"Rescindir el contrato"},{"key":"b","text":"Anular el contrato"}],"correct":"a"},{"id":78,"text":"Si un proponente cometió omisiones y fallece, ¿Qué plazo de vigencia se requiere para evitar la rescisión del contrato?","options":[{"key":"a","text":"2 años"},{"key":"b","text":"5 años"}],"correct":"a"},{"id":79,"text":"La cláusula de carencia de restricciones establece que el contrato no está sujeta a restricción alguna por causa de:","options":[{"key":"a","text":"Residencia, viajes y género o estilo de vida"},{"key":"b","text":"Edad, ocupación y residencia"}],"correct":"a"},{"id":80,"text":"Si un asegurado declaró una edad distinta a la que realmente tenía al contratar el seguro, ¿qué causa motiva que el contrato se rescinda?","options":[{"key":"a","text":"El asegurado dijo que tenía 25 años y tenía 42 años"},{"key":"b","text":"El asegurado declaró 68 y realmente tenía 72 años"}],"correct":"b","handwritten_note":"Al margen: 'No es asegurable - Edad maxima para contratar 70 añ[o]s'"},{"id":81,"text":"¿Qué cantidad se devuelve cuando el contrato se rescinde por error en la edad del asegurado, cuando la misma se encuentre fuera de los límites de admisión de la empresa?","options":[{"key":"a","text":"Las primas pagadas"},{"key":"b","text":"La reserva matemática"}],"correct":"b"},{"id":82,"text":"Si el asegurado declara una edad errónea y el error se descubre al fallecimiento, ¿qué procede?","options":[{"key":"a","text":"La prima se ajusta y se cobra retroactiva"},{"key":"b","text":"Se ajusta la suma asegurada"}],"correct":"b"},{"id":83,"text":"¿Qué procede cuando la muerte de un asegurado de vida, fue provocada intencionalmente por el beneficiario nombrado?","options":[{"key":"a","text":"Los herederos legales del asegurado cobran la suma"},{"key":"b","text":"El beneficiario cobra cuando salga de la cárcel"}],"correct":"a"},{"id":84,"text":"Si al momento del fallecimiento de un asegurado en la póliza de vida, no existen beneficiarios nombrados; ¿qué pasa con la suma asegurada?","options":[{"key":"a","text":"La cobran los padres del asegurado"},{"key":"b","text":"La cobran las personas que se designen en un juicio sucesorio"}],"correct":"b"},{"id":85,"text":"Si uno de los beneficiarios falle junto al asegurado, ¿qué pasa con su parte de la suma asegurada?","options":[{"key":"a","text":"Se distribuye entre sus herederos legales"},{"key":"b","text":"Se distribuye a partes iguales entre los demás beneficiarios"}],"correct":"b"},{"id":86,"text":"Si los beneficiarios son Cónyuge e Hijos y no se establece el porcentaje de participación, ¿cuánto cobran al fallecimiento del asegurado","options":[{"key":"a","text":"El cónyuge cobra todo"},{"key":"b","text":"50% para cónyuge y 50% para los descendientes"}],"correct":"b"},{"id":87,"text":"Cuando el asegurado renuncia a su derecho de cambiar los beneficiarios se considera:","options":[{"key":"a","text":"Irrevocable"},{"key":"b","text":"Preferente"}],"correct":"a"},{"id":88,"text":"Para que un seguro de vida sea inembargable, ¿qué característica debe tener?","options":[{"key":"a","text":"Todos los seguros de vida son inembargables"},{"key":"b","text":"Los beneficiarios deben ser irrevocables o cónyuge o descendientes"}],"correct":"b"},{"id":89,"text":"Si el asegurado se suicida, ¿Cuál es el tiempo minimo, según la ley sobre el contrato de Seguro, que debe estar vigente el Seguro de Vida para que los beneficiarios reciban la indemnización?","options":[{"key":"a","text":"2 años"},{"key":"b","text":"5 años"}],"correct":"a","handwritten_note":"Las opciones aparecen con marcadores tipo cuadro/viñeta en lugar de letras; el marcador de '2 años' está relleno"},{"id":90,"text":"Si un asegurado cambia de plan ¿qué obligación tiene?","options":[{"key":"a","text":"Ninguna porque no se permite hacerlo"},{"key":"b","text":"Paga la reserva matemática diferencial de manera retroactiva"}],"correct":"b","handwritten_note":"Las opciones aparecen con marcadores tipo cuadro/viñeta en lugar de letras; el marcador de la segunda opción está relleno"},{"id":91,"text":"En el Seguro de Menores, ¿Qué edad mínima debe tener el asegurado a su fallecimiento para que se le indemnice la suma asegurada?","options":[{"key":"a","text":"16 años"},{"key":"b","text":"12 años"}],"correct":"b","handwritten_note":"Las opciones aparecen con marcadores tipo cuadro/viñeta; la marca es poco distinguible en el escaneo"},{"id":92,"text":"Si un menor de 12 años asegurado fallece ¿Qué indemniza la compañía a sus beneficiarios?","options":[{"key":"a","text":"Las primas pagadas hasta la fecha del fallecimiento"},{"key":"b","text":"El 50% de la suma asegurada contratada"}],"correct":"a","handwritten_note":"Debajo de la pregunta, escrito a mano: 'se prohibe asegurar po[r] muerte a menores de 12 años'. Las opciones aparecen con marcadores tipo cuadro/viñeta; la marca es poco distinguible en el escaneo"},{"id":93,"text":"Cuando se asegura un menor de edad por muerte, se requiere:","options":[{"key":"a","text":"El consentimiento del tutor"},{"key":"b","text":"El consentimiento del menor y de su representante"}],"correct":"b","handwritten_note":"Las opciones aparecen con marcadores tipo cuadro/viñeta en lugar de letras; el marcador de la segunda opción está relleno"},{"id":94,"text":"Cuando se asegura la muerte de un tercero sin su consentimiento, ¿qué procede con el seguro?","options":[{"key":"a","text":"Se anula"},{"key":"b","text":"Se rescinde"}],"correct":"a","handwritten_note":"Las opciones aparecen con marcadores tipo cuadro/viñeta en lugar de letras; el marcador de 'Se anula' está relleno"},{"id":95,"text":"EL seguro donde se aseguran al titular, su cónyuge y a los hijos mayores de edad sin el consentimiento de los últimos, se denomina:","options":[{"key":"a","text":"Mancomunado"},{"key":"b","text":"Reciproco"}],"correct":"b"},{"id":96,"text":"Son 3 documentos necesarios del asegurado para tramitar la indemnización en el Seguro de Vida Individual:","options":[{"key":"a","text":"Póliza de seguro, Acta de nacimiento, Certificado médico forense"},{"key":"b","text":"Póliza de seguro, Acta de nacimiento, Acta de defunción"}],"correct":"b"},{"id":97,"text":"Identifique los 3 documentos de los beneficiarios necesarios para tramitar la indemnización en el Seguro de Vida:","options":[{"key":"a","text":"Credencial de elector, Acta de nacimiento, Acta de matrimonio"},{"key":"b","text":"Póliza de seguro, Acta de nacimiento, Acta de defunción"}],"correct":"a","handwritten_note":"Subrayado a mano: 'los beneficiarios'"},{"id":98,"text":"En caso de suicidio indemnizable, ¿qué documentos se deben presentar para que se pague la Suma Asegurada?","options":[{"key":"a","text":"Póliza, Acta de defunción, Participación del Ministerio Público, Acta de nacimiento"},{"key":"b","text":"Póliza, Acta de defunción, Acta resolutiva del Ministerio Público, dictamen del médico forense"}],"correct":"b"},{"id":99,"text":"En caso de fallecimiento del asegurado, cuando su beneficiario es menor de edad ¿Qué debe presentarse para que se pague la Suma Asegurada?","options":[{"key":"a","text":"Acta de defunción, Presentación física del tutor, Acta de nacimiento"},{"key":"b","text":"Acta de defunción, identificación oficial del tutor, Acta de nacimiento del menor"}],"correct":"b"},{"id":100,"text":"Es el documento necesario para reclamar la indemnización en el seguro de deudores","options":[{"key":"a","text":"Carta de la institución indicando el saldo insoluto"},{"key":"b","text":"Carta finiquito de reclamación"}],"correct":"a","handwritten_note":"La marca sobre la opción a es tenue en el escaneo"},{"id":101,"text":"El Lic. González adquirió un seguro de vida junto con otros socios de su despacho para proteger los intereses del mismo en caso de fallecimiento de alguno de ellos. ¿Qué documentación es necesaria para hacer efectivo el cobro de la suma asegurada si alguno de ellos falleciera y qué finalidad tendría la suma asegurada?","options":[{"key":"a","text":"Únicamente el acta constitutiva de la sociedad y la suma asegurada serviría para capitalizar a la sociedad por las posibles pérdidas derivadas de la falta de uno de sus socios"},{"key":"b","text":"Copia certificada del acta constitutiva de la sociedad y certificado de defunción, la suma asegurada serviría para liquidar la parte proporcional de la sociedad a los familiares del difunto"}],"correct":"b","handwritten_note":"Debajo de la pregunta, con flecha: 'Seguro para socios'"}]},{"id":"aye","label":"Accidentes y Enfermedades","theory":[{"title":"Operación de Accidentes y Enfermedades - Seguro de Accidentes Personales","content_md":"**Objetivo Legal:** Se ampara la lesión o incapacidad que afecte la integridad personal, salud o vigor vital del asegurado, como consecuencia de un evento externo, violento, súbito y fortuito.\n\n### Cobertura I: Muerte Accidental\n- **Objetivo:** Paga a los beneficiarios la suma contratada cuando la muerte sea al momento del accidente o en un plazo máximo de 90 días.\n- **Suma Asegurada:** La elige el asegurado, máximo 100 salarios mensuales. Se incrementa 10% en cada renovación, máximo 50%.\n- **Edad de Contratación:** Sin recargo 12 a 60 años. Con recargo: 61 a 65 años: Recargo 25%; 66 a 70 años: Recargo 50%; Más de 70 años: Recargo 75%.\n\n### Cobertura II: Pérdidas Orgánicas\nPaga al asegurado un porcentaje de la suma por muerte, cuando el asegurado sufra una pérdida orgánica, al momento del accidente o en un plazo máximo de 90 días, de acuerdo a la escala de indemnización que haya elegido.\n\n| Tipo de pérdida | Escala A | Escala B |\n|---|---|---|\n| Vista en los dos ojos, amputación de ambas manos o pies, un pie y una mano, un pie y un ojo, una mano y un ojo | 100% | 100% |\n| Una mano o un pie | 50% | 50% |\n| Un ojo | 30% | 30% |\n| Dedo pulgar de cualquier mano | 15% | 15% |\n| Dedo índice de cualquier mano | 10% | 10% |\n| Dedos anular, meñique o cordial | -o- | 5% c/u |\n| Sordera en ambos oídos | -o- | 25% |\n| Amputación parcial del pie incluyendo todos los dedos | -o- | 30% |\n| Acortamiento cuando menos 5 cm. de un miembro inferior | -o- | 15% |\n\n**Edad de Contratación:** 30 días de nacido hasta los 70 años. Con recargo: 61 a 65 años: Recargo 25%; 66 a 70 años: Recargo 50%; Más de 70 años: Recargo 75%.\n\n**Definiciones:**\n- Mano: Amputación desde la muñeca (articulación metacarpiana) o arriba de ella.\n- Pie: Amputación desde el tobillo o arriba de él.\n- Dedos: Amputación de 2 falanges cuando menos.\n- Anquilosis: pérdida de la función en articulaciones (sólo escala B).\n\n### Cobertura III: Indemnización Diaria Por Incapacidad\nIndemniza el sueldo diario que deja de percibir el asegurado cuando se incapacita por un accidente. La incapacidad se debe diagnosticar máximo en 10 días. La suma será: El salario diario demostrable.\n- **Incapacidad Total:** Existe cuando el asegurado deba estar hospitalizado o en reposo absoluto. Se indemniza el: 60% del salario diario. Hasta: por 1460 días (cuatro años).\n- **Incapacidad Parcial:** Existe cuando el asegurado no puede realizar sus actividades diarias pero si otras funciones. Se indemniza el: 40% del salario diario. Hasta: por 182 días.\n- **Edad de Contratación:** Sin recargo 16 a 60 años. Con recargo hasta los 65 años.\n\n### Cobertura IV: Reembolso de Gastos Médicos por Accidente\nReembolsa al asegurado los gastos que erogue para recuperar su salud cuando sufra lesiones causadas por un accidente. Período máximo de indemnización 365 días.\n- **Suma Asegurada:** Se determina en un porcentaje de la suma por muerte (entre un 10% y un 50%).\n- **Límites Específicos:** Tratamientos maxilo-faciales: 15% de la suma para gastos médicos. Gastos de ambulancia: 5% de la suma para gastos médicos.\n- **Edad de Contratación:** 30 días de nacido hasta los 65 años de edad.\n\n### Otros conceptos\n- **Por Convenio Expreso:** Deportes peligrosos: Motociclismo, automovilismo, alpinismo, rapel, box, lucha, en taxis aéreos, como piloto o tripulante de avión.\n- **Exclusiones:** Suicidio, servicio militar, guerra, riña, delitos, drogadicción o embriaguez, hernias, abortos, envenenamiento no accidental, homicidio intencional, enfermedades.\n- **Cotización:** Se basa en la actividad laboral o deportiva. La tarifa agrupa las actividades en riesgos de la A a la J.\n- **Riesgos subnormales:** Diabetes, leucemia, hipertensión, hipotensión, epilepsia, gibosis, gota, glaucoma, obesidad.\n- **Riesgo Catástrofe:** Es la acumulación de riesgo creada cuando 12 o más asegurados en esta póliza viajan al mismo tiempo en un mismo transporte.\n\n*Notas manuscritas en la página: \"2 ✓\" en la parte superior; \"Pregunta 10\" y \"Aprender\" al margen izquierdo, junto a la sección de Pérdidas Orgánicas.*"},{"title":"Operación de Accidentes y Enfermedades - Seguro de Gastos Médicos","content_md":"**Objetivo Legal:** Cubre los gastos médicos, hospitalarios y demás que sean necesarios para la recuperación de la salud o vigor vital del asegurado, cuando se hayan afectado por causa de un accidente o enfermedad.\n\n### Riesgos Cubiertos\n- **Enfermedad:** Toda alteración de la salud que resulte de la acción de agentes morbosos de origen interno o externo con relación al organismo, que amerite tratamiento médico o quirúrgico.\n- **Accidente:** Es aquel acontecimiento, proveniente de una causa externa, súbita y violenta que produce lesiones corporales en la persona del asegurado.\n\n### Suma Asegurada\n- Se aplica para cada enfermedad o accidente.\n- Para el mismo padecimiento no existe reinstalación.\n\n### Asegurados\n- Titular o contratante\n- Cónyuge\n- Hijos hasta los 21 años\n- Hijos hasta los 24 años si estudian y no trabajan\n\n### Gastos Amparados\n| Honorarios | Hospital | Terapias | Equipo médico | Otros |\n|---|---|---|---|---|\n| Médicos o Cirujanos | Habitación Standard | Fisioterapias | Oxígeno | Medicinas |\n| Enfermeras | Quirófano | Hidroterapias | Cardiógrafos | Material de limpieza |\n| Anestesiólogos | Terapia Intensiva | Quimioterapias | Encefalógrafos | Material médico |\n| Ayudantes de cirugía | Cama Adicional | Otras aceptadas por la ciencia médica | Vaporizadores, Etc. | Prótesis y ortopedia; Transfusiones |\n\n### Período de espera\n(Tiempo de vigencia que debe transcurrir para que se cubran algunos padecimientos; los padecimientos diagnosticados durante este período no se pagan)\n- **30 días:** Para enfermedades en general.\n- **10 Meses (complicaciones del embarazo):** Eclampsia, Toxicosis gravídica, Embarazo extrauterino, Embarazo molar, Fiebre Puerperal, Cesárea Necesaria.\n- **1 año para:** Quistes en ovarios o mamas, Amigdalitis, Adenoiditis.\n- **2 años para:** Lesiones de columna, Lordosis, Várices, hemorroides, Cirugía de nariz, boca o cara por accidente, Hernias, Litotricias.\n- **5 años para:** SIDA.\n\n### Reconocimiento de Antigüedad\n- La aseguradora reconoce la vigencia ininterrumpida con otras instituciones.\n- El diagnóstico de enfermedades debe darse durante la vigencia.\n- No se aseguran preexistencias.\n\n### Participación del Asegurado\n**Deducible:**\n- Primeros gastos médicos que quedan a cargo del asegurado en una reclamación.\n- Se aplica por cada padecimiento o accidente.\n- En gastos complementarios ya no se aplica.\n- Se expresa en pesos o equivalente de salario mensual.\n- No aplica por accidente ni por cirugía programada.\n\n**Coaseguro:**\n- Participación del asegurado en los gastos erogados.\n- Se aplica al excedente del deducible.\n- Se aplica cada vez que hay erogación.\n- Se expresa en porcentaje sobre el valor del gasto erogado.\n\n**Gasto Usual y Acostumbrado (GUA):**\n- Se agrega un tabulador de honorarios quirúrgicos.\n- Si el cirujano cobra una cantidad mayor, el asegurado paga el excedente.\n- El seguro puede elegirse sin tabulador."},{"title":"Seguro de Gastos Médicos - Coberturas Adicionales, Exclusiones Definitivas y Siniestros","content_md":"### Coberturas Adicionales\n**Emergencia en el Extranjero:** Cubre los gastos médicos en que incurra el asegurado cuando se encuentre en otro país y tenga una urgencia médica, entendiendo por urgencia médica: Toda alteración órgano-funcional súbita, que pone en peligro la vida del enfermo o lesionado, su integridad corporal, o la viabilidad de alguno de sus órganos, por lo que en ese momento la persona requiere de atención médica o quirúrgica inmediata.\n\n**Cobertura en el Extranjero:** Se pagan los gastos médicos que el asegurado decida realizar en el extranjero para restaurar su salud de una enfermedad o accidentes cubiertos, sin importar en donde se haya hecho el diagnóstico.\n\n### Exclusiones Definitivas\n**Actividades:**\n- Servicio militar, actos de guerra\n- Actos delictivos en que participe directamente el asegurado\n- Riñas, únicamente si el asegurado ha sido el provocador\n- Aviación privada en calidad de tripulante, pasajero o mecánico\n- Pruebas o contiendas de velocidad, resistencia o seguridad de vehículos\n- La práctica profesional de cualquier deporte\n- Práctica de box, lucha libre o grecorromana, karate, paracaidismo, charrería, tauromaquia y cualquier tipo de deporte aéreo\n\n**Gastos:**\n- Padecimientos preexistentes: Los síntomas y/o signos se hayan manifestado con anterioridad. Fueron diagnosticados con anterioridad. Los síntomas y/o signos fuesen aparentes a la vista o no pudiesen pasar desapercibidos. Por los que hubo gastos.\n- Tratamientos psiquiátricos o psicológicos\n- Circuncisiones, cualquiera que sea su causa\n- Enfermedades congénitas, excepto que el asegurado nazca durante la vigencia después de 10 meses de vigencia\n- Afecciones propias del embarazo, abortos, legrados\n- Curas de reposo o descanso, exámenes médicos tipo CHEK-UP\n- Tratamientos preventivos o en experimentación\n- Hallux Valgus o \"Juanetes\"\n- Cirugía plástica o estética, excepto por accidente\n- Tratamiento de alcoholismo o toxicomanía\n- Suicidio o intento del mismo\n- Adquisición de aparatos auditivos, lentes intraoculares de contacto y anteojos\n- Astigmatismo, presbiopia, hipermetropía, miopía y estrabismo, queratotomía radiada\n- Calvicie, obesidad, esterilidad, bajo peso y cualquiera de naturaleza análoga\n- Intervenciones quirúrgicas o tratamientos para control de la natalidad\n- Honorarios de quiroprácticos, acupunturistas y naturistas, que no cuenten con cédula profesional\n- Gastos realizados por acompañantes del asegurado, excepto cama extra\n\n### Siniestros\n(Período máximo de indemnización 730 días, inicia desde el primer gasto cubierto)\n\n**Aviso:** En un plazo de 5 días hábiles.\n\n**Reembolso:**\n- El asegurado paga todos los gastos necesarios para su tratamiento.\n- Recaba los comprobantes que cumplan con las normas Fiscales.\n- Entrega a la institución de seguros los documentos requeridos.\n- La aseguradora analiza los gastos cubiertos, aplica el deducible y coaseguro y emite reembolso en un plazo máximo de 30 días.\n\n**Pago Directo:**\n- La aseguradora forma una RED de médicos y hospitales.\n- El asegurado acude a la RED.\n- Debe estar hospitalizado cuando menos 24 horas.\n- La aseguradora paga al hospital y los médicos directamente.\n- El asegurado paga el deducible y el coaseguro.\n\n**Documentos que se requieren para el ajuste de siniestro:**\n1. Formato de \"Aviso de Accidente y/o Enfermedad\"\n2. Formato de \"Informe Médico\"\n3. Facturas a reembolsar\n4. Estudios de laboratorio y gabinete que se hayan realizado.\n5. En todos aquellos casos de cirugía, en los cuales se haya realizado biopsia, resección parcial o total de un órgano o tejido; será necesario el reporte de histopatología."},{"title":"Operación de Accidentes y Enfermedades - Seguro de Salud","content_md":"**Objetivo Legal:** Se cubre la prestación de servicios dirigidos a prevenir o restaurar la salud, a través de acciones que se realicen en beneficio del asegurado.\n\n### Autoridades\n- **SHCP:** Autoriza la constitución, operación y funcionamiento de las ISES.\n- **CNSF:** Supervisa y regula la función de aseguradoras que tienen las ISES.\n- **CONDUSEF:** Recibe quejas por reembolsos incorrectos o por rechazos de siniestros.\n- **Secretaría de Salud:** Emite un dictamen técnico sobre la calidad de los servicios de una ISES antes de que sean autorizadas. Supervisa y regula la calidad de servicios ofrecidos por las ISES.\n- **CONAMED:** Asesora e informa a los usuarios de servicios médicos. Recibe quejas de los pacientes o familiares sobre la mala calidad en el servicio médico u hospitalario. Realiza actividades de conciliación y arbitraje en quejas sobre la calidad médica u hospitalaria.\n\n### ISES\n- Instituciones de Seguros Especializadas en Salud.\n- Crean una red de servicios médicos con recursos propio, de terceros o combinados.\n- Cualquier cambio en la red la deben informar a los asegurados en un plazo máximo de 15 días hábiles.\n- Son aseguradoras especializadas.\n- Pueden ser autorizadas para vender adicionalmente, el Ramote Gastos Médicos [sic; probablemente \"el Ramo de Gastos Médicos\"].\n\n### Riesgos Asegurables\n- **Riesgos ciertos - Medicina Preventiva:** Conjunto de acciones para fomentar la salud con objeto de promover medidas de vida sana, disminuir o eliminar riesgos y para la detección temprana de enfermedades.\n- **Riesgos Inciertos - Medicina restaurativa:** Conjunto de acciones dirigidas a la recuperación de la salud del asegurado. Aplicación de medicamentos, terapias, etc.\n\n### Participación del Asegurado - Copago\nCualquier cantidad que queda a cargo del asegurado por los servicios médicos que reciba. Puede ser en Cantidad fija o porcentaje.\n\n### Coberturas\n**Básica:** Plan de servicios Básicos establecido por la Secretaría de Salud.\n\n**Medicina de Primer Nivel:** La función principal es el mantenimiento de la salud y la prevención de enfermedades a través de la detección temprana de los signos o síntomas que presentan los individuos.\n- Pediatría (0 a 18 años de edad)\n- Gineco-obstetricia (desde los 14 años de edad)\n- Medicina interna\n- Cirugía general\n\n**Beneficios adicionales:**\n- Hospitalización, Servicio de ambulancia, Cuidados en casa, Suministro de oxígeno, Medicamentos\n- Consulta con especialistas de segundo nivel: cardiólogo, neurólogo, oncólogo, ortopedista, etc.\n- Apoyos de diagnóstico especializados por ejemplo: tomografía axial, resonancia magnética, radioterapia, medicina nuclear\n- Fisioterapia\n- Suministro de aparatos de prótesis y ortopedia\n- Cirugía especializada por ejemplo: cardio-vascular, angiológica\n- Servicio dental preventivo y curativo\n- Hematología, inmunología\n\n### Sistemas de Indemnización\n(Período máximo de indemnización: 730 días)\n- **Pago Directo:** El asegurado debe estar hospitalizado cuando menos 24 horas y debe utilizar médicos y Hospitales de RED.\n- **Reembolso:** Falta de disponibilidad del servicio; Error del diagnóstico; Saturación; Atención de urgencia fuera de RED.\n\n### Exclusiones Definitivas\n- Complicaciones del embarazo antes de 10 meses de vigencia\n- Prematurez, malformaciones y padecimientos congénitos de los asegurados nacidos fuera de la vigencia, o cuando la madre no haya cumplido 10 meses de vigencia\n- Tratamientos de esterilidad o fertilidad\n- Estéticos, de calvicie, dietéticos y de obesidad\n- Gastos por mantenimiento, pérdida, destrucción de los aparatos de prótesis y ortopedia\n- Tratamientos psicológicos o psiquiátricos\n- Curas de Reposo o chec-up\n- Suicidio o su intento\n- Legrado\n- Lentes o anteojos"}],"questions":[{"id":1,"text":"Su objetivo es cubrir riesgos que tengan como base la lesión o incapacidad que afecte la integridad personal, salud o vigor vital del asegurado, a causa de eventos externos, violentos, súbitos y fortuitos;","options":[{"key":"a","text":"Seguro de Accidentes personales"},{"key":"b","text":"Seguro de Gastos Médicos"}],"correct":"a"},{"id":2,"text":"Identifica las coberturas que se pueden contratar en el seguro de Accidentes personales: 1. Muerte Accidental 2. Pérdidas Orgánicas 3. Pago adicional por invalidez 4. Indemnización diaria por incapacidad 5. Reembolso de gastos médicos 6. Muerte por accidente colectivo","options":[{"key":"a","text":"1, 2, 4, 5"},{"key":"b","text":"1, 2, 4, 6"}],"correct":"a","list":{"stem":"Identifica las coberturas que se pueden contratar en el seguro de Accidentes personales:","kind":"num","items":[{"k":"1","text":"Muerte Accidental"},{"k":"2","text":"Pérdidas Orgánicas"},{"k":"3","text":"Pago adicional por invalidez"},{"k":"4","text":"Indemnización diaria por incapacidad"},{"k":"5","text":"Reembolso de gastos médicos"},{"k":"6","text":"Muerte por accidente colectivo"}]},"handwritten_note":"Palomitas (✓) manuscritas junto a los conceptos 1, 2, 4 y 5 de la lista"},{"id":3,"text":"Lesión corporal o la muerte, involuntaria, causada por hechos externos, violentos, súbitos e imprevistos. Es la definición de:","options":[{"key":"a","text":"Enfermedad"},{"key":"b","text":"Accidente"}],"correct":"b"},{"id":4,"text":"Por fortuito se entiende:","options":[{"key":"a","text":"Un suceso cuya ocurrencia es intencional y provocada."},{"key":"b","text":"Un suceso cuya ocurrencia es casual e involuntaria"}],"correct":"b","handwritten_note":"En el impreso la segunda opción aparece etiquetada como 'c)'; es la opción circulada"},{"id":5,"text":"La cobertura básica del seguro de Accidentes Personales es:","options":[{"key":"a","text":"Muerte accidental y pérdidas orgánicas"},{"key":"b","text":"Muerte accidental"}],"correct":"b"},{"id":6,"text":"¿Qué cobertura se renueva con la actualización de la suma asegurada en un 10% anual con máximo del 50%?","options":[{"key":"a","text":"Muerte Accidental"},{"key":"b","text":"Reembolso de Gastos Médicos"}],"correct":"a"},{"id":7,"text":"Los beneficiaros cobran la suma contratada si la muerte ocurre durante el accidente o en un plazo máximo de:","options":[{"key":"a","text":"60 días"},{"key":"b","text":"90 días"}],"correct":"b"},{"id":8,"text":"¿Cómo opera el seguro de Accidentes Personales si la muerte ocurre en un accidente de aviones particulares y el asegurado es tripulante o piloto?","options":[{"key":"a","text":"Se paga por convenio expreso"},{"key":"b","text":"Se excluye siempre"}],"correct":"a"},{"id":9,"text":"Las edades para contratar la cobertura de Muerte Accidental son:","options":[{"key":"a","text":"Mínima 30 días, máximo 70 años"},{"key":"b","text":"Mínimo 12, máximo 70 años"}],"correct":"b"},{"id":10,"text":"¿Cuál es la diferencia entre las dos tablas de indemnizaciones de pérdidas orgánicas?","options":[{"key":"a","text":"Una paga más indemnización por la misma pérdida que la otra."},{"key":"b","text":"Una paga sólo separación, y la otra anquilosis y otras pérdidas."}],"correct":"b"},{"id":11,"text":"Los siguientes son órganos que se indemnizan en Pérdidas Orgánicas, EXCEPTO:","options":[{"key":"a","text":"Manos, pies, ojos, dedos"},{"key":"b","text":"Riñones, maxilar, lengua"}],"correct":"b"},{"id":12,"text":"Relaciona ambas columnas: 1. Ceguera en ambos ojos, amputación de dos pies o dos manos 2. Amputación de un pie o una mano 3. Ceguera en un solo ojo 4. Amputación del dedo pulgar 5. Amputación del dedo índice | a) 10% b) 30% c) 100% d) 50% e) 15%","options":[{"key":"a","text":"1 c, 2d, 3 e, 4 b, 5 a"},{"key":"b","text":"1 c, 2d, 3 b, 4 e, 5 a"}],"correct":"b","match":{"stem":"Relaciona ambas columnas:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Ceguera en ambos ojos, amputación de dos pies o dos manos"},{"k":"2","text":"Amputación de un pie o una mano"},{"k":"3","text":"Ceguera en un solo ojo"},{"k":"4","text":"Amputación del dedo pulgar"},{"k":"5","text":"Amputación del dedo índice"}]},{"label":"","kind":"let","items":[{"k":"a","text":"10%"},{"k":"b","text":"30%"},{"k":"c","text":"100%"},{"k":"d","text":"50%"},{"k":"e","text":"15%"}]}]}},{"id":13,"text":"Por la pérdida de manos, pies o la vista de ambos ojos se paga:","options":[{"key":"a","text":"100% por cada pérdida, aunque el total supere la suma asegurada"},{"key":"b","text":"Hasta el 100% de la suma contratada si las pérdidas son múltiples"}],"correct":"b"},{"id":14,"text":"Pérdida parcial del pie incluyendo todos los dedos, acortamiento 5 cm o más de un miembro inferior, sordera en ambos oídos; los dedos meñique, anular o medio, se indemnizan si se contrató:","options":[{"key":"a","text":"Escala A"},{"key":"b","text":"Escala B"}],"correct":"b"},{"id":15,"text":"Por anquilosis se entiende:","options":[{"key":"a","text":"El procedimiento quirúrgico de amputación de un miembro."},{"key":"b","text":"La pérdida del movimiento de articulaciones"}],"correct":"b"},{"id":16,"text":"Relaciona ambas columnas: 1. Sordera en ambos oídos 2. Acortamiento cuando menos 5 cm del miembro inferior 3. Amputación parcial del pie, incluyendo todos los dedos | a) 30% b) 25% c) 15%","options":[{"key":"a","text":"1 b, 2 c, 3 a"},{"key":"b","text":"1 b, 2 a, 3 c"}],"correct":"a","match":{"stem":"Relaciona ambas columnas:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Sordera en ambos oídos"},{"k":"2","text":"Acortamiento cuando menos 5 cm del miembro inferior"},{"k":"3","text":"Amputación parcial del pie, incluyendo todos los dedos"}]},{"label":"","kind":"let","items":[{"k":"a","text":"30%"},{"k":"b","text":"25%"},{"k":"c","text":"15%"}]}]}},{"id":17,"text":"Separación o anquilosamiento a nivel de la articulación carpo-metacarpiana o arriba de ella.","options":[{"key":"a","text":"Pérdida de la mano"},{"key":"b","text":"Pérdida del pie"}],"correct":"a","handwritten_note":"\"Muñeca\" escrito a mano bajo 'carpo-metacarpiana'"},{"id":18,"text":"Amputación desde la articulación tibio-tarsiana o arriba de ella","options":[{"key":"a","text":"Pérdida de la mano"},{"key":"b","text":"Pérdida del pie"}],"correct":"b","handwritten_note":"\"Tovillo\" [sic, tobillo] escrito a mano bajo 'tarsiana'"},{"id":19,"text":"Las pérdidas orgánicas se cubren si suceden a consecuencia de un accidente dentro de un plazo máximo de:","options":[{"key":"a","text":"90 días después del accidente"},{"key":"b","text":"60 días después del accidente"}],"correct":"a"},{"id":20,"text":"Las edades para contratar la cobertura de Pérdidas Orgánicas son:","options":[{"key":"a","text":"Mínima 30 días, máximo 70 años"},{"key":"b","text":"Mínimo 12 años, máximo 70 años"}],"correct":"a"},{"id":21,"text":"Si como consecuencia de un accidente, el asegurado no puede desarrollar ningún trabajo; en la cobertura de indemnización diaria, se califica como:","options":[{"key":"a","text":"Incapacidad Total"},{"key":"b","text":"Incapacidad permanente"}],"correct":"a"},{"id":22,"text":"La indemnización diaria por incapacidad total es:","options":[{"key":"a","text":"40% del salario diario, 182 días"},{"key":"b","text":"60% del salario diario 1460 días"}],"correct":"b","handwritten_note":"Marcas manuscritas al margen izquierdo (asterisco/puntos y una llave que agrupa las primeras preguntas de la página)"},{"id":23,"text":"La indemnización diaria por incapacidad parcial es:","options":[{"key":"a","text":"40% del salario diario, máximo 182 días"},{"key":"b","text":"60% del salario diario, máximo 1460 días"}],"correct":"a"},{"id":24,"text":"Las edades para contratar la cobertura de Indemnización diaria son:","options":[{"key":"a","text":"Mínima 30 días, máximo 64 años"},{"key":"b","text":"Mínimo 16 años, máximo 59 años"}],"correct":"b"},{"id":25,"text":"Asistir al médico en un plazo máximo de 10 días naturales, es una condición que debe cumplirse para:","options":[{"key":"a","text":"Que se pague Indemnización diaria"},{"key":"b","text":"Se inicie el ajuste del siniestro"}],"correct":"a"},{"id":26,"text":"La cobertura de reembolso de gastos médicos en el seguro de Accidentes Personales, opera:","options":[{"key":"a","text":"Como pago directo"},{"key":"b","text":"Sólo como reembolso"}],"correct":"b"},{"id":27,"text":"¿En qué cobertura se indemniza al 15 % por la reconstrucción del maxilar y el, 5% para ambulancia?","options":[{"key":"a","text":"Pérdidas Orgánicas"},{"key":"b","text":"Reembolso de Gastos Médicos"}],"correct":"b"},{"id":28,"text":"El período máximo de indemnización de Reembolso de Gastos Médicos es:","options":[{"key":"c","text":"365 días"},{"key":"d","text":"1460 días"}],"correct":"c","handwritten_note":"En el impreso las opciones aparecen etiquetadas como 'c)' y 'd)'"},{"id":29,"text":"¿Qué ocurre con los gastos que el asegurado eroga después de los 365 días de tratamiento de una lesión?","options":[{"key":"a","text":"Se pagan mientras exista suma asegurada"},{"key":"b","text":"Ya no se reembolsan"}],"correct":"b","handwritten_note":"Palabra manuscrita junto a 'eroga': \"Guía\" [poco legible]"},{"id":30,"text":"Las edades para contratar la cobertura de Reembolso de Gastos Médicos por accidentes, son:","options":[{"key":"a","text":"Mínima 30 días, máximo 64 años"},{"key":"b","text":"Mínimo 16 años, máximo 59 años"}],"correct":"a"},{"id":31,"text":"Es una condición para que se indemnicen las cobertura de \"Reembolso de Gastos Médicos:","options":[{"key":"a","text":"Asistir al médico en un plazo de 5 días"},{"key":"b","text":"Asistir al médico en un plazo de 10 días"}],"correct":"b"},{"id":32,"text":"Un asegurado sufre un accidente bajo el influjo de estimulantes prescritos por un médico, ¿Cómo procede la compañía aseguradora?","options":[{"key":"a","text":"Es una causal de rechazo"},{"key":"b","text":"Paga el total de los gastos que procedan"}],"correct":"b"},{"id":33,"text":"¿Cómo se consideran en el seguro de Accidentes Personales, las lesiones o la muerte por participar en riñas, durante servicio militar, por abortar, por suicidio o mutilación voluntaria, reposición de prótesis?","options":[{"key":"a","text":"Básicas"},{"key":"b","text":"Exclusiones"}],"correct":"b"},{"id":34,"text":"En seguro de accidentes personales, los siguientes son elementos que se toman en cuenta para calcular la prima adecuada:","options":[{"key":"a","text":"Ocupación laboral o deportiva"},{"key":"b","text":"Edad y sexo"}],"correct":"a"},{"id":35,"text":"¿Qué puede motivar que la prima del seguro de accidentes personales se modifique durante la vigencia de la póliza?","options":[{"key":"a","text":"Cambio del estado civil del asegurado"},{"key":"b","text":"Cambio en la actividad laboral o deportiva del asegurado"}],"correct":"b"},{"id":36,"text":"Los siguientes son elementos que influyen en la prima del seguro de Accidentes Personales, EXCEPTO:","options":[{"key":"a","text":"Edad, ocupación"},{"key":"b","text":"Sexo Estado Civil"}],"correct":"b"},{"id":37,"text":"¿Cómo se consideran para el seguro de accidentes personales el glaucoma, la cifosis, la epilepsia, hipertensión o hipotensión, diabetes, leucemia o neurastenia?","options":[{"key":"a","text":"Riesgos normales"},{"key":"b","text":"Riesgos subnormales"}],"correct":"b"},{"id":38,"text":"Relaciona ambas columnas determinando los recargos para cada edad: 1. De 60 a 65 años 2. De 66 a 70 años 3. Más de 70 años | a) 75% b) 50% c) 25%","options":[{"key":"a","text":"1 c, 2 b, 3 a"},{"key":"b","text":"1, b, 2 c, 3 a"}],"correct":"a","match":{"stem":"Relaciona ambas columnas determinando los recargos para cada edad:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"De 60 a 65 años"},{"k":"2","text":"De 66 a 70 años"},{"k":"3","text":"Más de 70 años"}]},{"label":"","kind":"let","items":[{"k":"a","text":"75%"},{"k":"b","text":"50%"},{"k":"c","text":"25%"}]}]},"handwritten_note":"Líneas manuscritas que conectan las edades con los porcentajes (1→c, 2→b, 3→a)"},{"id":39,"text":"De la siguiente lista identifica los conceptos excluidos del seguro de Accidentes Personales pero que pueden asegurarse por convenio expreso: 1. Actos delictivos del asegurado 2. Práctica de deportes extremos 3. Estado de embriaguez o drogadicción 4. Reposición de prótesis 5. Piloto o tripulantes de aviones particulares o comerciales 6. Motociclismo, automovilismo 7. Abortos accidentales","options":[{"key":"a","text":"2, 5, 6"},{"key":"b","text":"2, 5, 7"}],"correct":"a","list":{"stem":"De la siguiente lista identifica los conceptos excluidos del seguro de Accidentes Personales pero que pueden asegurarse por convenio expreso:","kind":"num","items":[{"k":"1","text":"Actos delictivos del asegurado"},{"k":"2","text":"Práctica de deportes extremos"},{"k":"3","text":"Estado de embriaguez o drogadicción"},{"k":"4","text":"Reposición de prótesis"},{"k":"5","text":"Piloto o tripulantes de aviones particulares o comerciales"},{"k":"6","text":"Motociclismo, automovilismo"},{"k":"7","text":"Abortos accidentales"}]},"handwritten_note":"Palomitas (✓) manuscritas junto a los conceptos 2, 5 y 6"},{"id":40,"text":"¿Cómo se cubren las lesiones que sufra el asegurado a consecuencia de paracaidismo, buceo, alpinismo?","options":[{"key":"a","text":"Básicamente"},{"key":"b","text":"Por convenio expreso"}],"correct":"b"},{"id":41,"text":"Cubren los gastos médicos que sean necesarios para la recuperación de la salud o vigor vital del asegurado por causa de un accidente o enfermedad; son el objetivo del seguro de:","options":[{"key":"a","text":"Accidentes Personales"},{"key":"b","text":"Gastos Médicos"}],"correct":"b","handwritten_note":"Nota manuscrita en la parte superior de la página: \"Agentes morvosos [sic] — Ejemplo: COVID\""},{"id":42,"text":"Las siguientes personas se consideran dependientes económicas del titular","options":[{"key":"a","text":"Su cónyuge o concubina, sus hijos y sus padres"},{"key":"b","text":"Su cónyuge o concubina y sus hijos desde que nacen hasta los 25 años si estudian"}],"correct":"b"},{"id":43,"text":"Los límites de edad en Gastos Médicos se revisan en la siguiente situación, EXCEPTO:","options":[{"key":"a","text":"Cuando se da de alta a un recién nacido."},{"key":"b","text":"Cuando se desea que un hijo adulto continué en la póliza familiar"}],"correct":"a"},{"id":44,"text":"Habitación standard, alimentos del paciente, honorarios de médicos y enfermeras, quirófano, prótesis, aparatos ortopédicos, cama adicional para acompañante; se consideran:","options":[{"key":"a","text":"Gastos Básicos"},{"key":"b","text":"Gastos excluidos"}],"correct":"a"},{"id":45,"text":"Equipo tipo hospital, terapia intensiva, enfermera a domicilio, ¿Cómo se consideran?","options":[{"key":"a","text":"Gastos Básicos"},{"key":"b","text":"Gastos Excluidos"}],"correct":"a"},{"id":46,"text":"Tratamiento de obesidad por razones orgánicas, tratamiento reconstructivo como resultado de un accidente; ¿cómo se consideran en la póliza de Gastos Médicos?","options":[{"key":"a","text":"Básicos"},{"key":"b","text":"Excluidos"}],"correct":"a"},{"id":47,"text":"Durante una cirugía, los gastos que tienen tope aún sin tabla son:","options":[{"key":"a","text":"Honorarios del anestesiólogo (30%) y honorarios de los asistentes (15%)"},{"key":"b","text":"Honorarios de asistentes y renta de quirófano"}],"correct":"a"},{"id":48,"text":"Las siguientes enfermedades se cubren desde el inicio de vigencia:","options":[{"key":"a","text":"Pulmonía, cisticercosis, apendicitis"},{"key":"b","text":"Circuncisión, parto natural, cobertura del recién nacido"}],"correct":"a"},{"id":49,"text":"La siguiente se considera cobertura adicional, EXCEPTO:","options":[{"key":"a","text":"Renta de aparatos ortopédicos"},{"key":"b","text":"Emergencia en el extranjero"}],"correct":"a","handwritten_note":"\"son basicos\" escrito a mano junto a la opción a"},{"id":50,"text":"Alteraciones estructurales o funcionales por causas anormales internas o externas, que amerite tratamiento médico o quirúrgico","options":[{"key":"a","text":"Enfermedad cubierta"},{"key":"b","text":"Enfermedad congénita"}],"correct":"a","handwritten_note":"\"Agentes morvosos\" [sic] escrito a mano bajo la palabra 'externas' (subrayada)"},{"id":51,"text":"La siguiente son elementos de la definición de Enfermedad Preexistente, EXCEPTO:","options":[{"key":"a","text":"Padecimientos diagnosticados por un médico, los síntomas no pueden pasar desapercibidos"},{"key":"b","text":"El padecimiento es asintomático"}],"correct":"b"},{"id":52,"text":"Padecimientos que se generan durante la gestación o al momento de nacer:","options":[{"key":"a","text":"Enfermedades Hereditarias"},{"key":"b","text":"Enfermedades congénitas"}],"correct":"b"},{"id":53,"text":"El tratamiento derivado de un padecimiento congénito detectado dentro de la vigencia de la póliza y no estaba asegurada desde el nacimiento, esta:","options":[{"key":"a","text":"Cubierto básicamente"},{"key":"b","text":"Excluido"}],"correct":"b"},{"id":54,"text":"El tratamiento derivado de un padecimiento congénito detectado dentro de la vigencia de la póliza y estaba asegurada desde el nacimiento, se considera:","options":[{"key":"a","text":"Cubierto con período de espera"},{"key":"b","text":"Excluido"}],"correct":"a"},{"id":55,"text":"Inicia el día que termina el plazo para pagar la prima y termina cuando el seguro se rehabilita por l pago de prima:","options":[{"key":"a","text":"Período de gracia"},{"key":"b","text":"Período al descubierto"}],"correct":"b","handwritten_note":"Junto a 'Período de gracia': \"Plazo p[ar]a paga[r]\" (manuscrito, cortado al margen derecho)"},{"id":56,"text":"¿Cómo proceden los accidentes y enfermedades ocurridos y diagnosticados durante el período al descubierto?","options":[{"key":"a","text":"Se cubren por convenio expreso"},{"key":"b","text":"Se excluyen"}],"correct":"b"},{"id":57,"text":"Plazo de vigencia que debe transcurrir para que algunas enfermedades se cubran:","options":[{"key":"a","text":"Periodo de cobertura"},{"key":"b","text":"Periodo de espera"}],"correct":"b"},{"id":58,"text":"Eclampsia, toxicosis gravidica, embarazo molar, embarazo extrauterino, fiebre puerperal, cobertura para el recién nacido, son padecimiento que se cubren con un período de espera de:","options":[{"key":"a","text":"10 meses"},{"key":"b","text":"Un año"}],"correct":"a"},{"id":59,"text":"Amigdalitis, adenoiditis, lesiones de columna, lordosis, várices, hemorroides, cirugía de nariz, boca o cara, hernias, litotricias; son padecimientos que se cubren:","options":[{"key":"a","text":"Desde el principio de vigencia"},{"key":"b","text":"Con periodo de espera"}],"correct":"b"},{"id":60,"text":"Las siguientes son características del reconocimiento de antigüedad en la póliza de Gastos Médicos, EXCEPTO:","options":[{"key":"a","text":"Permite cubrir en forma abierta los padecimientos preexistentes"},{"key":"b","text":"El tiempo transcurrido para los padecimientos con período de espera se respeta en el nuevo plan"}],"correct":"a"},{"id":61,"text":"Los gastos derivados de ambulancia aérea, emergencia en el extranjero, cobertura en el extranjero para el seguro de Gastos Médicos, se consideran:","options":[{"key":"a","text":"Gastos básicos"},{"key":"b","text":"Gastos que pueden asegurarse por convenio expreso"}],"correct":"b"},{"id":62,"text":"Reposición o mantenimiento de prótesis, lentes, presbicia, miopia, astigmatismo, estrabismo, parto natural, padecimientos preexistentes, Embriaguez o drogadicción, se consideran:","options":[{"key":"a","text":"Convenio expreso"},{"key":"b","text":"Exclusiones"}],"correct":"b"},{"id":63,"text":"Medicamento en experimentación, atención con personas sin cédula profesional, cirugía estética, tratamiento psicológicos o psiquiátricos, deportes peligrosos, se consideran:","options":[{"key":"a","text":"Convenio expreso"},{"key":"b","text":"Exclusiones"}],"correct":"b"},{"id":64,"text":"Primeros gastos de atención médica que paga el asegurado, se aplica sólo una vez por cada padecimiento y se utiliza para evitar reclamaciones pequeñas; son características de:","options":[{"key":"a","text":"Deducible"},{"key":"b","text":"Coaseguro"}],"correct":"a"},{"id":65,"text":"Mecanismo adicional al deducible que obliga al asegurado a participar en la reclamación:","options":[{"key":"a","text":"Franquicia"},{"key":"b","text":"Coaseguro"}],"correct":"b"},{"id":66,"text":"En el caso de gastos complementarios de alguna enfermedad cubierta, ¿Qué ocurre con el deducible y el coaseguro?","options":[{"key":"a","text":"El deducible no se aplica, el coaseguro si"},{"key":"b","text":"El deducible y el coaseguro ya no se aplican"}],"correct":"a"},{"id":67,"text":"En una reclamación donde el gasto erogado es de $ 400,000.00 y el deducible es de $ 5,000.00 y el coaseguro del 10%, se paga:","options":[{"key":"a","text":"$ 355,000.00"},{"key":"b","text":"$ 355,500.00"}],"correct":"b","handwritten_note":"Cálculo manuscrito al pie de la página: \"400,000. - 5,000 = 395,000 - 39,500 (10%) = 355,500\""},{"id":68,"text":"Las siguientes situaciones permiten que el deducible y el coaseguro no sean aplicados:","options":[{"key":"a","text":"Accidentes y cirugía programada"},{"key":"b","text":"Urgencias médicas y estar dentro del GUA"}],"correct":"a"},{"id":69,"text":"Residencia, Deportes, Profesión, sexo, hábitos y estado de salud; son elementos en el seguro de gastos médicos que se consideran para:","options":[{"key":"a","text":"Suscribir el riesgo"},{"key":"b","text":"Pagar el siniestro"}],"correct":"a"},{"id":70,"text":"Conocer los tratamientos de enfermedades, determinar la posible herencia de enfermedades, y determinar los tratamientos preexistentes; son los objetivos de:","options":[{"key":"a","text":"Cuestionario de hábitos"},{"key":"b","text":"Cuestionario médico"}],"correct":"b"},{"id":71,"text":"Prestan servicios a los asegurados, están en convenio y sus honorarios los paga directamente la aseguradora; son personas que forman:","options":[{"key":"a","text":"Red médica"},{"key":"b","text":"Sistema de salud"}],"correct":"a"},{"id":72,"text":"En caso de que la suma asegurada se agote en una enfermedad, ¿Qué pasa si se presenta durante la misma vigencia un accidente que no tiene ninguna relación con la enfermedad?","options":[{"key":"a","text":"Se cubre hasta por otro tanto de la suma asegurada contratada"},{"key":"b","text":"No se cubre el accidente porque no tiene reinstalación automática"}],"correct":"a"},{"id":73,"text":"¿Cuáles son las causas que ponen límite a la indemnización en una póliza de Gastos Médicos?","options":[{"key":"a","text":"Que el médico certifique la cura, que se haya agotado la Suma Asegurada o que termine el período máximo de indemnización"},{"key":"b","text":"La terminación de la vigencia, qué el médico de el dictamen de invalidez"}],"correct":"a"},{"id":74,"text":"Las edades mínimas y máximas para adquirir el seguro de GMM, son:","options":[{"key":"a","text":"-1 día a 70 años"},{"key":"b","text":"1 día a 64 años"}],"correct":"b"},{"id":75,"text":"Si el asegurado se atiende con médicos que están en la red que tipo de indemnización procede:","options":[{"key":"a","text":"Pago directo."},{"key":"b","text":"Reembolso."}],"correct":"a"},{"id":76,"text":"El requisito para que proceda el Pago Directo, además de estar cubierto el tratamiento recibido; es:","options":[{"key":"a","text":"Cualquier cirugía"},{"key":"b","text":"Hospitalización mínima de 24 horas"}],"correct":"b"},{"id":77,"text":"Es el pago que hace la aseguradora directamente al hospital, sanatorio o médico que atiende al asegurado:","options":[{"key":"a","text":"Pago directo."},{"key":"b","text":"Reembolso."}],"correct":"a"},{"id":78,"text":"A consecuencia de algún accidente o enfermedad el asegurado se atiende fuera de red, el gasto erogado es reintegrado por la aseguradora al asegurado, se trata de:","options":[{"key":"a","text":"Pago directo"},{"key":"b","text":"Reembolso"}],"correct":"b"},{"id":79,"text":"En el ajuste de un siniestro de gastos médicos, lo primero que se comprueba es:","options":[{"key":"a","text":"Que los gastos estén cubiertos"},{"key":"b","text":"Que no se haya rebasado el GUA"}],"correct":"a"},{"id":80,"text":"Varía en función de la región, los niveles de hospitales y la especialidad del doctor. La aseguradora y los proveedores se ponen de acuerdo en un costo promedio llamado:","options":[{"key":"a","text":"Monto indemnizable"},{"key":"b","text":"Gasto Usual y Acostumbrado"}],"correct":"b"},{"id":81,"text":"Si el importe de honorarios médicos rebasa el GUA, que procede:","options":[{"key":"a","text":"Rechaza todo el siniestro."},{"key":"b","text":"Paga el GUA y el remanente lo deja en manos del asegurado"}],"correct":"b"},{"id":82,"text":"La prestación de servicios dirigidos a prevenir o restaurar la salud, a través de acciones que se realicen en beneficio del asegurado; es el objetivo del seguro:","options":[{"key":"a","text":"De Gastos Médicos"},{"key":"b","text":"De Salud"}],"correct":"b"},{"id":83,"text":"¿Qué son las ISES?","options":[{"key":"a","text":"Institutos estatales de salud"},{"key":"b","text":"Instituciones de seguros especializadas en salud"}],"correct":"b"},{"id":84,"text":"Las Instituciones de Seguro especializadas en Salud, están autorizadas para comercializar en forma adicional el ramo de:","options":[{"key":"a","text":"Accidentes personales individuales y Gastos médicos"},{"key":"b","text":"Gastos Médicos y Vida"}],"correct":"a"},{"id":85,"text":"Establece las funciones de cada autoridad: 1. CNSF 2. Secretaría de Salud | a) Autoriza a nuevas ISES b) Realiza su examen técnico antes de autorizar a una ISES c) Define la obligación de servicios mínimos que se deben otorgar d) Supervisa a las ISES en su función como aseguradora e) Supervisa a las ISES en sus servicios médicos","options":[{"key":"a","text":"1 a, b, d; 2 c, e"},{"key":"b","text":"1 a, d; 2 b, c, e"}],"correct":"a","match":{"stem":"Establece las funciones de cada autoridad:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"CNSF"},{"k":"2","text":"Secretaría de Salud"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Autoriza a nuevas ISES"},{"k":"b","text":"Realiza su examen técnico antes de autorizar a una ISES"},{"k":"c","text":"Define la obligación de servicios mínimos que se deben otorgar"},{"k":"d","text":"Supervisa a las ISES en su función como aseguradora"},{"k":"e","text":"Supervisa a las ISES en sus servicios médicos"}]}]},"handwritten_note":"\"Aseguradora\" escrito a mano junto al inciso a; \"Cobertura basica\" al margen izquierdo; líneas manuscritas conectando 1 y 2 con los incisos"},{"id":86,"text":"Relaciona ambas columnas: 1. CONDUSEF 2. CONAMED | a) Recibe quejas sobre el monto de las reclamaciones de un seguro b) Recibe quejas por negligencia médica del paciente o sus familiares c) Informa a los usuarios sobre el funcionamiento de los productos d) Responden ante ella los médicos que son demandados por negligencia médica","options":[{"key":"a","text":"1 a, c; 2 b, d"},{"key":"b","text":"1 b, d; 2 a, c"}],"correct":"a","match":{"stem":"Relaciona ambas columnas:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"CONDUSEF"},{"k":"2","text":"CONAMED"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Recibe quejas sobre el monto de las reclamaciones de un seguro"},{"k":"b","text":"Recibe quejas por negligencia médica del paciente o sus familiares"},{"k":"c","text":"Informa a los usuarios sobre el funcionamiento de los productos"},{"k":"d","text":"Responden ante ella los médicos que son demandados por negligencia médica"}]}]},"handwritten_note":"Líneas manuscritas conectando CONDUSEF y CONAMED con los incisos"},{"id":87,"text":"¿A qué unidad administrativa de la Comisión Nacional de Arbitraje Médico le corresponde la atención de inconformidades en amigable composición?","options":[{"key":"a","text":"Dirección General de Orientación y Gestión"},{"key":"b","text":"Dirección General de Conciliación"}],"correct":"a","handwritten_note":"Nota manuscrita al margen izquierdo, posiblemente \"Aprender\" [poco legible]"},{"id":88,"text":"Son procesos que lleva a cabo la Comisión Nacional de Arbitraje Médico para resolver conflictos derivados de la prestación de servicios de salud, EXCEPTO:","options":[{"key":"a","text":"Conciliación y Arbitraje"},{"key":"b","text":"Aplicación de multas"}],"correct":"b"},{"id":89,"text":"Los siguientes son usuarios de CONAMED, EXCEPTO:","options":[{"key":"a","text":"Los pacientes o familiares que recibieron una mala atención médica"},{"key":"b","text":"Los médicos que demandan a la institución de salud"}],"correct":"b"},{"id":90,"text":"Establece la diferencia entre medicina preventiva y restaurativa: 1. Medicina preventiva 2. Medicina restaurativa | a) Campañas sobre la salud b) Cirugías, aplicación de medicamentos c) Campañas sobre higiene d) Aplicación de vacunas e) Fisioterapias, hidroterapias, radioterapias f) Aplicación de flúor","options":[{"key":"a","text":"1 a, c, d, f; 2 b, e"},{"key":"b","text":"1 c, e; 2 a, c, d, f"}],"correct":"a","match":{"stem":"Establece la diferencia entre medicina preventiva y restaurativa:","cols":[{"label":"","kind":"num","items":[{"k":"1","text":"Medicina preventiva"},{"k":"2","text":"Medicina restaurativa"}]},{"label":"","kind":"let","items":[{"k":"a","text":"Campañas sobre la salud"},{"k":"b","text":"Cirugías, aplicación de medicamentos"},{"k":"c","text":"Campañas sobre higiene"},{"k":"d","text":"Aplicación de vacunas"},{"k":"e","text":"Fisioterapias, hidroterapias, radioterapias"},{"k":"f","text":"Aplicación de flúor"}]}]},"handwritten_note":"Líneas manuscritas conectando 1 y 2 con los incisos"},{"id":91,"text":"Las redes médicas de las ISES pueden estar constituidas con instituciones y médicos:","options":[{"key":"a","text":"Estatales y propias"},{"key":"b","text":"Propias y/o de terceros y/o combinadas"}],"correct":"b"},{"id":92,"text":"Son obligaciones de las ISES, EXCEPTO:","options":[{"key":"a","text":"Operar con recursos propios"},{"key":"b","text":"Mantener su infraestructura operando con apego a la NOM"}],"correct":"a"},{"id":93,"text":"Las ISES deben informar a sus asegurados los cambios en su red médica en plazo máximo de;","options":[{"key":"a","text":"10 días hábiles"},{"key":"b","text":"15 días hábiles"}],"correct":"b"},{"id":94,"text":"Son derechos de los ISES, EXCEPTO:","options":[{"key":"a","text":"Elegir el médico de cabecera"},{"key":"b","text":"Recibir la prima por parte del Asegurado"}],"correct":"a"},{"id":95,"text":"La función principal es el mantenimiento de la salud y la prevención de enfermedades a través de la detección temprana de los signos o síntomas que presentan los individuos.","options":[{"key":"a","text":"Medicina de primer nivel"},{"key":"b","text":"Medicina de segundo nivel"}],"correct":"a"},{"id":96,"text":"Pediatras, gineco - obstetras, cirugía general y medicina interna; son considerados dentro de:","options":[{"key":"a","text":"Medicina de primer nivel o contacto"},{"key":"b","text":"Medicina de segundo nivel"}],"correct":"a"},{"id":97,"text":"Es una especialidad que no se cubre en los servicios de la medicina de segundo nivel del seguro de salud:","options":[{"key":"a","text":"Cardiología"},{"key":"b","text":"Cirugía general"}],"correct":"b"},{"id":98,"text":"El concepto Medicina de Segundo Nivel, considera la atención con:","options":[{"key":"a","text":"Médicos generales"},{"key":"b","text":"Médicos especialistas"}],"correct":"b"},{"id":99,"text":"A partir de qué edad se otorga atención médica en la especialidad de Ginecobstetricia:","options":[{"key":"a","text":"14 años"},{"key":"b","text":"18 años"}],"correct":"a"},{"id":100,"text":"Los pacientes que pueden ser atendidos en un hospital pediátrico son:","options":[{"key":"a","text":"Recién nacidos hasta los 16 años"},{"key":"b","text":"Recién nacidos hasta los 18 años"}],"correct":"b"},{"id":101,"text":"El Seguro de Salud ampara los siguientes riesgos, EXCEPTO:","options":[{"key":"a","text":"Vacunación"},{"key":"b","text":"Check-up"}],"correct":"b"},{"id":102,"text":"Son servicios adicionales al Seguro de Salud, EXCEPTO:","options":[{"key":"a","text":"Servicio de ambulancia, Cuidados en casa"},{"key":"b","text":"Terapias de rehabilitación por alcoholismo o drogadicción"}],"correct":"b"},{"id":103,"text":"Son servicios adicionales que se protegen en el seguro de salud, EXCEPTO:","options":[{"key":"a","text":"Atención médica de especialistas"},{"key":"b","text":"Psicólogos y psiquiatras"}],"correct":"b"},{"id":104,"text":"En el seguro de salud, los servicios dentales preventivo y curativos, Hematología, inmunología; se consideran:","options":[{"key":"a","text":"Básicos"},{"key":"b","text":"Adicionales"}],"correct":"b"},{"id":105,"text":"Legrado por aborto provocado, tratamientos de esterilidad o fertilidad, gastos por pérdida de los aparatos de prótesis y ortopedia","options":[{"key":"a","text":"Adicionales"},{"key":"b","text":"Excluidos"}],"correct":"b"},{"id":106,"text":"Estudios y/o tratamientos para corregir alteraciones del sueño, Curas de reposo o exámenes médicos, anteojos o lentes de contacto, tratamientos médicos o quirúrgicos efectuados por personas sin cédula profesional, padecimientos resultantes del intento de suicidio y/o mutilación voluntaria, para el seguro de saludo son:","options":[{"key":"a","text":"Riesgos adicionales"},{"key":"b","text":"Riesgos excluidos"}],"correct":"b"},{"id":107,"text":"Es la participación a cargo del asegurado que cubre al utilizar cualquier servicio","options":[{"key":"a","text":"Deducible"},{"key":"b","text":"Copago"}],"correct":"b","handwritten_note":"Nota manuscrita junto a 'Copago': \"Paga el asegurado en atención médica\""},{"id":108,"text":"El copago establecido en el seguro de salud, se expresa:","options":[{"key":"a","text":"En porcentaje o cantidad fija"},{"key":"b","text":"Sólo en porcentaje"}],"correct":"a"},{"id":109,"text":"Son derechos de asegurado, Excepto:","options":[{"key":"a","text":"Autorizar el tratamiento"},{"key":"b","text":"Atenderse con médicos fuera de la red"}],"correct":"b"},{"id":110,"text":"Es la obligación de la ISES cuando el asegurado se atiende con médicos fuera de la red","options":[{"key":"a","text":"Rechaza el gasto médico"},{"key":"b","text":"Reembolsa hasta el tabulador"}],"correct":"b"},{"id":111,"text":"¿En qué caso se procederá al reembolso en el seguro de salud?","options":[{"key":"a","text":"Urgencia médica"},{"key":"b","text":"Consulta preventiva"}],"correct":"a"},{"id":112,"text":"Falta de disponibilidad del servicio, error del diagnóstico, segunda o tercera opinión o saturación de la red; son situaciones que hacen que la indemnización se haga:","options":[{"key":"a","text":"Por reembolso"},{"key":"b","text":"Por Pago directo"}],"correct":"a"},{"id":113,"text":"Persona responsable de la supervisión y vigilancia sobre el cumplimiento de las normas mexicanas, de proponer cambios y ampliaciones al programa permanente de mejoramiento","options":[{"key":"a","text":"Auditor médico"},{"key":"b","text":"Contralor médico"}],"correct":"b"},{"id":114,"text":"Período en que el médico contralor debe reportar sus informes a la Secretaría de Salud y a la CNSF:","options":[{"key":"a","text":"Trimestralmente"},{"key":"b","text":"Cuatrimestralmente"}],"correct":"b"}]},{"id":"sfm","label":"Sistema Financiero Mexicano","theory":[{"title":"Sistema Financiero Mexicano y Autoridades","content_md":"(Nota manuscrita en la parte superior de la página: “Módulo 3”)\n\n**Sistema Financiero Mexicano**: Es el conjunto de leyes, reglamentos, organismos e instituciones que generan, captan, administran, orientan y dirigen, tanto el ahorro como la inversión, y financiamiento dentro de un marco legal de referencia, en el contexto político económico que brinda nuestro país. **El objetivo es permitir que el dinero fluya dentro de un marco legal**.\n\n### Autoridades\n\n**Secretaría de Hacienda y Crédito Público**\n- Es la autoridad máxima del sistema financiero\n- Autoriza la constitución y operación de instituciones financieras\n- Regula y vigila la solvencia económica de las instituciones financieras\n- Crea y supervisa la operación de las comisiones desconcentradas\n\n**Banco de México**\na) Regula la emisión y circulación de la moneda, otorga dinero a la banca para que se puedan efectuar operaciones pasivas y activas\nb) Es el asesor financiero del Gobierno Federal y hace la función de tesorería\nc) Opera con las Instituciones de Crédito como banco de reserva y acreditante de última instancia, además regula el servicio de cámara de compensación\nd) Es el asesor y agente exclusivo para colocar, redimir y vender valores gubernamentales\ne) Realizar la regularización crediticia y cambiaria"},{"title":"Comisiones desconcentradas de la SHCP (con autonomía técnica y facultades ejecutivas)","content_md":"**Comisión Nacional Bancaria y de Valores (CNBV)** — Instituciones de su competencia:\n- **Sector Bancario**: Banca comercial o múltiple; Banca de desarrollo o fomento\n- **Sector Bursátil**: Casas de Bolsa; Sociedades de Inversión; Sociedades Operadoras de Sociedades de Inversión; Calificadoras de Riesgos Financiero; Evaluadoras de Acciones\n- **Sector de Servicios Financieros no bancarios**: Cajas populares de ahorro; Uniones de crédito; Almacenes Generales de Depósito; Factoreras, Sofoles y Sofomes\n\n**Comisión Nacional de Seguros y Fianzas (CNSF)**:\n- **Sector Asegurador**: Sociedades Mutualistas de Seguros; Instituciones de Seguro\n- **Sector Afianzador**: Instituciones de Fianzas\n\n**Comisión Nacional del Sistema de Ahorro para el Retiro (CONSAR)**:\n- Administradoras de Fondos para el Retiro (AFORE)\n- Sociedades de Inversión Especializada en Fondos para el Retiro\n\n**Funciones de estas comisiones (CNBV, CNSF, CONSAR)**:\n- Autorizan la creación y funcionamiento de instituciones Financieras\n- Supervisa, vigila y regula a las instituciones financieras de su competencia para procurar su estabilidad y correcto funcionamiento\n- Aplica sanciones administrativas a las instituciones que infrinjan las leyes o reglamentos relativos\n- Mantiene y fomenta el sano y equilibrado desarrollo del sistema financiero en su conjunto, con el propósito de proteger los intereses del público usuario\n\n**Comisión Nacional para la Protección y Defensa de los Usuarios de los Servicios Financieros (CONDUSEF)**:\n- **Objetivo**: Procurar la equidad en las relaciones entre los Usuarios y las Instituciones Financieras, otorgando seguridad jurídica en las operaciones financieras y en la relación con sus usuarios\n- **Funciones Preventivas**: Crear cultura financiera; Informar a los usuarios sobre los productos e instituciones financieras; Fomentar la transparencia y la sana competencia de las instituciones financieras\n- **Funciones Correctivas**: Recibir Quejas de los distintos usuarios de servicios financieros; Promover audiencias de conciliación; Fungir como árbitro en amigable composición o en estricto derecho; Prestar servicios gratuitos de abogados a los usuarios sin recursos propios"},{"title":"Instituciones o Intermediarios del Sector Bancario","content_md":"**Banca Comercial o Múltiple**: Las instituciones de banca múltiple son sociedades anónimas facultadas para realizar operaciones de captación de recursos del público y de colocación de éstos en el propio público. Estas operaciones se denominan servicios de banca y crédito. A estas instituciones se les conoce también como bancos comerciales. Por ejemplo:\n- City Banamex S.A.\n- BBVA Bancomer, S.A.\n- HSBC, S.A.\n- Banca Afirme, S.A.\n- Banca Mifel, S.A.\n\n**Banca de Desarrollo**: Entidades de la administración pública federal, su objeto es fomentar el desarrollo de determinados sectores de la economía, a través de los servicios de banca y crédito, actuando de manera directa o como banca de segundo piso.\n\n**Banca de Segundo Piso**: Se denomina así porque no tiene sucursales, no atiende directamente a los usuarios y canaliza los recursos financieros al cliente a través de la banca comercial:\n- Banco Nacional de Obras y Servicios Públicos, S.N.C.\n- Nacional Financiera, S.N.C.\n- Banco Nacional de Comercio Exterior, S.N.C.\n- Sociedad Hipotecaria Federal, S.N.C.\n- Financiera Nacional de Desarrollo Agropecuario, Rural, Forestal y Pesquero (FND)"},{"title":"Sector Bursátil: Bolsa Mexicana de Valores y Casas de Bolsa","content_md":"**Bolsa Mexicana de Valores**: Empresa Privada que facilita las transacciones con valores y procura el desarrollo del mercado.\n- Establece los locales, instalaciones y mecanismos que faciliten las relaciones y operaciones entre la oferta y demanda de valores\n- Proporciona, mantiene y hace publicaciones sobre la información relativa a los valores inscritos en la BMV\n- Autorregula y, establece las medidas necesarias para que las operaciones que realicen las casas de bolsa, se sujeten a las disposiciones legales\n\n**Casas de Bolsa**: Son sociedades anónimas que realizan operaciones para **intermediar la oferta y la demanda de valores**, y administran carteras de valores propiedad de terceros. La CNBV se encarga de otorgarle o revocarle la autorización para su operación, emite reglas de carácter general y las supervisa."},{"title":"Sociedades de Inversión","content_md":"**Sociedades de Inversión**: Se forman con un gran grupo de inversionistas, que se convierten en accionistas. El dinero de los socios es invertido en un portafolio con características bien definidas, diversificado y en instrumentos de los diferentes mercados financieros.\n\n**Objetivos Legales de las S.I.**:\n- El fortalecimiento y descentralización del mercado de valores\n- El acceso del pequeño y mediano inversionista a dicho mercado\n- La diversificación del capital\n- La contribución al financiamiento de la actividad productiva del país, y\n- La protección de los intereses del público inversionista\n\n**Operaciones Prohibidas**:\n- Recibir depósitos de dinero\n- Dar en garantía sus bienes\n- Otorgar su aval o garantía respecto de obligaciones a cargo de un tercero\n- Recomprar o vender las acciones que emitan a precio distinto\n- Practicar operaciones activas de crédito, excepto préstamos y reportos\n\n**Abiertas**: Aquellas que **tienen la obligación de recomprar las acciones** representativas de su capital social o de amortizarlas con Activos Objeto de Inversión integrantes de su patrimonio.\n\n**Cerradas**: Aquellas que **tienen prohibido recomprar las acciones** representativas de su capital social y amortizar acciones con Activos integrantes de su patrimonio, **a menos que sus acciones se coticen en una bolsa de valores**.\n\n### Tipos de Sociedades de Inversión\n- **De Renta Fija**: Su portafolio se compone de instrumentos de deuda a corto plazo; Otorga rendimientos bajos y con poca volatilidad\n- **De Renta Variable**: Su portafolio se compone principalmente por instrumentos de renta variable; Tienen mayor riesgo\n- **De Capital (SINCAS)**: No adquieren los instrumentos en casa de bolsa; Operan acciones o partes sociales, obligaciones y bonos a cargo de empresas que promueva la propia sociedad de inversión. Las ganancias de la sociedad de inversión están relacionadas directamente con el desempeño de las empresas promovidas\n- **De Objeto Limitado**: Trabajan con instrumentos de largo plazo, emitidos por empresas y tienen por objeto invertir en el plan nacional de desarrollo; Otorgan préstamos que tienen que ver con sus estatutos"},{"title":"Otras Instituciones del Sector Bursátil","content_md":"**Sociedades Operadoras de Sociedades de Inversión**: Son sociedades financieras que se encargan de administrar la cartera de los fondos de inversión.\n\n**Calificadoras de Riesgo**: Califican los riesgos de crédito de los instrumentos financieros a través de distintas variables económicas:\n- Standard and Poors\n- Fitch\n- Moodys\n\n**Valuadoras de acciones de Sociedades de Inversión**: Su función es prestar los servicios de valuación de las acciones de las sociedades de inversión para liquidar a los accionistas que quieran retirarse de la sociedad."},{"title":"Mercado de Valores y sus Participantes","content_md":"**Mercado de Valores**: Lugar donde se realizan las operaciones de compraventa de instrumentos financieros o valores, se intercambia el dinero de los oferentes por los instrumentos que emiten los demandantes. **Su objetivo es permitir que el dinero llegue a los demandantes**.\n\n### Participantes\n- **Inversionista u Oferente**: Personas físicas o morales que cuentan con dinero y lo ofrecen a las personas que lo requieren con la intención de generar utilidades o rendimientos.\n- **Emisor o Demandante**: Requieren dinero para poder financiar sus proyectos, emiten instrumentos financieros que colocan en el mercado de valores para poder acceder al dinero de los inversionistas. Se clasifican en tres grupos: Gobierno, Bancos y Empresas Privada.\n- **Intermediarios**: Instituciones financieras que captan el dinero de los inversionistas y lo colocan entre los demandantes:\n  - **Sector Bancario**: Bancos Comerciales o Múltiples y Bancos de Desarrollo o de Fomento\n  - **Sector Financiero No Bancario**: Sociedades de Crédito Popular, Uniones de crédito, cajas populares, almacenadoras, Factoreras, Sofoles o Sofomes\n  - **Sector Bursátil**: Casas de Bolsa, Sociedades de Inversión, Calificadoras de Riesgos, Valuadoras de Acciones"},{"title":"Instrumentos Financieros","content_md":"Son contratos que se celebran entre dos partes donde una de ellas requiere usar dinero de otros y la otra parte pone su dinero para generar rentabilidad. Existe dos tipos de instrumentos o valores:\n- **De Deuda**: Son contratos donde se establece la obligación de una de las partes de pagar el capital más un interés acordado en un plazo definido.\n- **Patrimoniales**: Son los documentos denominados “Acciones” que se emiten con la intención de incrementar el capital de una empresa, invitando a inversionistas a aportar dinero al negocio. El inversionista que adquiere estos instrumentos se convierte en socio de la empresa emisora.\n\n**Instrumentos por la forma de su Rentabilidad**:\n- **Renta Fija**: Son instrumentos donde se expresa un interés preestablecido; En estos instrumentos se establece un plazo fijo\n- **Renta Variable**: Son instrumentos que no tienen un interés preestablecidos ni un plazo fijo\n\n**Instrumentos por el tipo de Emisor**:\n- **Gobierno Federal**: Certificados de la Tesorería (CETES); Bonos de Desarrollo (BONDES); Bonos en UDIs (UDIBONOS); Bonos de Protección al Ahorro Bancario (BPAs); Pagaré de Indemnización Carretero, aplicable al Fideicomiso de Apoyo al Rescates de Autopistas Concesionadas (PIC – FARAC)\n- **Bancarios**: Pagaré con Rendimiento Liquidable al Vencimiento (PRLV); Aceptaciones Bancarias o Letras de Cambio (AB); Certificados de Depósito (CD)\n- **Empresa Privada**: Papel Comercial (PC); Obligaciones; Pagaré Financiero (PF); Certificados de Participación Ordinaria (CPO); Certificados de Participación Inmobiliaria (CPI); Acciones"},{"title":"Clasificación de Mercados","content_md":"**Mercado de Dinero**:\n1. Se colocan instrumentos de Corto Plazo, 1 año o plazos menores (CETES, Aceptaciones bancarias, Pagarés, Papel comercial)\n2. Instrumentos de renta fija o deuda\n3. Son instrumentos de alta liquidez\n4. El dinero se utiliza como capital de trabajo o pasivo circulante\n5.
