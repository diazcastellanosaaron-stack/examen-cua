iales o Robo Total.\n\n**Suma asegurada:** Valor de Factura actualizado o de Avalúo.\n\n**Deducible:** 25% sobre el equipo afectado."},{"title":"Coberturas Adicionales — Adaptaciones y/o Conversiones","content_md":"**Objetivo:** Resarcir los daños o pérdidas que sufran las adaptaciones o conversiones.\n\n**Concepto:** Toda modificación y/o adición en carrocería, partes, mecanismos, aparatos, accesorios y/o rótulos, instalados a petición del comprador o propietario, en adición a aquellos con los que el fabricante equipa originalmente cada modelo y tipo específico que presenta al mercado.\n\n**Cobertura:** Se indemnizan los siniestros amparados en las coberturas de Daños materiales o Robo Total.\n\n**Suma asegurada:** Valor de Factura Actualizado o Valor de Avalúo.\n\n**Deducible:**\n- 5% si es por Daños Materiales\n- 10% si es por Robo Total"},{"title":"Coberturas Adicionales — Accidentes Automovilísticos del Conductor","content_md":"**Objetivo:** Indemniza la suma asegurada por muerte accidental o el porcentaje por Pérdidas orgánicas.\n\n**Cobertura:** La muerte del conductor o la pérdida orgánica por accidentes en tránsito del auto asegurado."},{"title":"Coberturas Adicionales — Extensión de R. C.","content_md":"**Objetivo:** Cubre al conductor cuando maneje un auto distinto al asegurado.\n\n**Cobertura:** R. C. Bienes, R. C. Personas.\n\n**Suma Asegurada:** Las mismas que en R. C. básica.\n\n**Territorio:** Sólo México."},{"title":"Coberturas Adicionales — R. C. Por Carga Peligrosa","content_md":"**Objetivo:** Indemniza daños a terceros causados con la carga que lleva el auto asegurado.\n\n**Cargas Peligrosas (Requieren Convenio Expreso):**\n\n**Tipo B:** Maquinaria pesada, vehículos a bordo de camiones, troncos o trozos de madera, rollos de papel, cable o alambre para uso industrial; materiales, partes o módulos para la industria; materiales, partes o módulos para la industria de la construcción, ganado en pie.\n\n**Tipo C:** Carga de clasificación peligrosa o muy peligrosa como productos altamente tóxicos y/o corrosivos, inflamables y/o explosivos, o cualquier otro tipo similar a los enunciados."},{"title":"Coberturas Adicionales — Asistencia y Defensa Legal (Defensa jurídica)","content_md":"**Objetivo:** Facilitar que el asegurado no permanezca en condición de detenido cuando cometa algún delito en tránsito.\n\n**Delitos en Tránsito:**\n1. Lesiones a la integridad física de terceros\n2. Homicidio imprudencial\n3. Daños a la propiedad ajena\n4. Daños a la propiedad pública\n\n**Gastos Amparados:**\n- Honorarios de abogados\n- Primas de fianzas para obtener libertad\n- Cauciones\n\n**Exclusiones:**\n- Faltas administrativas y multas\n- Estado de ebriedad o drogadicción"},{"title":"Coberturas Adicionales — Asistencia en Viajes","content_md":"**Objetivo:** Auxiliar al asegurado y sus acompañantes en caso de fallas mecánicas o enfermedades durante viajes.\n\n**Cobertura:**\n- Grúa\n- Hospedaje, transporte o renta de auto\n- Traslado a hospital por enfermedad o accidente\n- Asistencia vial: gasolina, corriente, cambio de llantas, grúa"},{"title":"Esquemas de Aseguramiento","content_md":"| Esquema | Descripción |\n|---|---|\n| Residentes | Vehículos fabricados en México o en el Extranjero pero que circulan con placas nacionales |\n| Turistas | Automóviles fabricados en el extranjero que circulan con placas de otros países |\n| Fronterizos | Automóviles que circulan con placas fronterizas y les permite circular en USA y la ciudad donde radica el dueño |\n| Clásicos o antiguos | Autos de más de 15 años de antigüedad en buen estado o autos de colección, se requiere avalúo |\n| Plan Piso | Automóviles que se encuentren en exhibición o en los patios de una agencia |\n| Plan Traslado | Automóviles mientras se transportan en nodrizas o por su propia propulsión |"},{"title":"Condiciones Generales — Obligaciones del Asegurado En Caso de Siniestro","content_md":"**Actos de salvaguarda:** Debe hacer lo posible para evitar o reducir el valor del daño.\n\n**Aviso:** Debe informar la ocurrencia del siniestro lo más pronto posible. La falta del aviso oportuno sólo reduce el valor de la indemnización.\n\n**Aviso a las Autoridades:** Presentar formal querella **ante las autoridades competentes**, cuando se trate de robo u otro acto delictuoso. Cooperar con la compañía para conseguir la recuperación del vehículo o del importe del daño.\n\n**Cooperación y asistencia con la aseguradora:**\n- Proporcionar los datos y pruebas necesarias, para su defensa\n- Ejercitar y hacer valer las acciones y defensas que le correspondan en derecho\n- A apoyar en todo procedimiento judicial\n- A otorgar poderes a favor de los abogados que la Compañía designe"},{"title":"Bases de Valuación e Indemnización de Daños","content_md":"**Valuación del Daño:** La aseguradora debe hacerlo en un plazo máximo de 72 horas. Si no el asegurado puede reparar su auto y deberá ser indemnizado.\n\n**Reparación anticipada:** La aseguradora no está obligada a indemnizar si el asegurado realiza la reparación antes de la valuación.\n\n**Plazo de Indemnización:** La aseguradora deberá indemnizar en un plazo de 30 días después de recibir todos los requisitos."},{"title":"Suma Asegurada — Ajuste Automático y Reinstalación Automática","content_md":"**Ajuste Automático de Suma Asegurada:** La aseguradora se obliga a incrementar la suma asegurada cuando el valor del automóvil asegurado sufra un incremento de valor, debido a la inflación que exista hasta el día del siniestro. Esta cobertura no es aplicable a las coberturas de:\n- Responsabilidad Civil\n- Gastos Médicos a Ocupantes\n\n**Reinstalación Automática de Suma Asegurada:** Las sumas aseguradas que se hubieren contratado en la póliza, se reinstalarán automáticamente cuando hayan sido reducidas por el pago de cualquier indemnización parcial efectuada por la Institución durante la vigencia de la póliza.\n\n**No aplica en las coberturas de:** Equipo Especial, Adaptaciones o conversiones, automóvil sustituto, RC. Del Viajero."},{"title":"Reglamento de Tránsito — Clasificación de Vehículos por el Peso","content_md":"| Ligeros | Pesados |\n|---|---|\n| Aquellos con un peso bruto vehicular de hasta 3.5 toneladas | Aquellos con un peso bruto vehicular mayor a 3.5 toneladas |"},{"title":"Reglamento de Tránsito — Licencias para Conducir (Federales)","content_md":"| Tipo | Autoriza |\n|---|---|\n| Permiso | Podrán conducir vehículos automotores que requieran licencias tipo A o D, Desde 16 hasta 18 años |\n| A | Autoriza a conducir vehículos de autotransporte federal de pasajeros y exclusivo de turismo |\n| B | Autoriza a conducir vehículos de autotransporte federal de carga en sus diferentes modalidades |\n| C | Autoriza a conducir vehículos de autotransporte federal de carga de dos o tres ejes (rabón o Tortón) |\n| D | Autoriza a conducir vehículos de autotransporte federal exclusivo de turismo en su modalidad de chofer-guía |\n| E | Autoriza a conducir vehículos de autotransporte federal de carga general, materiales y residuos peligrosos |\n| F | Autoriza a conducir vehículos de autotransporte federal de o hacia puertos marítimos y aeropuertos federales |"}],"questions":[{"id":1,"text":"Las coberturas básicas del seguro de automóviles son:","options":[{"key":"a","text":"Daños materiales, robo total, y Responsabilidad Civil"},{"key":"b","text":"Daños materiales, robo total, R. C. y Asistencia jurídica"}],"correct":"a"},{"id":2,"text":"Usos diferentes, autos para escuelas de manejo, autos de competencias de velocidad, resistencia o prototipo; autos con remolque, segundo remolque en tractocamiones, se aseguran:","options":[{"key":"a","text":"En forma básica"},{"key":"b","text":"Por convenio expreso"}],"correct":"b","handwritten_note":"usos distintos"},{"id":3,"text":"Colisiones, volcaduras, incendio, rayo, explosión, actos vandálicos de huelguistas, caída de objetos; son riesgos que se cubren:","options":[{"key":"a","text":"Básicamente en la cobertura de Daños materiales"},{"key":"b","text":"Básicamente en la cobertura de Robo total"}],"correct":"a"},{"id":4,"text":"Los daños que sufra el auto asegurado por terremoto, erupción volcánica, huracanes, marejadas, tsunami o inundación; ¿cómo se amparan en Daños Materiales","options":[{"key":"a","text":"Básicamente"},{"key":"b","text":"Adicionalmente"}],"correct":"a"},{"id":5,"text":"Los daños que sufra el camión que se transporta por otros medios, causados por hundimiento, descarrilamiento o caída de aviones; ¿Cómo se amparan?","options":[{"key":"a","text":"Básicamente"},{"key":"b","text":"En el seguro del medio de transporte"}],"correct":"a"},{"id":6,"text":"Un camión fue golpeado por rocas que se desprendieron de un cerro; el seguro de automóviles ¿Cómo considera los daños?","options":[{"key":"a","text":"Cubiertos en forma básica"},{"key":"b","text":"Cubiertos en forma adicional"}],"correct":"a"},{"id":7,"text":"El conductor de un camión de transporte de pasajeros se vuelca en la carretera México-Cuernavaca, en el acta del Ministerio Público figura que tenía un fuerte aliento alcohólico; se trata de un riesgo:","options":[{"key":"a","text":"No amparado"},{"key":"b","text":"Amparado"}],"correct":"b"},{"id":8,"text":"Un auto de carga choca contra un muro de contención, el chofer es diagnosticado con estado de embriaguez; ¿Cómo se considera el siniestro?","options":[{"key":"a","text":"Cubierto básicamente"},{"key":"b","text":"Excluido"}],"correct":"b","handwritten_note":"En auto particular"},{"id":9,"text":"Un camión sufre una volcadura en una pendiente, por falla en los frenos; ¿Cómo lo califica la aseguradora?","options":[{"key":"a","text":"Se paga por estar amparado"},{"key":"b","text":"Se rechaza el siniestro"}],"correct":"a"},{"id":10,"text":"Un camión sufre daños en la suspensión y partes bajas por exceso de carga; ¿cómo se considera el siniestro?","options":[{"key":"a","text":"Cubierto"},{"key":"b","text":"Excluido"}],"correct":"b"},{"id":11,"text":"Durante una colisión, el conductor de un auto particular, estaba en estado de ebriedad y tenía licencia vencida, ¿Cómo procede la Empresa de seguros?","options":[{"key":"a","text":"Lo rechaza por falta de licencia"},{"key":"b","text":"Lo rechaza por ambas causas"}],"correct":"a"},{"id":12,"text":"Los daños que el camión sufre por su propia carga, en la póliza de Automóviles se consideran:","options":[{"key":"a","text":"Cubiertos en forma básica"},{"key":"b","text":"Excluidos definitivamente"}],"correct":"b"},{"id":13,"text":"Las siguientes son sumas aseguradas del vehículo en la cobertura de daños materiales, EXCEPTO:","options":[{"key":"a","text":"Valor comercial, valor de avalúo, valor convenido"},{"key":"b","text":"Valor de reposición, Valor, real, valor estimativo"}],"correct":"b"},{"id":14,"text":"Es la suma asegurada de automóviles, que se determina considerando la depreciación por uso y el comportamiento de la oferta y la demanda en el mercado","options":[{"key":"a","text":"Valor comercial"},{"key":"b","text":"Valor de reposición"}],"correct":"a"},{"id":15,"text":"El valor factura se establece como suma asegurada en los siguientes autos:","options":[{"key":"a","text":"Autos último modelo que acaban de salir de la agencia"},{"key":"b","text":"Sólo en autos nuevos que acaban de salir de agencia"}],"correct":"a"},{"id":16,"text":"El deducible de cristales es:","options":[{"key":"a","text":"20% sobre el valor de los cristales del auto"},{"key":"b","text":"20% sobre le valor del cristal siniestrado."}],"correct":"b"},{"id":17,"text":"Cuando ocurre un siniestro en donde los daños materiales alcanzaron los $35,000.00 la rotura de cristales $1,200.00 y pactaron deducibles en daños materiales de $5,000.00 y 20% en cristales ¿Cuánto indemniza la aseguradora si el ajustador lo declaró en solo evento?","options":[{"key":"a","text":"$ 30,960"},{"key":"b","text":"$ 31,200"}],"correct":"b","handwritten_note":"36,200 - 5,000 = 31,200 / No aplica el deducible de cristales"},{"id":18,"text":"Para indemnizar un siniestro total a petición del asegurado, la pérdida debe rebasar el:","options":[{"key":"a","text":"50% de la suma asegurada."},{"key":"b","text":"75% de la suma asegurada"}],"correct":"a","handwritten_note":"Es automático (junto a la opción b)"},{"id":19,"text":"Los delitos que se cubren en la cobertura de Robo Total son:","options":[{"key":"a","text":"Robo y abuso de confianza"},{"key":"b","text":"Robo y fraude"}],"correct":"a","handwritten_note":"Excepto de familiares"},{"id":20,"text":"Un asegurado compró el paquete limitado y sufrió un siniestro por caída de objetos en su auto; ¿cómo se considera en la póliza?","options":[{"key":"a","text":"Cubierto en Robo Total"},{"key":"b","text":"Excluido por no incluir Daños Materiales"}],"correct":"a"},{"id":21,"text":"Incendio, terremoto, huracán inundación, actos vandálicos de marchistas, ¿cómo se consideran en la cobertura limitada?","options":[{"key":"a","text":"Amparados"},{"key":"b","text":"Excluidos"}],"correct":"a","handwritten_note":"En robo total"},{"id":22,"text":"Cómo procede el robo de un portafolios y accesorios estando el auto estacionado:","options":[{"key":"a","text":"Se paga por la cobertura de robo total."},{"key":"b","text":"No se paga."}],"correct":"b"},{"id":23,"text":"La cobertura de robo total tiene la siguiente exclusión:","options":[{"key":"a","text":"Que el auto sea robado por policías,"},{"key":"b","text":"Que el auto sea robado por dependientes del asegurado."}],"correct":"b"},{"id":24,"text":"Si un auto es robado y en la huida se colisiona con otros autos, la reparación del auto asegurado que deducible aplica:","options":[{"key":"a","text":"El deducible de daños materiales."},{"key":"b","text":"El deducible de robo total."}],"correct":"b"},{"id":25,"text":"En caso de robo total del auto asegurado, ¿a quién debe informar el asegurado?","options":[{"key":"a","text":"A la aseguradora y las autoridades competentes"},{"key":"b","text":"A la aseguradora, a las autoridades competentes y al agente de seguros."}],"correct":"a"},{"id":26,"text":"Los seguros de automóviles que son obligatorios, tienen como cobertura básica:","options":[{"key":"a","text":"Responsabilidad civil"},{"key":"b","text":"Daños materiales"}],"correct":"a"},{"id":27,"text":"Las siguientes se consideran conceptos amparados en la cobertura de R C Personas, EXCEPTO:","options":[{"key":"a","text":"Honorarios de Médicos"},{"key":"b","text":"Perjuicios"}],"correct":"b"},{"id":28,"text":"Las siguientes son exclusiones en R. C. Personas, EXCEPTO:","options":[{"key":"a","text":"Lesiones del asegurado y sus familiares"},{"key":"b","text":"Gastos, costas y fianzas judiciales"}],"correct":"b"},{"id":29,"text":"Cubre una cantidad adicional de suma asegurada que se podrá utilizar para R C Personas y R C Bienes si fuera necesario:","options":[{"key":"a","text":"Responsabilidad Civil Catastrófica."},{"key":"b","text":"Límite único y combinado."}],"correct":"a"},{"id":30,"text":"La modalidad que unifica la suma asegurada para indemnizar daños a bienes o personas se llama:","options":[{"key":"a","text":"Responsabilidad Civil Catastrófica."},{"key":"b","text":"Límite único y combinado. (LUC)"}],"correct":"b"},{"id":31,"text":"Responsabilidad Civil, ampara una cantidad adicional igual a la suma asegurada que será utilizada para:","options":[{"key":"a","text":"Costas y fianzas de carácter penal"},{"key":"b","text":"Gastos y costas de juicios civiles"}],"correct":"b"},{"id":32,"text":"La cobertura de Responsabilidad Civil tiene la siguiente característica:","options":[{"key":"a","text":"No tiene deducible ni coaseguro."},{"key":"b","text":"Tiene deducible y coaseguro."}],"correct":"a"},{"id":33,"text":"Las siguientes son coberturas adicionales a la cobertura de Responsabilidad Civil, EXCEPTO:","options":[{"key":"a","text":"R. C. Por la Carga Peligrosa, R. C. Por la Contaminación Ambiental, Extensión de Responsabilidad Civil"},{"key":"b","text":"R. C. Profesional, R.C. Cruzada, R. C. Asumida"}],"correct":"b"},{"id":34,"text":"Bobinas de papel, tela o láminas, maquinaria pesada, troncos de madera, automóviles, ganado en pie, postes, materiales de construcción; se clasifican como carga:","options":[{"key":"a","text":"Tipo B"},{"key":"b","text":"Tipo C"}],"correct":"a"},{"id":35,"text":"Materiales tóxicos, inflamables, explosivos, solventes; se consideran dentro de la carga peligrosa en el tipo","options":[{"key":"a","text":"Tipo B"},{"key":"b","text":"Tipo C"}],"correct":"b"},{"id":36,"text":"Un camión asegurado transporta rollos de papel, al descargarlos provoca daños a un vehículo, el riesgo arriba mencionado es:","options":[{"key":"a","text":"Riesgo cubierto básicamente"},{"key":"b","text":"Riesgo Excluido"}],"correct":"b"},{"id":37,"text":"Los siniestros causados en autos particulares por: que el conductor no tenga licencia adecuada, manejar en estado de embriaguez, daños a vías públicas por exceso de carga, daños a personas que no dependan del asegurado, daños a bienes de empleados del asegurado; ¿cómo se consideran en la R. C.","options":[{"key":"a","text":"Cubiertos"},{"key":"b","text":"Excluidos"}],"correct":"b"},{"id":38,"text":"Si en el accidente sufren daño bienes que sean propiedad de los dependientes del asegurado, lesiones los familiares del asegurado y las cauciones; ¿cómo se consideran en la R. C","options":[{"key":"a","text":"Cubierto"},{"key":"b","text":"Excluidos"}],"correct":"b"},{"id":39,"text":"Como se consideran el gastos que realiza un asegurado para obtener su libertad en las coberturas de Responsabilidad Civil:","options":[{"key":"a","text":"Se cubre básicamente en Responsabilidad Civil"},{"key":"b","text":"Es una exclusión de Responsabilidad Civil"}],"correct":"b"},{"id":40,"text":"Los siguientes son gastos que se pagan en la cobertura de gastos médicos ocupantes","options":[{"key":"a","text":"Hospital, medicinas, prótesis y gastos funerarios"},{"key":"b","text":"Gastos de parto, médicos, enfermeras, equipo de hospital"}],"correct":"a"},{"id":41,"text":"La cobertura de gastos médicos ocupantes paga por las lesiones de los siguientes ocupantes, EXCEPTO:","options":[{"key":"a","text":"Los que estaban en los asientos"},{"key":"b","text":"El que va en la cajuela"}],"correct":"b"},{"id":42,"text":"Si las lesiones se causan por accidentes del auto asegurado en tránsito y los ocupantes van en los compartimientos adecuados, ¿qué cobertura opera?","options":[{"key":"a","text":"Gastos médicos ocupantes"},{"key":"b","text":"R. C. Personas"}],"correct":"a"},{"id":43,"text":"En los siguientes vehículos, la cobertura de gastos médicos sólo aplica para el conductor:","options":[{"key":"a","text":"De carga de más de 3.5 tons."},{"key":"b","text":"De pasaje público"}],"correct":"b"},{"id":44,"text":"Si un autobús sufre un accidente y los pasajeros requieren atención médica, ¿qué cobertura indemniza los gastos?","options":[{"key":"a","text":"Gastos médicos ocupantes"},{"key":"b","text":"Responsabilidad civil del viajero"}],"correct":"b"},{"id":45,"text":"La suma asegurada de Gastos Médicos a Ocupantes se aplica:","options":[{"key":"a","text":"A todos los ocupantes que iban al momento del accidente"},{"key":"b","text":"Sólo a los ocupantes con lesiones por el accidente."}],"correct":"b"},{"id":46,"text":"La cobertura amplia incorpora:","options":[{"key":"a","text":"Daños Materiales, Robo Total, Responsabilidad Civil y Gastos Médicos Ocupantes"},{"key":"b","text":"Daños materiales y robo total, Asistencia en legal"}],"correct":"a"},{"id":47,"text":"El paquete limitado incluye:","options":[{"key":"a","text":"El robo total, la responsabilidad civil y los gastos médicos a ocupantes"},{"key":"b","text":"Únicamente responsabilidad civil y Gastos Médicos"}],"correct":"a"},{"id":48,"text":"Las coberturas que tienen deducible son:","options":[{"key":"a","text":"Responsabilidad civil, gastos médicos a ocupantes y asistencia legal."},{"key":"b","text":"Daños materiales, robo total y equipo especial."}],"correct":"b"},{"id":49,"text":"¿Cómo se llama la cobertura donde se protegen algunos elementos de seguridad como blindaje, alarmas, etc. que se le ponen al auto","options":[{"key":"a","text":"Daños Materiales"},{"key":"b","text":"Equipo Especial"}],"correct":"b"},{"id":50,"text":"El deducible para la cobertura de equipo especial es:","options":[{"key":"a","text":"20%"},{"key":"b","text":"25%"}],"correct":"b"},{"id":51,"text":"El delito que se comete de manera accidental, no intencional ni dolosamente se le llama:","options":[{"key":"a","text":"Delito intencional."},{"key":"b","text":"Delito culposo."}],"correct":"b"},{"id":52,"text":"Los siguientes son delitos que puede enfrentar el asegurado con motivo de un accidente de tránsito. EXCEPTO:","options":[{"key":"a","text":"Homicidio intencional"},{"key":"b","text":"Ataques a las vías de comunicación."}],"correct":"a"},{"id":53,"text":"La instancia que determina la intencionalidad en un accidente de tránsito que provoque la muerte de personas es:","options":[{"key":"a","text":"La aseguradora."},{"key":"b","text":"El poder judicial"}],"correct":"b"},{"id":54,"text":"Para liberar al asegurado cuando en un accidente lesiona a personas además de dañar vehículos de terceros se cuenta con:","options":[{"key":"a","text":"R. C. bienes"},{"key":"b","text":"Defensa Legal o Jurídica"}],"correct":"b"},{"id":55,"text":"En un siniestro la aseguradora se encuentra representada por:","options":[{"key":"a","text":"El ajustador."},{"key":"b","text":"El abogado de asistencia jurídica."}],"correct":"a"},{"id":56,"text":"Es una de las obligaciones del ajustador:","options":[{"key":"a","text":"Informar sobre los hechos relacionados con el accidente"},{"key":"b","text":"Impedir que el asegurado sea detenido"}],"correct":"a"},{"id":57,"text":"¿Cuánto tiempo tiene la institución de seguros para realizar la valuación del daño?","options":[{"key":"a","text":"72 horas desde el aviso del siniestro"},{"key":"b","text":"72 horas desde que el automóvil queda libre por parte de las autoridades"}],"correct":"b"},{"id":58,"text":"Si el asegurado realiza la reparación antes de que la aseguradora realice la valuación, ¿qué procede?","options":[{"key":"a","text":"La aseguradora se libera de sus obligaciones y rechaza el siniestro"},{"key":"b","text":"Se paga el siniestro, pero se aplica el doble del deducible"}],"correct":"a"},{"id":59,"text":"¿Qué puede hacer la institución de seguros si descubre omisiones en la declaración del siniestro y ya había indemnizado?","options":[{"key":"a","text":"Exigir el reembolso de lo pagado."},{"key":"b","text":"Asumir la pérdida."}],"correct":"a"},{"id":60,"text":"Las siguientes acciones: Ejecutar todos los actos para evitar o disminuir el daño, dar aviso a la compañía tan pronto tenga conocimiento, presentar formal querella ante las autoridades competentes, apoyar en cualquier proceso legal; ¿cómo se consideran?","options":[{"key":"a","text":"Opcionales"},{"key":"b","text":"Obligatorias"}],"correct":"b"},{"id":61,"text":"Uno de los documentos indispensables para indemnizar un auto por robo total es:","options":[{"key":"a","text":"El acta del Ministerio Público."},{"key":"b","text":"La Tarjeta de Circulación"}],"correct":"a"},{"id":62,"text":"Valor factura de refacciones, impuestos, mano de obra; son elemento que se indemnizan en:","options":[{"key":"a","text":"Pérdidas parciales"},{"key":"b","text":"Pérdidas totales"}],"correct":"a"},{"id":63,"text":"Factura original endosada a favor de la aseguradora, últimas 5 tenencias pagadas si el modelo lo amerita, baja de placas, comprobante de verificación vehicular; son documentos para indemnizar:","options":[{"key":"a","text":"Pérdida parcial"},{"key":"b","text":"Pérdida total"}],"correct":"b"},{"id":64,"text":"Son documentos que se exigen para pagar un siniestro por Robo total, EXCEPTO:","options":[{"key":"a","text":"Tarjeta de circulación"},{"key":"b","text":"Baja del automóvil ante Tránsito"}],"correct":"a"},{"id":65,"text":"¿Qué procede cuando existen daños materiales por colisión en 2 vehículos asegurados con diferentes aseguradoras y se demuestra que uno fu culpable?","options":[{"key":"a","text":"Se reparan ambos autos sin deducible"},{"key":"b","text":"Se repara cada vehículo con su propia póliza y sólo el responsable paga deducible"}],"correct":"b"},{"id":66,"text":"¿En qué plazo deberá indemnizar la aseguradora a un asegurado, una vez que ha sido entregada la documentación requerida","options":[{"key":"a","text":"45 días"},{"key":"b","text":"30 días"}],"correct":"b"},{"id":67,"text":"¿En qué coberturas no aplica la reinstalación automática?","options":[{"key":"a","text":"Robo total, Responsabilidad civil bienes, gastos medico ocupantes"},{"key":"b","text":"Adaptaciones y conversiones, Responsabilidad civil por daños del viajero, Auto sustituto"}],"correct":"b"},{"id":68,"text":"Elige 2 situaciones donde el asegurado tiene derecho a que se le devuelvan las primas no devengadas:","options":[{"key":"a","text":"Considerar terminado el contrato anticipadamente, Perdida del vehículo y que se hayan contratado 2 o más coberturas"},{"key":"b","text":"No haber lesiones en los ocupantes, no presentar ningún siniestro después de varios años de asegura"}],"correct":"a"},{"id":69,"text":"Se tienen la cobertura Amplia, al cuarto mes de vigencia, una colisión se determina la pérdida total. ¿qué ocurre con las primas de las coberturas no afectadas?","options":[{"key":"a","text":"Las absorbe la aseguradora por ley"},{"key":"b","text":"La devuelve a prorrata"}],"correct":"b"},{"id":70,"text":"El conductor de un camión de transporte de carga mexicano, causa daños a 2 vehículos en El Paso, Texas; el seguro no ampara los daños a terceros. ¿En qué cláusula se establece?","options":[{"key":"a","text":"Competencia"},{"key":"b","text":"Territorialidad."}],"correct":"b"},{"id":71,"text":"Los vehículos residentes son aquellos que:","options":[{"key":"a","text":"Son fabricados únicamente en México y pueden circular con placas nacionales"},{"key":"b","text":"Son fabricados en México o en el extranjero pudiendo circular con placas nacionales"}],"correct":"b"},{"id":72,"text":"Los vehículos valuados son aquellos que:","options":[{"key":"a","text":"Son fabricados en México o en el extranjero se consideran clásicos o tienen antigüedad mayor a 15 años."},{"key":"b","text":"Son fabricados en el extranjero, son clásicos o con antigüedad mayor de 15 años"}],"correct":"a"},{"id":73,"text":"Los vehículos turistas son aquellos que:","options":[{"key":"a","text":"Son vehículos con placas vigentes de otros países"},{"key":"b","text":"Son vehículos fabricados en el país que transitan por las ciudades fronterizas."}],"correct":"a"},{"id":74,"text":"Los vehículos que tienen autorización con limite territorial de circulación","options":[{"key":"a","text":"Turistas"},{"key":"b","text":"Fronterizos"}],"correct":"b"}]},{"id":"hogar","label":"Hogar (Casa Habitación)","theory":[{"title":"Tipos de seguros: por la relación de la Suma Asegurada con el Valor de los bienes (Interés asegurable)","content_md":"## Tipos de seguros (pág. 1)\n\n### Por la relación de la Suma Asegurada con el Valor de los bienes (Interés asegurable)\n\n| Proporcional | A Primer Riesgo |\n|---|---|\n| Si al momento de ocurrir un siniestro, existe bajoseguro, la aseguradora indemniza el valor del siniestro en la misma proporción que exista entre la suma asegurada y el valor real de los bienes. | No se aplica la proporción indemnizable, se paga el total de la pérdida sufrida. La suma asegurada es la cantidad máxima que se indemniza. |\n\n### Ejercicios impresos (con respuestas manuscritas)\n\n1. Si un asegurado tiene bienes que valen $ 1'000,000.00, y determina una suma asegurada de $ 600,000.00; cuando tiene un siniestro cuyo valor de recuperación es de $ 500,000.00, ¿Cuánto se indemniza en seguro proporcional? **[manuscrito] $ 300,000** ¿cuánto a primer riesgo? **[manuscrito] $ 500,000**\n2. El valor real de los bienes asegurados es de $ 5'000,000.00, la suma asegurada es por $ 1'000,000.00; si el valor del siniestro es de $ 2'000,000.00: ¿Cuánto se indemniza en seguro proporcional? **[manuscrito] $ 400,000** — En seguro a primer riesgo **[manuscrito] $ 1,000,000 \"Porque no hay proporción indemnizable\"**\n\n### Notas manuscritas en la página\n\n- Arriba: \"Proporción indemnizable es igual a = suma asegurada ÷ valor real de los bienes × valor del siniestro\"\n- \"6,000. ÷ 1,000,000 = 0.6 × 500,000 = 300,000\" [sic, se refiere a 600,000 ÷ 1,000,000]\n- Abajo: \"1,000,000 ÷ 5,000,000 = 0.2 × 2,000,000 = 400,000\"\n- Al margen izquierdo: \"Aprender\""},{"title":"Valor Asegurable","content_md":"## Valor Asegurable (pág. 1)\n\n| Valor Real | Valor de Reposición | Valor convenido | Valor de Avalúo |\n|---|---|---|---|\n| Se indemniza el valor que los bienes tengan al momento del siniestro descontando la depreciación por uso (Valor de usado) | Se indemniza el valor de los bienes al momento del siniestro sin descontar la depreciación por uso (valor de nuevo) | Cuando no es posible determinar el valor real, ambas parte acuerdan un valor indemnizable, normalmente es más alto que el valor real. | Valor determinado por peritos. Aplica en obras de arte y en objetos raros de difícil o imposible reposición |"},{"title":"Estructura del Seguro de Hogar","content_md":"## Estructura del Seguro de Hogar (pág. 1)\n\n| Ramos | Secciones (Cada sección opera como seguro independiente) | Valor Asegurable | Tipo se Seguro |\n|---|---|---|---|\n| Incendio | Edificio | Valor de Reposición | Proporcional |\n| Incendio | Contenidos | Valor de Reposición | Proporcional |\n| Diversos | Cristales | Valor de Reposición | A primer Riesgo |\n| Diversos | Robo Con Violencia | Valor Real | A primer Riesgo |\n| Diversos | Equipo Electrodoméstico | Valor de Reposición | Proporcional |\n| R. C. | R. C. Familiar | — | Indemniza los daños, perjuicios, daños moral consecuencia y los gastos de defensa durante un juicio en materia de responsabilidad civil. |\n| Accidentes Personales | A. P. Familiar | — | Ampara una suma asegurad por muerte accidental de algún miembro de la familia (excepto menores de 12 años). También ampara las pérdidas orgánicas accidentales que sufran los miembros de la familia. |"},{"title":"Cotización Seguro de Incendio (Secciones Edificio y Contenidos)","content_md":"## Cotización Seguro de Incendio (Secciones Edificio y Contenidos) (pág. 1)\n\n### Cuota básica\n- Se aplica en casas de construcción maciza\n- Incluye los riesgos de incendio y rayo.\n- Si la casa o departamento está en edificios da hasta 5 niveles, incluye la Extensión de Cubierta\n- Si en la casa existen negocios, se cotiza con la cuota del negocio.\n- Si un edificio de departamentos tiene un negocio que ocupe menos del 10% de la superficie construida, se cotiza como casa.\n\n### Recargos\n- **Por construcción**, se aplica cuando el techo o los muros tienen materiales combustibles\n- **Por protección Municipal**, se aplica en ubicaciones donde el servicio de agua y de bomberos deficiente.\n\n### Descuentos\n- **Núcleos Habitacionales**: Descuento del 15%.\n- Se requieren mínimo 40 casas o departamento y la suma asegurada máxima por casa debe ser de 15 veces el salario anual mínimo general del D. F."},{"title":"Descripción de Bienes por Sección","content_md":"## Descripción de Bienes (pág. 2)\n\n### Edificio\n- **Básicos**: La obra negra; Los acabados y Las instalaciones fijas o semifijas (sistemas de tuberías); En Condominios, la proporción de áreas comunes\n- **Por Convenio Expreso**: Para Huracán y Granizo: Molinos de viento, Antenas, Torres, Toldos. Para Terremoto y/o Erupción Volcánica: Construcciones adicionales a la principal (Bardas, patios, albercas, jardines, Fuentes)\n- **Excluidos**: Terreno; Cimientos\n\n### Contenidos\n- **Básicos**: Conjunto de bienes que se encuentran dentro de la casa, por ejemplo: El menaje, La ropa, Los aparatos electrodomésticos, Artículos decorativos, Joyas, etc\n- **Por Convenio Expreso**: Obras de arte u objetos raros, de difícil o imposible reposición, cuyo valor exceda de 300 días SMGVDF; Contenidos en refrigeradores; Lingotes de oro o plata; Piedras preciosas sin montar; Planos, croquis, manuscritos, patrones\n- **Excluidos**: Dinero en efectivo; Títulos financieros; Libros de contabilidad; Inventarios y otros comerciales\n\n### Cristales\n- **Básicos**: Cristales debidamente colocados, que formen parte de la construcción y midan 4 mm o más: Muros, Ventanas, Puertas, Tragaluces\n- **Por Convenio Expreso**: Cristales como contenidos: Cubiertas, Vitrinas, Lunas o espejos, Peceras. Cristales decorados: Polarizados, Plateados, Dorados, etc. Cristales que no estén debidamente colocados\n- **Excluidos**: Cristalería como copas, vasos, vajillas; Candiles, lámparas; Cristales con grosor menor a 4 milímetros\n\n### Robo con Violencia\n- **Básicos — Inciso 1**: a) Menaje de casa; b) Artículos deportivos, eléctricos o electrónicos, de música; obras de arte u objetos raros cuyo valor no exceda 150 días del salario mínimo general vigente en el D. F.; c) Dinero, instrumentos financieros (cheques, letras de cambio, pagarés, acciones) hasta por 150 días de salario mínimo general vigente en el D. F.\n- **Por Convenio Expreso — Inciso 2**: Artículos del inciso 1-b, cuyo valor exceda 150 días del salario mínimo general vigente en el D. F.: Artículos deportivos, Eléctricos o electrónicos, De música; Obras de arte u objetos raros. **Inciso 3**: Joyas o alhajas, Piezas de oro o plata, Relojes, Colecciones, Pieles preciosas, Armas\n- **Excluidos**: Bienes a la Intemperie: En patios, Azoteas, Jardines, Pasillos. Bienes de negocios que se realicen dentro de la casa del asegurado. Otros: Timbres postales o fiscales\n\n### Equipos Electrodomésticos\n- **Básicos**: Aparatos que utilicen electricidad y tengan un costo mayor al deducible (refrigerador, televisión, hornos, lavadoras, etc.)\n- **Por Convenio Expreso**: No tiene\n- **Excluidos**: Equipos que sean para negocio"},{"title":"Descripción de Coberturas Edificio y Contenidos: Cobertura Básica y Coberturas Adicionales","content_md":"## Descripción de Coberturas Edificio y Contenidos (pág. 3)\n\n### Cobertura Básica\n- **Riesgos Cubiertos**: *Riesgos Nombrados*: Incendio y/o Rayo. *Todo Riesgo*: Incendio, rayo, explosión, naves aéreas, vehículos y humo, huelgas y alborotos populares, Rotura de tuberías, derrame accidental de agua\n- **Riesgos Por Convenio Expreso**: Sólo tiene bienes que se aseguran por convenio expreso\n- **Riesgos Excluidos**: Vicio Propio; Guerra; Actos de Autoridad; Dolo o mala fe; Robos durante el siniestro; Corto circuito, arco voltaico, sobrecargas eléctricas en máquinas\n- **Deducible**: No tiene\n\n### Coberturas Adicionales\n\n#### Explosión\n- Riesgos Cubiertos: Explosión Interna, Explosión Externa\n- Por Convenio Expreso: No tiene\n- Excluidos: El aparato que explota\n- Deducible: No tiene\n\n#### Huracán y Granizo\n- Riesgos Cubiertos: Granizo, Ciclón, Huracán, Vientos Tempestuosos\n- Por Convenio Expreso: Torres, antenas, toldos, molinos; Edificios en Construcción; Nieve; Derrame accidental de agua; Rotura de tuberías; Obstrucción de Bajadas por granizo\n- Excluidos: Marejada o inundación; Cultivos en Pie; Filtraciones por vicios de la construcción; Aguas freáticas; Falta o insuficiencia de drenaje; Edificios sin uno mas muros o sin techo\n- Deducible: 1% sobre la S. A. con un máximo del equivalente a 750 días del S. M. Gral. del D. F.\n\n#### Naves Aéreas, Vehículos y Humo\n- Riesgos Cubiertos: Caídas de naves aéreas terceros u objetos caídos de ellas; Colisión de vehículos de terceros; Humo o Tizne que provengan del exterior\n- Por Convenio Expreso: Caída de Naves aéreas u objetos Caídos de ellas o Colisión de vehículos propiedad o al servicio del asegurado o sus inquilinos\n- Excluidos: Daños por humo a chimeneas; Humo que se genere dentro del predio si no hay conductos o chimeneas para su escape\n- Deducible: 1% S/S. A. máximo 750 días del S. M. Gral. del D. F.\n\n#### Huelgas y Alborotos Populares\n- Riesgos Cubiertos: Huelgas, disturbios obreros; Mítines, Motines; Alborotos populares; Actos de autoridades para reprimirlos; Actos vandálicos\n- Por Convenio Expreso: No tiene\n- Excluidos: Robos durante el siniestro; Depreciación o demora de mercado; Carencia o escasez de energia; Cambios de temperatura o humedad; Pérdidas consecuenciales\n- Deducible: 1% sobre la S. A. con un máximo del equivalente a 750 días del S. M. Gral. del D. F.\n\n#### Extensión de Cubierta\n- Riesgos Cubiertos: Explosión; Huracán y Granizo; Naves Aéreas, Vehículos, humo o tizne, propios o de terceros; Huelgas y alborotos Populares; Rotura de tubería; Derrame accidental de agua; Obstrucción de bajadas pluviales por granizo; Caída de árboles; Caída de antenas\n- Por Convenio Expreso: Daños por nieve; Bienes a la intemperie; Bienes a la intemperie [sic, aparece dos veces]; Edificios en construcción; Molinos de viento; Toldos\n- Excluidos: Daños a calderas por su propia explosión; Marejada o inundación; Cultivos en pie; Filtraciones por vicios de la construcción; Filtraciones de aguas subterráneas; Robos durante el siniestro; Demora o pérdida de mercado; Pérdidas consecuenciales; Cambios de temperatura; Carencia o escasez de energía; Daños a chimeneas o humos internos\n- Deducible: 1% sobre la suma asegurada con un máximo del equivalente a 750 días del salario mínimo general del D. F."},{"title":"Coberturas Adicionales (continúa): Inundación, Terremoto, Remoción de Escombros y Gastos Extras","content_md":"## Descripción de Coberturas Edificio y Contenidos (continúa) (pág. 4)\n\n#### Inundación\n- Riesgos Cubiertos: Desbordamiento de: Ríos, Lagos, Lagunas, Otras fuentes naturales o artificiales; Rompimiento de compuertas de presas\n- Por Convenio Expreso: Instalaciones fijas que se encuentren bajo cobertizos o sotechados\n- Excluidos: Cultivos en pie, bienes a la intemperie; Sistemas de desagüe o canales; Instalaciones subterráneas; Construcciones abajo del nivel del piso; Construcciones y contenidos sobre agua; Insuficiencia del drenaje, aguas freáticas\n- Deducible: 1% S/SA máximo 1500 días del SMGDF\n- Coaseguro: 20%\n\n#### Terremoto y/o Erupción Volcánica\n- Riesgos Cubiertos: Sismos; Derrame de lava; Emanación de ceniza volcánica\n- Por Convenio Expreso: Cimientos, Albercas, Bardas, Escaleras exteriores, Otras construccion es separadas de la principal, Frescos o murales\n- Excluidos: Suelos y terrenos; Edificios en construcción; Edificios no terminados; Reacciones nucleares; Contaminación radioactiva; marejada o inundación; desplazamientos o asentamientos normales del suelo, no repentinos\n- Deducible: Zonas A, B, B1, C, D, E, F, I: 2% — H1 y H2 3% — G 4% — J 5%; Se aplican S/S. A\n- Coaseguro: Zonas: A,B,C y D 10% — B1, E, F 25% — G, H1, H2, I, J 30%\n\n#### Remoción de Escombros (funciona a primer riesgo)\n- Riesgos Cubiertos: Gastos de: desmontaje, demolición, Limpieza, Acarreos de escombro. Motivada por siniestros causados por: Incendio y/o rayo, o cualquier cobertura adicional amparada\n- Por Convenio Expreso: Los mismos que aplican a cada cobertura (básica o adicional)\n- Excluidos: Los riesgos no cubiertos y las exclusiones en cada cobertura (básica o adicional), Remoción ordenada por autoridades o por decisión del asegurado sin haber siniestro\n- Deducible: No tiene — Coaseguro: No aplica\n\n#### Gastos Extras\n- Riesgos Cubiertos: Renta de casa provisional; Hospedaje; Mudanza; Almacenaje de muebles\n- Por Convenio Expreso: Los mismos que aplican a cada cobertura (básica o adicional)\n- Excluidos: Los riesgos no cubiertos y las exclusiones en cada cobertura (básica o adicional), Remoción ordenada por autoridades o por decisión del asegurado sin haber siniestro\n- Deducible: No tiene — Coaseguro: No tiene\n\n*Nota: en el margen izquierdo de la página las palabras \"Adicionales\" y \"Coberturas\" aparecen encerradas a mano.*"},{"title":"Descripción de Coberturas de la sección de Cristales","content_md":"## Descripción de Coberturas de la sección de Cristales (pág. 4)\n\n| Riesgos Básicos | Por Convenio Expreso | Exclusiones | Deducible |\n|---|---|---|---|\n| Daños materiales y pérdidas por rotura accidental (valor de reposición mas gastos de colocación) | Rotura durante mantenimiento del cristal; Rotura durante mantenimiento del Inmueble | Raspaduras o ralladuras; Actos Bélicos o de Autoridad; Vicio propio; Cristales menores a 4 mm; Cristalería (copas, vasos, etc.) | 5% del cristal con mínimo de 2 días en casa sola o 3 días en condominio |"},{"title":"Descripción de Coberturas Sección de Robo con Violencia","content_md":"## Descripción de Coberturas Sección de Robo con Violencia (pág. 5)\n\n### Riesgos Básicos\n- Pérdida de contenidos o daños materiales a inmuebles y contenidos Por **Robo con violencia**, o (se perpetra cuando no hay personas en la casa y el ladrón deja señas visibles de violencia del exterior al interior)\n- Pérdida de contenidos o daños materiales a inmuebles y contenidos Por **Asalto con violencia física o moral** (ocurre cuando el ladrón ejerce presión física o moral sobre los habitantes de la casa)\n\n### Exclusiones\n- Bienes en patios o azoteas\n- Robos durante siniestros\n- Huelgas y Alborotos populares\n- Robos en que participe el asegurado o sus dependientes\n- Actos de autoridad\n- Contenidos de negocios\n\n### Deducible\n- Bienes asegurados en el Inciso 1: 10% sobre suma asegurada\n- Bienes asegurados bajo los Incisos 2 y 3: 20% sobre suma asegurada de los bienes afectados. **La mitad si hay alarma al momento del siniestro.**"},{"title":"Equipo Electrodoméstico","content_md":"## Equipo Electrodoméstico (pág. 5)\n\n### Riesgos Básicos\n- Impericia, descuido, sabotaje.\n- Corto circuito, arco voltaico, sobrecargas eléctricas\n- Introducción de cuerpos extraños.\n- Daños pro fuerza centrífuga\n- Defectos de fabricación (mano de obra o materiales)\n\n### Exclusiones\n- Daños superficiales o estéticos\n- Actos Bélicos o de Autoridad\n- Desgaste natural, vicio propio\n- Riesgos que se cubren en incendio o robo\n\n### Deducible\n- 15 días del salario mínimo general vigente en el D. F.\n\n| Suma Asegurada | Indemnización por Pérdida Parcial | Indemnización por Pérdida Total |\n|---|---|---|\n| Valor de Reposición de los bienes | A valor de reposición: Valor factura, gastos de transporte, aduanas, montaje y desmontaje, impuestos y mano de obra | El valor real de los bienes. Existe cuando la reparación iguala o supera este valor |"},{"title":"Descripción de Coberturas Sección de Responsabilidad Civil Familiar","content_md":"## Descripción de Coberturas Sección de Responsabilidad Civil Familiar (pág. 5)\n\n### Definiciones\n- **R. C. Subjetiva**: El daño se causa por impericia, descuido o negligencia.\n- **R. C. Objetiva**: El daño se causa por uso o posesión de bienes peligrosos\n- **Daño**: Pérdida o menoscabo de la integridad física o los bines [sic]\n- **Perjuicios**: Falta de ganancias legales por causa del daño\n- **Daño Moral**: Daño a sentimientos, afectos, creencias, honor, decoro, configuración física o imagen\n\n### Alcance de la Póliza\n- Indemnización al tercero: Daños; Perjuicio; Daño Moral Consecuencial\n- Gastos para demandas en materia de R. C.: Suma asegurada adicional del 50% para: Honorarios de abogados; Fianzas de garantía; Gastos de ejecución o liquidación; Gastos y Costes\n\n### Asegurados\n- Contratante; Cónyuge o concubina; Hijos hasta 18 años; Hijas que dependan y vivan con él; Pupilos; Padres que vivan y dependan; Empleados domésticos\n\n### Cobertura Básica\n- Propietario o usuario de una o varias casas\n- Uso de bicicletas o lanchas de remo o pedal\n- Práctica de deportes como aficionado\n- Daños causados por animales domésticos (Guardia o caza)\n- Daños a las áreas indivisas en la proporción de los demás condóminos\n- Daños por actividades familiares dentro de la República Mexicana\n- Uso o posesión de armas de fuego\n\n### Coberturas adicionales\n- Daños en el extranjero\n- R.C. Arrendatario (Daños al inmueble por Incendio o explosión)\n- Daños por obras de ampliación reconstrucción o remodelación\n- Daños a bienes de terceros que estén bajo la custodia del asegurado por arrendamiento (excepto Autos)\n\n### Exclusiones\n- Incumplimiento de contratos\n- Prestaciones en sustitución del incumplimiento de contratos\n- Daños a colindantes por error en cimentaciones o apuntalamientos\n- Daños causados por automóviles, barcos o aviones\n- Daños que sufran los asegurados\n- Responsabilida d civil profesional\n- Daños a terceros de actividades empresariales"}],"questions":[{"id":1,"text":"El seguro de Hogar se define de la siguiente manera:","options":[{"key":"a","text":"Es un paquete que incluye distintos seguros para proteger el patrimonio familiar"},{"key":"b","text":"Es una póliza que integra todas las coberturas que requiere la protección del patrimonio familiar"}],"correct":"a"},{"id":2,"text":"De la siguiente lista elige los ramos que integran el seguro de hogar: 1. Incendio 2. Agrícola y de animales 3. Diversos 4. Responsabilidad Civil y Riesgos profesionales 5. Gastos Médicos 6. Accidentes Personales","options":[{"key":"a","text":"1, 3, 4, 6"},{"key":"b","text":"1, 4, 5, 6"}],"correct":"a","list":{"stem":"De la siguiente lista elige los ramos que integran el seguro de hogar:","kind":"num","items":[{"k":"1","text":"Incendio"},{"k":"2","text":"Agrícola y de animales"},{"k":"3","text":"Diversos"},{"k":"4","text":"Responsabilidad Civil y Riesgos profesionales"},{"k":"5","text":"Gastos Médicos"},{"k":"6","text":"Accidentes Personales"}]},"handwritten_note":"Palomas manuscritas junto a las opciones 1, 3, 4 y 6 de la lista"},{"id":3,"text":"Las Secciones del Ramo de incendio son:","options":[{"key":"a","text":"Edificio y Contenidos."},{"key":"b","text":"Edifico y Responsabilidad Civil"}],"correct":"a"},{"id":4,"text":"En diversos se incorporan las siguientes Secciones:","options":[{"key":"a","text":"Robo, asalto, dinero y valores, cristales, equipo electrónico y contenidos."},{"key":"b","text":"Robo con violencia y/o asalto, cristales y equipo electrodoméstico."}],"correct":"b"},{"id":5,"text":"La sección del seguro de hogar que ampara el apropiamiento ilícito de los bienes del asegurado es:","options":[{"key":"a","text":"Contenidos"},{"key":"b","text":"Robo con Violencia"}],"correct":"b","handwritten_note":"En domicilio"},{"id":6,"text":"Las siguientes son secciones del seguro para el hogar, EXCEPTO:","options":[{"key":"a","text":"Rotura de Cristales"},{"key":"b","text":"Equipo Electrónico"}],"correct":"b"},{"id":7,"text":"¿Cuántas casas debe integrar como mínimo el núcleo habitacional, para que se aplique el descuento denominado núcleos habitacionales?","options":[{"key":"a","text":"40 casas o departamentos"},{"key":"b","text":"50 casas o departamentos"}],"correct":"a"},{"id":8,"text":"¿Cuál debe ser la suma asegurada de cada vivienda, para que se aplique el descuento denominado núcleos habitacionales?","options":[{"key":"a","text":"Igual o menor a 30 veces el salario mínimo anual vigente en el DF"},{"key":"b","text":"Igual o menor a 15 veces el salario mínimo anual vigente en el DF"}],"correct":"b"},{"id":9,"text":"En una casa habitación que tiene hasta 5 niveles, ¿Qué cobertura incluye la cuota básica aplicada en las secciones de incendio Edificio y Contenidos?","options":[{"key":"a","text":"Básica y extensión de cubierta"},{"key":"b","text":"Básica y explosión"}],"correct":"a"},{"id":10,"text":"Por el objetivo que tiene un seguro de hogar, la Suma Asegurada debe corresponder a:","options":[{"key":"a","text":"El interés asegurable que representa el valor de los bienes expuestos a riesgo"},{"key":"b","text":"El valor por el cual el asegurado vendería sus bienes"}],"correct":"a"},{"id":11,"text":"Cuando la suma asegurada determinada por el asegurado, es menor al valor de los bienes expuestos a riesgo, se generan dos sistemas de aseguramiento, ¿Cuáles son?","options":[{"key":"a","text":"Seguros a todo riesgo y Riesgos Nombrados"},{"key":"b","text":"Seguro proporcional y Seguro a Primer Riesgo"}],"correct":"b","handwritten_note":"Bajo seguro (escrito sobre la frase subrayada \"suma asegurada determinada\")"},{"id":12,"text":"La condición que permite a la institución de seguro pagar una cantidad menor al valor del siniestro es:","options":[{"key":"a","text":"Cláusula de proporcionalidad."},{"key":"b","text":"Primer riesgo."}],"correct":"a","handwritten_note":"Primer riesgo (manuscrito subrayado sobre el texto de la pregunta)"},{"id":13,"text":"La indemnización por perder en un siniestro $ 200,000.00 cuando los bienes asegurados tenían un valor de 1'000,000.00 pero se aseguraron por $ 500,000.00","options":[{"key":"a","text":"$ 100,000."},{"key":"b","text":"$ 200,000."}],"correct":"a","handwritten_note":"Seguro proporcional. Al pie de la página: \"500,000 ÷ 1,000,000 = 0.5 × 200,000 = 100,000\""},{"id":14,"text":"Es la modalidad de aseguramiento que elimina el criterio de proporcionalidad:","options":[{"key":"a","text":"Valor de reposición."},{"key":"b","text":"Primer riesgo."}],"correct":"b"},{"id":15,"text":"El valor que considera el importe necesario para recuperar el bien dañado, tomando el precio de nuevo menos la depreciación por uso es:","options":[{"key":"a","text":"El valor de reposición."},{"key":"b","text":"El valor real."}],"correct":"b"},{"id":16,"text":"¿Cómo se llama al valor que se indemniza, sin considerar la depreciación física por uso?","options":[{"key":"a","text":"Reposición"},{"key":"b","text":"Real"}],"correct":"a"},{"id":17,"text":"En la póliza de seguro de hogar se ampara:","options":[{"key":"a","text":"El terreno, los contenidos y la construcción."},{"key":"b","text":"Los contenidos y la construcción sin el terreno."}],"correct":"b"},{"id":18,"text":"De la siguiente lista, elija 3 partes del edificio que se aseguran en la sección de incendio: 1. Cimientos 2. Plafones 3. Alfombras 4. Tapetes 5. Bardas","options":[{"key":"a","text":"1, 3, 5"},{"key":"b","text":"2, 3, 5"}],"correct":"b","list":{"stem":"De la siguiente lista, elija 3 partes del edificio que se aseguran en la sección de incendio:","kind":"num","items":[{"k":"1","text":"Cimientos"},{"k":"2","text":"Plafones"},{"k":"3","text":"Alfombras"},{"k":"4","text":"Tapetes"},{"k":"5","text":"Bardas"}]},"handwritten_note":"Palomas manuscritas junto a 2 (Plafones), 3 (Alfombras) y 5 (Bardas)"},{"id":19,"text":"¿En qué caso son asegurables las obras de arte en una póliza paquete de casa habitación?","options":[{"key":"a","text":"Al presentar relación de facturas y fotos"},{"key":"b","text":"Con previo avalúo y convenio expreso"}],"correct":"b","handwritten_note":"Nota manuscrita en la parte superior de la página: \"Extensión de cubierta: Es una cobertura adicional que empaqueta las siguientes coberturas: Explosión, Huracán y granizo, naves aéreas, vehículos y humo y Huelgas y alborotos populares\""},{"id":20,"text":"Qué bienes se excluyen de la sección de incendio de la póliza de hogar","options":[{"key":"a","text":"Dinero, títulos y libros de contabilidad"},{"key":"b","text":"Planos, Croquis, o dibujos"}],"correct":"a","handwritten_note":"Por convenio expresso (junto a la opción b)"},{"id":21,"text":"¿Qué riesgos se amparan en forma básica en las secciones de edificio y contenidos?","options":[{"key":"a","text":"Incendio y/o explosión."},{"key":"b","text":"Incendio y / o rayo"}],"correct":"b"},{"id":22,"text":"Para que se considere incendio debe existir:","options":[{"key":"a","text":"El registro de aviso a las unidades de bomberos."},{"key":"b","text":"La combustión accidental que produzca flama."}],"correct":"b"},{"id":23,"text":"Cómo se consideran los daños materiales que causan los bomberos al extinguir un incendio en la casa asegurada","options":[{"key":"a","text":"Cobertura Básica"},{"key":"b","text":"Cobertura Adicional"}],"correct":"a"},{"id":24,"text":"Es una exclusión de la cobertura de Incendio:","options":[{"key":"a","text":"Impacto de rayo en antenas."},{"key":"b","text":"Destrucción por actos de autoridad."}],"correct":"b"},{"id":25,"text":"Como se considera la explosión del boyler dentro de la sección de Contenidos en la póliza de hogar","options":[{"key":"a","text":"Excluido de la cobertura básica el boyler y cubierto los daños al inmueble"},{"key":"b","text":"Excluido de la cobertura de explosión el boyler y cubierto el daño al inmueble"}],"correct":"b","handwritten_note":"cobertura adicional (manuscrito al margen derecho, parcialmente cortado)"},{"id":26,"text":"Del listado siguiente, elija las 4 coberturas adicionales de incendio dentro de la póliza de paquete familiar: 1. Granizo, ciclón y huracán 2. Combustión espontánea 3. Terremoto y erupción volcánica 4. Huelgas y alborotos populares 5. Rotura de cristales 6. Aviones, vehículos y humo","options":[{"key":"a","text":"1, 2, 4, 6"},{"key":"b","text":"1, 3, 4, 6"}],"correct":"b","list":{"stem":"Del listado siguiente, elija las 4 coberturas adicionales de incendio dentro de la póliza de paquete familiar:","kind":"num","items":[{"k":"1","text":"Granizo, ciclón y huracán"},{"k":"2","text":"Combustión espontánea"},{"k":"3","text":"Terremoto y erupción volcánica"},{"k":"4","text":"Huelgas y alborotos populares"},{"k":"5","text":"Rotura de cristales"},{"k":"6","text":"Aviones, vehículos y humo"}]},"handwritten_note":"Palomas manuscritas junto a 1, 3, 4 y 6"},{"id":27,"text":"Los siguientes se excluyen de Huracán y Granizo, pero se pueden asegurar por convenio expreso:","options":[{"key":"a","text":"Antenas, toldos, torres"},{"key":"b","text":"Los que se encuentren en los sótanos"}],"correct":"a"},{"id":28,"text":"Es una exclusión de la cobertura de huracán y granizo.","options":[{"key":"a","text":"Los daños ocasionados a bienes que se encuentren a la intemperie."},{"key":"b","text":"La filtración de granizo por grietas o aberturas en el inmueble."}],"correct":"b"},{"id":29,"text":"Por huelgas y alborotos populares se entiende:","options":[{"key":"a","text":"La alteración del orden público, ocasionada por vándalos."},{"key":"b","text":"Las manifestaciones de carácter obrero, estudiantil o político."}],"correct":"b"},{"id":30,"text":"Es una exclusión de la cobertura de huelgas y alborotos populares:","options":[{"key":"a","text":"La ratería o hurto perpetrado por terceros durante la manifestación."},{"key":"b","text":"Las pintas que los manifestantes hagan a las paredes exteriores de la casa asegurada."}],"correct":"a"},{"id":31,"text":"Es una exclusión definitiva de la cobertura de Vehículos y humo:","options":[{"key":"a","text":"Los daños que ocasionen vehículos propiedad del asegurado."},{"key":"b","text":"Daños a chimeneas"}],"correct":"b","handwritten_note":"Por convenio (manuscrito al margen derecho, parcialmente cortado)"},{"id":32,"text":"De la lista siguiente, identifique 3 riesgos que incluye la cobertura denominada Extensión de Cobertura: 1. Vehículos 2. Actos vandálicos 3. Erupción volcánica 4. Derrame accidental de agua 5. Marejada 6. Nevada o helada","options":[{"key":"a","text":"1, 3, 5"},{"key":"b","text":"1, 2, 4"}],"correct":"b","list":{"stem":"De la lista siguiente, identifique 3 riesgos que incluye la cobertura denominada Extensión de Cobertura:","kind":"num","items":[{"k":"1","text":"Vehículos"},{"k":"2","text":"Actos vandálicos"},{"k":"3","text":"Erupción volcánica"},{"k":"4","text":"Derrame accidental de agua"},{"k":"5","text":"Marejada"},{"k":"6","text":"Nevada o helada"}]},"handwritten_note":"Palomas manuscritas junto a 1, 2 y 4"},{"id":33,"text":"De la siguiente lista, identifica los riesgos que se integran en el concepto \"Todo Riesgo\" para Incendio: 1. Incendio 2. Marejada 3. Explosión 4. Terremoto 5. Derrame accidental de agua 6. Huracán 7. Rotura de tuberías","options":[{"key":"a","text":"1, 2, 4, 6"},{"key":"b","text":"1, 3, 5, 7"}],"correct":"b","list":{"stem":"De la siguiente lista, identifica los riesgos que se integran en el concepto \"Todo Riesgo\" para Incendio:","kind":"num","items":[{"k":"1","text":"Incendio"},{"k":"2","text":"Marejada"},{"k":"3","text":"Explosión"},{"k":"4","text":"Terremoto"},{"k":"5","text":"Derrame accidental de agua"},{"k":"6","text":"Huracán"},{"k":"7","text":"Rotura de tuberías"}]},"handwritten_note":"Al margen izquierdo: \"- Fenómenos idrometeorológicos [sic] - Terremoto y erupción volcánica\". Palomas junto a 1, 3, 5 y 7. Al pie de la página: \"Todo riesgo de incendio: Es un paquete de cobertura básica más extensión de cubierta pero se excluye huracán y granizo\""},{"id":34,"text":"¿Qué riesgo se ampara dentro de la cobertura de Inundación de las secciones de Edificios y Contenidos?","options":[{"key":"a","text":"Acción normal de la marea"},{"key":"b","text":"Desbordamiento de ríos"}],"correct":"b"},{"id":35,"text":"La cobertura de terremoto se considera:","options":[{"key":"a","text":"Extensión de cubierta en la póliza de hogar, por ello no lleva deducible."},{"key":"b","text":"Catastrófica, por ello lleva deducible y coaseguro."}],"correct":"b"},{"id":36,"text":"¿Cuáles de los riesgos siguientes se aseguran en forma básica en la cobertura de Terremoto y/o erupción volcánica? 1. Sismo 2. Acoplamiento del suelo 3. Vibraciones del suelo 4. Emanación de ceniza volcánica 5. Derrame de lava volcánica 6. Maremotos","options":[{"key":"a","text":"2, 3, 6"},{"key":"b","text":"1, 4, 5"}],"correct":"b","list":{"stem":"¿Cuáles de los riesgos siguientes se aseguran en forma básica en la cobertura de Terremoto y/o erupción volcánica?","kind":"num","items":[{"k":"1","text":"Sismo"},{"k":"2","text":"Acoplamiento del suelo"},{"k":"3","text":"Vibraciones del suelo"},{"k":"4","text":"Emanación de ceniza volcánica"},{"k":"5","text":"Derrame de lava volcánica"},{"k":"6","text":"Maremotos"}]},"handwritten_note":"Palomas manuscritas junto a 1, 4 y 5"},{"id":37,"text":"Las siguientes son exclusiones definitivas de la Cobertura de Terremoto y/o erupción volcánica, EXCEPTO:","options":[{"key":"a","text":"Vibraciones o acoplamientos naturales del suelo"},{"key":"b","text":"Patios, fuentes y albercas"}],"correct":"b","handwritten_note":"Por convenio expres[o] (manuscrito al margen derecho, parcialmente cortado)"},{"id":38,"text":"Las siguientes son combinaciones de deducible y coaseguro en la cobertura de Terremoto y/o Erupción Volcánica, EXCEPTO:","options":[{"key":"a","text":"2% y 10%"},{"key":"b","text":"5% y 20%"}],"correct":"b"},{"id":39,"text":"Relaciona ambas columnas identificando el coaseguro que se aplica en cada zona sísmica: Zona sísmica: 1. A, B, C, D 2. B1, E, F 3. G, H1, I, J — Coaseguro: a) 30% b) 10% c) 25% d) 20%","options":[{"key":"a","text":"1 b, 2 c, 3 a"},{"key":"b","text":"1 a, 2b, 3 c"}],"correct":"a","match":{"stem":"Relaciona ambas columnas identificando el coaseguro que se aplica en cada zona sísmica:","cols":[{"label":"Zona sísmica","kind":"num","items":[{"k":"1","text":"A, B, C, D"},{"k":"2","text":"B1, E, F"},{"k":"3","text":"G, H1, I, J"}]},{"label":"Coaseguro","kind":"let","items":[{"k":"a","text":"30%"},{"k":"b","text":"10%"},{"k":"c","text":"25%"},{"k":"d","text":"20%"}]}]},"handwritten_note":"Líneas manuscritas cruzadas que relacionan las zonas sísmicas con el coaseguro"},{"id":40,"text":"La cobertura de remoción de escombros para el seguro de hogar opera:","options":[{"key":"a","text":"Como seguro proporcional"},{"key":"b","text":"Como seguro a primer riesgo"}],"correct":"b"},{"id":41,"text":"Renta de casa, mudanza, hospedaje, son los conceptos que se pagan en la cobertura de:","options":[{"key":"a","text":"Remoción de escombros"},{"key":"b","text":"Gastos Extraordinarios"}],"correct":"b","handwritten_note":"Al margen izquierdo: \"Ultima Pre de Incendio\" y más abajo \"Cristales\" (marcando el cambio de sección)"},{"id":42,"text":"Para que puedan asegurarse cristales, estos deben tener las siguientes características:","options":[{"key":"a","text":"Deben ser de 4 mm. de espesor aún cuando no estén colocados."},{"key":"b","text":"Deben estar colocados y medir al menos 4 mm. de espesor."}],"correct":"b","handwritten_note":"Por convenio (manuscrito al margen derecho, parcialmente cortado)"},{"id":43,"text":"Los cristales que se cubren en forma básica son:","options":[{"key":"a","text":"Los que forman parte de la construcción que estén debidamente colocados."},{"key":"b","text":"Los de la construcción o de los contenidos que estén debidamente colocados"}],"correct":"a"},{"id":44,"text":"La cobertura básica del seguro de cristales ampara:","options":[{"key":"a","text":"Cualquier daño o pérdida accidental."},{"key":"b","text":"Rotura accidental"}],"correct":"b"},{"id":45,"text":"¿Qué bienes se aseguran mediante convenio expreso en la sección de cristales?","options":[{"key":"a","text":"Lunas, cubiertas y vitrinas."},{"key":"b","text":"Espejos y cristales cortados."}],"correct":"a"},{"id":46,"text":"Es un riesgo que se puede amparar mediante convenio expreso en la sección de cristales de la póliza de Hogar, EXCEPTO:","options":[{"key":"a","text":"Defecto superficial del cristal"},{"key":"b","text":"La rotura del cristal por reparaciones del inmueble"}],"correct":"a"},{"id":47,"text":"El seguro de cristales indemniza:","options":[{"key":"a","text":"El valor real del cristal, los gastos de desmontaje y remontaje"},{"key":"b","text":"El valor de reposición, la remoción y el remontaje"}],"correct":"b"},{"id":48,"text":"El seguro de cristales funciona como un seguro:","options":[{"key":"a","text":"A primer riesgo relativo"},{"key":"b","text":"A primer riesgo absoluto"}],"correct":"b"},{"id":49,"text":"En la póliza de cristales, ¿Qué plazo máximo tiene el asegurado para entregar documentos, datos e informes que la aseguradora le solicita en caso de siniestro?","options":[{"key":"a","text":"15 días"},{"key":"b","text":"30 días"}],"correct":"a"},{"id":50,"text":"La cobertura básica de la sección de robo es:","options":[{"key":"a","text":"Robo con violencia"},{"key":"b","text":"Robo con violencia y asalto con violencia"}],"correct":"b"},{"id":51,"text":"Para que se indemnice un siniestro por robo con violencia, se deben cumplir los siguientes requisitos, excepto:","options":[{"key":"a","text":"Que existan señas visibles de violencia del exterior al interior a la casa"},{"key":"b","text":"Que exista violencia física o moral sobre las personas que están en la casa"}],"correct":"b"},{"id":52,"text":"¿Qué elementos son fundamentales para considerar que se efectuó un asalto en el Seguro de Robo en Domicilio?","options":[{"key":"a","text":"Acto doloso de dependientes o familiares Daño físico o moral a las personas fuera del inmueble"},{"key":"b","text":"Violencia física o moral a las personas dentro del inmueble"}],"correct":"b"},{"id":53,"text":"El importe de suma asegurada establecido para asegurar bienes en distintos incisos es:","options":[{"key":"a","text":"150 salarios mínimos mensuales vigentes en el Distrito Federal."},{"key":"b","text":"150 días de salario mínimo vigente en el Distrito Federal."}],"correct":"b"},{"id":54,"text":"Los títulos de crédito, cheques, letras de cambio, pagarés, etc. ¿qué requisito deben tener para que se cubran de forma básica?","options":[{"key":"a","text":"Valor hasta de 150 días del salario mínimo del D. F."},{"key":"b","text":"Valor superior a 150 días del salario mínimo del D. F."}],"correct":"a"},{"id":55,"text":"Elija de la siguiente lista, los bienes que están excluidos pero que se pueden contratar mediante convenio expreso en la sección de robo en la póliza de Hogar: 1. Alfombras 2. Obras de arte con valor superior a 150 DSMGVDF 3. Computadoras 4. Piedras preciosas no montadas 5. Manuscritos","options":[{"key":"a","text":"2, 4, 5"},{"key":"b","text":"2, 3, 4"}],"correct":"a","list":{"stem":"Elija de la siguiente lista, los bienes que están excluidos pero que se pueden contratar mediante convenio expreso en la sección de robo en la póliza de Hogar:","kind":"num","items":[{"k":"1","text":"Alfombras"},{"k":"2","text":"Obras de arte con valor superior a 150 DSMGVDF"},{"k":"3","text":"Computadoras"},{"k":"4","text":"Piedras preciosas no montadas"},{"k":"5","text":"Manuscritos"}]},"handwritten_note":"Palomas manuscritas junto a 2, 4 y 5"},{"id":56,"text":"Joyas, armas de fuego, pieles preciosas y relojes; ¿cómo se aseguran en la sección de Robo con Violencia?","options":[{"key":"a","text":"Por convenio expreso en el inciso 3"},{"key":"b","text":"Básicamente en el inciso 1"}],"correct":"a","handwritten_note":"La marca sobre la opción a está remarcada/tachoneada en tinta oscura; hay además un trazo manuscrito al margen derecho"},{"id":57,"text":"¿Cuál es la participación del asegurado cuando se afecta La sección de robo con violencia, en los bienes que requieren convenio expreso?","options":[{"key":"a","text":"20 % del monto de la pérdida"},{"key":"b","text":"10 % del monto de la pérdida"}],"correct":"a"},{"id":58,"text":"En el caso de Robo con Violencia, la participación del asegurado puede reducirse al 50% si se demuestra:","options":[{"key":"a","text":"Que el inmueble descrito cuenta con alarma contra robo, y siempre que los colindantes se encuentren fincados"},{"key":"b","text":"Que el inmueble cuenta con alarma contra robo, y se demuestra la existencia de las facturas o avalúos de dichos bienes asegurados"}],"correct":"a"},{"id":59,"text":"El robo sin violencia está considerado como:","options":[{"key":"a","text":"Exclusión definitiva."},{"key":"b","text":"Cobertura adicional"}],"correct":"a"},{"id":60,"text":"¿Qué bienes están excluidos en la cobertura de Robo de Casa Habitación?","options":[{"key":"a","text":"Dinero en efectivo"},{"key":"b","text":"Pertenencias en patios y azoteas"}],"correct":"b"},{"id":61,"text":"Un asegurado tiene en su casa un consultorio médico y es asaltado en el mismo, perdiendo su equipo médico. ¿Este siniestro se encuentra cubierto por la póliza Múltiple Casa Habitación?","options":[{"key":"a","text":"No"},{"key":"b","text":"Sí"}],"correct":"a"},{"id":62,"text":"Si un asegurado tiene en su casa un consultorio médico y es asaltado en el consultorio, perdiendo su equipo médico, ¿se encuentra cubierto por la póliza Múltiple Empresarial?","options":[{"key":"a","text":"Sí"},{"key":"b","text":"No"}],"correct":"a"},{"id":63,"text":"Son exclusiones de robo con violencia:","options":[{"key":"a","text":"Timbres fiscales o postales"},{"key":"b","text":"Cámaras fotográficas o digitales."}],"correct":"a"},{"id":64,"text":"Una persona contrata una póliza paquete para su casa, entre los contenidos tiene un dibujo de José Luis Cuevas, ¿A qué valor debe asegurar el valor en la sección de robo?","options":[{"key":"a","text":"Valor comercial"},{"key":"b","text":"Valor convenido"}],"correct":"b"},{"id":65,"text":"¿Qué documentos deberá presentar el asegurado junto con la solicitud de reclamo, para que sea indemnizado en caso de que le sean robadas pieles y/o joyas de su casa?","options":[{"key":"a","text":"Facturas y avalúos"},{"key":"b","text":"Factura, fotos o video y acta del Ministerio Público"}],"correct":"b"},{"id":66,"text":"De la siguiente lista identifica los riesgos que ampara la sección de electrodomésticos: 1. Incendio 2. Impericia, descuido o sabotaje 3. Explosión e implosión 4. Introducción de cuerpos extraños 5. Corto circuito y arco voltaico 6. Huelgas y alborotos populares 7. Sobrecargas eléctricas","options":[{"key":"a","text":"1, 3, 4, 6"},{"key":"b","text":"2, 4, 5, 7"}],"correct":"b","list":{"stem":"De la siguiente lista identifica los riesgos que ampara la sección de electrodomésticos:","kind":"num","items":[{"k":"1","text":"Incendio"},{"k":"2","text":"Impericia, descuido o sabotaje"},{"k":"3","text":"Explosión e implosión"},{"k":"4","text":"Introducción de cuerpos extraños"},{"k":"5","text":"Corto circuito y arco voltaico"},{"k":"6","text":"Huelgas y alborotos populares"},{"k":"7","text":"Sobrecargas eléctricas"}]},"handwritten_note":"Palomas/marcas manuscritas junto a 2, 4, 5 y 7 (y un trazo junto a 3)"},{"id":67,"text":"La sección de equipo electrodoméstico, el asegurado debe establecer la suma asegurada a:","options":[{"key":"a","text":"Valor real"},{"key":"b","text":"Valor de reposición"}],"correct":"b"},{"id":68,"text":"La pérdida parcial en un siniestro amparado en la sección de equipo electrodoméstico se indemniza considerando los siguientes elementos, EXCEPTO:","options":[{"key":"a","text":"Valor factura de las refacciones, Costo de fletes, Impuestos de importación"},{"key":"b","text":"Depreciación por uso"}],"correct":"b"},{"id":69,"text":"La sección de equipo electrodoméstico se considera pérdida total cuando:","options":[{"key":"a","text":"Cuando la reparación es igual al valor real del equipo"},{"key":"b","text":"Cuando la reparación rebasa el 75% del valor del equipo"}],"correct":"a"},{"id":70,"text":"La cobertura de equipo electrodoméstico opera:","options":[{"key":"a","text":"A proporción indemnizable."},{"key":"b","text":"A primer riesgo."}],"correct":"a"},{"id":71,"text":"La oxidación de cables conductores de electricidad y que representan una exclusión de equipo electrónico se llama:","options":[{"key":"a","text":"Derretimiento de aislante."},{"key":"b","text":"Herrumbre."}],"correct":"b"},{"id":72,"text":"Las coberturas que incorporan deducible en la póliza de hogar son:","options":[{"key":"a","text":"Robo, cristales, huracán, huelgas, vehículos, terremoto y equipo electrodoméstico"},{"key":"b","text":"Todas las coberturas de la póliza de hogar tienen deducible."}],"correct":"a"},{"id":73,"text":"Para las indemnizaciones en la cobertura de responsabilidad civil familiar se sigue lo descrito en:","options":[{"key":"a","text":"Lo dispuesto en el Código Civil"},{"key":"b","text":"Lo que la aseguradora quiera pagar"}],"correct":"a"},{"id":74,"text":"Los daños que se causen a terceras personas por la conducta ilícita o en contra de las buenas costumbres se considera:","options":[{"key":"a","text":"R. C. Objetiva."},{"key":"b","text":"R. C: Subjetiva"}],"correct":"b","handwritten_note":"se causa por uso [de] bienes (manuscrito junto a la opción a, parcialmente cortado)"},{"id":75,"text":"La R. C: Subjetiva implica que el daño se causa por negligencia, impericia o descuido, por eso también se conoce como:","options":[{"key":"a","text":"R. C. Culposa"},{"key":"b","text":"R. C. Del Riesgo Creado"}],"correct":"a","handwritten_note":"se causa por usar bienes (manuscrito junto a la opción b)"},{"id":76,"text":"En el Seguro de Responsabilidad Civil Familiar, se cubren la responsabilidad civil de las siguientes personas, EXCEPTO:","options":[{"key":"a","text":"Personal doméstico"},{"key":"b","text":"Padres del asegurado"}],"correct":"b"},{"id":77,"text":"En el seguro de R. C. Familiar, el beneficiario del seguro es:","options":[{"key":"a","text":"El cónyuge."},{"key":"b","text":"Un transeúnte"}],"correct":"b"},{"id":78,"text":"Identifica los conceptos que se amparan en forma básica dentro del seguro de Responsabilidad Civil Familiar: 1. Daños, 2. Daño moral directo 3. Cauciones para obtener la libertad condicional 4. Perjuicios 5. Lesiones por práctica profesional incorrecta 6. Daños moral consecuencial 7. Gastos y costas por demandas para resarcir daños 8. Multas que determine un Juez","options":[{"key":"a","text":"1, 4, 6, 7"},{"key":"b","text":"2, 4, 5, 8"}],"correct":"a","list":{"stem":"Identifica los conceptos que se amparan en forma básica dentro del seguro de Responsabilidad Civil Familiar:","kind":"num","items":[{"k":"1","text":"Daños"},{"k":"2","text":"Daño moral directo"},{"k":"3","text":"Cauciones para obtener la libertad condicional"},{"k":"4","text":"Perjuicios"},{"k":"5","text":"Lesiones por práctica profesional incorrecta"},{"k":"6","text":"Daños moral consecuencial"},{"k":"7","text":"Gastos y costas por demandas para resarcir daños"},{"k":"8","text":"Multas que determine un Juez"}]},"handwritten_note":"Junto a 3: \"(Penales)\"; junto a 4: \"Pagar lo que deja de ganar\"; junto a 6: \"a consecuencia de un daño fís[ico]\"; palomas manuscritas en 1, 4, 6 y 7"},{"id":79,"text":"Son daños que se cubren en forma básica en la R. C. Familiar, excepto:","options":[{"key":"a","text":"Los que se causen durante obras de remodelación o ampliación de la casa"},{"key":"b","text":"Los que se causen por el uso de armas de fuego legales"}],"correct":"a"},{"id":80,"text":"En la sección de responsabilidad civil de la póliza Múltiple Casa Habitación, si un empleado doméstico dañara por accidente la propiedad de un vecino ¿Estaría cubierto?","options":[{"key":"a","text":"Si"},{"key":"b","text":"No"}],"correct":"a"},{"id":81,"text":"En la sección de Responsabilidad Civil de la póliza Múltiple Casa Habitación, ¿Cuál de los siguientes riesgos está cubierto?","options":[{"key":"a","text":"La mordedura por el perro del asegurado, hacia un tercero"},{"key":"b","text":"Las lesiones del hijo del asegurado dentro de la casa"}],"correct":"a"},{"id":82,"text":"La cobertura de responsabilidad civil familiar ampara los daños que puedan causar las siguientes mascotas:","options":[{"key":"a","text":"Únicamente a los perros pequeños y las aves canoras."},{"key":"b","text":"Únicamente a los animales considerados como domésticos."}],"correct":"b"},{"id":83,"text":"Del listado siguiente, identifique 3 riesgos cubiertos en la cobertura básica de Responsabilidad Civil Familiar: 1. Daños ocasionados a partir de un derrame de agua accidental 2. Daños ocasionados por asentamiento del suelo 3. Como propietario de animales domésticos 4. Por la práctica de deporte como aficionado 5. Daños ocasionados dolosamente por el asegurado 6. Daños ocasionados por embarcaciones propiedad del asegurado","options":[{"key":"a","text":"1, 3, 4"},{"key":"b","text":"1, 2, 6"}],"correct":"a","list":{"stem":"Del listado siguiente, identifique 3 riesgos cubiertos en la cobertura básica de Responsabilidad Civil Familiar:","kind":"num","items":[{"k":"1","text":"Daños ocasionados a partir de un derrame de agua accidental"},{"k":"2","text":"Daños ocasionados por asentamiento del suelo"},{"k":"3","text":"Como propietario de animales domésticos"},{"k":"4","text":"Por la práctica de deporte como aficionado"},{"k":"5","text":"Daños ocasionados dolosamente por el asegurado"},{"k":"6","text":"Daños ocasionados por embarcaciones propiedad del asegurado"}]},"handwritten_note":"Palomas manuscritas junto a 1, 3 y 4"},{"id":84,"text":"De la siguiente lista elija 3 gastos que la empresa de seguros está obligada a indemnizar de acuerdo a la póliza de Responsabilidad Civil Familiar: 1. Primas de fianzas judiciales 2. Fianzas para obtener libertad 3. Honorarios de abogados 4. Multas 5. Costos por resoluciones judiciales","options":[{"key":"a","text":"2, 3, 5"},{"key":"b","text":"1, 3, 5"}],"correct":"b","list":{"stem":"De la siguiente lista elija 3 gastos que la empresa de seguros está obligada a indemnizar de acuerdo a la póliza de Responsabilidad Civil Familiar:","kind":"num","items":[{"k":"1","text":"Primas de fianzas judiciales"},{"k":"2","text":"Fianzas para obtener libertad"},{"k":"3","text":"Honorarios de abogados"},{"k":"4","text":"Multas"},{"k":"5","text":"Costos por resoluciones judiciales"}]},"handwritten_note":"Palomas manuscritas junto a 1, 3 y 5"},{"id":85,"text":"¿Cuál es la suma asegurada para el pago del importe de las primas por fianzas judiciales que el asegurado deba otorgara en garantía del pago de las sumas que se le reclaman a título de Responsabilidad Civil?","options":[{"key":"a","text":"El 50% adicional de la suma asegurada"},{"key":"b","text":"El 100% adicional de la suma asegurada"}],"correct":"a"},{"id":86,"text":"Identifica las exclusiones que se pueden asegurar dentro de la sección de responsabilidad civil familiar: 1. Daños durante obras de remodelación o ampliación de la casa 2. Daños causados fuera de México por actividades familiares 3. Daños a terceros durante actividades escolares de los menores de edad 4. Daños que se causen al edificio rentado por incendio o explosión 5. Daños a terceros durante la práctica de deportes como afiliados a una liga","options":[{"key":"a","text":"1, 2, 4"},{"key":"b","text":"1, 3, 5"}],"correct":"a","list":{"stem":"Identifica las exclusiones que se pueden asegurar dentro de la sección de responsabilidad civil familiar:","kind":"num","items":[{"k":"1","text":"Daños durante obras de remodelación o ampliación de la casa"},{"k":"2","text":"Daños causados fuera de México por actividades familiares"},{"k":"3","text":"Daños a terceros durante actividades escolares de los menores de edad"},{"k":"4","text":"Daños que se causen al edificio rentado por incendio o explosión"},{"k":"5","text":"Daños a terceros durante la práctica de deportes como afiliados a una liga"}]},"handwritten_note":"Junto a 4: \"R. C. Arrendatario\"; palomas manuscritas junto a 1, 2 y 4"},{"id":87,"text":"La responsabilidad civil del arrendatario ampara:","options":[{"key":"a","text":"Cualquier daño causado por cualquier persona, sea accidental o intencional sobre el inmueble arrendado."},{"key":"b","text":"Únicamente los daños que se causen al inmueble arrendado por incendio, o explosión"}],"correct":"b"},{"id":88,"text":"La R. C: Familiar excluye definitivamente los siguientes daños, EXCEPTO:","options":[{"key":"a","text":"Los que se causen por el uso de automóviles, barcos o aviones"},{"key":"b","text":"Los que se causen durante estudios o paseo en otros países"}],"correct":"b"},{"id":89,"text":"Si el asegurado llegara a causar daños a terceros derivado de las actividades privadas y familiares como propietario de casa habitación, la póliza de responsabilidad civil cubriría lo siguiente, EXCEPTO:","options":[{"key":"a","text":"La tenencia o uso de armas, de aire o de fuego, para cacería, cuando esté legalmente autorizado"},{"key":"b","text":"Daños ocasionados por la práctica de deportes en forma profesional"}],"correct":"b"},{"id":90,"text":"De la siguiente lista, identifique 3 exclusiones definitivas de la póliza de Responsabilidad Civil Familiar: 1. Daños sufridos por el cónyuge 2. Siniestros ocurridos fuera de la República Mexicana 3. Daños causados con motivos de obras 4. Daños por participación en apuestas o competencias deportivas 5. Daños derivados del ejercicio de un oficio 6. Daños ocasionados a consecuencia de un derrame de agua","options":[{"key":"a","text":"1, 4, 5"},{"key":"b","text":"1, 3, 6"}],"correct":"a","list":{"stem":"De la siguiente lista, identifique 3 exclusiones definitivas de la póliza de Responsabilidad Civil Familiar:","kind":"num","items":[{"k":"1","text":"Daños sufridos por el cónyuge"},{"k":"2","text":"Siniestros ocurridos fuera de la República Mexicana"},{"k":"3","text":"Daños causados con motivos de obras"},{"k":"4","text":"Daños por participación en apuestas o competencias deportivas"},{"k":"5","text":"Daños derivados del ejercicio de un oficio"},{"k":"6","text":"Daños ocasionados a consecuencia de un derrame de agua"}]},"handwritten_note":"Al margen izquierdo: \"Lo que no se pag[a]\"; palomas manuscritas junto a 1, 4 y 5"},{"id":91,"text":"La cobertura de muerte de la sección de Accidentes Personales, se dará a los hijos del asegurado a partir de la edad de:","options":[{"key":"a","text":"12 años"},{"key":"b","text":"18 años"}],"correct":"a"},{"id":92,"text":"La escala de indemnización que se toma en cuenta para la sección de accidentes personales familiar es:","options":[{"key":"a","text":"Sólo la A"},{"key":"b","text":"Escalas A o B"}],"correct":"a"},{"id":93,"text":"En la sección de accidentes personales familiar, las siguientes personas son asegurables, EXCEPTO:","options":[{"key":"a","text":"Hijos hasta los 24 años"},{"key":"b","text":"Padres del asegurado titular"}],"correct":"b"},{"id":94,"text":"Un asegurado sufrió un accidente y a los 90 día falleció, ¿qué cantidad se puede descontar al a suma de muerte accidental?","options":[{"key":"a","text":"Las cantidades indemnizadas en los conceptos de escalas A o B"},{"key":"b","text":"Las primas no devengadas"}],"correct":"a"}]},{"id":"emb","label":"Embarcaciones Men
