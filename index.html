:root{
  --navy:#2b2d6e; --navy-deep:#1b1d4f;
  --indigo:#201fc5; --indigo-soft:#e8e8fa;
  --gold:#ea5b22; --gold-soft:#fdeadd;
  --bg:#f1f2f8; --card:#ffffff; --line:#e4e6f0;
  --ink:#2a2f57; --ink-soft:#6e7495;
  --ok:#1e8e5a; --ok-soft:#e6f4ed;
  --bad:#c0392b; --bad-soft:#fdeceb;
  --warn:#b7791f; --warn-soft:#fdf3e0;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:"Quicksand",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:40px;font-weight:500}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
/* Header */
header{background:#fff;color:var(--navy);position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(19,26,77,.08);border-bottom:1px solid var(--line)}
.hbar{max-width:820px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px}
.logo-badge{width:42px;height:42px;flex-shrink:0;display:block;border-radius:9px;box-shadow:0 3px 8px rgba(32,31,197,.28)}
.logo-txt{font-size:10.5px;line-height:1.3;color:var(--ink-soft);letter-spacing:1.2px;font-weight:600;text-transform:uppercase}
.logo-txt b{display:block;font-size:15px;color:var(--navy);font-weight:800;letter-spacing:1.6px}
.backbtn{background:var(--indigo-soft);border-radius:10px;padding:8px 12px;color:var(--indigo);font-size:14px;font-weight:700;flex-shrink:0}
.backbtn:active{opacity:.7}
.hspace{flex:1}
.timer{background:var(--navy);color:#fff;padding:6px 12px;border-radius:10px;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.timer.low{background:var(--bad)}
/* Eyebrow */
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--indigo);font-weight:700;font-size:11.5px;letter-spacing:2.2px;text-transform:uppercase;margin-top:6px}
.eyebrow::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--gold)}
/* Cards & general */
.screen{padding-top:16px}
h1.title{font-size:22px;margin:8px 0 4px;color:var(--navy);font-weight:800;text-transform:uppercase;letter-spacing:.4px;line-height:1.25}
p.sub{color:var(--ink-soft);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(19,26,77,.06)}
.mod-card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;transition:transform .06s}
.mod-card:active{transform:scale(.985)}
.mod-key{flex-shrink:0;width:58px;height:58px;border-radius:15px;background:linear-gradient(140deg,#2a29d6,#1a19a8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:.5px;box-shadow:0 4px 10px rgba(32,31,197,.3)}
.mod-info{flex:1;min-width:0}
.mod-info b{font-size:15.5px;display:block;margin-bottom:2px}
.mod-info span{font-size:12.5px;color:var(--ink-soft);display:block}
.mod-chevron{color:var(--ink-soft);font-size:20px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;margin-top:5px}
.badge.gold{background:var(--gold-soft);color:#c2521a}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
/* Menu buttons */
.big-btn{display:flex;width:100%;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:11px;text-align:left;box-shadow:0 1px 3px rgba(16,32,54,.05)}
.big-btn:active{transform:scale(.985)}
.big-ico{font-size:24px;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);flex-shrink:0}
.big-btn b{display:block;font-size:15.5px;color:var(--navy);font-weight:700}
.big-btn span{font-size:12.5px;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--indigo);color:#fff;font-weight:700;font-size:15px;border-radius:12px;padding:13px 22px;min-height:48px;box-shadow:0 4px 10px rgba(32,31,197,.25)}
.btn:active{opacity:.85}
.btn.gold{background:var(--gold);color:#fff;box-shadow:0 4px 10px rgba(242,107,33,.3)}
.btn.ghost{background:#fff;color:var(--indigo);border:1.5px solid var(--indigo);box-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:9px 16px;min-height:40px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
/* Chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
/* Study */
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden}
.acc-head{width:100%;display:flex;align-items:center;gap:10px;padding:14px 15px;text-align:left;font-weight:700;font-size:14.5px}
.acc-head .arr{margin-left:auto;color:var(--ink-soft);transition:transform .15s}
.acc.open .arr{transform:rotate(90deg)}
.acc-body{display:none;padding:2px 16px 16px;border-top:1px solid var(--line)}
.acc.open .acc-body{display:block}
.md{font-size:14.5px}
.md h1,.md h2,.md h3,.md h4{color:var(--navy);margin:14px 0 6px;line-height:1.3}
.md h1{font-size:17px}.md h2{font-size:16px}.md h3{font-size:15px}.md h4{font-size:14.5px}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0 8px 22px}
.md li{margin:3px 0}
.md table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px;display:block;overflow-x:auto}
.md th{background:var(--navy);color:#fff;text-align:left;font-weight:700}
.md th,.md td{border:1px solid var(--line);padding:7px 9px;vertical-align:top;min-width:90px}
.md tr:nth-child(even) td{background:#f7f9fc}
.md strong{color:var(--navy)}
/* Question */
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qtag{font-size:11.5px;font-weight:700;background:var(--indigo);color:#fff;border-radius:999px;padding:3px 10px;letter-spacing:.5px}
.qtag.soft{background:var(--gold-soft);color:#c2521a}
.qcount{font-size:13px;color:var(--ink-soft);font-weight:600;margin-left:auto}
.qtext{font-size:16px;font-weight:600;line-height:1.45;margin-bottom:14px}
.opt{display:flex;width:100%;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:9px;font-size:14.5px;line-height:1.4}
.opt .k{flex-shrink:0;width:30px;height:30px;border-radius:9px;background:var(--indigo-soft);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--indigo);text-transform:uppercase}
.opt:not(:disabled):active{border-color:var(--indigo)}
.opt.sel{border-color:var(--indigo);background:var(--indigo-soft)}
.opt.sel .k{background:var(--indigo);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.feed{border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;margin:4px 0 12px}
.feed.ok{background:var(--ok-soft);color:var(--ok)}
.feed.bad{background:var(--bad-soft);color:var(--bad)}
.feed.warn{background:var(--warn-soft);color:var(--warn)}
.note{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;padding:10px 13px;font-size:13.5px;margin-bottom:12px}
.note b{color:#c2521a}
.pbar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f4914f);border-radius:99px;transition:width .25s}
.pbar.navy i{background:linear-gradient(90deg,var(--indigo),#4a48e8)}
/* Exam palette */
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px;margin:10px 0}
.pal button{height:42px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;color:var(--ink-soft)}
.pal button.done{background:var(--indigo);border-color:var(--indigo);color:#fff}
.pal button.cur{outline:2.5px solid var(--gold);outline-offset:1px}
/* Results */
.score-hero{text-align:center;padding:26px 16px}
.score-num{font-size:52px;font-weight:800;color:var(--indigo);line-height:1}
.score-num small{font-size:22px}
.score-lbl{color:var(--ink-soft);font-weight:600;margin-top:6px;font-size:14px}
.stat-row{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--ink-soft);font-weight:600}
.stat.g b{color:var(--ok)}.stat.r b{color:var(--bad)}.stat.n b{color:var(--ink-soft)}
.subrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.subrow:last-child{border-bottom:none}
.subrow b{font-variant-numeric:tabular-nums}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:420px;width:100%}
.modal h3{font-size:17px;margin-bottom:8px;color:var(--navy)}
.modal p{font-size:14px;color:var(--ink-soft);margin-bottom:16px}
.hidden{display:none!important}
.exam-info td{padding:6px 8px;font-size:13.5px;border-bottom:1px solid var(--line)}
.exam-info{width:100%;border-collapse:collapse;margin:10px 0 4px}
.exam-info td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
footer{max-width:820px;margin:26px auto 0;padding:0 14px;text-align:center;color:var(--ink-soft);font-size:11.5px}
@media(min-width:640px){
  .mods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mods .card{margin-bottom:0}
}

/* --- v2 --- */
.card.p0{padding:0}
.mod-card{padding:16px}
.cardttl{font-size:14.5px;color:var(--navy);display:block;margin-bottom:8px;font-weight:700}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.45}
.row2{display:flex;gap:8px;margin-bottom:12px}
.sp{height:10px}
.acc-n{flex-shrink:0;width:24px;height:24px;border-radius:8px;background:var(--indigo-soft);color:var(--indigo);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.exam-info tr.tot td{border-bottom:none;color:var(--navy);padding-top:9px}
.exam-info tr.tot td:first-child{font-weight:700}
/* tarjeta destacada */
.full-card{display:block;width:100%;text-align:left;background:linear-gradient(135deg,#0a1440,#12206b 45%,#201fc5);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(19,26,77,.28)}
.full-card:active{transform:scale(.99)}
.full-card b{display:block;font-size:16px;font-weight:800;margin:9px 0 3px}
.full-card>span{display:block;font-size:12.8px;opacity:.85;line-height:1.45}
.fc-top{display:flex;align-items:center;gap:10px}
.fc-tag{background:var(--gold);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;border-radius:999px;padding:4px 11px}
.fc-time{margin-left:auto;font-size:12.5px;font-weight:700;opacity:.9}
.fc-best{display:inline-block;margin-top:9px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
.full-card.sm{background:linear-gradient(135deg,#2a29d6,#1a19a8)}
/* resultados */
.score-num.good{color:var(--ok)}.score-num.mid{color:var(--warn)}.score-num.low{color:var(--bad)}
.grade-pill{display:inline-block;margin-top:10px;border-radius:999px;padding:5px 15px;font-size:13.5px;font-weight:800;background:var(--indigo-soft);color:var(--indigo)}
.grade-pill.good{background:var(--ok-soft);color:var(--ok)}
.grade-pill.mid{background:var(--warn-soft);color:var(--warn)}
.grade-pill.low{background:var(--bad-soft);color:var(--bad)}
.score-lbl.small{font-size:12.5px;margin-top:8px}
.resmod{padding:14px 16px 10px}
.rm-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.mod-key.sm{width:42px;height:42px;border-radius:11px;font-size:12px}
.rm-t{flex:1;min-width:0}
.rm-t b{display:block;font-size:14.5px;color:var(--navy);line-height:1.25}
.rm-t span{font-size:12.5px;color:var(--ink-soft)}
.rm-p{font-size:21px;font-weight:800;text-align:right;line-height:1.05}
.rm-p small{display:block;font-size:11.5px;font-weight:700;opacity:.75}
.rm-p.good,b.good{color:var(--ok)}.rm-p.mid,b.mid{color:var(--warn)}.rm-p.low,b.low{color:var(--bad)}
.pbar.thin{height:6px;margin:0 0 6px}
.pbar.good i{background:var(--ok)}.pbar.mid i{background:var(--warn)}.pbar.low i{background:var(--bad)}
.subrow span{color:var(--ink-soft)}

/* --- tabla de relacionar columnas --- */
.mtable{width:100%;border-collapse:separate;border-spacing:0;margin:2px 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
.mtable th{background:var(--navy);color:#fff;font-weight:700;font-size:11.5px;letter-spacing:1.1px;text-transform:uppercase;padding:8px 10px;text-align:left}
.mtable td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top;line-height:1.4}
.mtable td.l{width:44%;background:#fafbff;border-right:1px solid var(--line)}
.mtable tr:first-child td{border-top:none}
.mk{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:6px;background:var(--indigo-soft);color:var(--indigo);font-weight:800;font-size:11.5px;margin-right:7px;padding:0 5px;vertical-align:1px}
.mk.let{background:var(--gold-soft);color:#c2521a}
.mstem{font-size:15.5px;font-weight:600;line-height:1.45;margin-bottom:10px}
.opt .arrow{color:var(--ink-soft);font-weight:700}

/* --- lista enumerada dentro del enunciado --- */
.qlist{list-style:none;margin:0 0 14px;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qlist li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;font-size:14.5px;line-height:1.4;border-top:1px solid var(--line);background:#fff}
.qlist li:first-child{border-top:none}
.qlist li:nth-child(even){background:#fafbff}
.ln{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:7px;background:var(--indigo-soft);color:var(--indigo);font-weight:800;font-size:12px;margin-top:1px}
.ln.let{background:var(--gold-soft);color:#c2521a;text-transform:lowercase}

/* --- logo Agencia DNP --- */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.logo-mark{height:40px;width:63px;display:block;flex-shrink:0}
.logo-sep{width:1px;height:26px;background:var(--line);flex-shrink:0}
.logo-cap{font-size:9.5px;line-height:1.35;color:var(--ink-soft);letter-spacing:1.4px;font-weight:600;text-transform:uppercase}
.logo-cap b{display:block;font-size:12.5px;color:var(--navy);font-weight:800;letter-spacing:1.5px}
.home-logo{display:block;margin:2px auto 14px;height:78px;width:122px}
@media(max-width:479px){.logo-cap{display:none}.logo-sep{display:none}}
.hbar{flex-wrap:nowrap}
.timer{flex-shrink:0}

/* --- tamaño de letra accesible --- */
html[data-font="grande"] body{zoom:1.18}
html[data-font="xl"] body{zoom:1.4}
.fontbtn{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--indigo-soft);color:var(--indigo);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;line-height:1}
.fontbtn sup{font-size:10px;margin-left:1px}
.fontbtn:active{opacity:.7}
.fontopt{display:flex;width:100%;align-items:center;gap:12px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:9px;text-align:left}
.fontopt.on{border-color:var(--indigo);background:var(--indigo-soft)}
.fontopt .sample{flex-shrink:0;width:44px;text-align:center;font-weight:800;color:var(--navy)}
.fontopt b{display:block;color:var(--navy);font-size:15px}
.fontopt span{font-size:12.5px;color:var(--ink-soft)}

/* header compacto cuando la letra es grande o hay reloj corriendo */
body.exam-on .logo{display:none}
html[data-font="grande"] .logo-mark{height:34px;width:53px}
html[data-font="xl"] .logo-mark{height:30px;width:47px}
html[data-font="xl"] .hbar{gap:8px;padding:8px 10px}
html[data-font="xl"] .backbtn{padding:8px 10px}
html[data-font="xl"] .timer{padding:6px 9px;font-size:15px}
html[data-font="xl"] .fontbtn{width:36px;height:36px}
.logo{min-width:0}

<script>
const DATA = {"modules":[{"id":"AG","name":"Aspectos Generales","banks":["ag"],"exam":{"time":40,"parts":[{"bank":"ag","n":40}]}},{"id":"RISP","name":"Riesgos Individuales de Seguro de Personas","banks":["vida","aye"],"exam":{"time":60,"parts":[{"bank":"vida","n":30},{"bank":"aye","n":30}]}},{"id":"SMF","name":"Sistema y Mercados Financieros","banks":["sfm","mat"],"exam":{"time":32,"parts":[{"bank":"sfm","n":14},{"bank":"mat","n":6}]}},{"id":"RISD","name":"Riesgos Individuales de Seguro de Daños","banks":["autos","hogar","emb"],"exam":{"time":60,"parts":[{"bank":"autos","n":20},{"bank":"hogar","n":30},{"bank":"emb","n":10}]}}],"banks":[{"id":"ag","label":"Aspectos Generales","theory":[{"title":"Reglamento de Agentes de Seguros y Fianzas: El Agente de Seguros y sus tipos (pág. 1)","content_md":"## Agente de seguros\n\n**Persona Física o Moral que realiza la actividad de intermediación para contratar seguros.**\n\n> Nota manuscrita: \"Pregunta 3\" / \"Módulo 1\"\n\n### Actividades de Intermediación\n- Intercambio de propuestas\n- Asesorar a quien compra seguros\n- Ayudar a conservar, modificar, renovar o cancelar los seguros\n\n## Tipos de Agentes de Seguros\n\n### Persona Física Empleado\n- La Autorización la solicita la institución de seguros\n- Se subordinan a la institución de seguros\n- Es exclusivo para la institución\n- La autorización se cancela al terminar la relación laboral\n- No compra el seguro de Errores u Omisiones\n\n### Persona Física Por Cuenta Propia\n- La Autorización la solicita el propio agente, (Cédula)\n- Trabaja por cuenta propia\n- Puede trabajar para varias aseguradoras (Excepto cédula H)\n- La autorización se refrenda cada 3 años, en los últimos 60 días de vigencia\n- Debe comprar el seguro de Errores\n\n### Persona Moral\n- Sociedad Mercantil constituida como Sociedad Anónima\n- La razón social debe expresar: \"Agente de Seguros\"\n- El objeto es la Intermediación de seguros, y se expresa qué ramos puede vender\n- Debe tener 3 administradores\n- La autorización se da por oficio y por tiempo indefinido\n- La intermediación la realizan a través de apoderados, que deben obtener cédula (mínimo 1 por cada oficina)\n- No pueden ser socios empresas financieras o gobiernos\n\n## Funciones y figuras específicas\n\n### Agente de Seguros Mandatario\nCelebra un contrato especial con la aseguradora para:\n- Suscribir o seleccionar riesgos\n- Emiten pólizas, recibos y endosos\n- Reciben avisos de siniestro y los comprueban\n- Pueden cobrar primas con cheques a su nombre\n- Si es persona física, su cédula expresará su calidad de mandatario y la Institución que lo nombra\n\n### Apoderado\n- Celebra contrato de mandato con un agente de seguros persona moral\n- Realiza la intermediación a nombre del agente moral\n- No está obligado a comprar el seguro de Errores u Omisiones\n- Su cédula expresa el nombre del agente con que intermedia"},{"title":"Tipos de Autorización otorgadas por la CNSF (Intransferibles) (pág. 2)","content_md":"## Autorización Provisional\n1. Es para personas que estén en capacitación\n2. La autorización la solicita la Institución de Seguros\n3. Tiene una vigencia máxima de 18 meses\n\n> Nota manuscrita al margen: \"Posibles pregunta\"\n\n## Autorizaciones Definitivas (Cédulas)\n\n| Cédula | Descripción | Tipo | Seguros que puede ofrecer |\n|---|---|---|---|\n| A | Líneas Personales y Familiares | A 1 | a) Seguro de Vida; b) Seguro de Gastos Médicos; c) Seguro de Accidentes Personales; d) Seguro de Salud |\n| A | Líneas Personales y Familiares | A 2 | a) Seguro de Hogar; b) Seguro de Automóviles; c) Seguro de Embarcaciones Menores |\n| B | Líneas Empresariales | B 1 | a) Seguro para Técnicos y dirigentes; b) Seguro de Socios; c) Seguro de Grupo Vida; d) Seguro de Colectivo Gastos Médicos; e) Seguro Colectivo de Accidentes Personales |\n| B | Líneas Empresariales | B 2 | a) Seguro Empresarial (incluye Ramos técnicos); b) Seguro para transporte de carga; c) Seguro Flotilla |\n| C | Riesgos Especiales | — | a) Seguro para Grandes Riesgos (S. A. Mayor a 50 millones de dólares); b) Seguro para Casco de Barcos; c) Seguro para Casco de Aeronaves |\n| D | Específica | — | Riesgos Agrícolas, Riesgos de Animales, Seguro de Vida Campesino |\n| E | Específica | — | Seguros de Crédito |\n| H | Específica | — | Seguros de Caución (nota manuscrita: \"Cumplimiento - Cantidad de dinero - [Línea 12]\") |\n| M | Específica | — | Seguros para Mercados Masivos |\n\n> Nota manuscrita al margen: \"Aprender cada cédula y qué vende cada una\"\n\n## Datos de la Cédula\n1. Número\n2. Vigencia (3 Años)\n3. Tipo de Autorización\n4. Fotografía y Firma\n\n- **Apoderados:** Adicionalmente, el nombre del Agente de seguros Persona Moral que representan\n- **Agentes de Seguros Empleados:** Adicionalmente, el nombre de la Institución de Seguros que los contrató\n\n## Requisitos para ser Agente de Seguros\n1. Ser mexicano (los extranjeros deben tener la forma migratoria para trabajar en México)\n2. Ser mayor de Edad\n3. Tener estudios mínimos equivalentes a preparatoria\n4. Demostrar Capacidad Técnica (sacar mínimo 6 en todos los módulos que correspondan; los módulos donde acrediten con 8 o más de calificación, ya no los volverán a presentarlos)\n\n## Personas que no Pueden ser Agentes de Seguros\n1. Los que no reúnan los requisitos\n2. Empleados o funcionarios del Gobierno Federal, Estatal o Municipal\n3. Personas que estén en la cárcel, sentenciados por delitos patrimoniales\n4. Funcionarios o empleados de Instituciones Financieras\n5. Ajustadores de Siniestros o Comisarios de Averías\n6. Personas que puedan ejercer Coacción\n\n## Obligaciones del Agente de Seguros (Debe actuar con Ética y apegado a derecho)\n\n### Ante quien Pretenda Comprar un Seguro (Deben Informar por escrito a sus prospectos)\n1. Nombre Completo, domicilio, tipo de cédula y su vigencia\n2. Alcance real de la cobertura, cómo conservarla y cancelarla\n3. Que la Aseguradora es quien decide aceptar o rechazar una solicitud de seguro y las modificaciones solicitadas\n4. Que para cobrarle las primas, debe entregarle el recibo oficial de la Aseguradora\n5. Que debe llenar la solicitud completa y con la verdad, si no lo hace el seguro se puede rescindir\n\n### Ante la Aseguradora\n1. Apegarse a las políticas, tarifas y planes de seguros\n2. Informar por escrito las características del objeto que se desea asegurar\n3. Entregar las primas cobradas en un plazo máximo de 10 días hábiles\n4. Devolver las pólizas, endosos y recibos en un plazo máximo de 3 días hábiles, si el asegurado no paga la prima en el plazo legal\n\n### Ante la CNSF\n1. Cumplir los requisitos y llenar completo y con la verdad el formato 32.3.4\n2. Informar cambios de domicilio en un plazo máximo de 10 días hábiles\n3. Contestar las quejas en su contra en un plazo máximo de 10 días hábiles\n4. Pagar las multas que le aplique la CNSF en un plazo máximo de 15 días hábiles"},{"title":"Reglamento de Agentes: Seguro de Errores y Omisiones, Derechos del Agente y Sanciones (pág. 3)","content_md":"## Seguro de Errores y Omisiones\n- Indemniza daños y perjuicios por mala asesoría o por omisiones en su actividad\n- Lo deben comprar agentes persona física y agentes persona moral\n- No están obligados a comprarlo: Agentes Provisionales, agentes empleados, apoderados de Agentes Personas Morales o agentes de seguros con cédula de\n- La vigencia es de un año sin derecho de cancelación\n- Los agentes personas morales deben contratar una suma asegurada equivalente a 5% de su cartera, mínimo 150,000 UDIS\n- El agente de seguros persona moral debe enviar a la CNSF copia de su renovación en un plazo de 15 días\n- La suma asegurada mínima para personas físicas es de 25,000 UDIs\n- Las personas físicas deben comprar el seguro en un plazo máximo de 30 días a partir de su autorización y deben presentar en el refrendo copia simple de sus 3 pólizas\n\n## Derechos del Agente de Seguros\nLos Derechos son los siguientes:\n- Cobrar comisiones, premios y bonos y cualquier otra prestación que otorgue la aseguradora, sobre las primas efectivamente ingresadas a la aseguradora\n- Conservar sus derechos, aunque deje de ser Agente o termine su relación con la aseguradora (en renovaciones seguirá cobrando comisiones)\n- Como dueño de la cartera, la puede ceder, heredar o vender (la aseguradora tiene 15 días hábiles para informar al agente si ejercerá su derecho de preferencia)\n\nSus derechos terminan en las siguientes situaciones:\n- Si el agente fallece\n- Si el agente entra en interdicción\n- Si el agente abandona a sus clientes\n- Si el cliente pide cambio de agentes\n- Si el agente renuncia a su derecho por escrito\n\n## Sanciones Administrativas\n- Las aplica la CNSF\n- Son Independientes\n- No evitan responsabilidad penal o civil\n- Se aplican de acuerdo a la infracción y posición del agente\n\n### Sanciones\n| Sanción | Descripción |\n|---|---|\n| Amonestación | La CNSF envía un oficio al agente de seguros infractor informándole sobre las quejas que no ameritan castigo real. |\n| Suspensión | El castigo consiste en impedir que el agente de seguros coloque nuevos seguros. La suspensión puede ir de 30 días a 2 años |\n| Inhabilitación | Este castigo se aplica a Agentes de Seguros especialistas en Seguros de Pensiones Derivadas de las Leyes de Seguridad Social, consiste en impedir que acceda a la lista de prospectos emitida por la CNSF |\n| Revocación | La CNSF quita la autorización al agente de seguros de por vida, las causas son: 1. Cuando no entreguen las primas que cobran a la aseguradora en máximo 10 días hábiles; 2. Intermedien en seguros prohibidos; 3. Intermediar a pesar de estar suspendidos; 4. Cometer 5 infracciones en 200 días; 5. Si el agente de seguros persona moral, entra en concurso o quiebra o se revoca a 3 de sus apoderados en un año |\n| Multas | a. Las determina la CNSF dependiendo de la infracción cometida; b. Son independientes entre sí; c. Se establecen en equivalentes del salario mínimo general del Distrito Federal; d. Se considera la posición socio-económica del agente y la gravedad de la infracción; e. El agente tendrá 15 días hábiles para pagarlas |\n| Cancelación | No es un castigo, es un trámite administrativo, ocurre por: 1. Muerte del Agente; 2. Interdicción del Agente; 3. Renuncia del Agente; 4. Si es empleado, perder la relación laboral con la aseguradora; 5. Ser sentenciado a cárcel por algún delito |"},{"title":"Ley de Instituciones de Seguros y de Fianzas: Operación Activa de Seguros y Autoridades (pág. 4)","content_md":"## Operación Activa de Seguros\nUna persona se obliga a resarcir un daño o a pagar una suma de dinero cuando ocurra un evento futuro e incierto.\n\n### No se consideran operaciones de seguros cuando:\n- Se ofrezcan servicios\n- Los servicios se otorguen con recurso propios\n- No se ofrezca dinero\n\nLos servicios prepagados en materia de Salud, Siempre se deben considerar Operaciones Activas de Seguros.\n\n### Operaciones Prohibidas\nSe prohíbe contratar seguros con aseguradoras extranjeras No autorizadas:\n1. Seguros de personas que estén en México.\n2. Seguros de daños a terceros que puedan causarse en México.\n3. Seguros de créditos legislados en México\n4. Bienes cuyo interés asegurable esté en México\n\n### EXCEPCIONES:\n- La CNSF Autoriza a asegurar en territorio Nacional si el riesgo está en el extranjero\n- Comprar seguros en el extranjero si en México no se otorga ese seguro\n\n## Autoridades\n\n### SHCP\n- Interpreta y aplica para efectos administrativos lo conducente en las leyes y reglamentos en materia de seguros. En caso de duda puede consultar a la CNSF o al Banco de México\n- Crear las reglas aplicables a la creación, operación y funcionamiento de instituciones o sociedades mutualistas de seguros\n\n### CNSF\n- Autoriza la constitución de nuevas aseguradoras\n- Supervisa y Vigila\n- Regula los seguros\n- Autoriza a los agentes de seguros\n- Sanciona administrativamente a los Agentes de Seguros: Amonestación, Suspensión, Inhabilitación, Revocación, Multas\n\n### CONDUSEF\n- Promover, asesorar, proteger y defender los derechos e intereses de los Usuarios\n- Realiza audiencias de conciliación\n- Si ambas partes están de acuerdo, funge como Árbitro\n- Otorga servicios gratuitos de abogados a los usuarios que demuestren no tener recursos propios"},{"title":"LISF: Institución de Seguros vs Sociedad Mutualista (pág. 5)","content_md":"> Nota manuscrita: \"Aprender\". Al margen aparecen los números manuscritos \"13.-\", \"14.-\" y \"19.-\" junto a Tipos de Autorización, Autorización especializada y Reservas.\n\n| Características | Institución de Seguros | Sociedad Mutualista |\n|---|---|---|\n| Razón Social | Debe incluir las siglas S. A | Debe expresar su carácter de mutualidad |\n| Objeto de la sociedad | Comercializan operaciones activas de seguros (LUCRAN) | Administrar el fondo Mutuo para una adecuada distribución del riesgo (NO LUCRAN) |\n| Cantidad mínima de socios | 2 | 300 si es para seguros de vida, las demás Operaciones no tienen mínimo legal |\n| Denominación de los socios | Accionistas | Mutualizados |\n| Posibles asegurados | Cualquier persona física o moral, sujeta a proceso de selección de riesgos | Está limitado a los miembros de la mutualidad, no aplican selección de riesgos |\n| Métodos de atracción de asegurados | 1. Venta directa; 2. Agentes de seguros; 3. Personas morales autorizadas | Afiliación directa (se prohíbe contratar agentes de seguros) |\n| Tipos de Autorización | Intransferible; Adicionalmente pueden obtener autorización como: reaseguradora, reafianzadora y/o fiduciaria; Multilíneas o Especializada; **Si son multilíneas, tienen prohibido operar Vida y Daños juntos** | — |\n| Autorización especializada (Se otorga cuando se comercializa alguno de los seguros siguientes) | Seguros de salud (ISES); Pensiones derivadas de las leyes de seguridad social; Seguros de Crédito; Garantía financiera; Crédito a la vivienda; Seguro de Caución | No pueden operar en seguros de pensiones derivadas de las leyes de seguridad social |\n| Métodos del Cálculo de Primas | Bases Matemáticas: 1. Ley de los Grandes Números; 2. Cálculo de probabilidades (Cálculo de frecuencia global promedio y severidad relativa) | — |\n| Capital Inicial | 1. Lo determina la SHCP; 2. Se debe exhibir antes del 30 de junio; 3. Si el proyecto establece un capital mayor al mínimo, se puede exhibir el 50%; 4. Se aplica para establecer la estructura básica de servicio; 5. Se establece en UDIs | — |\n| Reservas que deben constituir | **Reservas Técnicas:** Fondo de dinero obligatorio que garantiza la solvencia económica para hacer frente a las obligaciones futuras (pago de siniestros), se dividen en: 1. **Para Riesgos en curso** (fondo de dinero que garantiza los siniestros futuros, pólizas vigentes donde no ha ocurrido el siniestro); 2. **Para obligaciones pendientes de cumplir**: Fondo que se constituye para: Pólizas Vencidas, siniestros reclamados, siniestros no reportados, dividendos, etc. | — |\n| Pólizas y Endosos | a) Todos los contratos y endosos, deben ser autorizados por la CNSF; b) Se consideran **contratos de Adhesión** los que tienen Condiciones elaboradas de manera unilateral y obligan a la contraparte a aceptarlas; c) Las pólizas y endosos deben redactarse **en español y con letras legibles y visibles** para personas con vista normal | — |"},{"title":"LISF: Operaciones y Ramos de Seguros; Operaciones Especiales (pág. 6)","content_md":"> Notas manuscritas: \"Pregunta 22\" y \"Aprender\"\n\n## Operaciones de Seguros\n\n### Operación Vida\nCubre riesgos que amenacen la Existencia de las personas y se pueden agregar coberturas adicionales sobre la salud o por accidentes.\n- Seguros Individuales\n- Seguros de Grupo\n- Pensiones Privadas\n- Pensiones Derivadas de las Leyes de Seguridad Social\n\n### Operación Accidentes y Enfermedades (Ramos)\n| Ramo | Cobertura |\n|---|---|\n| Accidentes Personales | Cubre lesiones o vigor vital por eventos fortuitos, súbitos, violentos y externos |\n| Gastos Médicos | Cubre los gastos médicos necesarios para restaurar la salud |\n| Salud | Cubre los gastos para Prevenir o Restaurar la Salud |\n\n### Operación Daños (Ramos)\n| Ramo | Descripción |\n|---|---|\n| 1. Incendio | Daños y pérdidas causados por incendio, explosión, fulminación o accidentes de naturaleza semejante. |\n| 2. Terremoto y Otros Riesgos Catastróficos | Amparan daños y perjuicios ocasionados a personas o cosas como consecuencia de eventos de periodicidad y severidad no predecibles |\n| 3. Automóviles | El pago de la indemnización que corresponda a los daños o pérdida del automóvil y a los daños o perjuicios causados a la propiedad ajena o a terceras personas con motivo del uso del automóvil |\n| 4. Responsabilidad Civil y Riesgos Profesionales | El pago de la indemnización que el asegurado deba a un tercero a consecuencia de un hecho que cause un daño previsto en el contrato de seguro |\n| 5. Marítimo y Transportes | Los daños y perjuicios que sufran los muebles y semovientes objeto del traslado. Pueden igualmente asegurarse los cascos de las embarcaciones y los aeroplanos, funcionamiento. |\n| 6. Agrícola y de Animales | Los daños o perjuicios que sufran los asegurados por pérdida parcial o total de los provechos esperados de la tierra o por muerte, pérdida o daños ocurridos a sus animales. |\n| 7. Crédito | El pago de la indemnización de una parte proporcional de las pérdidas que sufra el asegurado como consecuencia de la insolvencia total o parcial de sus clientes deudores por créditos comerciales. |\n| 8. Garantía Financiera | El pago por incumplimiento de los emisores de valores, títulos de crédito o documentos que sean objeto de oferta pública o de intermediación en mercados de valores |\n| 9. Crédito a la Vivienda | El pago por incumplimiento de los deudores, de créditos a la vivienda otorgados |\n| 10. Caución | Cubre las obligaciones que el contratante tenga, se requieren garantías. (Nota manuscrita: \"Legales\") |\n| 11. Diversos | La indemnización por daños y perjuicios ocasionados a personas o cosas por otra eventualidad. **Subramos:** Cristales, Robo, Dinero y Valores, Objetos Personales, Rotura de Maquinaria, Calderas y Recipientes sujetos a Presión, Equipo Electrónico, Etc. |\n\n## Operaciones Especiales\n| Operación | Descripción |\n|---|---|\n| Contraseguro | Existe cuando la institución de seguros se compromete a **devolver la prima** por alguna condición estipulada. |\n| Coaseguro | Existe cuando dos o más aseguradoras protegen el mismo riesgo en virtud de contratos directos con el asegurado. **El asegurado distribuye su riesgo.** |\n| Reaseguro | Existe cuando una aseguradora asegura lo que ya está protegido por otra. **La aseguradora compra seguros para proteger su cartera.** |"},{"title":"LISF: Operaciones Con Recursos de Procedencia Ilícita (Art. 492, antes 140) (pág. 7)","content_md":"## Disposiciones Generales\n| Las Emite | Aplicables a | Objeto Principal |\n|---|---|---|\n| La SHCP, oyendo la opinión de la CNSF y que deben cumplir los estándares internacionales establecidos y aceptados por la GAFI, Banco Mundial y Fondo Monetario Internacional | Instituciones y Sociedades Mutualistas, así como los agentes de seguros (Multa de 100,000 días si no cumplen) | Establecen medidas y procedimientos mínimos para prevenir y detectar actos, omisiones u operaciones que pudieran favorecer los delitos previstos en los artículos 139 o 148 Bis, 400 Bis del Código Penal Federal |\n\n## Código Penal Federal\n| Art. 139 | Art. 149 Bis | Art. 400 bis |\n|---|---|---|\n| Cárcel de 15 a 40 años y multas de 400 a 1200 días a quien realice o financie actos terroristas | Cárcel de 20 a 49 años a las personas que cometan el delito de Genocidio Y multa de $ 15,000 A $ 20,000 | Cárcel de cinco a quince años de prisión y de mil a cinco mil días multa a quien lave o ayude a lavar dinero |\n\n## Definiciones\n- **Clientes:** Contratantes, fideicomitentes o mandantes que paguen prima o dinero por algún servicio\n- **Beneficiarios:** Persona que recibe la indemnización de un seguro o el producto de un fideicomiso\n- **Propietario Real:** Persona que no siendo el asegurado o beneficiario, por medio de otra o de cualquier acto o mecanismo, obtiene los beneficios derivados de una Operación y es quien, en última instancia, ejerce los derechos de uso de los recursos, el verdadero dueño de los recursos.\n\n## Persona Políticamente Expuesta\nIndividuos y sus familiares que desempeña o ha desempeñado funciones públicas destacadas en un país extranjero o en territorio nacional, considerando entre otros, a los jefes de estado o de gobierno, líderes políticos, funcionarios gubernamentales, judiciales o militares de alta jerarquía, altos ejecutivos de empresas estatales o funcionarios o miembros importantes de partidos políticos.\n\n## Tipos de Operaciones\n| Tipo | Descripción |\n|---|---|\n| Operación Relevante (nota manuscrita: \"Cliente\", \"10,000 dls\") | Operación que se realice con los billetes y las monedas metálicas de curso legal en los Estados Unidos Mexicanos o en cualquier otro país, así como con cheques de viajero y monedas acuñadas en platino, oro y plata, por un monto igual o superior al equivalente en moneda nacional a diez mil dólares de los Estados Unidos de América. Las Instituciones deben declarar a la SHCP los primeros 10 días de Enero, Abril, Julio y Octubre |\n| Operación Inusual (nota manuscrita: \"Cliente\") | Operación o conducta de un Cliente que no concuerde con los antecedentes o actividad conocida por la aseguradora o declarada a ésta, o con el perfil transaccional inicial o habitual de dicho Cliente, en función al origen o destino de los recursos, al monto, frecuencia, tipo o naturaleza de la Operación de que se trate, sin que exista una justificación razonable. 60 días para declararlas a la SHCP |\n| Operación Preocupante (nota manuscrita: \"Empresario\") | Operación o conducta de cualquiera de los directivos, funcionarios, empleados y Apoderados de las Aseguradoras, que por sus características, pudiera contravenir, vulnerar o evadir la aplicación de lo dispuesto por la Ley o las presentes Disposiciones. 60 días para declararlas a la SHCP |\n\n## Conocimiento del Cliente (Los expedientes se conservan 10 años)\n\n### Personas Físicas\n- **Datos:** Nombre completo; Fecha de nacimiento; País de nacimiento; Ocupación, profesión, giro de negocio; Domicilio particular; Teléfono; Correo electrónico, en su caso; CURP y RFC, Número de serie del certificado digital de la Firma Electrónica si las tiene\n- **Documentos:** Identificación personal; CURP y/o Cédula Fiscal, cuando cuente con ellas; Comprobante de inscripción para la Firma Electrónica Avanzada, cuando cuente con ella; Comprobante de domicilio; Declaración Firmada; **EXTRANJEROS: Pasaporte y forma migratoria**\n\n### Personas Morales\n- **Datos:** Razón social; Giro u objeto social; Nacionalidad; Clave del Registro Federal de Contribuyentes; Serie del certificado digital de la Firma Electrónica; Domicilio; Teléfono; Correo Electrónico; Fecha de Constitución; Folio Mercantil; Nombre completo de apoderados\n- **Documentos:** Acta Constitutiva (si son extranjeras, debe estar apostillada); Poderes de sus apoderados; Identificación oficial de los apoderados; Comprobante de domicilio"},{"title":"Ley Sobre el Contrato de Seguro: Concepto, Requisitos, Personas y Documentos (pág. 8)","content_md":"## Contrato de Seguro, Concepto\nPor medio de este Contrato, la Institución de Seguros se obliga, a cambio de cobrar una prima, a resarcir un daño o a pagar la suma contratada, al verificarse el evento previsto.\n\n## Requisitos para celebrar el Contrato de Seguro\n| Requisito | Descripción |\n|---|---|\n| Capacidad jurídica | Las personas no deben estar en interdicción cuando celebran el contrato (menores de edad, personas con discapacidad o con sentencia de cárcel) |\n| Consentimiento | Las personas deben expresar libremente su consentimiento para celebrar el contrato |\n| Objeto | El objeto que se asegura es el de resarcimiento o el pago de una indemnización |\n| Causa | Las personas que adquieren un seguro, deben estar expuestas a riesgo en su integridad física o en su patrimonio |\n| Interés Asegurable — En los seguros sobre las personas | El seguro de personas puede cubrir un interés económico de cualquier especie o bien dar derecho a prestaciones independientes en absoluto de toda pérdida patrimonial derivada del siniestro. |\n| Interés Asegurable — En los seguros sobre los bienes | Todo interés económico que una persona tenga en que no se produzca un siniestro, podrá ser objeto de contrato de seguro contra los daños. |\n\n## Características Mercantiles del Contrato\n| Característica | Descripción |\n|---|---|\n| Aleatorio | La prestación que otorga el contrato está sujeta a que ocurra un evento futuro e incierto |\n| Bilateral | Los derechos y obligaciones son aplicables para ambas partes |\n| De adhesión | Una de las partes impone las condiciones y la otra se sujeta a las mismas |\n| De no adhesión | Las condiciones en que opera el contrato han sido acordadas por ambas partes |\n| De buena fe | Las personas que celebran el contrato no deben incurrir en Dolo o Mala Fe |\n| Oneroso | Los contratos tienen un costo (Prima) |\n\n## Personas que Celebran el Contrato\n- **Proponente:** Es la persona que desea comprar un seguro. **Obligación:** Debe informar por escrito en el documento que le facilite la institución de seguros, todos los datos importantes, como los conozca o deba conocer, sobre el objeto que se desea asegurar para que la aseguradora pueda apreciar el riesgo **(Art. 8)**\n- **Contratante:** Solicita el seguro a nombre propio o a nombre de terceros. **Obligación:** Pagar la prima\n- **Asegurado:** Es la persona sobre la que se realiza el contrato y quien está expuesta a los riesgos\n- **Beneficiario:** Es la persona o personas que reciben el beneficio del contrato\n\n## Documentos que Forman Parte del Contrato de Seguro\n| Documento | Descripción |\n|---|---|\n| Solicitud | La llena: El proponente. Qué información contiene: La correspondiente al asegurado y en su caso la de su representante. |\n| Póliza | Documento que emita la institución de seguros como prueba de la existencia del contrato y establece las condiciones en que opera. Puede ser: 1. Nominativa; 2. A la Orden; 3. Al portador (excepto los seguros de vida) |\n| Recibo | Lo emite la institución de seguros para comprobar el pago de prima |\n| Endosos | Cláusulas o documento que se agregan a la póliza para modificarla |"},{"title":"LSCS: Póliza, Perfeccionamiento e Ineficacia del Contrato (pág. 9)","content_md":"## Póliza\n\n### Datos Mínimos en Cualquier Seguro\n1. Nombre de ambas partes\n2. Domicilio de ambas partes\n3. Descripción del objeto de seguro\n4. Descripción de riesgos (coberturas básicas, adicionales y exclusiones)\n5. Suma Asegurada o Monto de garantía\n6. Costo de prima o cuotas aplicables\n7. Vigencia (inicio y término)\n8. Firma de la institución de seguros\n\n### Datos adicionales del Seguro de Vida\n- Nombre completo del asegurado\n- Fecha de nacimiento o edad del asegurado\n- Nombres completos de los beneficiarios\n- Causa y plazo por la que se torga la prestación\n- Valores garantizados (si existen)\n\n## Formas para probar la existencia del contrato\n1. La escrita\n2. La confesional\n\n## Perfeccionamiento\n- **Concepto:** Momento en el que se han cumplido todos los requisitos y formalidades para celebrar el contrato y se considera celebrado.\n- **Se perfecciona:** Cuando el proponente se entera que su propuesta fue aceptada\n- **No se debe sujetar a:** La entrega de la póliza ni al pago de prima\n- **Plazo máximo para perfeccionarlo:** Puede sujetarse a término, a cuyo vencimiento se da por celebrado. En los seguros de vida, el plazo no podrá ser mayor a 30 días contados a partir de que la institución de seguros reciba la oferta o practique el examen médico de ser necesario\n\n## Ineficacia del Contrato\n\n### Anulación\n- **Concepto:** El contrato se considera inexistente legalmente por haber incurrido en algún vicio.\n- **Causas:**\n  1. Dolo o mala fe\n  2. Desaparición del riesgo antes de celebrar el contrato\n  3. Ocurrencia del siniestro antes de celebrar el contrato\n  4. Asegurar la vida de un tercero sin su consentimiento\n\n> Nota manuscrita al margen: \"Aprender\"\n\n### Rescisión\n- **Concepto:** El contrato se cancela anticipadamente de hecho o de derecho por causas preestablecidas.\n- **Causas:**\n  1. Omisiones o Inexactas declaraciones\n  2. Agravación esencial del riesgo\n  3. Impedir o negar la subrogación de derechos (siniestro causado por un tercero)\n  4. Cambio de propietario del objeto asegurado\n\n## Causas que evitan la rescisión\n\n### Por Omisiones o Inexactas Declaraciones\n(Cuando el proponente no llena completa la solicitud o la información que se declara no es correcta)\n- Si la empresa las provocó\n- Si la empresa conocía o debía conocer el hecho\n- Si la empresa renunció al derecho de rescisión del contrato por esa causa\n- Si el declarante no contesta una de las cuestiones propuestas y sin embargo la empresa celebra el contrato\n\n### Por Agravación esencial del riesgo\n(Cambios que sufre el objeto asegurado, tales que de existir al principio de la vigencia, el contrato se rechaza o se celebra en condiciones distintas)\n- Si no ejerció influencia sobre el siniestro\n- Si tuvo por objeto salvaguardar los intereses de la empresa aseguradora o cumplir con un deber de humanidad\n- Si la empresa renunció expresa o tácitamente al derecho de rescindir el contrato por esa causa. Se tendrá por hecha la renuncia si la empresa no comunica al asegurado dentro de los quince días siguientes, su voluntad de rescindir el contrato."},{"title":"LSCS: Prima, Prescripción, Peritaje, Subrogación y Plazos (pág. 10)","content_md":"## Prima\n| Aspecto | Descripción |\n|---|---|\n| La paga | El contratante, en su domicilio |\n| Período básico | Anual |\n| Vence | El día en que se celebra el contrato |\n| Plazo | Mínimo 3 días máximo 30 días |\n| Formas de pago | Anual o fraccionado (Períodos iguales no menores a un mes) |\n| Seguros en que no existe pago fraccionado | 1. Accidentes personales a corto plazo; 2. Transportes de carga por un solo viaje; 3. Seguros obligatorios |\n| Derecho de los acreedores | La aseguradora debe informar a los acreedores la falta de pago de prima y ellos podrán pagarla para evitar la cancelación |\n| Desaparición de riesgo subnormal | La aseguradora debe devolver la extraprima no devengada |\n\n## Prescripción\n- **Concepto:** Plazo de 2 años, en el que si no se ejercen los derechos, se pierden. En los seguros de Vida son 5 años.\n- **Inicia:** Cuando nace el derecho o cuando los beneficiarios se enteran que lo tienen.\n- **Causas por las que se interrumpe:**\n  1. Por omisiones o inexactas declaraciones\n  2. Por el nombramiento de peritos para determinar el valor de un siniestro\n  3. Cuando se formaliza la queja ante la CONDUSEF\n\n## Peritaje\n- Se solicita cuando no hay acuerdo en el valor del siniestro\n- Los honorarios los pagan entre ambas partes\n- Si el resultado del primer perito no es satisfactorio, cada quien contrata uno y se nombra un tercero que funge como árbitro.\n- La aceptación del peritaje no implica que la institución de seguros acepte que el siniestro deba pagarse\n\n## Subrogación de Derechos\n- Cuando el siniestro lo causa un tercero, la institución de seguros paga el siniestro pero asume el derecho de demandar al causante del daño, para recuperar lo indemnizado.\n- Si el asegurado niega o impide la subrogación, la institución se exime de sus obligaciones.\n- La subrogación no procede si el tercero es familiar directo o empresa filial del asegurado\n\n## Plazos en la LSCS\n\n### Para la institución de Seguros\n| Concepto | Plazo |\n|---|---|\n| Para Contestar si acepta o rechaza un seguro de vida | 30 días a partir de que recibe la oferta o realiza el examen médico |\n| Para contestar si acepta o rechaza la solicitud de modificación, prórroga, renovación o celebración | 15 días hábiles a partir de que recibe la solicitud |\n| Para informar la rescisión por omisiones o inexactas declaraciones | 30 días a partir de que las detecta |\n| Para informar la rescisión por agravación de riesgo | 15 días hábiles a partir de que la detecta |\n| Para indemnizar un siniestro a partir de que reciba los requisitos | 30 días a partir de que el asegurado entrega todos los requisitos (si no se cumple debe pagar interés moratorio, art. 135 bis LGISMS) |\n\n### Para el Asegurado\n| Concepto | Plazo |\n|---|---|\n| Para informar las agravaciones de riesgo | 24 horas a partir de que la conozca |\n| Para informar la ocurrencia de un siniestro | 5 días a partir de que se entere de la ocurrencia |\n| Plazo mínimo para pagar la prima | 3 días hábiles |\n| Plazo máximo para pagar la prima | 30 días |\n| Plazo para revisar su póliza | 30 días a partir del día en que la reciba |"},{"title":"CONDUSEF: Objeto, Funciones, Quejas y Proceso de Reclamación (pág. 11)","content_md":"## Objeto\nLa protección y defensa de los derechos e intereses del público usuario de los servicios financieros.\n\n## Funciones\n1. Atender y resolver consultas de los usuarios\n2. Atender y resolver las quejas de los usuarios\n3. Llevar a cabo procedimientos conciliatorios entre las instituciones y los usuarios\n4. Fungir como Árbitro en amigable composición o en estricto derecho (ambas partes deben estar de acuerdo)\n5. Otorgar servicio gratuito de abogados a los usuarios que no tengan recursos económicos\n6. Elaborar y mantener un registro de las instituciones financieras\n\n## Quejas\n\n### Forma de presentarla\n1. De manera personal por escrito en cualquier delegación de la CONDUSEF\n2. Por correo electrónico\n3. Por correo certificado\n4. Por teléfono\n\n### Contenido\n1. Nombre y domicilio del usuario y su representante si existe\n2. Descripción del servicio reclamado con una relación sucinta del motivo de la queja\n3. Nombre de la institución que motiva la queja\n4. Documento que avalan la causa de la queja\n\n### Comisiones\nSi la CONDUSEF solicita a la CNBV, CNSF o CNSAR información sobre los productos o temas relacionados con la queja, estas comisiones deben contestar en un plazo máximo de 10 días hábiles.\n\n## Proceso de la reclamación\n1. El usuario presenta formalmente su queja en cualquier delegación de la CONDUSEF en la **Dirección General de Orientación, Supervisión, Conciliación y Dictamen** (tiene 2 años a partir de que nazca la queja)\n2. La CONDUSEF informa al usuario si recibe o no la queja. Las quejas que no recibe son: Variación en los rendimientos en el mercado y, Las notoriamente improcedentes.\n3. La CONDUSEF tiene 8 días hábiles para informar a la institución financiera y máximo 20 días hábiles para reunir a las partes a una audiencia de conciliación.\n4. La institución financiera debe entregar un reporte por escrito sobre las causas por las que se le reclama. Lo podrá presentar antes o durante la audiencia de conciliación.\n5. Si el usuario no se presenta a la audiencia de conciliación, tiene 10 días hábiles para presentar un justificante; en caso contrario, se da por desistido.\n6. Si no llegan a un acuerdo durante la conciliación, deben decidir si la CONDUSEF será o no el árbitro.\n7. Si la CONDUSEF es elegida como árbitro, deberá emitir el laudo en un plazo máximo de 60 días después de terminar la etapa probatoria.\n8. Si el laudo favorece al usuario, la institución tendrá 15 días hábiles para cumplir lo dispuesto.\n9. Si no es elegida, dejará a salvo los derechos de ambas partes para que acudan a los tribunales.\n10. El usuario Podrá solicitar copia certificada de un dictamen técnico que contendrá la opinión de la CONDUSEF, misma que podrá utilizar en un juicio como carga probatoria.\n11. La institución de seguros deberá constituir la reserva para obligaciones pendientes de cumplir y la mantendrá al menos 180 días.\n\n## Defensa Gratuita\n- La CONDUSEF debe crear un cuerpo de abogados que prestarán sus servicios gratuitamente a petición del usuario\n- La CONDUSEF no otorga este servicio cuando sea elegida como árbitro\n- Los usuarios deben demostrar que no cuentan con recursos para contratar sus propios abogados\n- Los abogados defensores deben hacer su trabajo con total apego a la ética profesional y usarán todos los recursos necesarios en beneficio del usuario. Deben reportar a la CONDUSEF cada mes los avances en los casos encomendados"},{"title":"Administración de Riesgos (pág. 12)","content_md":"## ¿Qué es el Riesgo?\nSon eventos futuros e inciertos que de ocurrir causan pérdidas económicas.\n\n## ¿Cómo se Clasifican los Riesgos Por su Naturaleza?\n- **Riesgos Especulativos:** Son creados por las personas con la intención de generar ganancias pero pueden originarse pérdidas.\n- **Riesgos Puros:** Corresponden a la naturaleza del riesgo, siempre que ocurren causan daño o pérdidas económicas.\n\n## ¿Cómo se clasifican los riesgos por su origen?\n- **Naturales:** Son los riesgos de la naturaleza (huracanes, terremotos, inundaciones, etc.)\n- **Humanos:** Son los creados por la conducta de las personas o sus avances tecnológicos\n\n## ¿Cómo se Clasifican los Riesgos por el Daño que Causan?\n- **Particulares:** Son los que afectan a una persona, una familia o una empresa.\n- **Catastróficos:** Amenazan al mismo tiempo a muchas personas que pertenecen a una comunidad. (terremotos, huracanes, epidemias)\n\n## ¿Cómo se clasifican los riesgos por su Posibilidad para medirlos?\n- **Objetivos:** Son riesgos que cuentan con estadísticas suficientes para su predicción\n- **Subjetivos:** Es difícil su medición por no tener estadísticas suficientes y confiables\n\n## ¿Cómo se Clasifican por su frecuencia?\n- **Constantes:** La frecuencia global promedio, es la misma en el tiempo.\n- **Variables:** La frecuencia global promedio cambia en el tiempo\n\n## ¿Qué es la Administración de Riesgos?\nEs el conjunto de procesos que se realizan para reducir el impacto negativo de los siniestros en una empresa al menor costo posible.\n\n## ¿Cuáles son los Pasos de la Administración de Riesgos?\n1. **Identificación:** El objetivo es reconocer los riesgos que amenazan el patrimonio, las fuentes donde se pueden originar y los objetos que pueden dañar.\n2. **Evaluación de Riesgos:** Su objetivo es evaluar los riesgos en cuanto a su frecuencia y severidad. Se jerarquizan los riesgos para determinar cuáles son urgentes en su atención y en la distribución de recursos que se usan.\n3. **Análisis de Soluciones:** Se analiza qué acciones se deben tomar: Eliminar (nota manuscrita: \"Aparta todo\"), Reducir (nota manuscrita: \"Algunas\"), Prevenir, Distribuir, Transferir (nota manuscrita: \"contrata seguro\"), Retener o asumir.\n4. **Aplicación y control:** El objetivo es aplicar las acciones diseñadas, dar seguimiento y hacer las correcciones que se vayan requiriendo.\n\n## ¿Cuáles son las acciones que se pueden tomar ante los riesgos?\n- **Eliminar:** Consiste en quitar todas las fuentes del riesgo, hacer imposible que ocurra.\n- **Reducir:** Consiste en atacar las causas que pueden derivar los siniestros, bajar la probabilidad de que ocurra.\n- **Prevenir:** Se establecen sistemas que permitan atacar al siniestro para evitar o reducir la pérdida económica.\n- **Distribuir:** Consiste en compartir el riesgo, ya sea entre muchas personas (mutualidad) o con varias aseguradoras (coaseguro o reaseguro).\n- **Transferir** (nota manuscrita: \"Contra seguro\"): A través de un contrato, la persona expuesta a riesgos cede a otra la obligación de resarcir los daños causados por un siniestro.\n- **Retener o Asumir:** La persona expuesta a riesgo decide que riesgos puede asumir a costo propio o que parte de la pérdida puede retener (las primeras pérdidas o los excesos de pérdida).\n\n## ¿Qué características deben tener los riesgos para asegurarlos?\n- **Posibles:** El riesgo puede ocurrir a la persona que solicita el seguro.\n- **Aleatorios:** Es la calidad de **incertidumbre**, no se sabe cuándo ni cómo ocurren.\n- **Fortuitos:** La ocurrencia del evento es de **forma no volitiva** (involuntaria) para las personas. Es de forma casual.\n- **Lícitos:** El objeto que se pretende asegurar debe tener un sustento legal.\n- **Concretos:** Deben existir estadísticas suficientes y confiables para cuantificar la frecuencia y severidad.\n- **Contenido Económico:** El riesgo puede generar pérdidas económicas para las personas."},{"title":"Fundamentos Técnicos de los Seguros (pág. 13)","content_md":"## Principios de los Seguros\n- **Mutualismo:** Agrupación de una gran masa de personas expuestas a riesgos análogos, que se unen para protegerse entre sí.\n- **Dispersión:** La pérdida que sufren pocas personas de una mutualidad, la pagan entre todos los mutualizados.\n- **Homogeneidad:** Los riesgos a que están expuestos los miembros de la colectividad son similares.\n- **Indemnizatorio:** Debe existir una pérdida económica para que los seguros funcionen.\n\n## Bases Matemáticas\n- **Ley de los grandes números:** Cuando se realiza un pronóstico de un evento futuro e incierto, a mayor número de Muestras analizadas el pronóstico es más acertado.\n- **Cálculo de probabilidad:** P = Eventos ocurridos / Muestras analizadas\n- **Estadísticas:** Son la acumulación de datos en forma ordenada. Deben cumplir las siguientes características: 1. Suficientes en información y tiempo; 2. La información debe ser confiable\n- **Frecuencia:** Número de eventos en un año\n- **Frecuencia global promedio:** frecuencia estadística de muchos años\n- **Severidad:** Valor de los siniestros ocurridos en un año.\n- **Severidad Relativa:** Valor estadístico de los siniestros tomando la estadística de varios años\n\n## Tipos de prima\n- **Prima Pura de Riesgo:** Parte de la prima que considera sólo el costo de las obligaciones futuras de la aseguradora. Incluye el costo de los siniestros y su gasto de ajuste.\n- **Prima de Tarifa:** Prima que incluye la prima pura de riesgo, los gastos de adquisición, los gastos de administración y la utilidad esperada.\n- **Prima Neta:** Prima que no incluye los impuestos\n- **Prima Total:** Prima que incluye recargos e impuestos\n- **Prima Devengada:** Prima que ampara una vigencia ya transcurrida\n- **Prima no Devengada:** Prima que debe devolver la aseguradora cuando la póliza se cancela anticipadamente\n- **Prima En depósito:** Se aplica en los seguros que no se conoce el valor real expuesto a riesgo o que se sujetan a declaración\n\n## Tipos de Tarifas\n- **Tarifa a Corto Plazo:** Se utiliza para devolver la prima no devengada cuando el asegurado solicita la cancelación anticipada del contrato.\n- **Tarifa a Prorrata:** Se utiliza cuando se devuelve prima por siniestros no cubiertos o cancelación anticipada hecha por la aseguradora.\n\n## Recargos\n- **Por pago fraccionado:** Es motivado por incremento en el costo de contabilidad, cobranza y por los rendimientos que se dejan de percibir.\n- **Recargo Fijo:** Se aplica en los seguros de vida y sirve para compensar los gastos de expedición de pólizas.\n- **Derecho de Póliza:** Se aplica en los seguros de daños y gastos médicos, es para compensar los gastos de expedición de pólizas.\n\n## Dividendos\n- **Concepto:** Reparto de utilidades que se realiza entre los asegurados.\n- **Causas:** 1. Menor siniestralidad a la esperada (Seguros de grupo o colectivo y flotillas); 2. Superávit en los rendimientos obtenidos por la inversión de la reserva matemática (Vida Individual)\n- **Usos:** a) Retiro en efectivo; b) Pago de primas; c) Aumento de protección; d) Ahorro"}],"questions":[{"id":1,"text":"Es el organismo encargado de la autorización, inspección y vigilancia de los agentes de seguros:","options":[{"key":"a","text":"Secretaría de Hacienda y Crédito Público"},{"key":"b","text":"Comisión Nacional de Seguros y Fianzas"}],"correct":"b"},{"id":2,"text":"De la siguiente lista identifica las actividades de intermediación que establece el reglamento de agentes de seguros y fianzas:","options":[{"key":"a","text":"Intercambio de propuestas, Asesoría para celebrar contrato de seguros, Modificaciones, renovaciones o prórrogas"},{"key":"b","text":"Emisión de pólizas y endosos, Reclamación y cobro de siniestro"}],"correct":"a"},{"id":3,"text":"Los tipos de agentes de seguros que pueden ser autorizados son:","options":[{"key":"a","text":"Persona física como empleado, persona física con contrato mercantil, persona moral"},{"key":"b","text":"Persona física con contrato laboral, persona física con contrato mercantil, apoderado"}],"correct":"a"},{"id":4,"text":"De acuerdo al artículo 14 del Reglamento de Agentes de seguros y Fianzas establece que la autorización para personas físicas se hace constar con:","options":[{"key":"a","text":"Una Cédula"},{"key":"b","text":"Un Oficio"}],"correct":"a"},{"id":5,"text":"De acuerdo al artículo 14 del Reglamento de Agentes de seguros y Fianzas establece que la autorización para personas morales se hace constar con:","options":[{"key":"a","text":"Una Cédula"},{"key":"b","text":"Un Oficio"}],"correct":"b"},{"id":6,"text":"Señale el periodo en el que el agente de seguros persona física, deberá refrendar su autorización para realizar actividades de intermediación:","options":[{"key":"a","text":"Cada tres años"},{"key":"b","text":"Cada seis años"}],"correct":"a","handwritten_note":"Numeración impresa salta de la pregunta 5 a la 11 (no aparecen las preguntas 6 a 10 en la hoja)."},{"id":7,"text":"La vigencia de la autorización para un agente de seguros persona moral será por:","options":[{"key":"a","text":"3 años"},{"key":"b","text":"Tiempo Indefinido"}],"correct":"b"},{"id":8,"text":"¿Cómo deben constituirse las personas morales que buscan obtener la autorización como agentes de seguros?","options":[{"key":"a","text":"Como sociedad anónima"},{"key":"b","text":"Como sociedad civil"}],"correct":"a"},{"id":9,"text":"La autorización para intermediar Seguro de Pensiones derivados de las leyes de Seguridad Social solo se otorgará para intermediar:","options":[{"key":"a","text":"El seguro en cualquier Institución de seguros"},{"key":"b","text":"Con una sola Institución de seguros"}],"correct":"b","handwritten_note":"Al margen: \"Pro futuro Pensión\""},{"id":10,"text":"Persona física que celebra contrato de mandato con un agente de seguros persona moral para que intermedie seguros a su nombre","options":[{"key":"a","text":"Agente de seguros mandatario"},{"key":"b","text":"Apoderado"}],"correct":"b","handwritten_note":"Junto a \"Apoderado\": \"Atiende / Trabaja para un agente\". Al pie de página: \"Apoderado / Mandatario: No hay diferencia\""},{"id":11,"text":"Identifica las funciones de un agente de seguros mandatario","options":[{"key":"a","text":"Seleccionar riesgos, emitir póliza, endosos y recibos, comprobar siniestros"},{"key":"b","text":"Rescatar valores garantizados, colocar reaseguro, contratar apoderados"}],"correct":"a"},{"id":12,"text":"Si el asegurado paga su prima con cheque, debe emitirlo a nombre de la Institución de seguros, ¿bajo qué condición se puede emitir a nombre del agente de seguros?","options":[{"key":"a","text":"No se puede"},{"key":"b","text":"Si el agente tiene nombramiento de mandatario"}],"correct":"b"},{"id":13,"text":"Relaciona ambas columnas determinando los seguros que se pueden vender con cada cédula. Cédulas: 1. C, 2. D, 3. E, 4. H. Seguros: a) Riesgos agrícolas, b) Seguros de Caución, c) Cascos de barcos o aviones, d) Crédito, e) Riesgos de animales, f) Grandes riesgos","options":[{"key":"a","text":"1a, b; 2d, e; 3c; 4f"},{"key":"b","text":"1c, f; 2a, e; 3d; 4b"}],"correct":"b","match":{"stem":"Relaciona ambas columnas determinando los seguros que se pueden vender con cada cédula:","cols":[{"label":"Cédulas","kind":"num","items":[{"k":"1","text":"C"},{"k":"2","text":"D"},{"k":"3","text":"E"},{"k":"4","text":"H"}]},{"label":"Seguros","kind":"let","items":[{"k":"a","text":"Riesgos agrícolas"},{"k":"b","text":"Seguros de Caución"},{"k":"c","text":"Cascos de barcos o aviones"},{"k":"d","text":"Crédito"},{"k":"e","text":"Riesgos de animales"},{"k":"f","text":"Grandes riesgos"}]}]},"handwritten_note":"Junto a cada cédula está escrito a mano: 1. C: \"c, f\"; 2. D: \"a, e\"; 3. E: \"d\"; 4. H: \"B\""},{"id":14,"text":"De la siguiente lista elija cuatro elementos que se encuentran contenidos en la cédula: 1. Número, 2. RFC de la Aseguradora, 3. Tipo de autorización, 4. Vigencia, 5. Domicilio del asegurado, 6. Nombre completo","options":[{"key":"a","text":"1, 3, 4, 6"},{"key":"b","text":"1, 2, 4, 5"}],"correct":"a","list":{"stem":"De la siguiente lista elija cuatro elementos que se encuentran contenidos en la cédula:","kind":"num","items":[{"k":"1","text":"Número"},{"k":"2","text":"RFC de la Aseguradora"},{"k":"3","text":"Tipo de autorización"},{"k":"4","text":"Vigencia"},{"k":"5","text":"Domicilio del asegurado"},{"k":"6","text":"Nombre completo"}]},"handwritten_note":"Palomeados a mano los elementos 1, 3, 4 y 6; junto a \"Tipo de autorización\": \"cédula Tipo\"; junto a \"Vigencia\": \"3 años\""},{"id":15,"text":"Los siguientes son requisitos para obtener autorización como agente de seguros, EXCEPTO:","options":[{"key":"a","text":"Ser mexicano, demostrar capacidad técnica, tener nivel académico de preparatoria o equivalente"},{"key":"b","text":"Sacar más de 8 de calificación, ser interdicto, tener residencia como extranjero"}],"correct":"b"},{"id":16,"text":"¿Ante qué organismo se debe comprobar la capacidad técnica?","options":[{"key":"a","text":"Asociación Mexicana de Instituciones y Seguros"},{"key":"b","text":"Comisión Nacional de Seguros y Fianzas"}],"correct":"b"},{"id":17,"text":"No obstante cumplir los requisitos para ser agente de seguros, la autorización se negará en la siguiente situación:","options":[{"key":"a","text":"Cuando sean empleados de las instituciones aseguradoras"},{"key":"b","text":"Cuando se pueda ejercer coacción para la contratación de seguros"}],"correct":"b","handwritten_note":"Al pie de página: \"coacción: Poder de obligar a otros\"; \"Interdicción: No tener capacidad jurídica (menores, personas en cárcel...)\"; \"Agente: Funciones de la aseguradora\"; \"cédula A / 6 / 8 ya no hago módulo\""},{"id":18,"text":"Las siguientes personas tienen prohibido ser agentes de seguros, EXCEPTO:","options":[{"key":"a","text":"Empleados del Gobierno, Personas con sentencia de cárcel"},{"key":"b","text":"Maestros, Extranjeros que tengan la forma migratoria adecuada"}],"correct":"b"},{"id":19,"text":"Cómo deben realizar su actividad de intermediación los agentes de seguros","options":[{"key":"a","text":"Constantemente a fin de elevar las ventas de seguros"},{"key":"b","text":"Bajo un marco de ética y profesionalismo de calidad apegado a derecho"}],"correct":"b"},{"id":20,"text":"De acuerdo al reglamento, cómo debe presentarse un agente de seguros persona física","options":[{"key":"a","text":"Con el original de la cédula de autorización vigente"},{"key":"b","text":"Con la identificación emitida por la Institución de seguros"}],"correct":"a"},{"id":21,"text":"Identifique 3 aspectos que el agente debe informar a quien pretende contratar un seguro: 1. Nombre y tipo de cédula, 2. Autorización de nota técnica, 3. Alcance real de la cobertura y cómo conservarla, 4. Que la aseguradora es quien lo acepta o rechaza, 5. La tarifa autorizada, 6. Que debe contestar completos los cuestionarios relativos que la aseguradora facilite","options":[{"key":"a","text":"1, 2, 5, 6"},{"key":"b","text":"1, 3, 4, 6"}],"correct":"b","list":{"stem":"Identifique 3 aspectos que el agente debe informar a quien pretende contratar un seguro:","kind":"num","items":[{"k":"1","text":"Nombre y tipo de cédula"},{"k":"2","text":"Autorización de nota técnica"},{"k":"3","text":"Alcance real de la cobertura y cómo conservarla"},{"k":"4","text":"Que la aseguradora es quien lo acepta o rechaza"},{"k":"5","text":"La tarifa autorizada"},{"k":"6","text":"Que debe contestar completos los cuestionarios relativos que la aseguradora facilite"}]},"handwritten_note":"Palomeados a mano los aspectos 1, 3, 4 y 6"},{"id":22,"text":"Un agente de seguros puede cobrar primas de seguros siempre y cuando:","options":[{"key":"a","text":"Entregue el recibo oficial expedido por la Institución Aseguradora"},{"key":"b","text":"Entregue la póliza al asegurado"}],"correct":"a"},{"id":23,"text":"¿Cuántos días tienen los agentes para ingresar a la institución de seguros las primas que hayan cobrado directamente?","options":[{"key":"a","text":"10 días hábiles"},{"key":"b","text":"10 días naturales"}],"correct":"a"},{"id":24,"text":"¿Sobre qué primas las instituciones de seguros pueden pagar comisiones y cualquier otra compensación?","options":[{"key":"a","text":"Sobre las primas cobradas en efectivo"},{"key":"b","text":"Sobre las primas efectivamente ingresadas a la institución"}],"correct":"b"},{"id":25,"text":"Si el agente cambia de domicilio debe notificarlo:","options":[{"key":"a","text":"10 días de antes, a la Comisión de Seguros y Fianzas, de igual manera a los asegurados"},{"key":"b","text":"10 días antes, a la Asociación Mexicana de Instituciones de Seguros y a los asegurados"}],"correct":"a"},{"id":26,"text":"El objetivo del seguro de responsabilidad civil por errores y omisiones es:","options":[{"key":"a","text":"Garantizar el cumplimiento de las responsabilidades en que pueda incurrir ante el usuario"},{"key":"b","text":"Garantizar el pago de siniestros a los clientes que contrataron un seguro a través de él"}],"correct":"a","handwritten_note":"Al margen: \"Este seguro es obligado para el agente\". Debajo: \"Lo contratan los médicos - o el agente no renueva\""},{"id":27,"text":"Las siguientes son obligaciones de un agente persona moral con relación al seguro de errores y omisiones, EXCEPTO:","options":[{"key":"a","text":"Presentar la renovación en un plazo no mayor de 15 días hábiles"},{"key":"b","text":"Calcular los montos y términos del Seguro"}],"correct":"b"},{"id":28,"text":"No están obligadas a comprar el seguro de Errores y Omisiones:","options":[{"key":"a","text":"Agentes de seguros provisionales, agentes de seguros empleados"},{"key":"b","text":"Agentes de seguros por cuenta propia, agentes de seguros personas morales"}],"correct":"a","handwritten_note":"Agregado a mano junto a la opción a: \"Apoderados\""},{"id":29,"text":"¿Qué ocurre con las comisiones de los seguros que se conservan en vigor, cuando la aseguradora da de baja al agente?","options":[{"key":"a","text":"Siguen perteneciendo al agente"},{"key":"b","text":"Se otorgan a otro agente"}],"correct":"a"},{"id":30,"text":"Una institución de seguros que decide ejercer el derecho de preferencia sobre una cartera, debe notificarlo al agente de seguros en un plazo de:","options":[{"key":"a","text":"15 días hábiles"},{"key":"b","text":"15 días naturales"}],"correct":"a"},{"id":31,"text":"Las siguientes son situaciones donde el agente de seguros pierde derecho a seguir cobrando comisión, EXCEPTO:","options":[{"key":"a","text":"Si muere, si el cliente pide cambio de conducto, si renuncia a su derecho al dejar de ser agente"},{"key":"b","text":"Si la Institución de seguros lo da de baja, si pierde su autorización para ser agente"}],"correct":"b"},{"id":32,"text":"De la siguiente lista elija a quienes, un agente puede ceder los derechos de su cartera de pólizas:","options":[{"key":"a","text":"Otros agentes o causahabientes o herederos"},{"key":"b","text":"Aseguradora o al asegurado"}],"correct":"a"},{"id":33,"text":"Las sanciones administrativas que puede aplicar la CNSF a los agentes de seguros son:","options":[{"key":"a","text":"Amonestación, suspensión, inhabilitación, revocación, cárcel"},{"key":"b","text":"Amonestación, suspensión, inhabilitación, revocación, multas"}],"correct":"b","handwritten_note":"Al margen derecho: \"cancelación\"; la palabra \"cárcel\" de la opción a aparece señalada a mano"},{"id":34,"text":"De la siguiente lista, identifica las causas por las que se revoca la autorización a un agente de seguros","options":[{"key":"a","text":"No entregar a la aseguradora las primas que cobre, intermediar en seguros prohibidos"},{"key":"b","text":"Fallecimiento del agente, Si deja de tener relación laboral con la aseguradora"}],"correct":"a","handwritten_note":"Al pie de página: \"Revocar: Castigo en el que se quita la autorización de por vida\""},{"id":35,"text":"Las siguientes son causas por las que se cancela la autorización de un agente de seguros, EXCEPTO:","options":[{"key":"a","text":"Muerte del agente de seguros, ser declarado en interdicción"},{"key":"b","text":"Cometer 5 infracciones en un periodo de 200 días"}],"correct":"b","handwritten_note":"Junto a la opción b: \"se revoca\""},{"id":36,"text":"¿Cómo se aplican las sanciones que recibe un agente de seguros?","options":[{"key":"a","text":"Depende de la importancia que le dé el asegurado"},{"key":"b","text":"Se aplican de forma independiente considerando la importancia de la infracción y las condiciones de infractor"}],"correct":"b"},{"id":37,"text":"¿Qué autoridad tiene la facultad de suspender a un agente de seguros de acuerdo al reglamento de agentes de seguros y fianzas?","options":[{"key":"a","text":"CNSF"},{"key":"b","text":"CONDUSEF"}],"correct":"a"},{"id":38,"text":"Una persona se compromete a resarcir un daño o a pagar una cantidad de dinero al ocurrir un evento futuro e incierto a cambio de una cantidad, esta definición corresponde a:","options":[{"key":"a","text":"Póliza de seguro"},{"key":"b","text":"Operación activa de seguros"}],"correct":"b","handwritten_note":"Arriba de la pregunta: \"operación: Contrato\". Hay una anotación ambigua (\"¿c?\") junto a las opciones; la marca no es del todo clara."},{"id":39,"text":"¿Qué seguros se consideran prohibidos en México?","options":[{"key":"a","text":"Contratar con aseguradoras no autorizados por la CNSF"},{"key":"b","text":"Contratar seguros empresariales con agentes cédula \"A\""}],"correct":"a"},{"id":40,"text":"Una empresa mexicana que no exporta, contrató una póliza de Responsabilidad Civil, con una compañía de Seguros Inglesa sin autorización en el País. Esta operación de Seguros se considera:","options":[{"key":"a","text":"Autorizada"},{"key":"b","text":"Prohibida"}],"correct":"b","handwritten_note":"Al pie de página: \"Responsabilidad civil: Obligación de pagar daños a terceros\""},{"id":41,"text":"Cuando una persona no encuentra en México el seguro que requiere, ¿qué autoridad le puede autorizar a comprarlo en el extranjero a pesar de estar prohibido?","options":[{"key":"a","text":"SHCP"},{"key":"b","text":"CNSF"}],"correct":"b"},{"id":42,"text":"¿A qué autoridad le corresponde la adopción de las medidas tendientes a regular la organización y funcionamiento de las Instituciones de Seguros?","options":[{"key":"a","text":"Secretaría de Hacienda y Crédito Público"},{"key":"b","text":"Comisión Nacional de Seguros y Fianzas"}],"correct":"a"},{"id":43,"text":"¿Qué autoridad es competente para interpretar las Reglas que establecen las orientaciones de política general aplicables a los agentes y apoderados de seguros y de fianzas?","options":[{"key":"a","text":"CNSF"},{"key":"b","text":"SHCP"}],"correct":"b"},{"id":44,"text":"Si la SHCP al interpretar alguna de las leyes o reglamentos en materia de seguros tiene duda ¿a quién puede consultar?","options":[{"key":"a","text":"A la CNSF y Condusef"},{"key":"b","text":"A la CNSF y Banco de México"}],"correct":"b"},{"id":45,"text":"La principal diferencia entre una Institución de Seguros y una Sociedad Mutualista es:","options":[{"key":"a","text":"La institución lucra, la Sociedad Mutualista no"},{"key":"b","text":"La Institución puede ser para seguros de Vida y Daños, la Sociedad mutualista no"}],"correct":"a","handwritten_note":"Al pie de página: \"Mutualista: Asociación para ayudar a pagar\""},{"id":46,"text":"Se constituyen como sociedades anónimas, deben contar con un capital mínimo por cada operación o ramo autorizado.","options":[{"key":"a","text":"Instituciones de seguros"},{"key":"b","text":"Sociedades Mutualistas"}],"correct":"a","handwritten_note":"Sobre \"operación o ramo\" está escrito: \"negocio\""},{"id":47,"text":"Las operaciones que realizan, no producen lucro, no deben tener como socios a instituciones financieras del extranjero, se requieren cuando menos 300 socios, vigencia mínima de 30 años en el acta constitutiva, son características de:","options":[{"key":"a","text":"Instituciones de seguros"},{"key":"b","text":"Sociedades Mutualistas"}],"correct":"b","handwritten_note":"Al margen izquierdo: \"Preguntas Directas\""},{"id":48,"text":"Las Sociedades Mutualistas de Seguros, ¿qué seguro no pueden ofrecer a sus miembros?","options":[{"key":"a","text":"Vida"},{"key":"b","text":"Pensiones derivadas de las leyes de seguridad social"}],"correct":"b"},{"id":49,"text":"¿Qué característica tiene la autorización que otorga la CNSF a una institución de seguros?","options":[{"key":"a","text":"Es intransmisible"},{"key":"b","text":"Puede ser para vida y daños simultáneamente"}],"correct":"a"},{"id":50,"text":"La autorización de una aseguradora puede concurrir con las siguientes autorizaciones, EXCEPTO:","options":[{"key":"a","text":"Reaseguradora y fiduciaria"},{"key":"b","text":"Ofrecer la operación Vida y la operación Daños"}],"correct":"b","handwritten_note":"Junto a \"fiduciaria\": \"vende fideicomiso\"; junto a la opción b: \"se prohíbe\". Al margen: \"Pág. 5\""},{"id":51,"text":"Qué tipo de autorización se otorga a las aseguradoras que comercializan; salud, crédito, pensiones derivadas de las leyes de seguridad social, crédito a la vivienda, caución","options":[{"key":"a","text":"Multilínea"},{"key":"b","text":"Especializada"}],"correct":"b","handwritten_note":"Debajo: \"Puede vender solo 1 de estos seguros - seguro de crédito\". Al ma
