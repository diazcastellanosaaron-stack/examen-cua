ores","theory":[{"title":"Seguro de Embarcaciones Menores - Conceptos Generales","content_md":"## Embarcación Menor\n\nEmbarcaciones que **miden hasta 15 metros de eslora** (largo).\n\nCon capacidad de **carga de hasta 500 toneladas brutas**. Una tonelada equivale a 100 pies cúbicos o 2,83 metros cúbicos.\n\n**Si rebasa estas medidas, se denomina Buque.**\n\n## Casco\n\nComprende la estructura interna compuesta por la quilla, cuadernas, varengas, el forro exterior y la cubierta. **No incluye los mástiles, ni los aparejos ni los salvavidas.**\n\n## Aparejos\n\nDenominación general, que incluye la arboladura (mástiles), las velas, la jarcia firme y la de labor. Conjunto de motones y cabos que permiten multiplicar la fuerza.\n\n## Partes de la embarcación (diagramas)\n\n- **Estribor** (Derecha)\n- **Babor** (Izquierda)\n- **Proa** (parte delantera)\n- **Popa** (parte trasera)\n- **Eslora** (largo)\n\nPartes de la estructura del casco señaladas en el diagrama: Trancanil, Paralelas, Cubierta, Bao, Cuadernas, Varengas, Sobrequilla, Quilla, Forro.\n\n*Nota manuscrita en el material: \"Manga = ancho\"*"},{"title":"Tipos de embarcaciones","content_md":"| Yate | Lancha | Velero | Motor Fuera de Borda |\n|---|---|---|---|\n| Embarcación de placer con fines de recreo, relativamente pequeña que al asegurarse tiene límites de navegación y la exigencia de permanecer amarrado 6 meses al año. | Se emplea para servicios auxiliares de los barcos, dentro de los puertos y para el transporte entre puertos de la misma costa. | Barco cuyo principal medio de propulsión son sus velas. | Es el tipo de motor que no está integrado a la estructura de la embarcación. |"},{"title":"Clasificación de Barcos","content_md":"Es un sistema para preservar la vida, la propiedad y el medioambiente en la mar. **Implica la verificación de embarcaciones**, durante su proyecto, construcción y operación, para verificar que cumple los requisitos de navegación.\n\n**Empresas Clasificadoras:** Bureau Veritas, Polski, Nippon Kaiji Kyokai, British Corporation, Registro Italiano, Germanischer Lloyd."},{"title":"Bandera de Conveniencia","content_md":"Países con registro abierto, autorizan a los extranjeros, propietarios de embarcaciones, a registrar sus barcos, sin que en realidad exista vínculo alguno entre ambos. No garantizan la calidad de sus naves ni de la tripulación.\n\n**Por Ejemplo:** Costa Rica, Honduras, Grecia, Malta, Líbano, Somalia, Chipre, Marruecos, Singapur, Liberia."},{"title":"Tipos de Navegación","content_md":"| Interior | Cabotaje | De Altura |\n|---|---|---|\n| Es cuando la embarcación desarrolla paseos dentro de los límites de los puertos en ríos, lagos y presas | Cuando la embarcación va costeando en travesías en mar, pero solamente en puertos del mismo litoral y del mismo país (Veracruz a Coatzacoalcos, a Tampico; De Mazatlán a La Paz, a Acapulco, Etc.) | La embarcación traspasa los límites territoriales de su nacionalidad. (Mazatlán a San Diego; Veracruz a Inglaterra, etc.) |"},{"title":"Bienes y coberturas","content_md":"| Bienes Básicos | Suma asegurada | Bienes Excluidos |\n|---|---|---|\n| • Casco<br>• Maquinaria de propulsión y mando<br>• Equipo de navegación (radio, brújulas, radares, etc.)<br>• Aparejos que no sean de pesca o labor<br>• Botes salvavidas (Con el nombre de la embarcación) | Valor Comercial o Convenido de la embarcación | • Efectos personales<br>• Equipo de pesca<br>• Pertrechos consumibles<br>• Aparejos de pesca o amarras<br>• Velas, mástiles, arboladuras, Jarcias de labor |"},{"title":"Cobertura Básica","content_md":"### En Tierra\n\nLa Pérdida total Real o Implícita, causada por los siguientes riesgos:\n\n- Incendio, rayo o explosión.\n- Colisión o volcadura del vehículo transportador.\n- Hundimiento o rotura de puentes al paso del vehículo transportador.\n- Robo con violencia o por asalto.\n\n### En Agua (Lanchas, Yates y Veleros)\n\nLa Pérdida Total Real o Implícita, causada por los siguientes riesgos:\n\n- Peligros de los Mares (**Mal tiempo o tempestad, Colisión o abordaje, Varadura o encalladura, hundimiento o zozobra**)\n- Incendio, explosión y rayo.\n- Contribución a la avería gruesa o gastos de salvamento."},{"title":"Avería Gruesa o General","content_md":"| Definición | Echazón | Marco Legal |\n|---|---|---|\n| Pérdida económica que ocurre cuando el Capitán del barco ordena tirar carga al mar para salvar la nave de un peligro real. Todas las personas que lleven interés en el barco deben participar proporcionalmente a la pérdida. | Acción que se realiza por orden del capitán del barco y consiste en tirar carga o equipo del barco por la borda | • Código de Comercio<br>• Ley de Navegación<br>• Reglas de York Amberes |\n\n### Gastos para arrastre o remolque\n\n| Gastos para arrastre o remolque | Marco Legal |\n|---|---|\n| 12 dólares por milla o 60 dólares por Hora | Reglas de la Haya - Visby |"},{"title":"Coberturas Adicionales o Por Convenio Expreso","content_md":"| Avería Particular | R. C. Abordajes | Huelgas Y Alborotos Populares | Guerra a Flote |\n|---|---|---|---|\n| Indemniza los daños parciales que sufra la embarcación (menores al 75%), los daños que sufran la maquinaria de mando o propulsión. | Se indemnizan ¾ partes de los daños que el barco asegurado cause a otros barcos por colisión, incluye barcos que pertenezcan al mismo asegurado (Barcos hermanos) | Indemniza las pérdidas o daños que sufra el barco por actos de personas que participen en huelgas, disturbios obreros, mítines o motines y alborotos populares. | Paga los daños que sufra el barco por la acción de armas de guerra que empleen fusión o fisión. |"},{"title":"PANDI (Protección e Indemnización)","content_md":"Cubre las obligaciones que le nazcan al asegurado por el uso o posesión del Yate, a consecuencia de la negligencia o descuido de la tripulación:\n\n- Daños a la integridad física de terceros\n- Daños a bienes de terceros\n- Gastos Extras por cuarentena\n- Repatriación de tripulación o pasajeros por naufragio\n- ¼ de los daños que se causen a otros barcos (Exceso de lo cubierto por R. C. por abordaje)"},{"title":"Riesgos Excluidos","content_md":"- La violación por el Asegurado de cualquier ley, disposición o reglamento expedidos por autoridades.\n- Motores fuera de borda que se suelten o se caigan fuera de borda.\n- Robo en que intervenga, directa o indirectamente un empleado, dependiente o representante propio del Asegurado.\n- Resultante mientras la embarcación esté participando en carrera o pruebas de velocidad o cualquier prueba en conexión con ellas.\n- Responsabilidad civil por ski acuático, patinaje sobre agua o cualquier deporte similar.\n- La responsabilidad patronal por enfermedades profesionales o por accidentes del trabajo de los miembros de la tripulación."}],"questions":[{"id":1,"text":"Este seguro cubre la embarcación mientras:","options":[{"key":"a","text":"Sea utilizada para descanso y/o placer"},{"key":"b","text":"Sea utilizada para competencia de pesca"}],"correct":"a"},{"id":2,"text":"Por sus dimensiones, las embarcaciones se clasifican en:","options":[{"key":"a","text":"Buques y embarcaciones menores"},{"key":"b","text":"Yates, buques y lanchas"}],"correct":"a"},{"id":3,"text":"¿Cómo se denomina a la embarcación con menos de 500 unidades de arqueo?","options":[{"key":"a","text":"Embarcación menor"},{"key":"b","text":"Buque"}],"correct":"a","handwritten_note":"Hay marcas de tinta sobre ambas letras (aparentes tachones/correcciones) y una palomita (✓) manuscrita junto a \"Embarcación menor\"."},{"id":4,"text":"Embarcaciones que tienen una eslora superior a 15 metros, se denominan:","options":[{"key":"a","text":"Embarcación menor"},{"key":"b","text":"Buque"}],"correct":"b","handwritten_note":"Nota manuscrita \"Largo\" con flecha hacia la palabra \"eslora\". Hay marcas de tinta sobre ambas letras (aparentes tachones/correcciones)."},{"id":5,"text":"Son embarcaciones menores de placer (utilizadas para propósitos recreativos, y/o de descanso y/o de placer):","options":[{"key":"a","text":"Lancha, velero, yate, lancha rápida."},{"key":"b","text":"Lancha, draga, junco, yate, lancha rápida."}],"correct":"a","handwritten_note":"Al margen derecho: \"embarcación de trabajo\" (referida a la opción b)."},{"id":6,"text":"Embarcación que debe estar amarrada 6 meses al año, por exigencias legales","options":[{"key":"a","text":"Yates"},{"key":"b","text":"Pangas"}],"correct":"a"},{"id":7,"text":"Es la embarcación pequeña que se utiliza para transportar mercancías hacia el buque o de éste:","options":[{"key":"a","text":"Lancha"},{"key":"b","text":"Yate"}],"correct":"a"},{"id":8,"text":"En la póliza de embarcaciones menores de placer se define: \"conjunto de baos, cuadernos, quilla, codaste y roda y demás piezas después del revestimiento exterior de madera o acero.\"","options":[{"key":"a","text":"Buque"},{"key":"b","text":"Casco"}],"correct":"b"},{"id":9,"text":"¿Cómo se llama el motor previsto de hélice que se coloca en la parte posterior de la popa de una embarcación menor?","options":[{"key":"a","text":"Fuera de borda"},{"key":"b","text":"Auxiliar"}],"correct":"a"},{"id":10,"text":"La navegación de embarcaciones se clasifica de acuerdo al lugar por donde se transita, ¿cuáles son?","options":[{"key":"a","text":"Navegación interior, de cabotaje, de altura"},{"key":"b","text":"Navegación exterior, sin cabotaje de altura"}],"correct":"a"},{"id":11,"text":"La navegación que realizan las embarcaciones menores de placer dentro de los límites de los puertos o en aguas mexicanas como son lagos, lagunas y ríos se llama:","options":[{"key":"a","text":"Interior"},{"key":"b","text":"Cabotaje"}],"correct":"a"},{"id":12,"text":"Una persona desea asegurar su velero que utiliza en Valle de Bravo los fines de semana, ¿Qué tipo de navegación utiliza esta embarcación?","options":[{"key":"a","text":"Interior"},{"key":"b","text":"Cabotaje"}],"correct":"a"},{"id":13,"text":"La navegación que se realiza costeando por el mismo litoral de un país se den /* ---------- utilidades ---------- */
const $ = (id)=>document.getElementById(id);
const app = $("app");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function store(k,v){try{localStorage.setItem("cua_"+k,JSON.stringify(v))}catch(e){}}
function load(k,d){try{const v=localStorage.getItem("cua_"+k);return v?JSON.parse(v):d}catch(e){return d}}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0")}

/* ---------- mini markdown ---------- */
function md(src){
  const lines = src.split(/\r?\n/); let out=[], i=0;
  function inline(t){
    t = esc(t);
    t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1<em>$2</em>");
    return t;
  }
  while(i<lines.length){
    let L = lines[i];
    if(/^\s*$/.test(L)){i++;continue}
    let h = L.match(/^(#{1,4})\s+(.*)/);
    if(h){out.push("<h"+(h[1].length)+">"+inline(h[2])+"</h"+(h[1].length)+">");i++;continue}
    if(/^\s*\|.*\|\s*$/.test(L)){
      let rows=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){rows.push(lines[i]);i++}
      let cells = rows.map(r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
      let hasSep = cells.length>1 && cells[1].every(c=>/^:?-{2,}:?$/.test(c));
      let html="<table>";
      cells.forEach((r,ri)=>{
        if(hasSep && ri===1) return;
        const tag = (ri===0)?"th":"td";
        html+="<tr>"+r.map(c=>"<"+tag+">"+inline(c)+"</"+tag+">").join("")+"</tr>";
      });
      out.push(html+"</table>");continue;
    }
    if(/^\s*([-*•➢✓❖]|\d+[.)])\s+/.test(L)){
      let ordered=/^\s*\d+[.)]\s+/.test(L);
      let items=[];
      while(i<lines.length && /^\s*([-*•➢✓❖]|\d+[.)])\s+/.test(lines[i])){
        items.push(lines[i].replace(/^\s*([-*•➢✓❖]|\d+[.)])\s+/,""));i++;
      }
      out.push((ordered?"<ol>":"<ul>")+items.map(x=>"<li>"+inline(x)+"</li>").join("")+(ordered?"</ol>":"</ul>"));continue;
    }
    let para=[L];i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s|^\s*\|.*\|\s*$|^\s*([-*•➢✓❖]|\d+[.)])\s+/.test(lines[i])){para.push(lines[i]);i++}
    out.push("<p>"+para.map(inline).join("<br>")+"</p>");
  }
  return out.join("");
}

/* ---------- helpers de datos ---------- */
function bankById(id){return DATA.banks.find(b=>b.id===id)}
function modById(id){return DATA.modules.find(m=>m.id===id)}
function moduleQCount(m){return m.banks.reduce((s,b)=>s+bankById(b).questions.length,0)}
function examTotalN(m){return m.exam.parts.reduce((s,p)=>s+p.n,0)}
function partTime(m,p){return Math.max(1,Math.round(m.exam.time*p.n/examTotalN(m)))}
const FULL_TIME = DATA.modules.reduce((s,m)=>s+m.exam.time,0);
const FULL_N = DATA.modules.reduce((s,m)=>s+examTotalN(m),0);
function getGoal(){return load("goal",80)}
function grade10(pct){return (Math.round(pct)/10).toFixed(1)}
function bestOf(k){const b=load("best",{});return b[k]}
function saveBest(k,pct){const b=load("best",{});const isNew=(b[k]==null||pct>b[k]);if(isNew){b[k]=pct;store("best",b)}return isNew}
function pctClass(p){return p>=getGoal()?"good":(p>=getGoal()-15?"mid":"low")}
function eyebrow(t){return '<div class="eyebrow">'+esc(t)+'</div>'}

/* Enunciado: si es de relacionar columnas, se dibuja como tabla */
function qBody(q){
  if(q.list){
    const L=q.list;
    return '<div class="mstem">'+esc(L.stem)+'</div><ul class="qlist">'+
      L.items.map(i=>'<li><span class="ln'+(L.kind==="let"?" let":"")+'">'+i.k+'</span><span>'+esc(i.text)+'</span></li>').join("")+
      '</ul>';
  }
  if(!q.match) return '<div class="qtext">'+esc(q.text)+'</div>';
  const m=q.match,c0=m.cols[0],c1=m.cols[1];
  const rows=Math.max(c0.items.length,c1.items.length);
  let h='<div class="mstem">'+esc(m.stem)+'</div><table class="mtable">'+
        '<tr><th>'+esc(c0.label||"Columna 1")+'</th><th>'+esc(c1.label||"Columna 2")+'</th></tr>';
  for(let i=0;i<rows;i++){
    const a=c0.items[i],b=c1.items[i];
    h+='<tr><td class="l">'+(a?'<span class="mk'+(c0.kind==="let"?" let":"")+'">'+a.k+'</span>'+esc(a.text):'')+'</td>'+
       '<td>'+(b?'<span class="mk'+(c1.kind==="let"?" let":"")+'">'+b.k+'</span>'+esc(b.text):'')+'</td></tr>';
  }
  return h+'</table>';
}
function optText(q,t){
  const s=esc(t);
  if(!q.match) return s;
  const re = (q.match.cols[0].kind==="let")
    ? /([a-h])\s*(\d(?:\s*,\s*\d)*)/g
    : /(\d)\s*([a-h](?:\s*,\s*[a-h])*)/g;
  return s.replace(re,'$1 <span class="arrow">→</span> $2');
}

     '<p class="sub">'+m.banks.map(b=>esc(bankById(b).label)).join(" · ")+' — '+moduleQCount(m)+' preguntas del material'+
     (bScore!=null?' · <b>mejor simulacro '+bScore+'%</b>':'')+'</p>'+
     '<button class="big-btn" onclick="openStudy(\''+m.id+'\')"><div class="big-ico">📖</div><div><b>Estudiar</b><span>Teoría del material, dividida por tema</span></div></button>'+
     '<button class="big-btn" onclick="openPracticeSetup(\''+m.id+'\')"><div class="big-ico">✏️</div><div><b>Practicar</b><span>Todas las preguntas, con respuesta al instante</span></div></button>'+
     '<button class="big-btn" onclick="openExamMenu(\''+m.id+'\')"><div class="big-ico">⏱️</div><div><b>Simulacro calificado</b><span>Módulo completo o solo una parte, con tiempo real</span></div></button>';
  });
}

/* ---------- estudio ---------- */
function openStudy(mid){
  const m=modById(mid);
  if(m.banks.length===1){return openStudyBank(mid,m.banks[0])}
  show(function(){
    app.innerHTML =
     eyebrow("Estudiar · "+m.id)+
     '<h1 class="title">Elige el tema</h1>'+
     '<p class="sub">Tu módulo '+m.id+' se divide en estos temas, igual que en el examen.</p>'+
     m.banks.map(b=>{const bk=bankById(b);const part=m.exam.parts.find(p=>p.bank===b);
      return '<button class="big-btn" onclick="openStudyBank(\''+mid+'\',\''+b+'\')"><div class="big-ico">📗</div>'+
       '<div><b>'+esc(bk.label)+'</b><span>'+bk.theory.length+' secciones de teoría · '+bk.questions.length+' preguntas'+(part?' · '+part.n+' en el examen':'')+'</span></div></button>';
     }).join("");
  });
}

function openStudyBank(mid,bid){
  const m=modById(mid), bk=bankById(bid);
  let open={};
  function paint(){
    app.innerHTML =
     eyebrow("Estudiar · "+m.id)+
     '<h1 class="title">'+esc(bk.label)+'</h1>'+
     '<p class="sub">'+bk.theory.length+' secciones, tal como vienen en tu material.</p>'+
     '<div class="row2"><button class="btn ghost sm" onclick="__allAcc(1)">Abrir todo</button>'+
     '<button class="btn ghost sm" onclick="__allAcc(0)">Cerrar todo</button></div>'+
     bk.theory.map((s,i)=>
       '<div class="acc'+(open[i]?" open":"")+'" id="acc'+i+'"><button class="acc-head" onclick="__toggleAcc('+i+')"><span class="acc-n">'+(i+1)+'</span>'+esc(s.title)+'<span class="arr">›</span></button>'+
       '<div class="acc-body md">'+md(s.content_md)+'</div></div>').join("")+
     '<button class="btn block" style="margin-top:6px" onclick="openPracticeBank(\''+mid+'\',\''+bid+'\')">Practicar este tema ('+bk.questions.length+' preguntas)</button>';
  }
  window.__toggleAcc=(i)=>{open[i]=!open[i];$("acc"+i).classList.toggle("open")};
  window.__allAcc=(v)=>{bk.theory.forEach((_,i)=>open[i]=!!v);paint()};
  show(paint);
}

/* ---------- práctica ---------- */
function openPracticeBank(mid,bid){
  startPractice(mid,[bid],"material");
}
function openPracticeSetup(mid){
  const m=modById(mid);
  let selBank=(m.banks.length===1?m.banks[0]:"all"), order="material";
  function count(){return (selBank==="all"?m.banks:[selBank]).reduce((s,b)=>s+bankById(b).questions.length,0)}
  function paint(){
    app.innerHTML =
     eyebrow("Practicar · "+m.id)+
     '<h1 class="title">Arma tu práctica</h1>'+
     (m.banks.length>1?
      '<div class="card"><b class="cardttl">Tema</b>'+
      '<div class="chips"><button class="chip '+(selBank==="all"?"on":"")+'" onclick="__pb(\'all\')">Todo el módulo</button>'+
      m.banks.map(b=>'<button class="chip '+(selBank===b?"on":"")+'" onclick="__pb(\''+b+'\')">'+esc(bankById(b).label)+'</button>').join("")+'</div></div>':'')+
     '<div class="card"><b class="cardttl">Orden</b>'+
     '<div class="chips">'+
     '<button class="chip '+(order==="material"?"on":"")+'" onclick="__po(\'material\')">Tal cual el material</button>'+
     '<button class="chip '+(order==="rand"?"on":"")+'" onclick="__po(\'rand\')">Aleatorio</button></div>'+
     '<p class="hint">En práctica ves la respuesta correcta al instante y no hay reloj.</p></div>'+
     '<button class="btn gold block" onclick="__pstart()">Comenzar práctica ('+count()+' preguntas)</button>';
  }
  window.__pb=(b)=>{selBank=b;paint()};
  window.__po=(o)=>{order=o;paint()};
  window.__pstart=()=>{startPractice(mid,(selBank==="all"?m.banks:[selBank]),order)};
  show(paint);
}

function startPractice(mid,banks,order){
  let qs=[];
  banks.forEach(b=>bankById(b).questions.forEach(q=>qs.push({moduleId:mid,bank:b,q:q})));
  if(order==="rand") qs=shuffle(qs);
  state.practice={list:qs,idx:0,good:0,bad:0,fails:[],answered:false,bySub:{}};
  show(renderPracticeQ);
}

function renderPracticeQ(){
  const P=state.practice;
  if(P.idx>=P.list.length){return renderPracticeEnd()}
  const {bank,q}=P.list[P.idx];
  const b=bankById(bank);
  app.innerHTML =
   '<div class="pbar navy"><i style="width:'+Math.round(P.idx/P.list.length*100)+'%"></i></div>'+
   '<div class="card"><div class="qmeta"><span class="qtag">'+esc(b.label)+'</span>'+
   '<span class="qcount">'+(P.idx+1)+' / '+P.list.length+'</span></div>'+
   qBody(q)+
   q.options.map(o=>'<button class="opt" data-k="'+o.key+'" onclick="__pAns(\''+o.key+'\')"><span class="k">'+o.key+'</span><span>'+optText(q,o.text)+'</span></button>').join("")+
   '<div id="pFeed"></div></div>'+
   '<div class="row"><button class="btn block hidden" id="pNext" onclick="__pNext()">Siguiente ›</button></div>';
  window.__pAns=(k)=>{
    if(P.answered)return; P.answered=true;
    const correct=q.correct;
    P.bySub[bank]=P.bySub[bank]||{good:0,total:0};
    document.querySelectorAll(".opt").forEach(el=>{
      el.disabled=true;
      if(correct && el.dataset.k===correct) el.classList.add("ok");
      if(el.dataset.k===k && correct && k!==correct) el.classList.add("bad");
      if(!correct && el.dataset.k===k) el.classList.add("sel");
    });
    let fh="";
    if(!correct){
      fh='<div class="feed warn">⚠️ Este reactivo no tiene respuesta confirmada en el material. No cuenta en tu puntaje.</div>';
    } else {
      P.bySub[bank].total++;
      if(k===correct){P.good++;P.bySub[bank].good++;fh='<div class="feed ok">✅ ¡Correcta!</div>'}
      else {P.bad++;P.fails.push(P.list[P.idx]);fh='<div class="feed bad">❌ Incorrecta. La respuesta es la opción '+correct+'.</div>'}
    }
    if(q.handwritten_note) fh+='<div class="note"><b>📝 Nota del material:</b> '+esc(q.handwritten_note)+'</div>';
    $("pFeed").innerHTML=fh;
    $("pNext").classList.remove("hidden");
    $("pNext").textContent=(P.idx+1>=P.list.length)?"Ver resultado ›":"Siguiente ›";
  };
  window.__pNext=()=>{P.idx++;P.answered=false;show(renderPracticeQ,false)};
}

function renderPracticeEnd(){
  const P=state.practice;
  const total=P.good+P.bad;
  const pct=total?Math.round(P.good/total*100):0;
  const subs=Object.keys(P.bySub).filter(s=>P.bySub[s].total>0);
  app.innerHTML =
   '<div class="card score-hero"><div class="score-num '+pctClass(pct)+'">'+pct+'<small>%</small></div>'+
   '<div class="score-lbl">Calificación '+grade10(pct)+' / 10 · práctica</div></div>'+
   '<div class="stat-row"><div class="stat g"><b>'+P.good+'</b><span>Correctas</span></div>'+
   '<div class="stat r"><b>'+P.bad+'</b><span>Incorrectas</span></div>'+
   '<div class="stat n"><b>'+total+'</b><span>Contestadas</span></div></div>'+
   (subs.length>1?'<div class="card"><b class="cardttl">Por tema</b>'+subs.map(s=>{
      const d=P.bySub[s],sp=Math.round(d.good/d.total*100);
      return '<div class="subrow"><span>'+esc(bankById(s).label)+'</span><b class="'+pctClass(sp)+'">'+d.good+' / '+d.total+' · '+sp+'%</b></div>';
    }).join("")+'</div>':'')+
   (P.fails.length?'<button class="btn block" onclick="__pRetry()">Repasar mis '+P.fails.length+' falladas</button><div class="sp"></div>':'')+
   '<button class="btn ghost block" onclick="goBack()">Terminar</button>';
  window.__pRetry=()=>{
    state.practice={list:P.fails.slice(),idx:0,good:0,bad:0,fails:[],answered:false,bySub:{}};
    show(renderPracticeQ,false);
  };
}

/* ---------- simulacros ---------- */
function openExamMenu(mid){
  const m=modById(mid);
  show(function(){
    const bAll=bestOf("mod:"+m.id);
    app.innerHTML =
     eyebrow("Simulacro · "+m.id)+
     '<h1 class="title">Elige tu simulacro</h1>'+
     '<p class="sub">Con reloj y calificación, como el examen real. Sin retroalimentación hasta entregar.</p>'+
     '<button class="full-card sm" onclick="startExamModule(\''+mid+'\')">'+
       '<div class="fc-top"><span class="fc-tag">Módulo completo</span><span class="fc-time">'+m.exam.time+' min</span></div>'+
       '<b>'+m.id+' · '+esc(m.name)+'</b>'+
       '<span>'+examTotalN(m)+' preguntas · '+m.exam.parts.map(p=>esc(bankById(p.bank).label)+' ('+p.n+')').join(' + ')+'</span>'+
       (bAll!=null?'<span class="fc-best">🏆 Tu mejor: '+bAll+'% · '+grade10(bAll)+'</span>':'')+
     '</button>'+
     (m.exam.parts.length>1?
      eyebrow("O solo una parte del módulo")+
      m.exam.parts.map((p,i)=>{
        const bk=bankById(p.bank),bp=bestOf("part:"+mid+":"+p.bank);
        return '<button class="big-btn" onclick="startExamPart(\''+mid+'\','+i+')"><div class="big-ico">🎯</div>'+
         '<div><b>'+esc(bk.label)+'</b><span>'+p.n+' preguntas · '+partTime(m,p)+' min'+(bp!=null?' · mejor '+bp+'%':'')+'</span></div></button>';
      }).join("")
     :'');

}

function openFullIntro(){
  const cfg={key:"full",title:"Examen completo",scope:"Los 4 módulos de corrido",time:FULL_TIME,
    groups:[].concat.apply([],DATA.modules.map(m=>m.exam.parts.map(p=>({moduleId:m.id,bank:p.bank,n:p.n}))))};
  examIntro(cfg);
}
function startExamModule(mid){
  const m=modById(mid);
  examIntro({key:"mod:"+mid,title:m.id+" · "+m.name,scope:"Módulo completo",time:m.exam.time,
    groups:m.exam.parts.map(p=>({moduleId:mid,bank:p.bank,n:p.n}))});
}
function startExamPart(mid,i){
  const m=modById(mid),p=m.exam.parts[i];
  examIntro({key:"part:"+mid+":"+p.bank,title:bankById(p.bank).label,scope:"Parte del módulo "+mid,
    time:partTime(m,p),groups:[{moduleId:mid,bank:p.bank,n:p.n}]});
}

function examIntro(cfg){
  const n=cfg.groups.reduce((s,g)=>s+g.n,0);
  const bs=bestOf(cfg.key);
  show(function(){
    app.innerHTML =
     eyebrow(cfg.scope)+
     '<h1 class="title">'+esc(cfg.title)+'</h1>'+
     '<p class="sub">'+n+' preguntas · '+cfg.time+' minutos'+(bs!=null?' · tu mejor resultado: <b>'+bs+'%</b>':'')+'</p>'+
     '<div class="card"><b class="cardttl">Composición</b><table class="exam-info">'+
     cfg.groups.map(g=>'<tr><td>'+(cfg.key==="full"?'<b>'+g.moduleId+'</b> · ':'')+esc(bankById(g.bank).label)+'</td><td>'+g.n+' preg</td></tr>').join("")+
     '<tr class="tot"><td><b>Tiempo total</b></td><td>'+cfg.time+' min</td></tr></table>'+
     '<p class="hint">Puedes navegar entre preguntas y entregar cuando quieras. Al terminar ves tu calificación'+(cfg.key==="full"?' global y la de cada módulo por separado':'')+', el desglose por tema y el repaso de tus errores.</p></div>'+
     '<div class="card"><b class="cardttl">Meta de aprobación</b>'+
     '<div class="chips">'+[70,80,90].map(g=>'<button class="chip '+(getGoal()===g?"on":"")+'" onclick="__setGoal('+g+')">'+g+'%</button>').join("")+'</div>'+
     '<p class="hint">Es tu meta personal de práctica para colorear los resultados; no viene del material de la CNSF.</p></div>'+
     '<button class="btn gold block" onclick="__go()">Comenzar simulacro</button>';
    window.__setGoal=(g)=>{store("goal",g);show(navStack[navStack.length-1],false)};
    window.__go=()=>{startExam(cfg)};
  });
}

function buildExamList(cfg){
  const byMod={},order=[];
  cfg.groups.forEach(g=>{
    if(!byMod[g.moduleId]){byMod[g.moduleId]=[];order.push(g.moduleId)}
    const pool=bankById(g.bank).questions.filter(q=>q.correct);
    shuffle(pool).slice(0,Math.min(g.n,pool.length)).forEach(q=>byMod[g.moduleId].push({moduleId:g.moduleId,bank:g.bank,q:q}));
  });
  let list=[];
  order.forEach(mid=>{list=list.concat(shuffle(byMod[mid]))});
  return list;
}

function startExam(cfg){
  const list=buildExamList(cfg);
  state.exam={cfg:cfg,list:list,ans:{},idx:0,active:true,left:cfg.time*60};
  $("timerBox").classList.remove("hidden");
  $("timerBox").classList.remove("low");
  document.body.classList.add("exam-on");
  $("timerBox").textContent=fmtTime(state.exam.left);
  timerInt=setInterval(()=>{
    const E=state.exam; if(!E||!E.active){stopTimer();return}
    E.left--;
    $("timerBox").textContent=fmtTime(Math.max(0,E.left));
    if(E.left<=300)$("timerBox").classList.add("low");
    if(E.left<=0){finishExam(true)}
  },1000);
  show(renderExamQ);
}

function renderExamQ(){
  const E=state.exam; if(!E) return;
  const it=E.list[E.idx], b=bankById(it.bank);
  const done=Object.keys(E.ans).length;
  const isFull=(E.cfg.key==="full");
  app.innerHTML =
   '<div class="pbar"><i style="width:'+Math.round(done/E.list.length*100)+'%"></i></div>'+
   '<div class="card"><div class="qmeta">'+
   (isFull?'<span class="qtag">'+it.moduleId+'</span>':'')+
   '<span class="qtag soft">'+esc(b.label)+'</span>'+
   '<span class="qcount">'+(E.idx+1)+' / '+E.list.length+'</span></div>'+
   qBody(it.q)+
   it.q.options.map(o=>'<button class="opt '+(E.ans[E.idx]===o.key?"sel":"")+'" onclick="__eAns(\''+o.key+'\')"><span class="k">'+o.key+'</span><span>'+optText(it.q,o.text)+'</span></button>').join("")+'</div>'+
   '<div class="row" style="margin-bottom:12px">'+
   '<button class="btn ghost sm" '+(E.idx===0?"disabled":"")+' onclick="__eNav(-1)">‹ Anterior</button>'+
   '<button class="btn sm" '+(E.idx===E.list.length-1?"disabled":"")+' onclick="__eNav(1)">Siguiente ›</button></div>'+
   '<div class="card"><b class="cardttl">Preguntas · '+done+' de '+E.list.length+' contestadas</b>'+
   '<div class="pal">'+E.list.map((x,i)=>'<button class="'+(E.ans[i]!=null?"done ":"")+(i===E.idx?"cur":"")+'" onclick="__eGo('+i+')">'+(i+1)+'</button>').join("")+'</div>'+
   '<button class="btn gold block" onclick="__eFinish()">Entregar y calificar</button></div>';
  window.__eAns=(k)=>{E.ans[E.idx]=k;if(E.idx<E.list.length-1){E.idx++}show(renderExamQ,false)};
  window.__eNav=(d)=>{E.idx+=d;show(renderExamQ,false)};
  window.__eGo=(i)=>{E.idx=i;show(renderExamQ,false)};
  window.__eFinish=()=>{
    const missing=E.list.length-Object.keys(E.ans).length;
    if(missing>0) confirmModal("Entregar examen","Te faltan "+missing+" preguntas por contestar y contarán como incorrectas. ¿Entregar de todos modos?",()=>finishExam(false),"Entregar");
    else confirmModal("Entregar examen","¿Confirmas que quieres entregar y calificar?",()=>finishExam(false),"Entregar");
  };
}

function finishExam(byTime){
  const E=state.exam; if(!E||!E.active)return;
  E.active=false; stopTimer();
  const mods={},order=[];
  let good=0,blank=0,wrong=[];
  E.list.forEach((it,i)=>{
    if(!mods[it.moduleId]){mods[it.moduleId]={good:0,total:0,subs:{},subOrder:[]};order.push(it.moduleId)}
    const M=mods[it.moduleId];
    if(!M.subs[it.bank]){M.subs[it.bank]={good:0,total:0};M.subOrder.push(it.bank)}
    M.total++;M.subs[it.bank].total++;
    const given=E.ans[i];
    if(given==null) blank++;
    if(given===it.q.correct){good++;M.good++;M.subs[it.bank].good++}
    else wrong.push({item:it,given:given});
  });
  const total=E.list.length;
  const pct=Math.round(good/total*100);
  const isBest=saveBest(E.cfg.key,pct);
  order.forEach(mid=>{
    const M=mods[mid];
    const mp=Math.round(M.good/M.total*100);
    if(E.cfg.key==="full") saveBest("full:"+mid,mp);
  });
  navStack.pop();
  show(function(){
    const g=getGoal();
    app.innerHTML =
     (byTime?'<div class="feed warn" style="margin-bottom:10px">⏰ Se agotó el tiempo — el examen se entregó automáticamente.</div>':'')+
     '<div class="card score-hero"><div class="score-num '+pctClass(pct)+'">'+pct+'<small>%</small></div>'+
     '<div class="grade-pill '+pctClass(pct)+'">Calificación '+grade10(pct)+' / 10</div>'+
     '<div class="score-lbl">'+good+' de '+total+' correctas · '+esc(E.cfg.title)+'</div>'+
     '<div class="score-lbl small">'+(pct>=g?'✅ Alcanzaste tu meta de '+g+'%':'Meta de práctica: '+g+'% — te faltan '+Math.max(1,Math.ceil(total*g/100)-good)+' aciertos')+(isBest?' · 🏆 ¡Tu mejor marca!':'')+'</div></div>'+
     '<div class="stat-row"><div class="stat g"><b>'+good+'</b><span>Correctas</span></div>'+
     '<div class="stat r"><b>'+(total-good-blank)+'</b><span>Incorrectas</span></div>'+
     '<div class="stat n"><b>'+blank+'</b><span>Sin contestar</span></div></div>'+
     '<div class="eyebrow">Calificación por módulo</div>'+
     order.map(mid=>{
       const M=mods[mid],mp=Math.round(M.good/M.total*100),mm=modById(mid);
       return '<div class="card resmod"><div class="rm-head"><div class="mod-key sm">'+mid+'</div>'+
         '<div class="rm-t"><b>'+esc(mm?mm.name:mid)+'</b><span>'+M.good+' de '+M.total+' correctas</span></div>'+
         '<div class="rm-p '+pctClass(mp)+'">'+mp+'%<small>'+grade10(mp)+'</small></div></div>'+
         '<div class="pbar thin '+pctClass(mp)+'"><i style="width:'+mp+'%"></i></div>'+
         (M.subOrder.length>1?M.subOrder.map(s=>{
            const d=M.subs[s],sp=Math.round(d.good/d.total*100);
            return '<div class="subrow"><span>'+esc(bankById(s).label)+'</span><b class="'+pctClass(sp)+'">'+d.good+' / '+d.total+' · '+sp+'%</b></div>';
         }).join(""):'')+'</div>';
     }).join("")+
     (wrong.length?'<button class="btn block" onclick="__revW()">Repasar mis errores ('+wrong.length+')</button><div class="sp"></div>':'')+
     '<div class="row"><button class="btn ghost" onclick="__exAgain()">Repetir simulacro</button>'+
     '<button class="btn ghost" onclick="__exHome()">Volver</button></div>';
    window.__revW=()=>{
      show(function(){
        app.innerHTML=eyebrow("Repaso")+'<h1 class="title">Tus errores</h1>'+
        '<p class="sub">En verde la respuesta correcta según el material.</p>'+
        wrong.map((w,n)=>{
          const q=w.item.q;
          return '<div class="card"><div class="qmeta"><span class="qtag soft">'+esc(bankById(w.item.bank).label)+'</span><span class="qcount">'+(n+1)+' / '+wrong.length+'</span></div>'+
          qBody(q)+
          q.options.map(o=>'<div class="opt '+(o.key===q.correct?"ok":(o.key===w.given?"bad":""))+'"><span class="k">'+o.key+'</span><span>'+optText(q,o.text)+'</span></div>').join("")+
          (w.given==null?'<div class="feed warn">Sin contestar</div>':'')+
          (q.handwritten_note?'<div class="note"><b>📝 Nota del material:</b> '+esc(q.handwritten_note)+'</div>':'')+
          '</div>';
        }).join("");
      });
    };
    window.__exAgain=()=>{navStack.pop();startExam(E.cfg)};
    window.__exHome=()=>{navStack.pop();goBack()};
  },true);
  state.exam=null;
}
